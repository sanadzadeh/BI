<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Reporting & Analytics | Interactive Case Study</title><meta name="description" content="Interactive fictional enterprise modernisation portfolio: executive reporting, movement investigation, data assurance and dynamic scenarios.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f6;--card:#fff;--soft:#f7f9fa;--line:#d9e2e7;--ink:#182832;--muted:#61717b;--accent:#0b6572;--accentbg:#e6f2f2;--teal:#3f9a92;--blue:#4b81a3;--amber:#b47f26;--red:#b54b46;--green:#3e815d;--shadow:0 5px 18px #1428310a;--serif:'Cormorant Garamond',Georgia,serif}
html[data-theme=dark]{--bg:#101820;--card:#19252e;--soft:#202e38;--line:#354651;--ink:#ecf3f5;--muted:#afc0c8;--accent:#78d3cb;--accentbg:#1b3b3e;--teal:#7ac9bc;--blue:#8bb7dc;--amber:#efbf67;--red:#f3958b;--green:#86d49c;--shadow:0 5px 20px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.top{background:var(--card);border-bottom:1px solid var(--line);padding:16px max(22px,calc((100vw - 1330px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand h1{font:600 29px/1 var(--serif);margin:0}.brand small{color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.actions select,.btn{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink)}.btn:hover,.tab:hover{border-color:var(--accent)}.shell{max-width:1330px;margin:auto;padding:22px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow:auto}.tab{border:1px solid transparent;border-bottom:3px solid transparent;padding:12px 18px;background:transparent;color:var(--muted);white-space:nowrap;font-weight:600}.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);background:var(--accentbg)}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.head h2{font:600 31px/1.05 var(--serif);margin:0 0 5px}.head p{color:var(--muted);margin:0;max-width:810px}.tag{border:1px solid var(--line);color:var(--muted);border-radius:50px;padding:5px 9px;font-size:11px;white-space:nowrap}.grid{display:grid;gap:14px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1.4fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:19px;box-shadow:var(--shadow);min-width:0}.card h3{font-size:15px;margin:0 0 7px}.sub{font-size:12px;color:var(--muted);margin:0 0 15px}.klabel{font-size:12px;color:var(--muted)}.kvalue{font:600 33px/1.2 var(--serif);margin:8px 0 0}.kdetail{font-size:12px;color:var(--muted);margin-top:4px}.chart{width:100%;height:auto;min-height:190px}.chart text{font:12px Inter,system-ui;fill:var(--muted)}.chart .axis{stroke:var(--line);stroke-dasharray:3 5}.chart .bar{fill:var(--blue)}.chart .compare{fill:var(--teal)}.chart .plot{fill:none;stroke:var(--accent);stroke-width:3}.chart .point{fill:var(--card);stroke:var(--accent);stroke-width:2}.chart .point:hover{stroke-width:4}.key{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;background:var(--accent)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:space-between}.callout{border-left:4px solid var(--accent);padding:15px 18px;background:var(--accentbg);border-radius:8px}.callout strong{font-size:15px}.callout p{margin:6px 0 0;color:var(--ink)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px;font-size:12px}th{color:var(--muted);font-weight:600}tbody tr:last-child td{border-bottom:0}.linkrow{background:transparent;border:0;color:var(--accent);font-weight:600;padding:2px 0;text-align:left;text-decoration:underline}.pill{font-size:11px;border-radius:40px;padding:4px 8px;background:var(--accentbg);color:var(--accent);white-space:nowrap}.pill.warn{color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,transparent)}.pill.risk{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}.metric{margin:12px 0}.metric .row{font-size:12px;margin-bottom:5px}.track{background:var(--soft);height:9px;overflow:hidden;border-radius:9px}.fill{height:100%;background:var(--accent);border-radius:9px}.choice{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.choice button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:9px 12px}.choice button.active{background:var(--accentbg);border-color:var(--accent);color:var(--accent)}.control{padding:10px 0;border-bottom:1px solid var(--line)}.control label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.control input{width:100%;accent-color:var(--accent)}.footnote{font-size:11px;color:var(--muted);margin-top:12px}.steps{display:flex;flex-direction:column;gap:9px}.step{background:var(--soft);border:1px solid var(--line);padding:11px;border-radius:8px}.step b{display:block;font-size:12px;margin-bottom:3px}.step span{font-size:12px;color:var(--muted)}.detail{border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--soft);margin-top:14px}.detail h4{margin:0 0 6px}.detail p{margin:0 0 8px}.summarynum{font:600 23px var(--serif)}.muted{color:var(--muted)}.hide{display:none!important}footer{color:var(--muted);font-size:11px;margin:24px 0 10px}.sr{position:absolute;left:-9999px}@media(max-width:980px){.four{grid-template-columns:repeat(2,1fr)}.split,.two{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:13px}.top{padding:13px}.four{grid-template-columns:1fr 1fr}.card{padding:14px}.head{align-items:flex-start;flex-direction:column}.head h2{font-size:27px}.kvalue{font-size:29px}.tabs{gap:0}.tab{padding:11px 10px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<header class="top"><div class="brand"><h1>Portfolio Reporting & Analytics</h1><small>Enterprise modernisation · performance · evidence · scenarios</small></div><div class="actions"><label for="period">Period</label><select id="period"><option value="current">Current quarter</option><option value="previous">Previous quarter</option></select><label for="scope">Portfolio</label><select id="scope"><option value="all">Whole portfolio</option><option value="priority">Priority initiatives</option><option value="exceptions">Exceptions only</option></select><button class="btn" id="reset" type="button">Reset</button><button class="btn" id="theme" type="button" aria-label="Toggle colour theme">Dark mode</button></div></header>
<div class="shell"><nav class="tabs" aria-label="Dashboard views"><button class="tab" data-tab="overview" aria-selected="true">01 Executive overview</button><button class="tab" data-tab="investigate" aria-selected="false">02 Performance & assurance</button><button class="tab" data-tab="scenario" aria-selected="false">03 Scenarios & recommendations</button></nav><main id="main" aria-live="polite"></main><footer>Illustrative portfolio and model. All entities, metrics, incidents and outputs are fictional. Calculations are transparent and intended to demonstrate analysis, not predict actual delivery outcomes.</footer></div>
<script>
'use strict';
const portfolio=[
{id:'clinical',name:'Clinical systems renewal',group:'Priority',weight:26,prior:76,actual:82,definition:4,quality:95,reconciled:98,exceptions:1,cost:82,benefit:96,risk:72,owner:'Technology',action:'Explain the definition adjustment before presenting progress as delivery improvement.'},
{id:'channels',name:'Digital service channels',group:'Priority',weight:22,prior:81,actual:86,definition:0,quality:97,reconciled:99,exceptions:0,cost:53,benefit:77,risk:35,owner:'Delivery',action:'Confirm that recent delivery gains translate into measurable service outcomes.'},
{id:'platform',name:'Core platform migration',group:'Priority',weight:24,prior:70,actual:75,definition:2,quality:87,reconciled:90,exceptions:2,cost:108,benefit:116,risk:81,owner:'Technology',action:'Reconcile the migration milestone mapping and highlight remaining dependencies.'},
{id:'assets',name:'Asset retirement',group:'Standard',weight:16,prior:68,actual:76,definition:5,quality:90,reconciled:92,exceptions:2,cost:37,benefit:52,risk:77,owner:'Finance',action:'Separate the reporting reclassification from actual retirement progress.'},
{id:'automation',name:'Operations automation',group:'Standard',weight:12,prior:83,actual:88,definition:0,quality:98,reconciled:99,exceptions:1,cost:28,benefit:43,risk:40,owner:'Operations',action:'Track realised time savings against the approved baseline.'}
];
const baseline={demand:100,quality:96,automation:63,capacity:100};let state={tab:'overview',period:'current',scope:'all',selected:'clinical',assumptions:{...baseline},dark:false};
const $=s=>document.querySelector(s);const f=(n,d=1)=>Number(n).toFixed(d);const pct=n=>f(n,1)+'%';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function scoped(){return portfolio.filter(p=>state.scope==='all'||(state.scope==='priority'?p.group==='Priority':p.exceptions>0));}
function current(p){return state.period==='current'?p.actual:p.prior;}
function weighted(rows,fn){const den=rows.reduce((s,p)=>s+p.weight,0);return den?rows.reduce((s,p)=>s+p.weight*fn(p),0)/den:0;}
function kpi(label,value,detail){return '<article class="card"><div class="klabel">'+label+'</div><div class="kvalue">'+value+'</div><div class="kdetail">'+detail+'</div></article>'}
function heading(title,desc){return '<div class="head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><span class="tag">Fictional case study</span></div>'}
function bar(label,value,max=100){return '<div class="metric"><div class="row"><span>'+esc(label)+'</span><b>'+f(value,0)+'%</b></div><div class="track"><div class="fill" style="width:'+Math.min(100,value/max*100)+'%"></div></div></div>'}
function table(rows){return '<div class="tablewrap"><table><thead><tr><th>Initiative</th><th>Reported</th><th>Change</th><th>Exceptions</th><th>Action</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><button class="linkrow" data-pick="'+p.id+'">'+esc(p.name)+'</button></td><td>'+pct(current(p))+'</td><td>'+((current(p)-p.prior)>0?'+':'')+f(current(p)-p.prior,1)+' pp</td><td>'+p.exceptions+'</td><td><button class="linkrow" data-pick="'+p.id+'">Investigate →</button></td></tr>').join('')+'</tbody></table></div>'}
function chart(rows){const W=650,H=252,pad=42,gap=(W-pad*2)/rows.length;return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Prior and selected period delivery performance by initiative">'+[0,25,50,75,100].map(x=>'<line class="axis" x1="'+pad+'" x2="'+(W-pad)+'" y1="'+(H-25-x*1.9)+'" y2="'+(H-25-x*1.9)+'"/><text x="4" y="'+(H-22-x*1.9)+'">'+x+'%</text>').join('')+rows.map((p,i)=>{let x=pad+i*gap+gap*.18,w=gap*.24,y1=H-25-p.prior*1.9,y2=H-25-current(p)*1.9;return '<rect class="bar" x="'+x+'" y="'+y1+'" width="'+w+'" height="'+(p.prior*1.9)+'" rx="3"><title>'+esc(p.name)+' prior '+p.prior+'%</title></rect><rect class="compare" x="'+(x+w+3)+'" y="'+y2+'" width="'+w+'" height="'+(current(p)*1.9)+'" rx="3"><title>'+esc(p.name)+' selected '+current(p)+'%</title></rect><text x="'+(x-2)+'" y="'+(H-8)+'">'+esc(p.name.split(' ')[0])+'</text>'}).join('')+'</svg>'}
function overview(){const p=scoped(),now=weighted(p,current),prev=weighted(p,x=>x.prior),exceptions=p.reduce((s,x)=>s+x.exceptions,0),quality=weighted(p,x=>x.quality);return heading('Executive overview','What changed, what requires attention and which conclusions can be supported by the evidence.')+'<section class="grid four">'+kpi('Delivery performance',pct(now),state.period==='current'?f(now-prev,1)+' pp vs prior quarter':'Previous quarter baseline')+kpi('Reporting data quality',pct(quality),'Weighted quality confidence')+kpi('Unresolved exceptions',exceptions,'Across '+p.length+' selected initiatives')+kpi('Definition-driven movement',f(weighted(p,x=>x.definition),1)+' pp','Portion of reported movement from methodology')+'</section><section class="grid split" style="margin-top:14px"><article class="card"><div class="row"><h3>Delivery performance by initiative</h3><div class="key"><span><i class="dot" style="background:var(--blue)"></i>Prior</span><span><i class="dot" style="background:var(--teal)"></i>Selected</span></div></div><p class="sub">Select an initiative below to inspect the driver behind its reported change.</p>'+chart(p)+'</article><article class="card"><h3>Reporting assurance</h3><p class="sub">Weighted results from the same underlying initiative records.</p>'+bar('Source quality',quality)+bar('Reconciliation coverage',weighted(p,x=>x.reconciled)) +bar('Progress confidence',Math.max(0,now-weighted(p,x=>x.definition)))+'<div class="callout" style="margin-top:15px"><strong>Executive attention</strong><p>'+exceptions+' exceptions remain unresolved. The '+f(weighted(p,x=>x.definition),1)+' pp methodology effect should be separated from underlying delivery progress in the quarter-on-quarter commentary.</p></div></article></section><section class="card" style="margin-top:14px"><div class="row"><h3>Exception and movement register</h3><span class="tag">Click to investigate</span></div>'+table(p)+'</section>'}
function detail(p){const reported=p.actual-p.prior,genuine=reported-p.definition;return '<div class="detail"><h4>'+esc(p.name)+'</h4><div class="grid four"><div><div class="klabel">Previously published</div><div class="summarynum">'+p.prior+'%</div></div><div><div class="klabel">Current reported</div><div class="summarynum">'+p.actual+'%</div></div><div><div class="klabel">Methodology effect</div><div class="summarynum">'+(p.definition>=0?'+':'')+p.definition+' pp</div></div><div><div class="klabel">Underlying movement</div><div class="summarynum">'+(genuine>=0?'+':'')+genuine+' pp</div></div></div><p class="footnote">Trace: current reported minus prior published = '+reported+' percentage points. Methodology effect = '+p.definition+' points. Residual underlying movement = '+genuine+' points. All are fictional inputs.</p><div class="grid two"><div><h4>Assurance evidence</h4>'+bar('Quality checks passed',p.quality)+bar('Reconciliation coverage',p.reconciled)+'<p class="sub">'+p.exceptions+' open exceptions · owner: '+esc(p.owner)+'</p></div><div class="callout"><strong>Recommended commentary</strong><p>'+esc(p.action)+'</p></div></div></div>'}
function investigate(){const p=scoped(),sel=p.find(x=>x.id===state.selected)||p[0];if(sel)state.selected=sel.id;return heading('Performance & assurance','Select a reported measure, explain the variance and trace the evidence before publishing commentary.')+'<section class="grid split"><article class="card"><h3>Performance register</h3><p class="sub">Select an initiative to investigate the current reported result.</p>'+table(p)+'</article><article class="card"><h3>Selected measure</h3><label for="investSel" class="sub">Initiative</label><select class="btn" id="investSel" style="width:100%">'+p.map(x=>'<option value="'+x.id+'" '+(sel?.id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>'+(sel?detail(sel):'')+'</article></section><section class="card" style="margin-top:14px"><h3>Evidence pathway</h3><div class="grid four">'+[['01 Source','Enterprise systems and stakeholder inputs'],['02 Define','Measure dictionary, matching logic and reporting rules'],['03 Validate','Quality tests, reconciliation and exception register'],['04 Publish','Adjusted commentary, accountable owner and review trail']].map(x=>'<div class="step"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div><p class="footnote">For demonstration, each initiative stores prior and current progress, a separately identified methodology movement, assurance scores and exception counts. The figures are not based on real operational data.</p></section>'}
function scenarioCalc(a){const demand=a.demand/100,quality=a.quality/100,auto=a.automation/100,cap=a.capacity/100;const manualUnits=100*demand*(1-auto)*(1+(1-quality)*1.8);const capacityUnits=35*cap;const pressure=manualUnits/capacityUnits;const timeliness=Math.max(60,Math.min(100,100-Math.max(0,pressure-.8)*21));const exceptions=Math.round(2+18*(1-quality)*demand+Math.max(0,pressure-1)*6);const readiness=Math.max(50,Math.min(100,quality*100-Math.max(0,pressure-1)*13));return {manualUnits,capacityUnits,pressure,timeliness,exceptions,readiness}}
function controls(){return [['demand','Reporting demand',80,160,'%'],['quality','Source data quality',70,100,'%'],['automation','Automated preparation coverage',30,90,'%'],['capacity','Review capacity',70,140,'%']].map(([id,label,min,max,unit])=>'<div class="control"><label for="'+id+'"><span>'+label+'</span><strong id="'+id+'Value">'+state.assumptions[id]+unit+'</strong></label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="1" value="'+state.assumptions[id]+'"/></div>').join('')}
function scenarios(){const r=scenarioCalc(state.assumptions),b=scenarioCalc(baseline),delta=(r.manualUnits/b.manualUnits-1)*100;let action=r.pressure>1.1?'Protect critical reporting and reallocate review capacity':r.readiness<90?'Prioritise reconciliation before releasing material figures':'Maintain reporting cadence and redirect capacity to investigation';return heading('Scenarios & recommendations','Change demand, assurance, automation and review capacity. The result recalculates from one explicit model.')+'<section class="grid split"><article class="card"><div class="row"><h3>Scenario assumptions</h3><button class="btn" id="resetSc">Restore base</button></div><p class="sub">Choose a starting position or adjust each assumption.</p><div class="choice">'+[['base','Base'],['demand','Demand surge'],['data','Data issue'],['uplift','Automation uplift']].map(([id,l])=>'<button type="button" data-preset="'+id+'">'+l+'</button>').join('')+'</div>'+controls()+'</article><article class="card"><h3>Calculated implications</h3><div class="grid two">'+kpi('Timeliness',pct(r.timeliness),'Estimated output punctuality')+kpi('Open exceptions',r.exceptions,'Estimated control issues')+kpi('Manual effort',f(r.manualUnits,1),'Index units; '+(delta>=0?'+':'')+f(delta,0)+'% vs base')+kpi('Release readiness',pct(r.readiness),'Estimated evidence readiness')+'</div><div class="callout" style="margin-top:14px"><strong>'+action+'</strong><p>'+ (r.pressure>1.1?'Demand and manual work exceed review capacity. Protect executive outputs and defer lower-value reporting.':r.readiness<90?'Lower source quality increases rework and reduces confidence. Review affected measures before publication.':'Current workload can be handled within available capacity. Use released effort for investigating material drivers.')+'</p></div><p class="footnote">Manual effort = 100 × demand × (1 − automation) × [1 + 1.8 × (1 − quality)]. Review capacity = 35 × capacity factor. Timeliness, exceptions and readiness are illustrative response functions, with caps. No fixed scenario outcome table is used.</p></article></section><section class="grid two" style="margin-top:14px"><article class="card"><h3>Scenario versus base</h3><p class="sub">Shared inputs and calculated effects; all values update together.</p>'+[['Manual effort',r.manualUnits,b.manualUnits],['Timeliness',r.timeliness,b.timeliness],['Readiness',r.readiness,b.readiness]].map(([n,v,x])=>'<div class="metric"><div class="row"><span>'+n+'</span><b>'+f(v,1)+' / base '+f(x,1)+'</b></div><div class="track"><div class="fill" style="width:'+Math.min(100,v/Math.max(v,x)*100)+'%"></div></div></div>').join('')+'</article><article class="card"><h3>Controls before executive release</h3><div class="steps"><div class="step"><b>Source and definition checks</b><span>Confirm that like-for-like measures are compared.</span></div><div class="step"><b>Reconciliation and materiality</b><span>Investigate source differences before agreeing commentary.</span></div><div class="step"><b>Governance evidence</b><span>Record assumptions, owner, exceptions and what would change the recommendation.</span></div></div></article></section>'}
function render(){const views={overview,investigate,scenario};$('#main').innerHTML=views[state.tab]();document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===state.tab)));document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{state.selected=b.dataset.pick;state.tab='investigate';render();window.scrollTo({top:0,behavior:'smooth'})}));const sel=$('#investSel');if(sel)sel.addEventListener('change',e=>{state.selected=e.target.value;render()});document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{const presets={base:{...baseline},demand:{...baseline,demand:145},data:{...baseline,quality:78},uplift:{...baseline,automation:84}};state.assumptions=presets[b.dataset.preset];render()}));for(const id of Object.keys(baseline)){let el=$('#'+id);if(el)el.addEventListener('change',e=>{state.assumptions[id]=+e.target.value;render()})}$('#resetSc')?.addEventListener('click',()=>{state.assumptions={...baseline};render()})}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render()}));$('#period').addEventListener('change',e=>{state.period=e.target.value;render()});$('#scope').addEventListener('change',e=>{state.scope=e.target.value;render()});$('#reset').addEventListener('click',()=>{state.tab='overview';state.period='current';state.scope='all';state.selected='clinical';state.assumptions={...baseline};$('#period').value='current';$('#scope').value='all';render()});$('#theme').addEventListener('click',()=>{state.dark=!state.dark;document.documentElement.dataset.theme=state.dark?'dark':'light';$('#theme').textContent=state.dark?'Light mode':'Dark mode'});render();
</script></body></html>
