<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Reporting & Analytics Dashboard</title><meta name="description" content="Organisation-neutral portfolio reporting dashboard covering executive reporting, trends, reconciliations, controls and automation."><style>:root{--bg:#f3f5f7;--card:#fff;--line:#d9e0e6;--ink:#18222c;--muted:#66727d;--nav:#0d2f45;--teal:#0d6670;--teal2:#dff0f1;--ok:#3f7a4c;--warn:#a66d00;--risk:#a43c34;--shadow:0 3px 12px rgba(24,34,44,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{height:58px;background:#fff;border-bottom:3px solid var(--teal);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:3}.brand{font-weight:700;font-size:16px}.brand small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:3px;letter-spacing:.08em;text-transform:uppercase}.filters{display:flex;gap:7px}.filters select{border:1px solid var(--line);background:#fafbfc;padding:6px 8px;border-radius:5px;font-size:11px}.app{display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 58px)}aside{background:#fff;border-right:1px solid var(--line);padding:15px 10px;position:sticky;top:58px;height:calc(100vh - 58px)}.navtitle{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#89939c;margin:0 10px 9px}.nav{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;margin:2px 0;border-radius:5px;color:#50606d;font-size:12px;cursor:pointer}.nav.active{background:var(--teal2);color:var(--teal);font-weight:700;border-left:3px solid var(--teal)}main{padding:20px 22px 38px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.head h1{font-size:22px;margin:0 0 5px}.head p{margin:0;color:var(--muted);font-size:12px}.demo{font-size:9px;text-transform:uppercase;color:var(--teal);border:1px solid #b8d9dc;background:var(--teal2);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:1.25fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px;box-shadow:var(--shadow)}.ey{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#84909a;margin-bottom:6px}.kv{font-size:24px;font-weight:700}.ks{font-size:11px;color:var(--muted);margin-top:4px}.ct{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.ct h3{font-size:13px;margin:0}.ct span{font-size:10px;color:var(--muted)}.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:130px 1fr 42px;gap:8px;align-items:center;font-size:11px}.track{height:8px;border-radius:99px;background:#e9eef2;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--teal),#4a8c9a)}.score{text-align:right;color:var(--muted)}.trend{height:210px;display:flex;align-items:end;gap:9px;padding:14px 4px 0;border-bottom:1px solid var(--line);background:linear-gradient(#fff,#fcfdfe)}.col{flex:1;display:flex;gap:3px;align-items:end;height:100%}.a,.b{flex:1;border-radius:3px 3px 0 0}.a{background:var(--teal)}.b{background:#98b9c5}.tbl{overflow:auto;border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{font-size:11px;text-align:left;padding:8px 9px;border-bottom:1px solid var(--line)}th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#7b8790;background:#f7f9fa}.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:700}.good{color:var(--ok);background:#e7f2ea}.warn{color:var(--warn);background:#fbf0d8}.risk{color:var(--risk);background:#f8e7e5}.flow{display:flex;gap:7px;align-items:stretch}.node{flex:1;background:#f8fafb;border:1px solid var(--line);border-radius:6px;padding:10px}.node strong{font-size:11px}.node p{font-size:10px;line-height:1.4;color:var(--muted);margin:4px 0 0}.arrow{align-self:center;color:#83909b}.scenarioBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenarioBtns button{border:1px solid var(--line);background:#f8fafb;padding:8px;border-radius:5px;text-align:left;font-size:11px}.scenarioBtns button.active{border-color:var(--teal);background:var(--teal2);color:var(--teal);font-weight:700}.decision{border-left:4px solid var(--teal);background:#fbfefe;padding:12px;border-radius:7px}.decision h3{margin:0 0 5px;font-size:14px}.decision p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.heat{display:grid;grid-template-columns:150px repeat(4,1fr);gap:6px;align-items:center}.hh{font-size:9px;color:#82909a;text-align:center;text-transform:uppercase}.hl{font-size:11px;color:var(--muted)}.hc{height:30px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:10px}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow:auto}.navtitle{display:none}.nav{white-space:nowrap;width:auto}.kpis,.two,.scenarioBtns{grid-template-columns:1fr}.top{position:static}.flow{overflow:auto}.node{min-width:150px}} </style></head><body><header class="top"><div class="brand">Portfolio Reporting & Analytics<small>performance · governance · reconciliations · automation</small></div><div class="filters"><select><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select><option>Whole portfolio</option><option>Priority view</option><option>Exceptions</option></select></div></header><div class="app"><aside><div class="navtitle">Views</div><button class="nav active" data-v="0">00 Executive overview</button><button class="nav" data-v="1">01 Portfolio performance</button><button class="nav" data-v="2">02 Reporting controls</button><button class="nav" data-v="3">03 Automation & workflow</button><button class="nav" data-v="4">04 Scenarios</button></aside><main id="main"></main></div><script>const views=[()=>`<div class="head"><div><h1>Executive overview</h1><p>Portfolio performance, reporting health and exceptions prepared for senior review.</p></div><span class="demo">Illustrative data</span></div><div class="grid kpis"><div class="card"><div class="ey">Portfolio index</div><div class="kv">104.8</div><div class="ks">+2.7% vs prior period</div></div><div class="card"><div class="ey">Reporting timeliness</div><div class="kv">96%</div><div class="ks">30 of 31 outputs on time</div></div><div class="card"><div class="ey">Open exceptions</div><div class="kv">6</div><div class="ks">2 require senior attention</div></div><div class="card"><div class="ey">Manual effort removed</div><div class="kv">63%</div><div class="ks">Recurring pack preparation automated</div></div></div><div class="grid two"><div class="card"><div class="ct"><div><h3>Portfolio trend</h3><span>Current period vs comparator</span></div></div><div class="trend">${[58,62,66,68,72,77,81,84].map((x,i)=>`<div class="col"><div class="a" style="height:${x}%"></div><div class="b" style="height:${x-5+(i%2)}%"></div></div>`).join('')}</div></div><div class="card"><div class="ct"><div><h3>Reporting health</h3><span>Key control measures</span></div></div><div class="bars">${[['Completeness',98],['Reconciliation',96],['Timeliness',96],['Definition coverage',93],['Refresh reliability',97]].map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="score">${x[1]}%</span></div>`).join('')}</div></div></div><div class="card" style="margin-top:10px"><div class="ct"><div><h3>Management reporting register</h3><span>Current issues and actions</span></div></div><div class="tbl"><table><thead><tr><th>Area</th><th>Measure</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Portfolio</td><td>Performance movement</td><td><span class="badge good">On track</span></td><td>Include driver commentary</td></tr><tr><td>Finance</td><td>Cost reconciliation</td><td><span class="badge good">On track</span></td><td>Close month-end check</td></tr><tr><td>Risk</td><td>Exception ageing</td><td><span class="badge warn">Review</span></td><td>Escalate two items</td></tr><tr><td>Reporting</td><td>Manual pack dependency</td><td><span class="badge warn">Improving</span></td><td>Automate remaining steps</td></tr></tbody></table></div></div>`,()=>`<div class="head"><div><h1>Portfolio performance</h1><p>Performance movements, drivers, scorecards and senior commentary.</p></div><span class="demo">Illustrative data</span></div><div class="grid kpis"><div class="card"><div class="ey">Current index</div><div class="kv">104.8</div><div class="ks">Period close</div></div><div class="card"><div class="ey">Positive contributors</div><div class="kv">7</div><div class="ks">Across current scorecard</div></div><div class="card"><div class="ey">Watch items</div><div class="kv">3</div><div class="ks">Require explanation</div></div><div class="card"><div class="ey">Board pack readiness</div><div class="kv">92%</div><div class="ks">Evidence complete</div></div></div><div class="card"><div class="tbl"><table><thead><tr><th>Portfolio area</th><th>Current</th><th>Prior</th><th>Movement</th><th>Commentary</th></tr></thead><tbody><tr><td>Growth</td><td>106.1</td><td>102.8</td><td>+3.3</td><td>Benefits and timing ahead of plan</td></tr><tr><td>Defensive</td><td>102.7</td><td>101.8</td><td>+0.9</td><td>Stable with low variance</td></tr><tr><td>Real assets</td><td>104.0</td><td>100.9</td><td>+3.1</td><td>Cost movement partly offset by benefits</td></tr><tr><td>Liquidity</td><td>100.4</td><td>100.2</td><td>+0.2</td><td>No material change</td></tr></tbody></table></div></div>`,()=>`<div class="head"><div><h1>Reporting controls</h1><p>Reconciliations, validation and source-to-output checks before publication.</p></div><span class="demo">Illustrative data</span></div><div class="grid two"><div class="card"><div class="ct"><div><h3>Control heatmap</h3><span>Four reporting stages</span></div></div><div class="heat"><div></div><div class="hh">Source</div><div class="hh">Transform</div><div class="hh">Validate</div><div class="hh">Publish</div>${[['Portfolio data',['hi','hi','hi','hi']],['Finance data',['hi','hi','mid','hi']],['Risk data',['hi','mid','mid','hi']],['Reference data',['hi','hi','hi','hi']]].map(r=>`<div class="hl">${r[0]}</div>${r[1].map((c,i)=>`<div class="hc ${c}">${c==='hi'?'Pass':'Review'}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="ct"><div><h3>Assurance measures</h3><span>Current reporting cycle</span></div></div><div class="bars">${[['Source completeness',98],['Rule coverage',94],['Reconciliation',96],['Exception closure',88],['Traceability',95]].map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="score">${x[1]}%</span></div>`).join('')}</div></div></div><div class="card" style="margin-top:10px"><div class="flow"><div class="node"><strong>1. Source</strong><p>Enterprise systems and approved stakeholder inputs.</p></div><div class="arrow">→</div><div class="node"><strong>2. Transform</strong><p>Defined measures, joins and business rules.</p></div><div class="arrow">→</div><div class="node"><strong>3. Reconcile</strong><p>Check totals, keys, definitions and exceptions.</p></div><div class="arrow">→</div><div class="node"><strong>4. Review</strong><p>Commentary, material movements and evidence.</p></div><div class="arrow">→</div><div class="node"><strong>5. Publish</strong><p>Executive and board-style reporting output.</p></div></div></div>`,()=>`<div class="head"><div><h1>Automation & workflow</h1><p>Reporting priorities, recurring production steps and effort released for analysis.</p></div><span class="demo">Illustrative data</span></div><div class="grid kpis"><div class="card"><div class="ey">Automated steps</div><div class="kv">63%</div><div class="ks">Recurring process</div></div><div class="card"><div class="ey">Cycle time</div><div class="kv">2.1d</div><div class="ks">From cut-off to publish</div></div><div class="card"><div class="ey">Ad hoc requests</div><div class="kv">8</div><div class="ks">Current queue</div></div><div class="card"><div class="ey">Priority changes</div><div class="kv">3</div><div class="ks">This period</div></div></div><div class="card"><div class="tbl"><table><thead><tr><th>Work item</th><th>Frequency</th><th>Current state</th><th>Next improvement</th></tr></thead><tbody><tr><td>Portfolio pack</td><td>Monthly</td><td>Part automated</td><td>Automate commentary inputs</td></tr><tr><td>Executive scorecard</td><td>Monthly</td><td>Automated</td><td>Exception-led review</td></tr><tr><td>Board extract</td><td>Quarterly</td><td>Controlled manual review</td><td>Preserve sign-off</td></tr><tr><td>Ad hoc analysis</td><td>On demand</td><td>Analyst-led</td><td>Reusable templates</td></tr></tbody></table></div></div>`,()=>`<div class="head"><div><h1>Reporting scenarios</h1><p>How priorities change when demand, data quality or reporting deadlines shift.</p></div><span class="demo">Illustrative data</span></div><div class="scenarioBtns"><button class="active" onclick="sel(this,0)">Base<br><small>Current cycle</small></button><button onclick="sel(this,1)">Demand surge<br><small>More ad hoc work</small></button><button onclick="sel(this,2)">Data issue<br><small>Reconciliation failure</small></button><button onclick="sel(this,3)">Automation uplift<br><small>More repeatable work</small></button></div><div id="dec" class="decision"><h3>Maintain current reporting priorities</h3><p>Protect board and executive outputs, close open reconciliations and continue automating recurring pack preparation.</p></div>`];function render(i){document.querySelectorAll('.nav').forEach((b,n)=>b.classList.toggle('active',n===i));document.getElementById('main').innerHTML=views[i]()}document.querySelectorAll('.nav').forEach((b,i)=>b.onclick=()=>render(i));function sel(el,i){document.querySelectorAll('.scenarioBtns button').forEach(b=>b.classList.remove('active'));el.classList.add('active');const d=[['Maintain current reporting priorities','Protect board and executive outputs, close open reconciliations and continue automating recurring pack preparation.'],['Re-sequence the queue','Preserve decision-critical reporting first, defer low-value requests and use standard templates for repeatable analysis.'],['Hold affected measures','Stop publication of impacted figures, isolate the source issue, reconcile the position and republish with a clear audit trail.'],['Shift effort to interpretation','Use capacity released from recurring production to investigate material movements, improve commentary and support stakeholder analysis.']][i];document.getElementById('dec').innerHTML=`<h3>${d[0]}</h3><p>${d[1]}</p>`}render(0)</script></body></html>
