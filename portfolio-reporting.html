<style>

--blue))}.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}.status-summary{display:flex;gap:12px;margin-top:8px;font-size:.58rem;color:var(--ink-2);flex-wrap:wrap}.status-summary span{display:flex;align-items:center;gap:5px}.status-summary i{width:7px;height:7px;border-radius:2px}.heatmap{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .48rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center}.heat-label{font-size:.59rem;color:var(--ink-2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl.warn .tl-dot{border-color:var(--warn)}.tl.bad .tl-dot{border-color:var(--risk)}.tl.good .tl-dot{border-color:var(--ok)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:6px 8px;font-size:.58rem;text-align:left}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}.note{font-size:.54rem;color:var(--ink-3);line-height:1.45;margin-top:6px}@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.header{align-items:flex-start;flex-wrap:wrap}}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenarios{grid-template-columns:1fr}.header{position:static}}

<body>
<div class="shell"><header class="header"><div class="brand"><div class="brand-mark"></div><div><h1>Portfolio Reporting & Analytics</h1><p>portfolio performance · executive reporting · data assurance · automation</p></div></div><div class="controls"><select class="select"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="select"><option>Whole portfolio</option><option>Priority portfolio</option><option>Exception view</option></select><button class="theme-btn" id="themeBtn"><span class="theme-orb"></span><span id="themeText">Dark</span></button></div></header><div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div></div><div class="tooltip" id="tooltip"></div>
<script>
const CFG={views:[{nav:'Executive overview',title:'Portfolio reporting overview',desc:'Performance, reporting health, material movements and exceptions prepared for senior review.'},{nav:'Portfolio performance',title:'Portfolio performance',desc:'Current position, movement, drivers and board-style commentary across the portfolio.'},{nav:'Data assurance',title:'Reporting assurance',desc:'Reconciliation, validation, data quality and source-to-output controls behind published measures.'},{nav:'Scenarios',title:'Reporting scenarios',desc:'Effect of changing reporting demand, data quality and automation assumptions.'},{nav:'Governance',title:'Governance and workflow',desc:'Reporting lineage, ownership, review rhythm and automation across the production cycle.'}],kpis:[{label:'Portfolio index',value:'104.8',sub:'+2.7% vs prior period',icon:'PF'},{label:'Reporting timeliness',value:'96%',sub:'30 of 31 outputs on time',icon:'RT'},{label:'Open exceptions',value:'6',sub:'2 need senior attention',icon:'EX'},{label:'Manual effort removed',value:'63%',sub:'Recurring pack preparation',icon:'AU'}],seriesLabels:['Prior period','Current period'],lineLabel:'Exception count',primaryChartTitle:'Portfolio performance and exception view',primaryChartSub:'Current and prior position with exception overlay.',primaryRows:[{label:'Growth',a:82,b:88,line:3},{label:'Defensive',a:79,b:83,line:2},{label:'Real assets',a:76,b:84,line:4},{label:'Liquidity',a:91,b:92,line:1},{label:'Programs',a:74,b:81,line:5},{label:'Benefits',a:80,b:86,line:2}],healthTitle:'Reporting health',healthSub:'Selected reporting and control measures.',health:[{label:'Completeness',value:98},{label:'Reconciliation',value:96},{label:'Timeliness',value:96},{label:'Definition coverage',value:93},{label:'Refresh reliability',value:97}],decisionTitle:'Focus senior attention on material movements and unresolved exceptions',decisionText:'A useful reporting pack should explain what changed, what drove the movement, what remains unresolved and what decision or action is required.',register:[{item:'Growth performance',area:'Portfolio',status:'On track',action:'Include driver commentary'},{item:'Cost reconciliation',area:'Finance',status:'On track',action:'Close month-end check'},{item:'Exception ageing',area:'Risk',status:'Review',action:'Escalate two items'},{item:'Manual pack dependency',area:'Reporting',status:'Watch',action:'Automate remaining steps'}],trendTitle:'Portfolio performance trend',trendSub:'Illustrative movement across 12 reporting periods.',trendA:[90,92,93,95,96,98,100,101,102,103,104,105],trendB:[89,90,91,92,93,95,96,97,98,99,100,101],mixTitle:'Reporting coverage',mixSub:'Current readiness across key reporting domains.',mix:[{label:'Portfolio performance',value:96},{label:'Finance',value:95},{label:'Risk',value:90},{label:'Executive pack',value:94},{label:'Board-style reporting',value:92}],performanceTableTitle:'Performance scorecard',performanceHeaders:['Area','Primary measure','Current','Movement','Status'],performanceRows:[['Growth','Performance index','106.1','+3.3','On track'],['Defensive','Performance index','102.7','+0.9','On track'],['Real assets','Performance index','104.0','+3.1','Review'],['Liquidity','Performance index','100.4','+0.2','On track'],['Benefits','Realisation confidence','86%','+4pp','On track']],quality:[{label:'Portfolio data',values:[98,97,95,96]},{label:'Finance data',values:[97,96,91,95]},{label:'Risk data',values:[94,92,88,91]},{label:'Reference data',values:[99,98,96,98]}],flow:[{title:'Reporting need',text:'Define audience, decision and materiality.'},{title:'Sources',text:'Enterprise systems, finance and governed business inputs.'},{title:'Transform',text:'Business rules, joins and measure calculations.'},{title:'Assure',text:'Reconcile, validate and investigate exceptions.'},{title:'Publish',text:'Executive or board-style pack with commentary.'}],issueAge:[{label:'0–7 days',value:82},{label:'8–30 days',value:55},{label:'31–60 days',value:26},{label:'>60 days',value:9}],assuranceTitle:'Published figures should remain traceable to source, rule and review',assuranceText:'The reporting process should make clear where a number came from, how it was calculated, what checks were applied and whether any unresolved exceptions remain.',scenarios:[{name:'Base',note:'Current demand and controls.',series:[90,92,94,96,98,100,102,104],kpis:[{label:'Timeliness',value:'96%',sub:'Current'},{label:'Exceptions',value:'6',sub:'Open'},{label:'Automation',value:'63%',sub:'Recurring steps'},{label:'Readiness',value:'92%',sub:'Board-style pack'}],decision:'Maintain current reporting rhythm',detail:'Current demand is manageable with existing controls and prioritisation.'},{name:'Demand surge',note:'More executive and ad hoc requests.',series:[90,91,92,93,94,95,96,97],kpis:[{label:'Timeliness',value:'88%',sub:'Under pressure'},{label:'Exceptions',value:'9',sub:'Open'},{label:'Automation',value:'63%',sub:'Unchanged'},{label:'Readiness',value:'84%',sub:'More review'}],decision:'Protect decision-critical reporting',detail:'Prioritise executive and board outputs while deferring lower-value ad hoc work.'},{name:'Data issue',note:'Reconciliation deteriorates.',series:[90,91,90,92,91,93,92,94],kpis:[{label:'Timeliness',value:'91%',sub:'Slower'},{label:'Exceptions',value:'14',sub:'Higher'},{label:'Automation',value:'63%',sub:'Unchanged'},{label:'Readiness',value:'76%',sub:'Affected'}],decision:'Hold affected measures until reconciled',detail:'Do not publish material figures while source or definition exceptions remain unresolved.'},{name:'Automation uplift',note:'More manual steps removed.',series:[90,93,96,99,101,103,105,107],kpis:[{label:'Timeliness',value:'99%',sub:'Improved'},{label:'Exceptions',value:'4',sub:'Lower'},{label:'Automation',value:'82%',sub:'Recurring steps'},{label:'Readiness',value:'96%',sub:'Improved'}],decision:'Shift released effort into analysis',detail:'Use saved preparation time for driver analysis, commentary and exception investigation.'}],scenarioChartTitle:'Reporting scenario trajectory',lineage:[{title:'Published measure',text:'Performance, movement, exception and commentary.'},{title:'Calculation',text:'Defined logic, joins, filters and business rules.'},{title:'Assurance',text:'Reconciliation, validation and exception review.'},{title:'Source',text:'Enterprise and governed stakeholder data.'},{title:'Decision use',text:'Executive, governance or board-style reporting.'}],timeline:[{cls:'good',title:'Source refresh',text:'Controlled data cut and completeness checks.'},{cls:'good',title:'Reconciliation',text:'Key totals, definitions and material movements reviewed.'},{cls:'warn',title:'Commentary gate',text:'Exceptions and drivers confirmed before publication.'},{cls:'good',title:'Executive release',text:'Pack issued with actions and ownership recorded.'}],governanceTableTitle:'Reporting controls and ownership',governanceRows:[['Publication QA','Reporting team','Validation evidence','On track'],['Reconciliation','Data owners','Reconciliation log','On track'],['Metric definitions','Governance','Measure dictionary','Review'],['Exception closure','Business owners','Action register','Watch']]};
let state={view:0,scenario:0};
function statusClass(s){return /on track|healthy|complete|low/i.test(s)?'good':/risk|watch|conditional|medium|review/i.test(s)?'warn':'bad'}
function badge(s){return `<span class="badge ${statusClass(s)}">${s}</span>`}
function smoothPath(points){if(points.length<2)return'';let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const p0=points[i],p1=points[i+1],mx=(p0[0]+p1[0])/2;d+=` C ${mx} ${p0[1]}, ${mx} ${p1[1]}, ${p1[0]} ${p1[1]}`;}return d;}
function bindTooltips(){const tip=document.getElementById('tooltip');document.querySelectorAll('[data-tip]').forEach(el=>{el.addEventListener('mouseenter',()=>{tip.innerHTML=el.dataset.tip;tip.style.display='block'});el.addEventListener('mousemove',e=>{const r=tip.getBoundingClientRect(),pad=12,gap=14;let l=e.clientX+gap,t=e.clientY+gap;if(l+r.width+pad>innerWidth)l=e.clientX-r.width-gap;if(t+r.height+pad>innerHeight)t=e.clientY-r.height-gap;tip.style.left=Math.max(pad,l)+'px';tip.style.top=Math.max(pad,t)+'px'});el.addEventListener('mouseleave',()=>tip.style.display='none')})}
function lineChart(series,second=null){const w=650,h=220,p=28,all=[...series,...(second||[])],min=Math.min(...all)-2,max=Math.max(...all)+2,pts=series.map((v,i)=>[p+i/(series.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),pts2=second?second.map((v,i)=>[p+i/(second.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]):[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-a" d="${smoothPath(pts)}"/>${second?`<path class="line-b" d="${smoothPath(pts2)}"/>`:''}${pts.map((q,i)=>`<circle class="hoverable" data-tip="<strong>Period ${i+1}</strong>${series[i]}" cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('')}</svg>`}
function barLine(rows){const w=650,h=220,pL=42,pR=24,pT=18,pB=28,slot=(w-pL-pR)/rows.length,maxB=Math.max(...rows.map(x=>Math.max(x.a,x.b)))*1.12,maxL=Math.max(...rows.map(x=>x.line),1)*1.15,bars=rows.map((d,i)=>{const x=pL+i*slot+slot*.14,ah=d.a/maxB*(h-pT-pB),bh=d.b/maxB*(h-pT-pB);return `<rect class="hoverable" data-tip="<strong>${d.label}</strong>${CFG.seriesLabels[0]} ${d.a}<br>${CFG.seriesLabels[1]} ${d.b}<br>${CFG.lineLabel} ${d.line}" x="${x}" y="${h-pB-ah}" width="${slot*.25}" height="${ah}" rx="3" fill="var(--blue)" opacity=".78"/><rect class="hoverable" data-tip="<strong>${d.label}</strong>${CFG.seriesLabels[1]} ${d.b}" x="${x+slot*.29}" y="${h-pB-bh}" width="${slot*.25}" height="${bh}" rx="3" fill="var(--gold)" opacity=".86"/>`;}).join(''),pts=rows.map((d,i)=>[pL+i*slot+slot*.42,pT+(maxL-d.line)/maxL*(h-pT-pB)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join('')}${bars}<path class="line-risk" d="${smoothPath(pts)}"/>${rows.map((d,i)=>`<text class="tick" x="${pL+i*slot+slot*.16}" y="${h-8}">${d.label}</text>`).join('')}</svg>`}
function metricBars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x.label}</label><div class="track"><div class="fill" style="width:${x.value}%"></div></div><div class="metric-score">${x.value}%</div></div>`).join('')}</div>`}
function pageHead(i,label){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[i].title}</h2><p class="page-desc">${CFG.views[i].desc}</p></div><span class="demo">${label}</span></div>`}
function renderOverview(){return `${pageHead(0,'Illustrative demonstration')}<section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub}</div></div><div class="kpi-icon">${x.icon}</div></div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>${CFG.primaryChartTitle}</h3><p>${CFG.primaryChartSub}</p></div><div class="legend"><span><i style="background:var(--blue)"></i>${CFG.seriesLabels[0]}</span><span><i style="background:var(--gold)"></i>${CFG.seriesLabels[1]}</span><span><i style="background:var(--risk)"></i>${CFG.lineLabel}</span></div></div>${barLine(CFG.primaryRows)}</div><div class="card"><div class="chart-title"><div><h3>${CFG.healthTitle}</h3><p>${CFG.healthSub}</p></div></div>${metricBars(CFG.health)}<div class="status-summary"><span><i style="background:var(--ok)"></i>Strong</span><span><i style="background:var(--warn)"></i>Watch</span><span><i style="background:var(--risk)"></i>Intervene</span></div></div></section><section class="grid two"><div class="decision"><div class="eyebrow">Decision focus</div><h3>${CFG.decisionTitle}</h3><p>${CFG.decisionText}</p></div><div class="card"><div class="chart-title"><div><h3>Priority register</h3><p>Current items requiring attention or confirmation.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r.item}</td><td>${r.area}</td><td>${badge(r.status)}</td><td>${r.action}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function renderPerformance(){return `${pageHead(1,'Performance view')}<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>${CFG.trendTitle}</h3><p>${CFG.trendSub}</p></div></div>${lineChart(CFG.trendA,CFG.trendB)}</div><div class="card"><div class="chart-title"><div><h3>${CFG.mixTitle}</h3><p>${CFG.mixSub}</p></div></div>${metricBars(CFG.mix)}</div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>${CFG.performanceTableTitle}</h3><p>Selected measures and current position.</p></div></div><div class="table-wrap"><table><thead><tr>${CFG.performanceHeaders.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${CFG.performanceRows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===r.length-1?badge(v):v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function renderQuality(){return `${pageHead(2,'Assurance view')}<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heatmap"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="heat-head">${x}</div>`).join('')}${CFG.quality.map(q=>`<div class="heat-label">${q.label}</div>${q.values.map(v=>`<div class="heat-cell ${v>=90?'hi':v>=80?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Validation pathway</h3><p>From reporting requirement to trusted output.</p></div></div><div class="flow">${CFG.flow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join('')}</div></div></section><section class="grid two" style="margin-top:10px"><div class="card"><div class="chart-title"><div><h3>Issue ageing</h3><p>Illustrative open-item profile.</p></div></div>${metricBars(CFG.issueAge)}</div><div class="decision"><div class="eyebrow">Assurance principle</div><h3>${CFG.assuranceTitle}</h3><p>${CFG.assuranceText}</p></div></section>`}
function renderScenario(){const s=CFG.scenarios[state.scenario];return `${pageHead(3,'Scenario view')}<div class="scenarios">${CFG.scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?'active':''}" data-sc="${i}"><strong>${x.name}</strong><span>${x.note}</span></button>`).join('')}</div><section class="grid kpis">${s.kpis.map(x=>`<div class="card"><div class="eyebrow">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub}</div></div>`).join('')}</section><section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>${CFG.scenarioChartTitle}</h3><p>Comparison of baseline and selected scenario trajectory.</p></div></div>${lineChart(CFG.scenarios[0].series,s.series)}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s.decision}</h3><p>${s.detail}</p></div></section>`}
function renderGovernance(){return `${pageHead(4,'Governance view')}<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Reporting lineage</h3><p>Trace key measures from published output back to controlled source.</p></div></div><div class="flow">${CFG.lineage.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Reporting cycle</h3><p>Control and review rhythm.</p></div></div><div class="timeline">${CFG.timeline.map(x=>`<div class="tl ${x.cls}"><span class="tl-dot"></span><strong>${x.title}</strong><p>${x.text}</p></div>`).join('')}</div></div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>${CFG.governanceTableTitle}</h3><p>Ownership, evidence and next action.</p></div></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${CFG.governanceRows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join('')}</tbody></table></div></section>`}
const RENDERERS=[renderOverview,renderPerformance,renderQuality,renderScenario,renderGovernance];
function renderSidebar(){const s=document.getElementById('sidebar');s.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-view="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v.nav}</span></button>`).join('')}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Designed for role-relevant decision support</div>`;s.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=+b.dataset.view;render()}));}
function render(){document.getElementById('main').innerHTML=RENDERERS[state.view]();renderSidebar();bindTooltips();document.querySelectorAll('[data-sc]').forEach(b=>b.addEventListener('click',()=>{state.scenario=+b.dataset.sc;render()}));}
document.getElementById('themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';document.getElementById('themeText').textContent=dark?'Dark':'Light';});
render();
</script>
</body></html>
