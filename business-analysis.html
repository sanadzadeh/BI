<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Enterprise Business Analysis Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative business analysis dashboard covering requirements, dependencies, decisions, delivery governance and readiness.">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--line:#dce2e8;--ink:#14212b;--muted:#66727d;--blue:#0b4f82;--blue2:#1f78b4;--blueDim:#e8f2f9;--ok:#2f7d4f;--warn:#a36b00;--risk:#a63d32;--shadow:0 3px 12px rgba(20,33,43,.07)}
:root[data-theme="dark"]{--bg:#10161b;--surface:#182028;--line:#2d3943;--ink:#edf3f7;--muted:#a7b2bb;--blue:#68b7e8;--blue2:#8ac9ef;--blueDim:#163142;--ok:#73c793;--warn:#e3b557;--risk:#e38b81;--shadow:0 5px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}.brand b{font-size:16px}.brand span{display:block;margin-top:3px;font:10px DM Mono;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.top button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 9px}.app{display:grid;grid-template-columns:210px 1fr}.side{position:sticky;top:57px;height:calc(100vh - 57px);background:var(--surface);border-right:1px solid var(--line);padding:14px 9px}.side h4{margin:0 8px 10px;font:10px DM Mono;color:var(--muted);text-transform:uppercase}.nav{width:100%;display:flex;gap:8px;align-items:center;padding:9px;border:0;background:transparent;color:var(--muted);border-left:3px solid transparent;border-radius:7px;text-align:left}.nav.active{background:var(--blueDim);color:var(--blue);border-left-color:var(--blue)}.num{font:10px DM Mono}.main{padding:20px 24px 40px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:14px}.head h1{font-size:22px;margin:0 0 4px}.head p{margin:0;color:var(--muted);font-size:12px;max-width:820px}.pill{font:10px DM Mono;color:var(--blue);background:var(--blueDim);border:1px solid var(--line);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:1.4fr 1fr}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px;box-shadow:var(--shadow)}.eyebrow{font:10px DM Mono;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}.value{font-size:24px;font-weight:700}.sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}.barrow{display:grid;grid-template-columns:155px 1fr 40px;gap:8px;align-items:center;margin:9px 0;font-size:11px}.track{height:8px;background:var(--bg);border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:999px}.score{font:10px DM Mono;text-align:right;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font:10px DM Mono;color:var(--muted);text-transform:uppercase;background:var(--bg)}.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:700}.good{background:#e8f4ed;color:var(--ok)}.amber{background:#fbf1dd;color:var(--warn)}.red{background:#f8e7e4;color:var(--risk)}.flow{display:flex;gap:7px;align-items:stretch;overflow:auto}.node{min-width:150px;flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px}.node b{display:block;font-size:11px;margin-bottom:4px}.node span{font-size:10px;color:var(--muted);line-height:1.4}.arrow{align-self:center;color:var(--muted)}.decision{border-left:4px solid var(--blue);padding:12px;background:var(--surface);border-radius:9px;box-shadow:var(--shadow)}.decision b{display:block;margin-bottom:5px}.decision p{margin:0;font-size:11px;color:var(--muted);line-height:1.5}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side h4{display:none}.nav{min-width:max-content}.kpis,.two{grid-template-columns:1fr}.main{padding:16px 12px}.head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header class="top"><div class="brand"><b>Khaled S. — Enterprise Business Analysis</b><span>requirements · decisions · dependencies · delivery</span></div><button id="theme">Dark</button></header>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const views=[
['Overview','Enterprise analysis overview','A compact view of requirements quality, decisions, dependencies and delivery readiness.'],
['Requirements','Requirements & traceability','How business intent is translated into prioritised, testable and traceable requirements.'],
['Dependencies','Cross-stream dependencies','Where initiatives, teams and decisions intersect and where escalation is required.'],
['Decisions','Decision support','Options, trade-offs and decision records used to keep delivery aligned to business intent.'],
['Readiness','Delivery readiness','Controls for testing, implementation, business readiness and post-change follow-through.'],
['Capability','BA capability','A practical view of review, guidance and consistency across analytical work.']
];
const side=document.getElementById('side'),main=document.getElementById('main');
function nav(){side.innerHTML='<h4>Views</h4>'+views.map((v,i)=>`<button class="nav ${i===0?'active':''}" onclick="render(${i},this)"><span class="num">0${i}</span><span>${v[0]}</span></button>`).join('')}
function kpis(items){return `<div class="grid kpis">${items.map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('')}</div>`}
function bars(items){return `<div class="card"><div class="eyebrow">Analysis health</div>${items.map(x=>`<div class="barrow"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="score">${x[1]}%</span></div>`).join('')}</div>`}
function table(rows){return `<div class="card"><div class="eyebrow">Current items</div><table><thead><tr><th>Item</th><th>Owner</th><th>State</th><th>Decision / action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b><div class="sub">${r[1]}</div></td><td>${r[2]}</td><td><span class="badge ${r[3]}">${r[4]}</span></td><td>${r[5]}</td></tr>`).join('')}</tbody></table></div>`}
function render(i,el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');let [n,t,d]=views[i];let body='';
if(i===0)body=kpis([['Open requirements','46','Across three active workstreams'],['Decision points','8','Three require senior alignment'],['Dependencies','12','Four cross-team'],['Readiness','84%','Current implementation gate']])+`<div class="grid two">${bars([['Requirements completeness',92],['Traceability',88],['Dependency clarity',81],['Decision coverage',86],['Readiness evidence',84]])}<div class="decision"><b>Current focus</b><p>Resolve two cross-stream dependencies before finalising the next delivery sequence. Both affect scope, benefit timing and testing entry.</p></div></div><div style="margin-top:10px">${table([['Customer onboarding rule set','Five business rules still differ across teams','Product / Tech','amber','Needs alignment','Confirm one rule set before build continues'],['Data hand-off dependency','Source-to-target ownership unresolved','Data / Ops','red','Escalate','Decision required at governance forum'],['Readiness checklist','Evidence set drafted','Change / Delivery','good','On track','Complete final owner confirmations']])}</div>`;
if(i===1)body=kpis([['Prioritised','38','MoSCoW / decision-led'],['Traceable','88%','Intent to requirement to test'],['Open conflicts','5','Across process and policy'],['Clarifications','7','Waiting on stakeholder input']])+table([['R-014 Eligibility rule','Policy intent differs from current process','Business','amber','Review','Resolve rule and update acceptance criteria'],['R-022 Exception path','No owner for manual override','Operations','red','Open','Assign owner and define control'],['R-031 Reporting measure','Definition agreed and testable','Finance','good','Ready','Carry into test evidence']]);
if(i===2)body=kpis([['Cross-stream','12','Dependencies currently tracked'],['Critical','4','Could move delivery date'],['Unowned','2','Require allocation'],['Resolved this cycle','6','Closed through working sessions']])+`<div class="card"><div class="eyebrow">Dependency chain</div><div class="flow"><div class="node"><b>Business rule</b><span>Definition and owner agreed</span></div><div class="arrow">→</div><div class="node"><b>Data change</b><span>Mapping and control impact</span></div><div class="arrow">→</div><div class="node"><b>Build</b><span>Implementation sequence</span></div><div class="arrow">→</div><div class="node"><b>Testing</b><span>Entry criteria and evidence</span></div><div class="arrow">→</div><div class="node"><b>Readiness</b><span>Process, people and control change</span></div></div></div>`;
if(i===3)body=kpis([['Decisions logged','24','Current program'],['Open','8','Awaiting alignment'],['Trade-offs tested','11','Cost, timing, scope, risk'],['Exec decisions','5','Current cycle']])+table([['Sequence option','Earlier benefit vs higher change load','Strategy / Delivery','amber','Decision','Choose sequence for next planning cycle'],['Scope boundary','Two teams interpret scope differently','Business / Tech','red','Escalate','Confirm boundary before design sign-off'],['Control treatment','Manual vs automated control','Risk / Tech','good','Agreed','Proceed with automated option and evidence plan']]);
if(i===4)body=kpis([['Testing entry','82%','Evidence complete'],['Business readiness','84%','Owner confirmations pending'],['Open defects','6','Two high priority'],['Control checks','91%','Current gate']])+bars([['Requirements clarified',95],['Acceptance criteria',90],['Process readiness',83],['Control evidence',91],['Training / handover',76]]);
if(i===5)body=kpis([['Artefacts reviewed','18','This cycle'],['Methods aligned','9','Measures / rules / templates'],['Working sessions','7','Guidance and problem solving'],['Open quality issues','3','Require rework']])+table([['Requirements pack','Traceability and scope review','BA team','good','Reviewed','Minor wording changes only'],['Process map','Exception path missing','BA / SME','amber','Rework','Add manual exception and owner'],['Decision record','Trade-off rationale incomplete','Delivery','amber','Rework','Add impact on benefit timing']]);
main.innerHTML=`<div class="head"><div><h1>${t}</h1><p>${d}</p></div><span class="pill">illustrative data</span></div>${body}`}
nav();render(0);document.getElementById('theme').onclick=()=>{let d=document.documentElement;let dark=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',dark?'':'dark');document.getElementById('theme').textContent=dark?'Dark':'Light'};
</script></body></html>
