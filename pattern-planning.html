<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Planning & Rostering Analytics</title><meta name="description" content="Illustrative operational planning dashboard covering crew pattern efficiency, roster stability, capacity, compliance and scenarios."><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--p:#f4f4f4;--s:#fff;--sa:#fafafa;--sd:#ededed;--b:#d9d9d9;--i:#181818;--i2:#525252;--i3:#818181;--a:#e0001b;--ad:#fff0f2;--am:#f1b8c0;--bl:#303030;--g:#8a8a8a;--ok:#327a48;--okd:#eaf4ed;--w:#a46b00;--wd:#fbf0d8;--r:#c8102e;--rd:#fbe8ec;--sh:0 8px 24px rgba(20,20,20,.08);--ss:0 2px 8px rgba(20,20,20,.055);--rad:8px;--mon:'DM Mono',monospace}:root[data-theme=dark]{--p:#111;--s:#191919;--sa:#202020;--sd:#292929;--b:#333;--i:#f4f4f4;--i2:#b7b7b7;--i3:#898989;--a:#ff4359;--ad:#34151a;--am:#71323b;--bl:#d7d7d7;--g:#a6a6a6;--ok:#79c58b;--okd:#173421;--w:#e2ad45;--wd:#3b2d14;--r:#ff6d7e;--rd:#3b1d22;--sh:0 9px 26px rgba(0,0,0,.30);--ss:0 2px 10px rgba(0,0,0,.24)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--p);color:var(--i);font-family:Inter,system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--s);border-bottom:3px solid var(--a);box-shadow:0 2px 10px rgba(0,0,0,.05)}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:28px;border-radius:0 0 18px 0;background:var(--a);position:relative;transform:skewX(-18deg);box-shadow:inset -8px 0 0 rgba(255,255,255,.10)}.mark:before{content:"";position:absolute;left:9px;right:9px;top:13px;height:2px;background:#fff;transform:skewX(18deg)}.mark:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;right:8px;top:9px;opacity:.95;transform:skewX(18deg)}.brand h1{font:700 1rem/1 Inter,sans-serif;margin:0;letter-spacing:-.02em}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mon);letter-spacing:.08em;text-transform:uppercase;color:var(--i3)}.controls{display:flex;gap:7px;flex-wrap:wrap}.sel,.theme{border:1px solid var(--b);background:var(--sa);color:var(--i);border-radius:5px;padding:6px 8px;font-size:.64rem}.theme{border-color:var(--a);color:var(--a)}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.side{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:var(--s);border-right:1px solid var(--b);padding:15px 9px}.st{font:400 .5rem/1 var(--mon);letter-spacing:.13em;text-transform:uppercase;color:var(--i3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--i2);padding:8px 9px;border-radius:5px;margin:2px 0}.nav.active{background:var(--ad);border-left-color:var(--a);color:var(--a)}.nn{font:400 .53rem/1.2 var(--mon);color:var(--i3)}.nl{font-size:.71rem;font-weight:600}.meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--b);font-size:.59rem;line-height:1.5;color:var(--i2)}.main{min-width:0;padding:20px 24px 44px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.pt{font:700 1.32rem/1 Inter,sans-serif;letter-spacing:-.025em;margin:0 0 5px}.pd{margin:0;max-width:850px;color:var(--i2);font-size:.69rem;line-height:1.45}.demo{font:500 .5rem/1 var(--mon);text-transform:uppercase;color:var(--a);background:var(--ad);border:1px solid var(--am);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--s);border:1px solid var(--b);border-radius:var(--rad);box-shadow:var(--ss);padding:13px;min-width:0}.feature{box-shadow:var(--sh);border-top:2px solid var(--a)}.eye{font:500 .49rem/1.2 var(--mon);text-transform:uppercase;color:var(--i3);margin-bottom:6px}.kv{font:700 1.28rem/.95 Inter,sans-serif;letter-spacing:-.03em}.ks{font-size:.59rem;color:var(--i2);line-height:1.35;margin-top:5px}.ki{width:29px;height:29px;border-radius:6px;display:grid;place-items:center;background:var(--ad);color:var(--a);font:500 .54rem/1 var(--mon)}.kpi{display:flex;justify-content:space-between}.ct{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.ct h3{font-size:.75rem;margin:0}.ct p{font-size:.56rem;color:var(--i3);margin:3px 0 0}.chart{width:100%;height:205px}.gl{stroke:var(--b);stroke-width:1;stroke-dasharray:3 5}.la{fill:none;stroke:var(--a);stroke-width:3}.lb{fill:none;stroke:var(--bl);stroke-width:2.5}.lr{fill:none;stroke:var(--r);stroke-width:2.5}.lg{fill:none;stroke:var(--g);stroke-width:2.5}.tick{fill:var(--i3);font:8px var(--mon)}.ms{display:grid;gap:8px}.mb{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center}.mb label{font-size:.59rem;color:var(--i2)}.track{height:7px;border-radius:999px;background:var(--sd);overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--a),#ff5367)}.score{text-align:right;font:400 .55rem/1 var(--mon);color:var(--i2)}.decision{border-left:4px solid var(--a);background:linear-gradient(135deg,var(--s),var(--ad));border-radius:var(--rad);padding:12px}.decision h3{font:700 .91rem/1.15 Inter,sans-serif;margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--i2);margin:0}.tw{overflow:auto;border:1px solid var(--b);border-radius:7px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:8px 9px;border-bottom:1px solid var(--b);text-align:left;font-size:.59rem}th{font:400 .47rem/1.2 var(--mon);text-transform:uppercase;color:var(--i3);background:var(--sa)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.good{color:var(--ok);background:var(--okd)}.warn{color:var(--w);background:var(--wd)}.bad{color:var(--r);background:var(--rd)}.heat{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.hh{font:400 .48rem/1 var(--mon);text-transform:uppercase;color:var(--i3);text-align:center}.hl{font-size:.59rem;color:var(--i2)}.hc{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mon)}.hi{background:var(--ok)}.mid{background:var(--w)}.lo{background:var(--r)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:150px;flex:1;padding:10px;border-radius:7px;background:var(--sa);border:1px solid var(--b)}.node.active{background:var(--ad);border-color:var(--a)}.nt{font:400 .48rem/1 var(--mon);text-transform:uppercase;color:var(--i3);margin-bottom:5px}.nb{font-size:.58rem;line-height:1.4;color:var(--i2)}.arrow{align-self:center;color:var(--a)}.scens{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.sc{border:1px solid var(--b);background:var(--sa);color:var(--i2);border-radius:5px;padding:7px 8px;text-align:left;font-size:.58rem}.sc.active{background:var(--ad);border-color:var(--a);color:var(--a)}.sc strong,.sc span{display:block}.sc span{margin-top:3px;color:var(--i3);font-size:.51rem}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--b)}.tl{position:relative;margin-bottom:12px}.dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--s);border:3px solid var(--a)}.tl.warn .dot{border-color:var(--w)}.tl.bad .dot{border-color:var(--r)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;color:var(--i2)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--b)}.st,.meta{display:none}.nav{width:auto;white-space:nowrap}.two,.kpis,.scens{grid-template-columns:1fr}.header{position:static}.main{padding:16px 12px 36px}}</style></head><body><div class="shell"><header class="header"><div class="brand"><div class="mark"></div><div><h1>Pattern Planning & Rostering Analytics</h1><p>crew capacity · roster stability · compliance · operational efficiency</p></div></div><div class="controls"><select class="sel"><option>Current roster cycle</option><option>Next roster cycle</option><option>Quarter view</option></select><select class="sel"><option>All bases</option><option>Domestic</option><option>Long haul</option><option>Exception view</option></select><button class="theme" id="theme">Dark</button></div></header><div class="app"><nav class="side" id="side"></nav><main class="main" id="main"></main></div></div><script>const C={v:[['Executive overview','Roster planning overview','Operational view of crew coverage, pattern efficiency, stability and exceptions.'],['Pattern efficiency','Pattern efficiency','Flying-pattern utilisation, deadheading, duty mix and cost drivers.'],['Roster stability','Roster stability','Coverage, reserve demand, swaps and disruption indicators.'],['Compliance & fatigue','Compliance and fatigue','Logical checks across duty limits, rest, fatigue and agreement constraints.'],['Scenarios','Planning scenarios','Scenario comparison for demand, disruption, reserve coverage and cost.']],k:[['Roster coverage','98.4%','Planned duties covered','CV'],['Pattern utilisation','86%','Productive duty utilisation','UT'],['Reserve coverage','7.8%','Available buffer','RV'],['Open exceptions','14','Require planner review','EX']],h:[['Roster coverage',98],['Pattern utilisation',86],['Reserve adequacy',82],['Rule compliance',97],['Cost efficiency',89]],reg:[['SYD short-haul peak','Coverage','Watch','Rebalance reserve'],['Long-haul pairing','Utilisation','On track','Maintain pattern'],['Early-start cluster','Fatigue','Review','Test alternative'],['Deadhead concentration','Cost','Watch','Re-sequence sectors']],perf:[['Domestic AM','Coverage','99%','+1pp','On track'],['Domestic PM','Reserve demand','8.4%','+1.2pp','Watch'],['Long haul','Pattern utilisation','88%','+3pp','On track'],['Mixed fleet','Deadhead rate','5.9%','-0.8pp','Improving'],['All crew','Rule compliance','97%','Stable','On track']],q:[['Duty limits',[99,98,97,96]],['Minimum rest',[98,97,95,96]],['Agreement rules',[97,96,93,95]],['Roster construction',[96,95,92,94]]],flow:[['Flying demand','Sector schedule, timing and crew requirement.'],['Pattern build','Group sectors into workable duty patterns.'],['Constraint checks','Rest, duty, fatigue and agreement rules.'],['Roster build','Allocate patterns, reserves and recovery capacity.'],['Operational review','Cost, stability, exceptions and crew impact.']],sc:[['Base','Current demand and reserve settings.','Maintain current balance','Coverage remains stable with manageable exception volume.'],['Demand uplift','Flying demand rises 6%.','Increase targeted reserve','Protect peak periods rather than lifting buffer uniformly.'],['Disruption','Higher delay and cancellation pressure.','Add recovery capacity','Trade a small utilisation reduction for improved resilience.'],['Cost focus','Lower deadheading and reserve cost.','Rebuild selected patterns','Target inefficient pairings without weakening compliance or peak coverage.']],gov:[['Duty-time checks','Planning','Rules engine / validation','On track'],['Reserve thresholds','Crew operations','Coverage report','Watch'],['Pattern changes','Roster planning','Change record','On track'],['Fatigue exceptions','Safety / planning','Exception register','Review']]};let S={v:0,s:0};const bd=x=>`<span class="badge ${/on track|improving/i.test(x)?'good':/watch|review/i.test(x)?'warn':'bad'}">${x}</span>`;function bars(a){return `<div class="ms">${a.map(x=>`<div class="mb"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}function line(a,b){let w=650,h=210,p=28,m=Math.min(...a,...b)-2,M=Math.max(...a,...b)+2,pts=s=>s.map((v,i)=>[p+i/(s.length-1)*(w-2*p),h-p-(v-m)/(M-m)*(h-2*p)]),d=q=>'M '+q.map(x=>x.join(' ')).join(' L ');return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gl" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="la" d="${d(pts(a))}"/><path class="lb" d="${d(pts(b))}"/></svg>`}function combo(){let r=[['AM peak',92,96,5],['PM peak',88,93,7],['Long haul',83,88,4],['Weekend',86,91,6],['Reserve',78,82,3],['Recovery',72,79,8]],w=650,h=210,pL=42,pR=24,pT=18,pB=28,sl=(w-pL-pR)/r.length,m=110;let bars=r.map((d,i)=>{let x=pL+i*sl+sl*.15,a=d[1]/m*(h-pT-pB),b=d[2]/m*(h-pT-pB);return `<rect x="${x}" y="${h-pB-a}" width="${sl*.25}" height="${a}" rx="3" fill="var(--g)" opacity=".75"/><rect x="${x+sl*.29}" y="${h-pB-b}" width="${sl*.25}" height="${b}" rx="3" fill="var(--a)" opacity=".85"/>`}).join(''),pts=r.map((d,i)=>[pL+i*sl+sl*.43,pT+(10-d[3])/10*(h-pT-pB)]),d='M '+pts.map(x=>x.join(' ')).join(' L ');return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gl" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join('')}${bars}<path class="lr" d="${d}"/>${r.map((x,i)=>`<text class="tick" x="${pL+i*sl+4}" y="${h-8}">${x[0]}</text>`).join('')}</svg>`}function head(i,tag){return `<div class="head"><div><h2 class="pt">${C.v[i][1]}</h2><p class="pd">${C.v[i][2]}</p></div><span class="demo">${tag}</span></div>`}function kp(items=C.k){return `<section class="grid kpis">${items.map(x=>`<div class="card"><div class="kpi"><div><div class="eye">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">${x[2]}</div></div><div class="ki">${x[3]||'•'}</div></div></div>`).join('')}</section>`}function table(rows){return `<div class="tw"><table><thead><tr><th>Area</th><th>Measure</th><th>Current</th><th>Movement</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${i===4?bd(x):x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function overview(){return head(0,'Illustrative')+kp()+`<section class="grid two"><div class="card feature"><div class="ct"><div><h3>Coverage and exception profile</h3><p>Planned versus current position with operational exception overlay.</p></div></div>${combo()}</div><div class="card"><div class="ct"><div><h3>Planning health</h3><p>Selected operational indicators.</p></div></div>${bars(C.h)}</div></section><section class="grid two" style="margin-top:10px"><div class="decision"><div class="eye">Planning focus</div><h3>Protect peak coverage without carrying excess buffer across the full roster</h3><p>Use reserve and pattern changes where disruption exposure is concentrated, while preserving utilisation and rule compliance elsewhere.</p></div><div class="card"><div class="ct"><div><h3>Priority register</h3><p>Current items requiring planner attention.</p></div></div><div class="tw"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${C.reg.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${bd(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div></section>`}function efficiency(){let a=[78,79,81,80,82,83,84,85,86,86,87,88],b=[75,76,77,78,79,79,80,81,82,83,84,85];return head(1,'Efficiency')+`<section class="grid two"><div class="card feature"><div class="ct"><div><h3>Pattern utilisation trend</h3><p>Productive utilisation versus planning baseline.</p></div></div>${line(a,b)}</div><div class="card"><div class="ct"><div><h3>Efficiency drivers</h3><p>Selected pattern-planning measures.</p></div></div>${bars([['Productive duty',86],['Deadhead control',94],['Duty balance',89],['Connection efficiency',84],['Cost alignment',88]])}</div></section><section class="card" style="margin-top:10px"><div class="ct"><div><h3>Pattern scorecard</h3><p>Selected operational measures.</p></div></div>${table(C.perf)}</section>`}function stability(){return head(2,'Stability')+kp([['Coverage','98.4%','Current roster','CV'],['Reserve use','7.8%','Planned buffer','RV'],['Swap demand','4.6%','Duties changed','SW'],['Recovery load','11','Open actions','RC']])+`<section class="grid two"><div class="card"><div class="ct"><div><h3>Coverage by operating period</h3><p>Current coverage against operational need.</p></div></div>${bars([['AM peak',96],['PM peak',93],['Long haul',98],['Weekend',95],['Recovery',89]])}</div><div class="card"><div class="ct"><div><h3>Stability timeline</h3><p>Illustrative planning and review rhythm.</p></div></div><div class="timeline"><div class="tl"><span class="dot"></span><strong>Pattern build complete</strong><p>Base flying demand translated into draft duties.</p></div><div class="tl"><span class="dot"></span><strong>Constraint validation</strong><p>Duty, rest and agreement checks completed.</p></div><div class="tl warn"><span class="dot"></span><strong>Reserve review</strong><p>Peak-period buffer below preferred threshold.</p></div><div class="tl"><span class="dot"></span><strong>Roster release gate</strong><p>Final exceptions and change volume reviewed.</p></div></div></div></section>`}function compliance(){return head(3,'Controls')+`<section class="grid two"><div class="card"><div class="ct"><div><h3>Compliance heatmap</h3><p>Illustrative rule-check performance.</p></div></div><div class="heat"><div></div>${['Pass','Warn','Exception','Evidence'].map(x=>`<div class="hh">${x}</div>`).join('')}${C.q.map(q=>`<div class="hl">${q[0]}</div>${q[1].map(v=>`<div class="hc ${v>=96?'hi':v>=93?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="ct"><div><h3>Planning pathway</h3><p>From flying demand to operational review.</p></div></div><div class="flow">${C.flow.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div></section><section class="card" style="margin-top:10px"><div class="ct"><div><h3>Control register</h3><p>Ownership and evidence for key checks.</p></div></div><div class="tw"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${C.gov.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${bd(r[3])}</td></tr>`).join('')}</tbody></table></div></section>`}function scenarios(){let s=C.sc[S.s],series=[[86,87,88,89,90,91,92,93],[86,86,87,88,88,89,90,91],[86,85,84,86,87,88,89,90],[86,88,89,90,91,92,93,94]][S.s];return head(4,'Scenario')+`<div class="scens">${C.sc.map((x,i)=>`<button class="sc ${i===S.s?'active':''}" data-sc="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div>${kp([['Coverage',S.s===1?'96.8%':S.s===2?'97.2%':'98.4%','Scenario output','CV'],['Utilisation',S.s===3?'90%':S.s===2?'82%':'86%','Pattern result','UT'],['Reserve',S.s===1?'10.2%':S.s===2?'11.5%':'7.8%','Buffer','RV'],['Cost index',S.s===3?'96.4':S.s===2?'103.2':'100.0','Relative cost','CI']])}<section class="grid two"><div class="card feature"><div class="ct"><div><h3>Scenario trajectory</h3><p>Baseline versus selected planning case.</p></div></div>${line([86,87,88,89,90,91,92,93],series)}</div><div class="decision"><div class="eye">Scenario implication</div><h3>${s[2]}</h3><p>${s[3]}</p></div></section>`}const R=[overview,efficiency,stability,compliance,scenarios];function renderSide(){let s=document.getElementById('side');s.innerHTML=`<div class="st">Planning views</div>${C.v.map((v,i)=>`<button class="nav ${i===S.v?'active':''}" data-v="${i}"><span class="nn">0${i+1}</span><span class="nl">${v[0]}</span></button>`).join('')}<div class="meta">Organisation-neutral portfolio artefact<br>Illustrative operational data<br>Designed for planning and rostering decision support</div>`;s.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.v=+b.dataset.v;render()})}function render(){document.getElementById('main').innerHTML=R[S.v]();renderSide();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{S.s=+b.dataset.sc;render()})}document.getElementById('theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';document.getElementById('theme').textContent=d?'Dark':'Light'};render();</script></body></html>
