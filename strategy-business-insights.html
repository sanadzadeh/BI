<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Strategy & Business Insights — Khaled Sanad</title><meta name="description" content="Illustrative strategy and business insights dashboard covering enterprise performance, drivers, scenarios and executive decision support."><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet"><style>:root{--bg:#f3f5f6;--card:#fff;--ink:#18232c;--muted:#64727d;--line:#d9e1e5;--accent:#0b5d6b;--blue:#4a7897;--gold:#b58b48;--green:#3f7a4c;--red:#a23b2e;--soft:#e8f1f3;--shadow:0 2px 10px rgba(24,35,44,.06);--mono:'DM Mono',monospace;--serif:'Cormorant Garamond',serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand h1{margin:0;font:600 18px var(--serif)}.brand p{margin:3px 0 0;font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.controls{display:flex;gap:7px}.controls select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 8px;font-size:11px}.app{display:grid;grid-template-columns:210px 1fr}.side{position:sticky;top:55px;height:calc(100vh - 55px);background:#fff;border-right:1px solid var(--line);padding:14px 9px}.side-title{font:9px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:#87939d;padding:0 8px 7px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:5px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;padding:8px;color:var(--muted);border-radius:7px;margin:2px 0}.nav.active{background:var(--soft);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:10px var(--mono);color:#8b969e}.nav-label{font-size:12px;font-weight:600}.main{padding:20px 24px 36px;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}.head h2{margin:0 0 4px;font:600 23px var(--serif)}.head p{margin:0;color:var(--muted);font-size:11px}.tag{font:9px var(--mono);text-transform:uppercase;color:var(--accent);background:var(--soft);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;box-shadow:var(--shadow)}.eyebrow{font:9px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:#87939d}.value{font:600 26px var(--serif);margin-top:4px}.sub{font-size:10px;color:var(--muted);margin-top:3px}.title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}.title h3{margin:0;font-size:12px}.title p{margin:3px 0 0;font-size:10px;color:#87939d}.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:9px;color:var(--muted)}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.chart{width:100%;height:210px}.gridline{stroke:var(--line);stroke-dasharray:3 5}.tick{fill:#7d8992;font:8px var(--mono)}.line-a,.line-b,.line-c{fill:none;stroke-linecap:round;stroke-linejoin:round}.line-a{stroke:var(--accent);stroke-width:3}.line-b{stroke:var(--blue);stroke-width:2.7}.line-c{stroke:var(--gold);stroke-width:2.5}.area{fill:var(--soft);opacity:.85}.barrow{display:grid;grid-template-columns:135px 1fr 48px;gap:8px;align-items:center;margin:8px 0}.barrow span{font-size:10px}.track{height:7px;background:#e8edf0;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px}.mono{font:9px var(--mono);color:var(--muted);text-align:right}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:8px 9px;border-bottom:1px solid var(--line);font-size:10px;text-align:left}th{font:9px var(--mono);text-transform:uppercase;color:#87939d;background:#f7f9fa}.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:9px;font-weight:700}.good{background:#e8f3eb;color:var(--green)}.watch{background:#fbf1dc;color:#94680a}.risk{background:#f8e8e5;color:var(--red)}.callout{border-left:4px solid var(--accent);background:#fff;border-radius:10px;padding:12px 13px;box-shadow:var(--shadow)}.callout strong{font-size:12px}.callout p{margin:5px 0 0;font-size:10px;line-height:1.45;color:var(--muted)}.scenarioBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;text-align:left}.scenario.active{border-color:var(--accent);background:var(--soft);color:var(--accent)}.scenario strong{display:block;font-size:11px}.scenario span{display:block;margin-top:3px;font-size:9px;color:#87939d}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto}.side-title{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.scenarioBtns{grid-template-columns:1fr 1fr}}@media(max-width:620px){.kpis,.two,.scenarioBtns{grid-template-columns:1fr}.main{padding:14px}}</style></head><body><header class="top"><div class="brand"><h1>Khaled S. — Strategy & Business Insights</h1><p>enterprise performance · strategic drivers · scenarios · executive decisions</p></div><div class="controls"><select><option>Current quarter</option><option>Year to date</option><option>12 months</option></select><select><option>Enterprise</option><option>Customer</option><option>Operations</option></select></div></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><script>const V=[['Overview','Enterprise performance','Performance, strategic drivers and priority decisions.'],['Drivers','Performance drivers','Financial, customer and operational movements.'],['Scenarios','Strategic scenarios','Alternative assumptions and forward implications.'],['Market','Market & sector','External trends, risks and opportunities.'],['Board','Executive decisions','Decision-ready insights and progress tracking.']];let view=0,sc=0;const months=['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];const perf=[72,74,73,76,77,79,78,81,83,82,85,87],target=[70,71,72,73,74,75,76,77,78,79,80,81],customer=[66,68,67,69,71,72,73,74,76,77,79,80];const scenarios=[[87,89,91,92,94,95],[87,86,84,83,82,81],[87,90,93,96,98,100]];function path(s,w,h,p,min,max){const pts=s.map((v,i)=>[p+i/(s.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]);let d=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){let [x0,y0]=pts[i-1],[x1,y1]=pts[i],dx=(x1-x0)/2;d+=` C ${x0+dx} ${y0}, ${x1-dx} ${y1}, ${x1} ${y1}`}return d}function trend(){let w=650,h=210,p=30;return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[40,80,120,160].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-a" d="${path(perf,w,h,p,60,95)}"/><path class="line-b" d="${path(target,w,h,p,60,95)}"/><path class="line-c" d="${path(customer,w,h,p,60,95)}"/>${months.map((m,i)=>`<text class="tick" x="${p+i/11*(w-2*p)-7}" y="${h-7}">${m}</text>`).join('')}</svg>`}function scenarioChart(i){let w=650,h=210,p=30,base=scenarios[0],sel=scenarios[i];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[40,80,120,160].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-b" d="${path(base,w,h,p,75,105)}"/><path class="line-a" d="${path(sel,w,h,p,75,105)}"/>${['Now','Q1','Q2','Q3','Q4','Q5'].map((m,j)=>`<text class="tick" x="${p+j/5*(w-2*p)-7}" y="${h-7}">${m}</text>`).join('')}</svg>`}function head(){return `<div class="head"><div><h2>${V[view][1]}</h2><p>${V[view][2]}</p></div><span class="tag">Illustrative analysis</span></div>`}function bars(a){return a.map(x=>`<div class="barrow"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="mono">${x[1]}%</span></div>`).join('')}function overview(){return head()+`<div class="grid kpis"><div class="card"><div class="eyebrow">Performance index</div><div class="value">87</div><div class="sub">+6 vs plan</div></div><div class="card"><div class="eyebrow">Revenue outlook</div><div class="value">+4.2%</div><div class="sub">12-month run-rate</div></div><div class="card"><div class="eyebrow">Retention</div><div class="value">92.4%</div><div class="sub">+1.1 pts YoY</div></div><div class="card"><div class="eyebrow">Priority actions</div><div class="value">6</div><div class="sub">2 Board-level</div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Enterprise performance trend</h3><p>Actual performance, plan and customer outcome index.</p></div><div class="legend"><span><i style="background:var(--accent)"></i>Actual</span><span><i style="background:var(--blue)"></i>Plan</span><span><i style="background:var(--gold)"></i>Customer</span></div></div>${trend()}</div><div class="card"><div class="title"><div><h3>Strategic drivers</h3><p>Contribution to current performance.</p></div></div>${bars([['Customer retention',82],['Cost discipline',76],['Service utilisation',71],['Operating efficiency',68],['Growth initiatives',64]])}</div></div><div class="grid two" style="margin-top:10px"><div class="callout"><strong>Decision focus</strong><p>Performance is ahead of plan, but the gap is increasingly concentrated in retention and cost discipline. Growth initiatives remain below their expected contribution.</p></div><div class="card"><div class="table"><table><tr><th>Priority</th><th>Signal</th><th>Implication</th><th>Status</th></tr><tr><td>Retention</td><td>Improving</td><td>Protect service drivers</td><td><span class="badge good">On track</span></td></tr><tr><td>Acquisition</td><td>Flat</td><td>Review proposition</td><td><span class="badge watch">Watch</span></td></tr><tr><td>Operating cost</td><td>Favourable</td><td>Maintain controls</td><td><span class="badge good">On track</span></td></tr><tr><td>Growth program</td><td>Below plan</td><td>Re-test assumptions</td><td><span class="badge risk">Review</span></td></tr></table></div></div></div>`}function drivers(){return head()+`<div class="grid two"><div class="card"><div class="title"><div><h3>Driver bridge</h3><p>Current contribution by business dimension.</p></div></div>${bars([['Financial performance',84],['Customer outcomes',79],['Operational efficiency',73],['Strategic execution',67],['Market position',62]])}</div><div class="card"><div class="title"><div><h3>Movement analysis</h3><p>Where the latest shift is coming from.</p></div></div><div class="table"><table><tr><th>Metric</th><th>Movement</th><th>Primary driver</th><th>Confidence</th></tr><tr><td>Revenue</td><td>+4.2%</td><td>Retention + mix</td><td>High</td></tr><tr><td>Cost-to-serve</td><td>-3.1%</td><td>Process efficiency</td><td>High</td></tr><tr><td>Acquisition</td><td>+0.4%</td><td>Stable demand</td><td>Medium</td></tr><tr><td>Service demand</td><td>+6.8%</td><td>Digital uptake</td><td>Medium</td></tr></table></div></div></div><div class="callout" style="margin-top:10px"><strong>Analytical implication</strong><p>The headline result is positive, but the strongest contribution comes from existing-customer performance rather than new growth. The next question is whether that mix is sustainable.</p></div>`}const scen=[['Base','Current assumptions'],['Pressure','Lower growth, higher cost'],['Upside','Improved retention and productivity']];function scenariosView(){return head()+`<div class="scenarioBtns">${scen.map((x,i)=>`<button class="scenario ${i===sc?'active':''}" onclick="sc=${i};render()"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><div class="grid kpis"><div class="card"><div class="eyebrow">Performance index</div><div class="value">${[95,81,100][sc]}</div></div><div class="card"><div class="eyebrow">Revenue growth</div><div class="value">${['4.4%','1.2%','6.1%'][sc]}</div></div><div class="card"><div class="eyebrow">Cost movement</div><div class="value">${['-2.0%','+3.5%','-4.1%'][sc]}</div></div><div class="card"><div class="eyebrow">Retention</div><div class="value">${['92.7%','90.8%','94.0%'][sc]}</div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Forward performance path</h3><p>Selected scenario against the base case.</p></div></div>${scenarioChart(sc)}</div><div class="callout"><strong>Scenario implication</strong><p>${['The base case supports current priorities, with attention on execution and growth conversion.','A modest reduction in growth combined with cost pressure removes most of the current performance buffer.','Higher retention and productivity create capacity to accelerate strategic initiatives without materially increasing cost.'][sc]}</p></div></div>`}function market(){return head()+`<div class="grid two"><div class="card"><div class="title"><div><h3>External signal score</h3><p>Illustrative market and sector monitoring.</p></div></div>${bars([['Member / customer expectations',81],['Competitive intensity',74],['Regulatory change',69],['Digital adoption',85],['Cost pressure',66]])}</div><div class="card"><div class="table"><table><tr><th>Trend</th><th>Direction</th><th>Business relevance</th><th>Response</th></tr><tr><td>Digital service expectations</td><td>Rising</td><td>High</td><td>Accelerate capability</td></tr><tr><td>Price sensitivity</td><td>Rising</td><td>Medium</td><td>Test proposition</td></tr><tr><td>Regulatory expectations</td><td>Rising</td><td>High</td><td>Track impacts</td></tr><tr><td>Competitive offers</td><td>Stable</td><td>Medium</td><td>Monitor</td></tr></table></div></div></div>`}function board(){return head()+`<div class="grid two"><div class="card"><div class="title"><div><h3>Strategic scorecard</h3><p>Progress against enterprise priorities.</p></div></div>${bars([['Customer outcomes',82],['Financial performance',86],['Operational efficiency',73],['Strategic execution',68],['Capability uplift',76]])}</div><div class="card"><div class="title"><div><h3>Decision register</h3><p>Current items requiring senior attention.</p></div></div><div class="table"><table><tr><th>Decision</th><th>Evidence</th><th>Status</th></tr><tr><td>Growth initiative reprioritisation</td><td>Scenario + performance</td><td><span class="badge watch">Review</span></td></tr><tr><td>Retention investment</td><td>Customer + financial</td><td><span class="badge good">Ready</span></td></tr><tr><td>Cost efficiency target</td><td>Operational drivers</td><td><span class="badge good">Ready</span></td></tr><tr><td>Market response</td><td>External trends</td><td><span class="badge watch">Assess</span></td></tr></table></div></div></div><div class="callout" style="margin-top:10px"><strong>Board-ready principle</strong><p>Each recommendation should connect the performance movement to its underlying driver, the alternative choices available and the consequence of acting or not acting.</p></div>`}function nav(){side.innerHTML=`<div class="side-title">Views</div>`+V.map((x,i)=>`<button class="nav ${i===view?'active':''}" onclick="view=${i};render()"><span class="nav-num">0${i}</span><span class="nav-label">${x[0]}</span></button>`).join('')}function render(){main.innerHTML=[overview,drivers,scenariosView,market,board][view]();nav()}render();</script></body></html>
