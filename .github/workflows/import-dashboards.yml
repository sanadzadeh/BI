name: Import BI dashboards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-dashboards.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download dashboards
        shell: bash
        run: |
          set -euo pipefail
          dl(){ curl -fL --retry 2 "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t" -o "$2"; }
          dl 1UCg9zBRgNvBu1lu3PaB2I1a6MPsKzTcx enterprise-data-bi-portfolio.html
          dl 12N2o_gmh0DLO2W3b4aPaSMx_YdYs0sUV transformation-performance-benefits-dashboard.html
          dl 1L0LYE9biHfmOj_nFnHgtgHp127zYe9vN applied-ai-quality-assurance-dashboard.html
          dl 1_CNxG_dw_FFMD79AhP-QIdiXFnrt9zO_ business-reporting-data-quality-dashboard.html
          dl 1GpfYBzZ0XG-OBctf8QofAytlzDcfJ4KC treasury-liquidity-transformation-portfolio.html
          dl 14DOufZxoz5qCgiqGLvpFSLxvQCWKz0F7 consumer-bi-insights-portfolio.html
          dl 1WOlkWb0KMhlNlyFzrDZ2CoMCh02S1lWO model-assumption-forecasting-portfolio.html
          dl 1qdILDY6C9K2k6rNLnlrXdMd0kokxwLdx financial-crime-intelligence-analytics-dashboard.html
          dl 1JQfsdYuWF0bXZslL9-J55upmUeZFqJ7w fraud-intelligence-investigation-workbench.html
          dl 1oRvSwVPcb_XqxmeEU-jAVyRA7FJ6yau- transport-insights-performance-dashboard.html
          dl 1F9-t23N0-LOyOjzvzcCdLYu8ND-gBd0a aml-systems-data-analytics-dashboard.html
          dl 1hanXkIviFhFvPNlXzO_RmegY53oUTIuj technology-demand-investment-planning-dashboard.html
          dl 1VH2wUcLi-Zv39vrosVs-LyY_xKf9-Ora commercial-insights-reporting-portfolio.html
          dl 18W4zHgzI3o0L7HXz2NEumEPuS_eB_OUQ research-reporting-analytics-dashboard.html
          for f in *.html; do grep -q '<!DOCTYPE html>' "$f" || { echo "Invalid $f"; exit 1; }; done
      - name: Create landing page
        shell: bash
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BI Portfolio</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:940px;margin:48px auto;padding:0 20px;color:#18232c;background:#f4f6f7}h1{font-family:Georgia,serif;font-size:2rem;margin:0 0 6px}p{color:#65727c;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}a{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #d8e0e5;border-radius:10px;padding:14px}a:hover{border-color:#0b5d6b}strong{display:block;margin-bottom:5px}span{font-size:.78rem;color:#71808a;word-break:break-all}</style></head><body><h1>BI Portfolio</h1><p>Standalone dashboard artefacts.</p><div class="grid">
          <a href="./enterprise-data-bi-portfolio.html"><strong>Enterprise Data & BI Portfolio</strong><span>enterprise-data-bi-portfolio.html</span></a>
          <a href="./transformation-performance-benefits-dashboard.html"><strong>Transformation Performance & Benefits</strong><span>transformation-performance-benefits-dashboard.html</span></a>
          <a href="./applied-ai-quality-assurance-dashboard.html"><strong>Applied AI Quality Assurance</strong><span>applied-ai-quality-assurance-dashboard.html</span></a>
          <a href="./business-reporting-data-quality-dashboard.html"><strong>Business Reporting & Data Quality</strong><span>business-reporting-data-quality-dashboard.html</span></a>
          <a href="./treasury-liquidity-transformation-portfolio.html"><strong>Treasury Liquidity Transformation</strong><span>treasury-liquidity-transformation-portfolio.html</span></a>
          <a href="./consumer-bi-insights-portfolio.html"><strong>Consumer BI Insights</strong><span>consumer-bi-insights-portfolio.html</span></a>
          <a href="./model-assumption-forecasting-portfolio.html"><strong>Model Assumption & Forecasting</strong><span>model-assumption-forecasting-portfolio.html</span></a>
          <a href="./financial-crime-intelligence-analytics-dashboard.html"><strong>Financial Crime Intelligence Analytics</strong><span>financial-crime-intelligence-analytics-dashboard.html</span></a>
          <a href="./fraud-intelligence-investigation-workbench.html"><strong>Fraud Intelligence Investigation Workbench</strong><span>fraud-intelligence-investigation-workbench.html</span></a>
          <a href="./transport-insights-performance-dashboard.html"><strong>Transport Insights & Performance</strong><span>transport-insights-performance-dashboard.html</span></a>
          <a href="./aml-systems-data-analytics-dashboard.html"><strong>AML Systems & Data Analytics</strong><span>aml-systems-data-analytics-dashboard.html</span></a>
          <a href="./technology-demand-investment-planning-dashboard.html"><strong>Technology Demand & Investment Planning</strong><span>technology-demand-investment-planning-dashboard.html</span></a>
          <a href="./commercial-insights-reporting-portfolio.html"><strong>Commercial Insights & Reporting</strong><span>commercial-insights-reporting-portfolio.html</span></a>
          <a href="./research-reporting-analytics-dashboard.html"><strong>Research Reporting & Analytics</strong><span>research-reporting-analytics-dashboard.html</span></a>
          </div></body></html>
          EOF
      - name: Commit dashboards
        shell: bash
        run: |
          git config user.name 'Khaled Sanad'
          git config user.email '138832352+sanadzadeh@users.noreply.github.com'
          rm -f .github/workflows/import-dashboards.yml
          git add -A
          git commit -m 'Consolidate BI dashboards'
          git push
