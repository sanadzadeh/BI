<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Market Structure & Regulatory Analytics Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative market structure, regulatory analysis, emerging risk and data assurance portfolio.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;--border:#d8e0e5;--ink:#18232c;--ink2:#55636f;--ink3:#7b8893;--accent:#0b5d6b;--accent-dim:#e4f1f2;--blue:#4a7897;--gold:#b58b48;--ok:#3f7a4c;--warn:#a3720a;--risk:#a23b2e;--shadow:0 2px 8px rgba(34,48,58,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue))}.brand h1{margin:0;font:600 1.05rem var(--serif)}.brand p{margin:3px 0 0;font:.5rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.controls{display:flex;gap:7px}select,button{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.62rem}.app{display:grid;grid-template-columns:210px 1fr}.side{position:sticky;top:55px;height:calc(100vh - 55px);padding:14px 9px;background:var(--surface);border-right:1px solid var(--border)}.side-title{font:.49rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:0 8px 7px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:6px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink2);padding:8px;border-radius:7px;margin:2px 0}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:.52rem var(--mono);color:var(--ink3)}.nav-label{font-size:.7rem;font-weight:600}.main{padding:20px 24px 40px;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:13px}.head h2{margin:0 0 4px;font:600 1.38rem var(--serif)}.head p{margin:0;font-size:.66rem;color:var(--ink2)}.demo{font:.49rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--accent);background:var(--accent-dim);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;box-shadow:var(--shadow)}.eyebrow{font:.48rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between}.value{font:600 1.35rem var(--serif)}.sub{font-size:.57rem;color:var(--ink2);margin-top:4px}.icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:.52rem var(--mono)}.title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}.title h3{font-size:.74rem;margin:0}.title p{font-size:.54rem;color:var(--ink3);margin:3px 0 0}.legend{display:flex;gap:8px;font-size:.52rem;color:var(--ink2);flex-wrap:wrap}.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}.chart{width:100%;height:205px}.gridline{stroke:var(--border);stroke-dasharray:3 5}.tick{fill:var(--ink3);font:8px var(--mono)}.axis{stroke:var(--border)}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.4}.line-a{fill:none;stroke:var(--accent);stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.area{fill:var(--accent-dim);opacity:.9}.bars rect{opacity:.86}.metric{display:grid;grid-template-columns:118px 1fr 42px;gap:7px;align-items:center;margin:8px 0}.metric label{font-size:.57rem;color:var(--ink2)}.track{height:7px;background:var(--surface-deep);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}.score{text-align:right;font:.53rem var(--mono);color:var(--ink2)}.badge{display:inline-flex;align-items:center;padding:3px 6px;border-radius:999px;font-size:.53rem;font-weight:700}.good{color:var(--ok);background:#e8f3eb}.warn{color:var(--warn);background:#fbf1dc}.bad{color:var(--risk);background:#f8e8e5}.table{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:8px 9px;border-bottom:1px solid var(--border);font-size:.58rem;text-align:left}th{font:.47rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);background:var(--surface-alt)}.heat{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.hh{font:.47rem var(--mono);text-transform:uppercase;color:var(--ink3);text-align:center}.hl{font-size:.57rem;color:var(--ink2)}.hc{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.5rem var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}.flow{display:flex;gap:6px;overflow:auto}.node{flex:1;min-width:150px;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface-alt)}.node strong{display:block;font-size:.58rem}.node span{display:block;margin-top:4px;font-size:.53rem;color:var(--ink2);line-height:1.35}.arrow{align-self:center;color:var(--ink3)}.decision{border-left:4px solid var(--accent);background:var(--surface);border-radius:10px;padding:12px;box-shadow:var(--shadow)}.decision h3{margin:0 0 4px;font:600 .95rem var(--serif)}.decision p{margin:0;font-size:.58rem;line-height:1.45;color:var(--ink2)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{text-align:left}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;font-size:.5rem;color:var(--ink3)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto}.side-title{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.scenarios{grid-template-columns:1fr 1fr}}@media(max-width:650px){.kpis,.two,.scenarios{grid-template-columns:1fr}.main{padding:15px}}
</style></head>
<body><header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. - Market Structure & Regulatory Analytics</h1><p>market monitoring · emerging risk · regulatory response · data assurance</p></div></div><div class="controls"><select><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select><option>All markets</option><option>Listed markets</option><option>OTC / private markets</option></select></div></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Executive overview','Market structure overview','Signals, risks and regulatory actions in one view.'],['Market signals','Market signals','Movement, concentration and emerging-risk indicators.'],['Data assurance','Data assurance','Quality and traceability of evidence used in regulatory analysis.'],['Scenarios','Regulatory scenarios','Potential market developments and response options.'],['Governance','Regulatory response','From evidence to advice, decision and implementation.']];let view=0,sc=0;
const scoreRows=[['Liquidity',82,76,7],['Concentration',68,74,8],['Volatility',71,79,9],['Access',88,85,4],['Resilience',84,81,5],['Transparency',77,83,6]];
const signalMonths=['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
const concentration=[61,62,64,63,65,66,68,69,71,72,73,74];
const liquidityStress=[43,45,42,47,49,50,52,55,53,57,60,62];
const scenarioSeries=[[58,59,60,61,61,62,62,63],[58,63,69,76,82,86,84,80],[58,60,63,66,70,74,77,79],[58,56,53,50,47,44,42,40]];
function badge(s){return `<span class="badge ${/stable|on track|complete/i.test(s)?'good':/watch|review/i.test(s)?'warn':'bad'}">${s}</span>`}
function metrics(a){return a.map(x=>`<div class="metric"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}
function marketScorecard(){let w=650,h=210,p=35,slot=(w-2*p)/scoreRows.length,max=100;let bars=scoreRows.map((d,i)=>{let x=p+i*slot+10,a=d[1]/max*(h-55),b=d[2]/max*(h-55);return `<g class="bars"><rect x="${x}" y="${h-28-a}" width="22" height="${a}" rx="3" fill="var(--blue)"/><rect x="${x+27}" y="${h-28-b}" width="22" height="${b}" rx="3" fill="var(--gold)"/></g><text class="tick" x="${x}" y="${h-8}">${d[0]}</text>`}).join('');let pts=scoreRows.map((d,i)=>[p+i*slot+35,20+(10-d[3])/10*(h-60)]),d=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++)d+=` L ${pts[i][0]} ${pts[i][1]}`;return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[35,80,125,170].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}${bars}<path class="line-risk" d="${d}"/></svg>`}
function linePath(series,w,h,p,min,max){return series.map((v,i)=>{let x=p+i/(series.length-1)*(w-2*p),y=h-p-(v-min)/(max-min)*(h-2*p);return [x,y]}).map((q,i)=>`${i?'L':'M'} ${q[0]} ${q[1]}`).join(' ')}
function signalTrend(){let w=650,h=210,p=30,min=35,max=80,a=linePath(concentration,w,h,p,min,max),b=linePath(liquidityStress,w,h,p,min,max);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[40,80,120,160].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-a" d="${a}"/><path class="line-b" d="${b}"/>${signalMonths.map((m,i)=>`<text class="tick" x="${p+i/(signalMonths.length-1)*(w-2*p)-8}" y="${h-7}">${m}</text>`).join('')}</svg>`}
function scenarioTrajectory(idx){let w=650,h=210,p=32,min=35,max=90,base=scenarioSeries[0],sel=scenarioSeries[idx],p1=linePath(base,w,h,p,min,max),p2=linePath(sel,w,h,p,min,max);let areaPts=sel.map((v,i)=>[p+i/(sel.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]);let area=`M ${areaPts[0][0]} ${h-p} `+areaPts.map(q=>`L ${q[0]} ${q[1]}`).join(' ')+` L ${areaPts[areaPts.length-1][0]} ${h-p} Z`;return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[40,80,120,160].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="area" d="${area}"/><path class="line-b" d="${p1}"/><path class="line-a" d="${p2}"/>${['Now','M1','M2','M3','M4','M5','M6','M7'].map((m,i)=>`<text class="tick" x="${p+i/7*(w-2*p)-7}" y="${h-7}">${m}</text>`).join('')}</svg>`}
function head(){return `<div class="head"><div><h2>${V[view][1]}</h2><p>${V[view][2]}</p></div><span class="demo">Illustrative analysis</span></div>`}
function overview(){return head()+`<div class="grid kpis"><div class="card"><div class="kpi"><div><div class="eyebrow">Priority issues</div><div class="value">7</div><div class="sub">2 escalated</div></div><div class="icon">RI</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Market indicators</div><div class="value">24</div><div class="sub">Across public and OTC</div></div><div class="icon">MI</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Data confidence</div><div class="value">94%</div><div class="sub">Critical checks passed</div></div><div class="icon">DQ</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Open actions</div><div class="value">11</div><div class="sub">3 due this week</div></div><div class="icon">AC</div></div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Market condition scorecard</h3><p>Cross-sectional comparison of baseline and current conditions.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Baseline</span><span><i style="background:var(--gold)"></i>Current</span><span><i style="background:var(--risk)"></i>Risk signal</span></div></div>${marketScorecard()}</div><div class="card"><div class="title"><div><h3>Regulatory health</h3><p>Selected analytical and delivery measures.</p></div></div>${metrics([['Evidence quality',96],['Market coverage',89],['Issue triage',92],['Stakeholder alignment',86],['Action closure',81]])}</div></div><div class="grid two" style="margin-top:10px"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Prioritise issues where market impact and evidence strength intersect</h3><p>Use transparent thresholds so scarce analytical capacity is directed toward material, supportable regulatory questions.</p></div><div class="card"><div class="title"><div><h3>Priority register</h3><p>Current items for review.</p></div></div><div class="table"><table><tr><th>Issue</th><th>Area</th><th>Status</th><th>Next step</th></tr><tr><td>Liquidity concentration</td><td>Listed markets</td><td>${badge('Review')}</td><td>Deep-dive</td></tr><tr><td>OTC transparency</td><td>Derivatives</td><td>${badge('Watch')}</td><td>Validate data</td></tr><tr><td>Private-market growth</td><td>Structure</td><td>${badge('Review')}</td><td>Policy analysis</td></tr><tr><td>Resilience controls</td><td>Systems</td><td>${badge('On track')}</td><td>Monitor</td></tr></table></div></div></div>`}
function signals(){return head()+`<div class="grid two"><div class="card"><div class="title"><div><h3>12-month signal trend</h3><p>Concentration and liquidity-stress indices over time.</p></div><div class="legend"><span><i style="background:var(--accent)"></i>Concentration</span><span><i style="background:var(--blue)"></i>Liquidity stress</span></div></div>${signalTrend()}</div><div class="card"><div class="title"><div><h3>Risk mix</h3><p>Relative severity by theme.</p></div></div>${metrics([['Structure',78],['Liquidity',72],['Conduct',64],['Technology',69],['Transparency',75]])}</div></div><div class="card" style="margin-top:10px"><div class="table"><table><tr><th>Signal</th><th>Evidence</th><th>Direction</th><th>Assessment</th></tr><tr><td>Concentration</td><td>Strong</td><td>Rising</td><td>${badge('Review')}</td></tr><tr><td>Liquidity dispersion</td><td>Moderate</td><td>Stable</td><td>${badge('Watch')}</td></tr><tr><td>Operational resilience</td><td>Strong</td><td>Improving</td><td>${badge('On track')}</td></tr><tr><td>Private-market activity</td><td>Moderate</td><td>Rising</td><td>${badge('Review')}</td></tr></table></div></div>`}
function quality(){let q=[['Trading data',[97,95,96,94]],['Entity data',[93,91,88,92]],['External intelligence',[89,90,84,87]],['Regulatory actions',[95,94,91,93]]];return head()+`<div class="grid two"><div class="card"><div class="title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control.</p></div></div><div class="heat"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="hh">${x}</div>`).join('')}${q.map(r=>`<div class="hl">${r[0]}</div>${r[1].map(v=>`<div class="hc ${v>=92?'hi':v>=86?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="title"><div><h3>Evidence pathway</h3><p>From signal to regulatory advice.</p></div></div><div class="flow"><div class="node"><strong>Signal</strong><span>Market movement or emerging issue</span></div><div class="arrow">→</div><div class="node"><strong>Evidence</strong><span>Data, intelligence, policy and market input</span></div><div class="arrow">→</div><div class="node"><strong>Analysis</strong><span>Test, challenge, compare and quantify</span></div><div class="arrow">→</div><div class="node"><strong>Advice</strong><span>Conclusion, caveats and recommended action</span></div></div></div></div>`}
const scenarios=[['Base','Current market settings','7','11','94%','Maintain monitoring'],['Stress event','Liquidity and volatility rise','11','18','88%','Escalate surveillance'],['Structural shift','Private-market activity grows','9','14','90%','Policy review'],['Data uplift','Coverage and timeliness improve','6','8','98%','Refine thresholds']];
function scenario(){let s=scenarios[sc];return head()+`<div class="scenarios">${scenarios.map((x,i)=>`<button class="scenario ${i===sc?'active':''}" onclick="sc=${i};render()"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><div class="grid kpis"><div class="card"><div class="eyebrow">Priority issues</div><div class="value">${s[2]}</div></div><div class="card"><div class="eyebrow">Open actions</div><div class="value">${s[3]}</div></div><div class="card"><div class="eyebrow">Evidence confidence</div><div class="value">${s[4]}</div></div><div class="card"><div class="eyebrow">Response</div><div class="value" style="font-size:1rem">${s[5]}</div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Scenario risk trajectory</h3><p>Selected scenario against the base path over seven forward periods.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Base</span><span><i style="background:var(--accent)"></i>${s[0]}</span></div></div>${scenarioTrajectory(sc)}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s[5]}</h3><p>Adjust analytical effort and regulatory response to the strength of evidence, market impact and speed of change.</p></div></div>`}
function governance(){return head()+`<div class="grid two"><div class="card"><div class="title"><div><h3>Regulatory workflow</h3><p>Evidence to implementation.</p></div></div><div class="flow"><div class="node"><strong>Identify</strong><span>Signal or issue</span></div><div class="arrow">→</div><div class="node"><strong>Assess</strong><span>Evidence and impact</span></div><div class="arrow">→</div><div class="node"><strong>Advise</strong><span>Options and recommendation</span></div><div class="arrow">→</div><div class="node"><strong>Implement</strong><span>Guidance, policy or process change</span></div></div></div><div class="card"><div class="title"><div><h3>Governance controls</h3><p>Decision quality and traceability.</p></div></div>${metrics([['Evidence traceability',96],['Peer review',92],['Action ownership',88],['Decision record',95]])}</div></div><div class="card" style="margin-top:10px"><div class="table"><table><tr><th>Control</th><th>Evidence</th><th>Status</th><th>Action</th></tr><tr><td>Issue assessment</td><td>Data + research</td><td>${badge('On track')}</td><td>Maintain</td></tr><tr><td>Stakeholder review</td><td>Meeting record</td><td>${badge('On track')}</td><td>Maintain</td></tr><tr><td>Policy impact</td><td>Options paper</td><td>${badge('Watch')}</td><td>Confirm assumptions</td></tr><tr><td>Implementation tracking</td><td>Action register</td><td>${badge('Review')}</td><td>Close ownership gap</td></tr></table></div></div>`}
function nav(){side.innerHTML=`<div class="side-title">Portfolio views</div>`+V.map((x,i)=>`<button class="nav ${i===view?'active':''}" onclick="view=${i};render()"><span class="nav-num">0${i}</span><span class="nav-label">${x[0]}</span></button>`).join('')}
function render(){main.innerHTML=[overview,signals,quality,scenario,governance][view]();nav()}render();
</script></body></html>
