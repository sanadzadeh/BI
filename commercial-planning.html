<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commercial Planning Dashboard</title><meta name="description" content="Organisation-neutral commercial planning dashboard covering performance, options, business cases, prioritisation and governance."><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--p:#f4f5f6;--s:#fff;--sa:#f8f9fa;--sd:#e9edf0;--b:#d8dee3;--i:#18232c;--i2:#56636d;--i3:#7f8b94;--a:#315b72;--ad:#e8f0f4;--am:#c5d6df;--b2:#7a97a7;--ok:#467a53;--okd:#e8f2ea;--w:#9b6d12;--wd:#faf0dc;--r:#a24b3a;--rd:#f8e9e6;--sh:0 7px 22px rgba(30,45,55,.08);--ss:0 2px 8px rgba(30,45,55,.05);--rad:10px;--ser:'Cormorant Garamond',Georgia,serif;--mon:'DM Mono',monospace}:root[data-theme=dark]{--p:#11161a;--s:#1a2126;--sa:#20292f;--sd:#2a353d;--b:#344049;--i:#eef2f4;--i2:#b5c0c7;--i3:#87959f;--a:#7db5ce;--ad:#18313e;--am:#2a5162;--b2:#93b6c6;--ok:#81c08d;--okd:#1b3422;--w:#dfad4f;--wd:#3b2f17;--r:#df8979;--rd:#3d211d;--sh:0 9px 26px rgba(0,0,0,.28);--ss:0 2px 10px rgba(0,0,0,.22)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--p);color:var(--i);font-family:Inter,system-ui,sans-serif}button,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--b)}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(145deg,var(--a),var(--b2));position:relative}.mark:before,.mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff}.mark:before{top:11px}.mark:after{top:20px}.brand h1{font:600 1.08rem/1 var(--ser);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.1 var(--mon);text-transform:uppercase;letter-spacing:.08em;color:var(--i3)}.controls{display:flex;gap:7px;flex-wrap:wrap}.sel,.theme{border:1px solid var(--b);background:var(--sa);color:var(--i);border-radius:6px;padding:6px 8px;font-size:.64rem}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.side{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--s);border-right:1px solid var(--b);padding:15px 9px}.st{font:400 .5rem/1 var(--mon);letter-spacing:.13em;text-transform:uppercase;color:var(--i3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--i2);padding:8px 9px;border-radius:6px;margin:2px 0}.nav.active{background:var(--ad);border-left-color:var(--a);color:var(--a)}.nn{font:400 .53rem/1.2 var(--mon);color:var(--i3)}.nl{font-size:.71rem;font-weight:600}.meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--b);font-size:.59rem;line-height:1.5;color:var(--i2)}.main{min-width:0;padding:20px 24px 44px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.pt{font:600 1.38rem/1 var(--ser);margin:0 0 5px}.pd{margin:0;max-width:850px;color:var(--i2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem/1 var(--mon);text-transform:uppercase;color:var(--a);background:var(--ad);border:1px solid var(--am);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--s);border:1px solid var(--b);border-radius:var(--rad);box-shadow:var(--ss);padding:13px;min-width:0}.feature{box-shadow:var(--sh)}.eye{font:500 .49rem/1.2 var(--mon);text-transform:uppercase;color:var(--i3);margin-bottom:6px}.kv{font:600 1.33rem/.95 var(--ser)}.ks{font-size:.59rem;color:var(--i2);line-height:1.35;margin-top:5px}.ki{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;background:var(--ad);color:var(--a);font:500 .54rem/1 var(--mon)}.kpi{display:flex;justify-content:space-between}.ct{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.ct h3{font-size:.75rem;margin:0}.ct p{font-size:.56rem;color:var(--i3);margin:3px 0 0}.chart{width:100%;height:205px}.gl{stroke:var(--b);stroke-width:1;stroke-dasharray:3 5}.la{fill:none;stroke:var(--a);stroke-width:3}.lb{fill:none;stroke:var(--b2);stroke-width:2.5}.tick{fill:var(--i3);font:8px var(--mon)}.ms{display:grid;gap:8px}.mb{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center}.mb label{font-size:.59rem;color:var(--i2)}.track{height:7px;border-radius:999px;background:var(--sd);overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--b2))}.score{text-align:right;font:400 .55rem/1 var(--mon);color:var(--i2)}.tw{overflow:auto;border:1px solid var(--b);border-radius:7px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:8px 9px;border-bottom:1px solid var(--b);text-align:left;font-size:.59rem}th{font:400 .47rem/1.2 var(--mon);text-transform:uppercase;color:var(--i3);background:var(--sa)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.good{color:var(--ok);background:var(--okd)}.warn{color:var(--w);background:var(--wd)}.bad{color:var(--r);background:var(--rd)}.scens{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.sc{border:1px solid var(--b);background:var(--sa);color:var(--i2);border-radius:6px;padding:7px 8px;text-align:left;font-size:.58rem}.sc.active{background:var(--ad);border-color:var(--a);color:var(--a)}.sc strong,.sc span{display:block}.sc span{margin-top:3px;color:var(--i3);font-size:.51rem}.decision{border-left:4px solid var(--a);background:linear-gradient(135deg,var(--s),var(--sa));border-radius:var(--rad);padding:12px}.decision h3{font:600 .94rem/1.15 var(--ser);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--i2);margin:0}.flow{display:flex;gap:6px;overflow:auto}.node{min-width:155px;flex:1;padding:10px;border:1px solid var(--b);border-radius:7px;background:var(--sa)}.node.active{background:var(--ad);border-color:var(--a)}.nt{font:400 .48rem/1 var(--mon);text-transform:uppercase;color:var(--i3);margin-bottom:5px}.nb{font-size:.58rem;line-height:1.4;color:var(--i2)}.arrow{align-self:center;color:var(--i3)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--b)}.st,.meta{display:none}.nav{width:auto;white-space:nowrap}.two,.kpis,.scens{grid-template-columns:1fr}.header{position:static}.main{padding:16px 12px 36px}}</style></head><body><div class="shell"><header class="header"><div class="brand"><div class="mark"></div><div><h1>Commercial Planning Dashboard</h1><p>performance · options · business cases · prioritisation</p></div></div><div class="controls"><select class="sel"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="sel"><option>Whole portfolio</option><option>Priority initiatives</option><option>Exception view</option></select><button class="theme" id="theme">Dark</button></div></header><div class="app"><nav class="side" id="side"></nav><main class="main" id="main"></main></div></div><script>const C={v:[['Executive overview','Commercial overview','Performance, value, trade-offs and priority decisions in one view.'],['Performance','Performance and drivers','Movement in commercial and delivery measures, with the drivers behind change.'],['Options','Options and business cases','Comparison of cost, benefit, timing and implementation trade-offs.'],['Prioritisation','Initiative prioritisation','Relative value, capacity demand, dependencies and delivery constraints.'],['Governance','Decision governance','Traceability from question and assumptions through analysis, review and decision.']],k:[['Benefit index','106.4','Illustrative portfolio measure','BI'],['Cost variance','+2.1%','Against current plan','CV'],['Priority items','7','Requiring senior decision','PI'],['Validated inputs','96%','Inputs passing checks','VI']],h:[['Commercial value',88],['Benefit confidence',84],['Capacity fit',79],['Data quality',96],['Decision readiness',86]],reg:[['Growth initiative A','High','Medium','Proceed'],['Service redesign','Medium','Low','Refine'],['Channel change','High','High','Sequence'],['Process uplift','Medium','Medium','Proceed']],perf:[['Revenue proxy','104.2','+3.4%','Volume and mix'],['Cost index','98.7','-1.8%','Automation'],['Adoption','82%','+6pp','Channel uptake'],['Benefit confidence','84%','+4pp','Assumption refresh']],flow:[['Question','Define the commercial decision and audience.'],['Evidence','Bring together finance, customer, operational and delivery inputs.'],['Options','Compare cost, benefit, timing, risk and capacity.'],['Review','Test assumptions, reconcile inputs and challenge trade-offs.'],['Decision','Issue recommendation and record the agreed action.']],sc:[['Base','Current assumptions','Maintain plan','Proceed with current sequence while monitoring cost variance.'],['Growth','Higher adoption','Accelerate priority item','Additional benefit requires more near-term capacity.'],['Cost pressure','Higher delivery cost','Re-sequence','Protect higher-value initiatives and defer lower-return work.'],['Capacity constraint','Reduced delivery capacity','Narrow scope','Focus on initiatives with strongest near-term benefit.']]};let S={v:0,s:0};const bd=x=>`<span class="badge ${/proceed|high|on track/i.test(x)?'good':/refine|medium|sequence/i.test(x)?'warn':'bad'}">${x}</span>`;function bars(a){return `<div class="ms">${a.map(x=>`<div class="mb"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}function line(a,b){let w=650,h=210,p=28,m=Math.min(...a,...b)-2,M=Math.max(...a,...b)+2,pts=s=>s.map((v,i)=>[p+i/(s.length-1)*(w-2*p),h-p-(v-m)/(M-m)*(h-2*p)]),d=q=>'M '+q.map(x=>x.join(' ')).join(' L ');return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gl" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="la" d="${d(pts(a))}"/><path class="lb" d="${d(pts(b))}"/></svg>`}function table(rows,heads){return `<div class="tw"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${i===r.length-1?bd(x):x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function render(){let v=C.v[S.v];side.innerHTML=`<div class="st">Views</div>${C.v.map((x,i)=>`<button class="nav ${i===S.v?'active':''}" onclick="S.v=${i};render()"><span class="nn">0${i}</span><span class="nl">${x[0]}</span></button>`).join('')}<div class="meta">Illustrative data only.<br>Organisation-neutral analytical example.</div>`;let body=`<div class="head"><div><h2 class="pt">${v[1]}</h2><p class="pd">${v[2]}</p></div><span class="demo">Illustrative</span></div>`;if(S.v===0)body+=`<div class="grid kpis">${C.k.map(x=>`<div class="card kpi"><div><div class="eye">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">${x[2]}</div></div><div class="ki">${x[3]}</div></div>`).join('')}</div><div class="grid two"><div class="card feature"><div class="ct"><div><h3>Performance trajectory</h3><p>Illustrative commercial and benefit indices</p></div></div>${line([92,94,96,98,99,101,103,106],[91,92,93,94,95,96,97,99])}</div><div class="card"><div class="ct"><div><h3>Decision readiness</h3><p>Current portfolio measures</p></div></div>${bars(C.h)}</div></div><div style="height:10px"></div>${table(C.reg,['Initiative','Value','Capacity demand','Recommendation'])}`;if(S.v===1)body+=`<div class="grid kpis">${C.k.map(x=>`<div class="card kpi"><div><div class="eye">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">${x[2]}</div></div></div>`).join('')}</div><div class="grid two"><div class="card feature"><div class="ct"><div><h3>Performance movement</h3><p>Current versus prior period</p></div></div>${line([88,90,92,95,97,100,103,104],[89,90,91,92,93,94,95,96])}</div><div class="card"><div class="ct"><div><h3>What moved</h3><p>Driver summary</p></div></div>${table(C.perf,['Measure','Current','Movement','Primary driver'])}</div></div>`;if(S.v===2)body+=`<div class="scens">${C.sc.map((x,i)=>`<button class="sc ${i===S.s?'active':''}" onclick="S.s=${i};render()"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><div class="grid two"><div class="card feature"><div class="ct"><div><h3>Option comparison</h3><p>Benefit and cost under selected assumptions</p></div></div>${line([82,85,88,91,94,97,100,103],[80,82,84,86,88,90,92,94])}</div><div class="decision"><h3>${C.sc[S.s][2]}</h3><p>${C.sc[S.s][3]}</p></div></div><div style="height:10px"></div>${table(C.reg,['Initiative','Value','Capacity demand','Recommendation'])}`;if(S.v===3)body+=`<div class="grid two"><div class="card feature"><div class="ct"><div><h3>Priority balance</h3><p>Commercial value against capacity fit</p></div></div>${bars([['Growth initiative A',92],['Service redesign',71],['Channel change',84],['Process uplift',77]])}</div><div class="card"><div class="ct"><div><h3>Current priority register</h3><p>Relative value and delivery demand</p></div></div>${table(C.reg,['Initiative','Value','Capacity demand','Recommendation'])}</div></div>`;if(S.v===4)body+=`<div class="card feature"><div class="ct"><div><h3>Decision path</h3><p>From commercial question to agreed action</p></div></div><div class="flow">${C.flow.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${i===2?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div><div style="height:10px"></div><div class="grid two"><div class="card"><div class="ct"><div><h3>Control coverage</h3><p>Checks applied before senior use</p></div></div>${bars([['Source reconciliation',96],['Business rules',93],['Assumption review',89],['Version control',91]])}</div><div class="decision"><h3>Decision record</h3><p>Each recommendation should retain the question, assumptions, key evidence, trade-offs, review points and final action so the analysis can be revisited when conditions change.</p></div></div>`;main.innerHTML=body}theme.onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'':'dark';theme.textContent=d.dataset.theme==='dark'?'Light':'Dark'};render();</script></body></html>
