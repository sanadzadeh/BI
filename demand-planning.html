<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technology Demand & Investment Planning Portfolio - Khaled Sanad</title><meta name="description" content="Illustrative technology demand and investment planning portfolio covering demand intake, prioritisation, forecasts, capacity and benefits."><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--p:#f3f5f6;--s:#fff;--sa:#f7f9fa;--sd:#e9eef1;--b:#d8e0e5;--i:#18232c;--i2:#55636f;--i3:#7b8893;--a:#0b5d6b;--ad:#e4f1f2;--am:#bddcde;--bl:#4a7897;--g:#b58b48;--ok:#3f7a4c;--okd:#e8f3eb;--w:#a3720a;--wd:#fbf1dc;--r:#a23b2e;--rd:#f8e8e5;--sh:0 7px 22px rgba(34,48,58,.08);--ss:0 2px 8px rgba(34,48,58,.06);--rad:11px;--ser:'Cormorant Garamond',Georgia,serif;--mon:'DM Mono',monospace}:root[data-theme=dark]{--p:#11171c;--s:#182027;--sa:#1e2830;--sd:#25313a;--b:#2f3b44;--i:#edf2f4;--i2:#aab5be;--i3:#81909b;--a:#61c5bf;--ad:#173335;--am:#27585a;--bl:#7ba9c8;--g:#c9a86d;--ok:#7fc98f;--okd:#193425;--w:#e0ad4c;--wd:#3a2e15;--r:#e08a7a;--rd:#3c201d;--sh:0 9px 26px rgba(0,0,0,.27);--ss:0 2px 10px rgba(0,0,0,.22)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--p);color:var(--i);font-family:Inter,system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--b)}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--a),var(--bl));position:relative}.mark:before,.mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff}.mark:before{top:11px}.mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--ser);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mon);letter-spacing:.08em;text-transform:uppercase;color:var(--i3)}.controls{display:flex;gap:7px;flex-wrap:wrap}.sel,.theme{border:1px solid var(--b);background:var(--sa);color:var(--i);border-radius:7px;padding:6px 8px;font-size:.64rem}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.side{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--s);border-right:1px solid var(--b);padding:15px 9px}.st{font:400 .5rem/1 var(--mon);letter-spacing:.13em;text-transform:uppercase;color:var(--i3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--i2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav.active{background:var(--ad);border-left-color:var(--a);color:var(--a)}.nn{font:400 .53rem/1.2 var(--mon);color:var(--i3)}.nl{font-size:.71rem;font-weight:600}.meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--b);font-size:.59rem;line-height:1.5;color:var(--i2)}.main{min-width:0;padding:20px 24px 44px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.pt{font:600 1.38rem/1 var(--ser);margin:0 0 5px}.pd{margin:0;max-width:850px;color:var(--i2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem/1 var(--mon);text-transform:uppercase;color:var(--a);background:var(--ad);border:1px solid var(--am);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--s);border:1px solid var(--b);border-radius:var(--rad);box-shadow:var(--ss);padding:13px;min-width:0}.feature{box-shadow:var(--sh)}.eye{font:500 .49rem/1.2 var(--mon);text-transform:uppercase;color:var(--i3);margin-bottom:6px}.kv{font:600 1.33rem/.95 var(--ser)}.ks{font-size:.59rem;color:var(--i2);line-height:1.35;margin-top:5px}.ki{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--ad);color:var(--a);font:500 .54rem/1 var(--mon)}.kpi{display:flex;justify-content:space-between}.ct{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.ct h3{font-size:.75rem;margin:0}.ct p{font-size:.56rem;color:var(--i3);margin:3px 0 0}.chart{width:100%;height:205px}.gl{stroke:var(--b);stroke-width:1;stroke-dasharray:3 5}.la{fill:none;stroke:var(--a);stroke-width:3}.lb{fill:none;stroke:var(--bl);stroke-width:2.5}.lr{fill:none;stroke:var(--r);stroke-width:2.5}.tick{fill:var(--i3);font:8px var(--mon)}.ms{display:grid;gap:8px}.mb{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center}.mb label{font-size:.59rem;color:var(--i2)}.track{height:7px;border-radius:999px;background:var(--sd);overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--bl))}.score{text-align:right;font:400 .55rem/1 var(--mon);color:var(--i2)}.decision{border-left:4px solid var(--a);background:linear-gradient(135deg,var(--s),var(--sa));border-radius:var(--rad);padding:12px}.decision h3{font:600 .94rem/1.15 var(--ser);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--i2);margin:0}.tw{overflow:auto;border:1px solid var(--b);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:8px 9px;border-bottom:1px solid var(--b);text-align:left;font-size:.59rem}th{font:400 .47rem/1.2 var(--mon);text-transform:uppercase;color:var(--i3);background:var(--sa)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.good{color:var(--ok);background:var(--okd)}.warn{color:var(--w);background:var(--wd)}.bad{color:var(--r);background:var(--rd)}.heat{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.hh{font:400 .48rem/1 var(--mon);text-transform:uppercase;color:var(--i3);text-align:center}.hl{font-size:.59rem;color:var(--i2)}.hc{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mon)}.hi{background:var(--ok)}.mid{background:var(--w)}.lo{background:var(--r)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:150px;flex:1;padding:10px;border-radius:8px;background:var(--sa);border:1px solid var(--b)}.node.active{background:var(--ad);border-color:var(--a)}.nt{font:400 .48rem/1 var(--mon);text-transform:uppercase;color:var(--i3);margin-bottom:5px}.nb{font-size:.58rem;line-height:1.4;color:var(--i2)}.arrow{align-self:center;color:var(--i3)}.scens{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.sc{border:1px solid var(--b);background:var(--sa);color:var(--i2);border-radius:6px;padding:7px 8px;text-align:left;font-size:.58rem}.sc.active{background:var(--ad);border-color:var(--a);color:var(--a)}.sc strong,.sc span{display:block}.sc span{margin-top:3px;color:var(--i3);font-size:.51rem}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--b)}.tl{position:relative;margin-bottom:12px}.dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--s);border:3px solid var(--a)}.tl.warn .dot{border-color:var(--w)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;color:var(--i2)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--b)}.st,.meta{display:none}.nav{width:auto;white-space:nowrap}.two,.kpis,.scens{grid-template-columns:1fr}.header{position:static}.main{padding:16px 12px 36px}}</style></head><body><div class="shell"><header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. - Technology Demand & Investment Planning Portfolio</h1><p>demand · prioritisation · capacity · investment · benefits</p></div></div><div class="controls"><select class="sel"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="sel"><option>Enterprise view</option><option>Priority portfolio</option><option>Exception view</option></select><button class="theme" id="theme">Dark</button></div></header><div class="app"><nav class="side" id="side"></nav><main class="main" id="main"></main></div></div><script>const C={v:[['Executive overview','Demand and investment overview','Demand, funding, capacity and benefits in one portfolio decision view.'],['Performance','Portfolio planning performance','Demand progression, funding alignment and forecast confidence.'],['Data assurance','Planning assurance','Quality and governance controls behind demand and investment decisions.'],['Scenarios','Investment scenarios','Scenarios for demand growth, capacity pressure and funding changes.'],['Governance','Investment governance','Lineage from demand assumptions and source inputs to prioritisation decisions.']],k:[['Demand items','46','Current portfolio demand','DM'],['Funded','68%','Demand with confirmed funding','FD'],['Forecast variance','3.8%','Current portfolio variance','FV'],['Benefits tracked','91%','Benefits with evidence','BN']],h:[['Demand clarity',86],['Funding alignment',82],['Forecast confidence',88],['Benefits evidence',91],['Dependency coverage',84]],reg:[['Capacity','Core platforms','Review','Re-sequence Q4 demand'],['Investment','Data','On track','Confirm funding'],['Dependency','Security','Watch','Resolve architecture gate'],['Benefits','Cloud','Improving','Refresh baseline']],perf:[['Demand','Intake completeness','86%','+5pp','On track'],['Funding','Alignment','82%','Stable','On track'],['Forecast','Confidence','88%','+4pp','On track'],['Benefits','Evidence coverage','91%','+8pp','Improving']],q:[['Demand intake',[95,94,91,93]],['Cost estimates',[92,91,87,90]],['Capacity data',[90,92,86,89]],['Benefits evidence',[94,95,90,94]]],flow:[['Demand question','What outcome, problem or investment need is being proposed?'],['Evidence','Demand, cost, capacity, dependency and benefit inputs.'],['Prioritise','Assess value, urgency, feasibility and portfolio fit.'],['Scenario','Test funding and capacity trade-offs.'],['Decision','Fund, sequence, defer or reshape demand.']],sc:[['Base','Current demand and funding profile.','Maintain transparent prioritisation','Keep demand, value, cost and dependency evidence visible.'],['Demand surge','New demand rises materially.','Tighten portfolio triage','Separate critical demand from lower-value discretionary work.'],['Capacity pressure','Delivery capacity reduces.','Re-sequence by value and dependency','Protect high-value work and expose displaced demand.'],['Funding shift','Available investment changes.','Refresh portfolio trade-offs','Re-run prioritisation against the revised funding envelope.']],gov:[['Demand intake','Portfolio team','Demand register','On track'],['Prioritisation','Investment leads','Scoring evidence','On track'],['Funding decisions','Finance / portfolio','Decision record','Review'],['Benefits tracking','Business owners','Benefit register','On track']]};let S={v:0,s:0};const bd=x=>`<span class="badge ${/on track|improving/i.test(x)?'good':/watch|review/i.test(x)?'warn':'bad'}">${x}</span>`;function bars(a){return `<div class="ms">${a.map(x=>`<div class="mb"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}function line(a,b){let w=650,h=210,p=28,m=Math.min(...a,...b)-2,M=Math.max(...a,...b)+2,pts=s=>s.map((v,i)=>[p+i/(s.length-1)*(w-2*p),h-p-(v-m)/(M-m)*(h-2*p)]),d=q=>'M '+q.map(x=>x.join(' ')).join(' L ');return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gl" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="la" d="${d(pts(a))}"/><path class="lb" d="${d(pts(b))}"/></svg>`}function combo(){let r=[['Demand',80,86,4],['Funding',78,82,4],['Forecast',83,88,3],['Benefits',84,91,2],['Capacity',79,84,5],['Deps',76,84,4]],w=650,h=210,pL=42,pR=24,pT=18,pB=28,sl=(w-pL-pR)/r.length,pts=[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gl" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join('')}${r.map((d,i)=>{let x=pL+i*sl+sl*.14,ah=d[1]/110*(h-pT-pB),bh=d[2]/110*(h-pT-pB);pts.push([pL+i*sl+sl*.42,pT+(7-d[3])/7*(h-pT-pB)]);return `<rect x="${x}" y="${h-pB-ah}" width="${sl*.25}" height="${ah}" rx="3" fill="var(--bl)" opacity=".78"/><rect x="${x+sl*.29}" y="${h-pB-bh}" width="${sl*.25}" height="${bh}" rx="3" fill="var(--g)" opacity=".86"/><text class="tick" x="${x}" y="${h-8}">${d[0]}</text>`}).join('')}<path class="lr" d="M ${pts.map(x=>x.join(' ')).join(' L ')}"/></svg>`}function hd(i,t){return `<div class="head"><div><h2 class="pt">${C.v[i][1]}</h2><p class="pd">${C.v[i][2]}</p></div><span class="demo">${t}</span></div>`}function overview(){return hd(0,'Illustrative demonstration')+`<section class="grid kpis">${C.k.map(x=>`<div class="card"><div class="kpi"><div><div class="eye">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">${x[2]}</div></div><div class="ki">${x[3]}</div></div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="ct"><div><h3>Demand alignment and exception view</h3><p>Baseline and current position with planning exceptions.</p></div></div>${combo()}</div><div class="card"><div class="ct"><div><h3>Planning health</h3><p>Demand, funding, forecast and benefit indicators.</p></div></div>${bars(C.h)}</div></section><section class="grid two"><div class="decision"><div class="eye">Decision focus</div><h3>Prioritise demand using a common view of value, capacity, cost and dependency</h3><p>Make trade-offs visible before funding and delivery commitments are locked in.</p></div><div class="card"><div class="ct"><div><h3>Priority register</h3><p>Current planning items requiring attention.</p></div></div><div class="tw"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${C.reg.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${bd(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div></section>`}function perf(){return hd(1,'Performance view')+`<section class="grid two"><div class="card feature"><div class="ct"><div><h3>Portfolio planning trend</h3><p>Illustrative movement across 12 periods.</p></div></div>${line([72,75,73,78,80,82,81,85,87,89,90,92],[75,77,78,80,82,84,85,87,89,91,92,94])}</div><div class="card"><div class="ct"><div><h3>Current coverage</h3><p>Relative planning and governance position.</p></div></div>${bars(C.h)}</div></section><section class="card" style="margin-top:10px"><div class="ct"><div><h3>Performance scorecard</h3><p>Selected portfolio measures.</p></div></div><div class="tw"><table><thead><tr><th>Domain</th><th>Measure</th><th>Current</th><th>Direction</th><th>Status</th></tr></thead><tbody>${C.perf.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${bd(r[4])}</td></tr>`).join('')}</tbody></table></div></section>`}function assure(){return hd(2,'Assurance view')+`<section class="grid two"><div class="card"><div class="ct"><div><h3>Planning-data heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heat"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="hh">${x}</div>`).join('')}${C.q.map(q=>`<div class="hl">${q[0]}</div>${q[1].map(v=>`<div class="hc ${v>=90?'hi':v>=80?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="ct"><div><h3>Decision pathway</h3><p>From demand question to portfolio decision.</p></div></div><div class="flow">${C.flow.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div></section><section class="grid two" style="margin-top:10px"><div class="card"><div class="ct"><div><h3>Issue ageing</h3><p>Illustrative open planning items.</p></div></div>${bars([['0-7 days',70],['8-30 days',46],['31-90 days',25],['>90 days',8]])}</div><div class="decision"><div class="eye">Assurance principle</div><h3>Investment choices should expose assumptions, constraints and evidence</h3><p>A useful planning view makes the reasons for prioritisation visible, including cost, value, capacity and dependency assumptions.</p></div></section>`}function scenarios(){let s=C.sc[S.s];return hd(3,'Scenario view')+`<div class="scens">${C.sc.map((x,i)=>`<button class="sc ${i===S.s?'active':''}" data-s="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><section class="grid kpis">${C.k.map(x=>`<div class="card"><div class="eye">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">Scenario view</div></div>`).join('')}</section><section class="grid two"><div class="card feature"><div class="ct"><div><h3>Investment scenario trajectory</h3><p>Baseline compared with selected scenario.</p></div></div>${line([72,75,78,80,83,85,88,90],[72,74,77,79,81,83,85,87].map((v,i)=>v+S.s*(i>3?1:0)))}</div><div class="decision"><div class="eye">Scenario implication</div><h3>${s[2]}</h3><p>${s[3]}</p></div></section>`}function gov(){let t=[['good','Weekly demand intake','Validate new demand and required decision information.'],['good','Fortnightly prioritisation','Review value, capacity, cost and dependencies.'],['warn','Funding gate','Material commitments require evidence and approval.'],['good','Monthly forecast reset','Refresh delivery, spend and benefits outlook.']];return hd(4,'Governance view')+`<section class="grid two"><div class="card"><div class="ct"><div><h3>Investment lineage</h3><p>Trace prioritisation back to demand evidence and assumptions.</p></div></div><div class="flow">${C.flow.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div><div class="card"><div class="ct"><div><h3>Governance timeline</h3><p>Portfolio planning rhythm.</p></div></div><div class="timeline">${t.map(x=>`<div class="tl ${x[0]}"><span class="dot"></span><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div></div></section><section class="card" style="margin-top:10px"><div class="ct"><div><h3>Governance controls</h3><p>Ownership, evidence and status.</p></div></div><div class="tw"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${C.gov.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${bd(r[3])}</td></tr>`).join('')}</tbody></table></div></section>`}const R=[overview,perf,assure,scenarios,gov];function render(){main.innerHTML=R[S.v]();side.innerHTML=`<div class="st">Portfolio views</div>${C.v.map((v,i)=>`<button class="nav ${i===S.v?'active':''}" data-v="${i}"><span class="nn">0${i}</span><span class="nl">${v[0]}</span></button>`).join('')}<div class="meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Standalone HTML</div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.v=+b.dataset.v;render()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.s=+b.dataset.s;render()})}theme.onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';theme.textContent=d?'Dark':'Light'};render();</script></body></html>
