<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treasury Liquidity Transformation Portfolio — Khaled Sanad</title><meta name="description" content="Illustrative treasury liquidity transformation portfolio covering reporting, calculation assurance, data controls, scenarios and governance."><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--p:#f3f5f6;--s:#fff;--sa:#f7f9fa;--d:#e9eef1;--b:#d8e0e5;--b2:#bcc8cf;--i:#18232c;--m:#55636f;--m2:#7b8893;--a:#0b5d6b;--ad:#e4f1f2;--am:#bddcde;--bl:#4a7897;--g:#b58b48;--ok:#3f7a4c;--od:#e8f3eb;--w:#a3720a;--wd:#fbf1dc;--r:#a23b2e;--rd:#f8e8e5;--sh:0 7px 22px #22303a14;--shs:0 2px 8px #22303a0f;--ser:'Cormorant Garamond',Georgia,serif;--mon:'DM Mono',monospace}:root[data-theme=dark]{--p:#11171c;--s:#182027;--sa:#1e2830;--d:#25313a;--b:#2f3b44;--b2:#43525e;--i:#edf2f4;--m:#aab5be;--m2:#81909b;--a:#61c5bf;--ad:#173335;--am:#27585a;--bl:#7ba9c8;--g:#c9a86d;--ok:#7fc98f;--od:#193425;--w:#e0ad4c;--wd:#3a2e15;--r:#e08a7a;--rd:#3c201d;--sh:0 9px 26px #00000045;--shs:0 2px 10px #00000038}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--p);color:var(--i);font-family:Inter,sans-serif}button,select{font:inherit}button{cursor:pointer}.header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--b)}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--a),var(--bl));position:relative;box-shadow:var(--shs)}.mark:before,.mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.mark:before{top:11px}.mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--ser);margin:0}.brand p{margin:4px 0 0;font:400 .52rem var(--mon);letter-spacing:.08em;text-transform:uppercase;color:var(--m2)}.controls{display:flex;gap:7px}.select,.theme{border:1px solid var(--b);background:var(--sa);color:var(--i);border-radius:7px;padding:6px 8px;font-size:.64rem}.theme{font-weight:600}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.side{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--s);border-right:1px solid var(--b);padding:15px 9px}.side-title{font:400 .5rem var(--mon);letter-spacing:.13em;text-transform:uppercase;color:var(--m2);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--m);padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:var(--sa);color:var(--i)}.nav.active{background:var(--ad);border-left-color:var(--a);color:var(--a)}.num{font:400 .53rem var(--mon);color:var(--m2)}.lab{font-size:.71rem;font-weight:600}.meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--b);font-size:.59rem;line-height:1.5;color:var(--m)}main{min-width:0;padding:20px 24px 44px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.head h2{font:600 1.38rem var(--ser);margin:0 0 5px}.head p{margin:0;max-width:850px;color:var(--m);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem var(--mon);letter-spacing:.08em;text-transform:uppercase;color:var(--a);background:var(--ad);border:1px solid var(--am);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--s);border:1px solid var(--b);border-radius:11px;box-shadow:var(--shs);padding:13px;min-width:0}.feature{box-shadow:var(--sh)}.ey{font:500 .49rem var(--mon);letter-spacing:.09em;text-transform:uppercase;color:var(--m2);margin-bottom:6px}.kv{font:600 1.33rem var(--ser)}.ks{font-size:.59rem;color:var(--m);line-height:1.35;margin-top:5px}.kpi{display:flex;justify-content:space-between;gap:7px}.ki{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--ad);color:var(--a);font:500 .54rem var(--mon)}.ct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.ct h3{font-size:.75rem;margin:0}.ct p{font-size:.56rem;color:var(--m2);margin:3px 0 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--m)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%}.chart{width:100%;height:205px;display:block}.gridline{stroke:var(--b);stroke-dasharray:3 5}.la{fill:none;stroke:var(--a);stroke-width:3}.lb{fill:none;stroke:var(--bl);stroke-width:2.5}.lr{fill:none;stroke:var(--r);stroke-width:2.5}.tick{fill:var(--m2);font:8px var(--mon)}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:115px 1fr 44px;gap:8px;align-items:center}.bar label{font-size:.59rem;color:var(--m)}.track{height:7px;border-radius:999px;background:var(--d);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--bl))}.score{text-align:right;font:400 .55rem var(--mon);color:var(--m)}.decision{border-left:4px solid var(--a);background:linear-gradient(135deg,var(--s),var(--sa));border-radius:11px;padding:12px;box-shadow:var(--shs)}.decision h3{font:600 .94rem var(--ser);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--m);margin:0}.tw{overflow:auto;border:1px solid var(--b);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:680px;background:var(--s)}th,td{padding:8px 9px;border-bottom:1px solid var(--b);text-align:left;font-size:.59rem}th{font:400 .47rem var(--mon);letter-spacing:.06em;text-transform:uppercase;color:var(--m2);background:var(--sa)}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--od)}.warn{color:var(--w);background:var(--wd)}.bad{color:var(--r);background:var(--rd)}.heat{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.hh{font:400 .48rem var(--mon);text-transform:uppercase;color:var(--m2);text-align:center}.hl{font-size:.59rem;color:var(--m)}.hc{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem var(--mon)}.hi{background:var(--ok)}.mid{background:var(--w)}.lo{background:var(--r)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--sa);border:1px solid var(--b)}.node.active{background:var(--ad);border-color:var(--a)}.nt{font:400 .48rem var(--mon);text-transform:uppercase;color:var(--m2);margin-bottom:5px}.nb{font-size:.58rem;line-height:1.4;color:var(--m)}.arr{align-self:center;color:var(--m2)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--b);background:var(--sa);color:var(--m);border-radius:6px;padding:6px 8px;text-align:left;font-size:.58rem}.scenario.active{background:var(--ad);border-color:var(--a);color:var(--a);font-weight:700}.scenario strong,.scenario span{display:block}.scenario span{margin-top:3px;color:var(--m2);font-size:.51rem;line-height:1.3}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--b)}.tl{position:relative;margin-bottom:12px}.dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--s);border:3px solid var(--a)}.tl.warn .dot{border-color:var(--w)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--m)}@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--b);padding:8px}.side-title,.meta{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.scenarios{grid-template-columns:1fr}.header{position:static;align-items:flex-start;flex-wrap:wrap}main{padding:16px 12px 36px}}
</style></head><body><header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. - Treasury Liquidity Transformation Portfolio</h1><p>treasury · liquidity · controls · transformation</p></div></div><div class="controls"><select class="select"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="select"><option>Enterprise view</option><option>Priority portfolio</option><option>Exception view</option></select><button class="theme" id="theme">Dark</button></div></header><div class="app"><nav class="side" id="side"></nav><main id="main"></main></div><script>
const V=[
{n:"Executive overview",t:"Treasury liquidity overview",d:"Liquidity reporting, calculation investigation, data controls and transformation decision support."},
{n:"Performance",t:"Treasury performance",d:"Measures, movement and current operating position across liquidity calculations, controls and reporting."},
{n:"Data assurance",t:"Data assurance",d:"Completeness, accuracy, timeliness and control evidence supporting trusted treasury reporting."},
{n:"Scenarios",t:"Liquidity scenarios",d:"Illustrative changes in demand, quality or operating conditions and their decision implications."},
{n:"Governance",t:"Governance and lineage",d:"Trace reported outcomes through business rules, calculations, controls and source data."}];
let view=0,sc=0;
const badge=s=>`<span class="badge ${/on track|improving/i.test(s)?"good":/watch|review/i.test(s)?"warn":"bad"}">${s}</span>`;
const head=i=>`<div class="head"><div><h2>${V[i].t}</h2><p>${V[i].d}</p></div><span class="demo">${i?["","Performance view","Assurance view","Scenario view","Governance view"][i]:"Illustrative demonstration"}</span></div>`;
const bars=a=>`<div class="bars">${a.map(x=>`<div class="bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join("")}</div>`;
function line(a,b){let w=650,h=220,p=28,all=[...a,...b],mn=Math.min(...all)-2,mx=Math.max(...all)+2,P=x=>x.map((v,i)=>[p+i/(x.length-1)*(w-2*p),h-p-(v-mn)/(mx-mn)*(h-2*p)]),path=q=>"M "+q.map((p,i)=>`${i?"L":""}${p[0]} ${p[1]}`).join(" ");return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join("")}<path class="la" d="${path(P(a))}"/><path class="lb" d="${path(P(b))}"/></svg>`}
function barline(){let r=[["Liquidity",92,98,3],["Funding",89,96,5],["Reconcile",90,96,4],["Controls",91,94,4],["Automation",70,82,7],["Lineage",84,91,5]],w=650,h=220,l=42,rr=24,t=18,bb=28,slot=(w-l-rr)/r.length,max=110,pts=[];let bs=r.map((d,i)=>{let x=l+i*slot+slot*.14,a=d[1]/max*(h-t-bb),b=d[2]/max*(h-t-bb);pts.push([l+i*slot+slot*.42,t+(8-d[3])/8*(h-t-bb)]);return `<rect x="${x}" y="${h-bb-a}" width="${slot*.25}" height="${a}" rx="3" fill="var(--bl)" opacity=".78"/><rect x="${x+slot*.29}" y="${h-bb-b}" width="${slot*.25}" height="${b}" rx="3" fill="var(--g)" opacity=".86"/><text class="tick" x="${l+i*slot+slot*.1}" y="${h-8}">${d[0]}</text>`}).join("");return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${l}" y1="${t+i*(h-t-bb)/3}" x2="${w-rr}" y2="${t+i*(h-t-bb)/3}"/>`).join("")}${bs}<path class="lr" d="M ${pts.map((p,i)=>`${i?"L":""}${p[0]} ${p[1]}`).join(" ")}"/></svg>`}
const health=[["Calculation coverage",98],["Data reconciliation",96],["Control evidence",94],["Automation",82],["Lineage coverage",91]];
function overview(){return head(0)+`<section class="grid kpis">${[["Calculations","128","Daily controlled calculations","CL"],["Exceptions","9","Current calculation exceptions","EX"],["Control pass rate","98.2%","Controls passed","CP"],["Manual steps","14","Remaining manual process steps","MS"]].map(x=>`<div class="card"><div class="kpi"><div><div class="ey">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">${x[2]}</div></div><div class="ki">${x[3]}</div></div></div>`).join("")}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="ct"><div><h3>Calculation coverage and exception view</h3><p>Baseline and current position with exception overlay.</p></div><div class="legend"><span><i style="background:var(--bl)"></i>Baseline</span><span><i style="background:var(--g)"></i>Current</span><span><i style="background:var(--r)"></i>Exceptions</span></div></div>${barline()}</div><div class="card"><div class="ct"><div><h3>Portfolio health</h3><p>Selected operational and assurance indicators.</p></div></div>${bars(health)}</div></section><section class="grid two"><div class="decision"><div class="ey">Decision focus</div><h3>Link calculation outcomes to source data, business rules and control evidence</h3><p>Make investigation faster by keeping the analytical chain visible from input to reported result.</p></div><div class="card"><div class="ct"><div><h3>Priority register</h3><p>Current items requiring attention or confirmation.</p></div></div><div class="tw"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${[["Daily calculation","Liquidity","On track","Automate exception note"],["Source mapping","Funding","Review","Resolve mapping"],["Variance threshold","Treasury","Improving","Tighten threshold"],["Control evidence","Controls","On track","Archive run log"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div></div></section>`}
function performance(){let rows=[["Liquidity","Calculation coverage","98%","+4pp","On track"],["Funding","Source reconciliation","96%","+3pp","On track"],["Controls","Evidence coverage","94%","+2pp","On track"],["Automation","Automated process coverage","82%","+12pp","Watch"],["Lineage","Traceability coverage","91%","+7pp","On track"]];return head(1)+`<section class="grid two"><div class="card feature"><div class="ct"><div><h3>Treasury performance trajectory</h3><p>Illustrative movement across 12 reporting periods.</p></div></div>${line([78,80,82,83,85,87,89,91,93,95,96,98],[70,72,75,77,79,82,84,86,88,90,92,94])}</div><div class="card"><div class="ct"><div><h3>Coverage mix</h3><p>Relative coverage across major assurance areas.</p></div></div>${bars(health)}</div></section><section class="card" style="margin-top:10px"><div class="ct"><div><h3>Performance scorecard</h3><p>Selected measures and current position.</p></div></div><div class="tw"><table><thead><tr><th>Area</th><th>Primary measure</th><th>Current</th><th>Direction</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${i==4?badge(x):x}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`}
function quality(){let q=[["Liquidity inputs",99,98,97,98],["Funding sources",97,96,93,95],["Reference data",96,95,92,94],["Control logs",98,97,96,99]],f=[["Reporting question","Define the liquidity, funding or control decision that needs support."],["Source","Identify controlled data sources, populations and reference inputs."],["Validate","Check completeness, definitions, mappings, reconciliations and exceptions."],["Calculate","Apply governed business rules and controlled calculation logic."],["Outcome","Produce a traceable reporting result, exception action or control response."]];return head(2)+`<section class="grid two"><div class="card"><div class="ct"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heat"><div></div>${["Complete","Accurate","Timely","Controlled"].map(x=>`<div class="hh">${x}</div>`).join("")}${q.map(x=>`<div class="hl">${x[0]}</div>${x.slice(1).map(v=>`<div class="hc ${v>=90?"hi":v>=80?"mid":"lo"}">${v}</div>`).join("")}`).join("")}</div></div><div class="card"><div class="ct"><div><h3>Validation pathway</h3><p>From source to trusted decision product.</p></div></div><div class="flow">${f.map((x,i)=>`${i?'<div class="arr">→</div>':""}<div class="node ${i==0?"active":""}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join("")}</div></div></section><section class="grid two" style="margin-top:10px"><div class="card"><div class="ct"><div><h3>Issue ageing</h3><p>Illustrative open-item profile.</p></div></div>${bars([["0–7 days",78],["8–30 days",46],["31–90 days",21],[">90 days",7]])}</div><div class="decision"><div class="ey">Assurance principle</div><h3>Keep every reported conclusion traceable to source data, definitions and control evidence</h3><p>A strong treasury reporting product makes the population, business rules, validation checks, calculation logic, exceptions and limitations visible.</p></div></section>`}
const S=[
["Base","Current calculation and control profile.",[78,81,84,87,90,93,96,98],["128","9","98.2%","14"],"Maintain calculation assurance","Keep source, rule and exception evidence connected while continuing targeted automation."],
["Volume peak","Higher processing and exception demand.",[78,80,82,83,84,85,86,87],["156","17","96.8%","14"],"Protect critical controls","Automate low-value steps while preserving reconciliation, exception triage and evidence quality."],
["Data issue","Source mapping or feed quality deteriorates.",[78,76,74,73,75,78,82,86],["128","24","93.7%","19"],"Contain reporting impact","Trace affected calculations quickly, isolate the source defect and resolve mapping or feed quality first."],
["Automation uplift","More manual steps are automated.",[78,83,87,91,94,96,98,99],["128","7","99.0%","6"],"Reallocate effort to investigation","Use saved capacity for exception analysis, control improvement and stronger reporting assurance."]];
function scenarios(){let s=S[sc],labs=["Calculations","Exceptions","Control pass","Manual steps"];return head(3)+`<div class="scenarios">${S.map((x,i)=>`<button class="scenario ${i==sc?"active":""}" data-sc="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join("")}</div><section class="grid kpis">${s[3].map((v,i)=>`<div class="card"><div class="ey">${labs[i]}</div><div class="kv">${v}</div><div class="ks">${i==0?"Daily":i==1?"Current":"Scenario position"}</div></div>`).join("")}</section><section class="grid two"><div class="card feature"><div class="ct"><div><h3>Liquidity scenario trajectory</h3><p>Comparison of baseline and selected scenario.</p></div></div>${line(S[0][2],s[2])}</div><div class="decision"><div class="ey">Scenario implication</div><h3>${s[4]}</h3><p>${s[5]}</p></div></section>`}
function governance(){let f=[["Reported outcome","Liquidity, funding, variance or control result used for decision support."],["Calculation","Controlled calculation logic, thresholds and business rules."],["Validation","Reconciliations, mappings, completeness checks and exception handling."],["Source","Liquidity, funding, reference and control-log data sources."],["Evidence","Run logs, approvals, lineage records and documented exceptions."]],t=[["good","Daily calculation run","Execute controlled calculations, reconciliations and exception checks."],["good","Daily exception review","Investigate material variances, data issues and failed controls."],["warn","Change assurance gate","Validate business-rule, mapping or calculation changes before release."],["good","Monthly control review","Review recurring exceptions, evidence quality, automation and lineage coverage."]],r=[["Calculation assurance","Treasury reporting","Controlled logic and run evidence","On track"],["Source reconciliation","Data / Treasury","Reconciliation and mapping evidence","On track"],["Exception ownership","Treasury / operations","Exception register","Watch"],["Change governance","Transformation","Validated change record","On track"]];return head(4)+`<section class="grid two"><div class="card"><div class="ct"><div><h3>Measure lineage</h3><p>Trace key measures from decision output back to controlled source.</p></div></div><div class="flow">${f.map((x,i)=>`${i?'<div class="arr">→</div>':""}<div class="node ${i==0?"active":""}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join("")}</div></div><div class="card"><div class="ct"><div><h3>Governance timeline</h3><p>Control and review rhythm.</p></div></div><div class="timeline">${t.map(x=>`<div class="tl ${x[0]}"><span class="dot"></span><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join("")}</div></div></section><section class="card" style="margin-top:10px"><div class="ct"><div><h3>Governance controls</h3><p>Ownership, evidence and current position.</p></div></div><div class="tw"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${badge(x[3])}</td></tr>`).join("")}</tbody></table></div></section>`}
const R=[overview,performance,quality,scenarios,governance];
function render(){document.getElementById("main").innerHTML=R[view]();document.getElementById("side").innerHTML=`<div class="side-title">Portfolio views</div>${V.map((x,i)=>`<button class="nav ${i==view?"active":""}" data-v="${i}"><span class="num">0${i}</span><span class="lab">${x.n}</span></button>`).join("")}<div class="meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Designed for role-relevant decision support</div>`;document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=+b.dataset.v;render()});document.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{sc=+b.dataset.sc;render()})}
document.getElementById("theme").onclick=()=>{let d=document.documentElement.dataset.theme=="dark";document.documentElement.dataset.theme=d?"":"dark";document.getElementById("theme").textContent=d?"Dark":"Light"};render();
</script></body></html>
