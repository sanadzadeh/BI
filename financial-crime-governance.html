<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Crime Governance & Reporting Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative financial crime governance and reporting portfolio covering KRIs, management information, emerging typologies, control effectiveness, data quality and committee reporting.">
<style>
:root{--bg:#f3f5f6;--card:#fff;--soft:#f8fafb;--line:#dbe3e7;--ink:#18232c;--muted:#667580;--accent:#0b5d6b;--blue:#557d98;--green:#477f55;--gold:#b48946;--red:#a94d41;--serif:Georgia,serif;--mono:Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}h1{font:600 18px var(--serif);margin:0}.tag{font:9px var(--mono);color:var(--accent);background:#e6f1f2;padding:5px 7px;border-radius:99px}.app{display:grid;grid-template-columns:210px 1fr}.side{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 58px);padding:12px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:7px;margin:2px 0;color:var(--muted);cursor:pointer}.nav.active{background:#e6f1f2;color:var(--accent);font-weight:700}.meta{font-size:10px;color:#87949d;border-top:1px solid var(--line);margin-top:14px;padding-top:10px;line-height:1.4}.main{padding:20px}.head h2{font:600 24px var(--serif);margin:0}.head p{font-size:12px;color:var(--muted)}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(5,1fr);margin:12px 0}.two{grid-template-columns:1.2fr .8fr}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.eye{font:9px var(--mono);text-transform:uppercase;color:#87949d}.val{font:600 24px var(--serif);margin-top:4px}.sub{font-size:10px;color:var(--muted);margin-top:3px}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:150px 1fr 42px;gap:7px;align-items:center;font-size:11px}.track{height:8px;background:#edf1f3;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px}.decision{border-left:4px solid var(--accent)}.decision strong{display:block;font:600 17px var(--serif);margin:5px 0 8px}.decision span{font-size:11px;color:var(--muted);line-height:1.45}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:8px;border-bottom:1px solid var(--line);font-size:11px;text-align:left}th{font:9px var(--mono);text-transform:uppercase;color:#87949d;background:var(--soft)}.badge{padding:3px 6px;border-radius:99px;font-size:10px;font-weight:700}.good{background:#e7f2e9;color:var(--green)}.warn{background:#fbf0db;color:#956c15}.bad{background:#f8e7e4;color:var(--red)}.flow{display:flex;gap:6px;align-items:center;overflow:auto}.node{min-width:140px;flex:1;background:var(--soft);border:1px solid var(--line);padding:9px;border-radius:8px}.node b{font-size:11px}.node span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.arrow{color:#87949d}@media(max-width:900px){.app{grid-template-columns:1fr}.side{min-height:auto;display:flex;overflow:auto}.meta{display:none}.nav{white-space:nowrap}.kpis,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.two{grid-template-columns:1fr}}
</style></head><body><header><h1>Khaled S. — Financial Crime Governance & Reporting</h1><span class="tag">Illustrative data</span></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Overview','Governance overview','A concise view of risk, controls, reporting quality and matters requiring escalation.'],['KRIs','KRI framework','Illustrative indicators across AML/CTF, sanctions, fraud and control effectiveness.'],['Typologies','Emerging typologies','Forward-looking risk signals linked to control and reporting implications.'],['Controls','Control effectiveness','A view of control confidence, evidence and required challenge.'],['MI quality','MI & data quality','Checks applied before reporting reaches senior committees.'],['Committee','Committee reporting','A simple line from evidence to issue, recommendation and action.']];let view=0;
const health=[['AML/CTF controls',86],['Sanctions controls',89],['Fraud controls',81],['Data confidence',84],['Action closure',76]];
function badge(s){return '<span class="badge '+(/Strong|Closed|On track/.test(s)?'good':/High|Escalate/.test(s)?'bad':'warn')+'">'+s+'</span>'}
function bars(a){return '<div class="bars">'+a.map(x=>'<div class="bar"><span>'+x[0]+'</span><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><span>'+x[1]+'%</span></div>').join('')+'</div>'}
function head(){return '<div class="head"><h2>'+V[view][1]+'</h2><p>'+V[view][2]+'</p></div>'}
function overview(){return head()+'<div class="grid kpis"><div class="card"><div class="eye">High risks</div><div class="val">4</div><div class="sub">requiring active oversight</div></div><div class="card"><div class="eye">KRIs outside appetite</div><div class="val">3</div><div class="sub">across reporting domains</div></div><div class="card"><div class="eye">Open actions</div><div class="val">12</div><div class="sub">4 past target date</div></div><div class="card"><div class="eye">MI confidence</div><div class="val">84%</div><div class="sub">weighted quality position</div></div><div class="card"><div class="eye">Emerging typologies</div><div class="val">5</div><div class="sub">under active review</div></div></div><div class="grid two"><div class="card">'+bars(health)+'</div><div class="card decision"><div class="eye">Committee focus</div><strong>Escalate the combination of rising mule activity and weaker action closure</strong><span>The threat signal alone is not enough. The concern increases because control actions are closing more slowly while exposure indicators are moving upward.</span></div></div></div>'}
function kris(){return head()+'<div class="card"><div class="table"><table><thead><tr><th>KRI</th><th>Domain</th><th>Current</th><th>Threshold</th><th>Status</th></tr></thead><tbody><tr><td>High-risk alert backlog</td><td>AML/CTF</td><td>7.4%</td><td>≤5%</td><td>'+badge('Escalate')+'</td></tr><tr><td>Sanctions screening exceptions</td><td>Sanctions</td><td>1.6%</td><td>≤2%</td><td>'+badge('On track')+'</td></tr><tr><td>Mule-risk referrals</td><td>Fraud</td><td>+18%</td><td>+10%</td><td>'+badge('High')+'</td></tr><tr><td>Overdue control actions</td><td>Governance</td><td>4</td><td>≤2</td><td>'+badge('Escalate')+'</td></tr><tr><td>MI reconciliation exceptions</td><td>Data</td><td>2.1%</td><td>≤3%</td><td>'+badge('On track')+'</td></tr></tbody></table></div></div>'}
function typologies(){return head()+'<div class="card"><div class="table"><table><thead><tr><th>Typology</th><th>Signal</th><th>Control implication</th><th>Reporting implication</th></tr></thead><tbody><tr><td>Mule networks</td><td>Higher linked-account concentration</td><td>Review detection and referral thresholds</td><td>Track network exposure and action closure</td></tr><tr><td>Identity takeover</td><td>Growth in compromised identity indicators</td><td>Review verification controls</td><td>Add identity-risk trend to MI</td></tr><tr><td>Sanctions evasion</td><td>Changing payment and virtual-asset patterns</td><td>Test screening and escalation logic</td><td>Report exceptions and emerging methods</td></tr><tr><td>Social engineering</td><td>New scam narratives</td><td>Review customer and frontline indicators</td><td>Separate attempted and realised loss trends</td></tr></tbody></table></div></div>'}
function controls(){return head()+'<div class="grid two"><div class="card">'+bars([['Design effectiveness',88],['Operating evidence',82],['Issue closure',76],['Data support',84],['Change governance',87]])+'</div><div class="card decision"><div class="eye">Challenge principle</div><strong>Do not accept a green control rating without the evidence behind it</strong><span>Independent review should test the source, definition, trend and outstanding actions before relying on the reported control position.</span></div></div></div>'}
function mi(){return head()+'<div class="grid two"><div class="card">'+bars([['Source reconciliation',93],['Metric definition',91],['Period consistency',88],['Narrative alignment',86],['Action traceability',82]])+'</div><div class="card"><div class="flow"><div class="node"><b>Input</b><span>1L and operational reporting</span></div><div class="arrow">→</div><div class="node"><b>Challenge</b><span>Definitions, anomalies, evidence</span></div><div class="arrow">→</div><div class="node"><b>Synthesise</b><span>Risk story and trend</span></div><div class="arrow">→</div><div class="node"><b>Report</b><span>Issue, implication, action</span></div></div></div></div>'}
function committee(){return head()+'<div class="card"><div class="flow"><div class="node"><b>Evidence</b><span>Data, control result, intelligence</span></div><div class="arrow">→</div><div class="node"><b>Risk statement</b><span>What changed and why it matters</span></div><div class="arrow">→</div><div class="node"><b>Challenge</b><span>What does not reconcile</span></div><div class="arrow">→</div><div class="node"><b>Recommendation</b><span>Specific treatment or decision</span></div><div class="arrow">→</div><div class="node"><b>Action</b><span>Owner and due date</span></div></div></div><div class="card decision" style="margin-top:10px"><div class="eye">Writing standard</div><strong>Committee reporting should make the decision visible</strong><span>Lead with the risk movement, evidence and required action. Operational detail should support that story rather than obscure it.</span></div></div>'}
function render(){document.getElementById('side').innerHTML=V.map((x,i)=>'<button class="nav '+(i===view?'active':'')+'" onclick="view='+i+';render()">'+(i+1)+'. '+x[0]+'</button>').join('')+'<div class="meta">Illustrative example only. Uses fictional data and does not represent any organisation\'s actual risk profile, controls or committee reporting.</div>';document.getElementById('main').innerHTML=[overview,kris,typologies,controls,mi,committee][view]()}render();
</script></body></html>
