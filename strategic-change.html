<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Strategic & Technology Change Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative strategic and technology change portfolio covering delivery, readiness, dependencies, benefits and governance.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f6;--card:#fff;--soft:#f7f9fa;--line:#dbe2e6;--ink:#18232c;--muted:#667580;--muted2:#8a969f;--accent:#0b5d6b;--accent2:#4b8792;--accentSoft:#e5f0f1;--blue:#5b7f9a;--gold:#b58b48;--green:#477f55;--red:#aa4b3f;--shadow:0 2px 10px rgba(30,45,55,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue))}.brand h1{margin:0;font:600 1.04rem var(--serif)}.brand span{display:block;margin-top:2px;font:.46rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}.demo{font:.47rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accentSoft);padding:5px 7px;border-radius:999px}.app{display:grid;grid-template-columns:205px 1fr}.side{height:calc(100vh - 58px);position:sticky;top:58px;background:var(--card);border-right:1px solid var(--line);padding:13px 9px}.side-title{font:.46rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:0 8px 7px}.nav{width:100%;border:0;border-left:3px solid transparent;background:transparent;border-radius:7px;padding:8px;text-align:left;color:var(--muted);display:grid;grid-template-columns:24px 1fr;gap:5px;cursor:pointer;margin:2px 0}.nav.active{background:var(--accentSoft);border-left-color:var(--accent);color:var(--accent)}.num{font:.49rem var(--mono);color:var(--muted2)}.label{font-size:.68rem;font-weight:600}.main{padding:18px 22px 36px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:11px}.head h2{font:600 1.34rem var(--serif);margin:0}.head p{margin:4px 0 0;color:var(--muted);font-size:.62rem}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:1.35fr 1fr}.twoeq{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow);min-width:0}.eyebrow{font:.45rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}.value{font:600 1.36rem var(--serif)}.sub{margin-top:3px;font-size:.53rem;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.section-title h3{font-size:.71rem;margin:0}.legend{display:flex;gap:8px;font-size:.49rem;color:var(--muted)}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.chart{width:100%;height:205px}.gridline{stroke:var(--line);stroke-dasharray:3 5}.tick{fill:var(--muted2);font:8px var(--mono)}.lineA{fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.lineB{fill:none;stroke:var(--blue);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.area{fill:var(--accentSoft)}.bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:112px 1fr 35px;gap:7px;align-items:center}.barrow label{font-size:.55rem;color:var(--muted)}.track{height:7px;border-radius:99px;background:#edf1f3;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.score{text-align:right;font:.5rem var(--mono);color:var(--muted)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--card),var(--soft));border-radius:10px;padding:12px}.decision strong{display:block;font:600 .88rem var(--serif);margin-bottom:4px}.decision span{font-size:.54rem;color:var(--muted);line-height:1.35}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:.55rem;text-align:left}th{font:.45rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);background:var(--soft)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.49rem;font-weight:700}.good{background:#e7f2e9;color:var(--green)}.warn{background:#fbf0db;color:#956c15}.bad{background:#f8e7e4;color:var(--red)}.heat{display:grid;grid-template-columns:120px repeat(4,1fr);gap:5px;align-items:center}.hh{font:.43rem var(--mono);text-transform:uppercase;color:var(--muted2);text-align:center}.hl{font-size:.53rem;color:var(--muted)}.hc{height:28px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.48rem var(--mono)}.hi{background:var(--green)}.mid{background:var(--gold)}.lo{background:var(--red)}.flow{display:flex;align-items:center;gap:6px;overflow:auto}.node{min-width:130px;flex:1;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:9px}.node b{display:block;font-size:.56rem}.node span{display:block;margin-top:3px;font-size:.48rem;color:var(--muted);line-height:1.3}.arrow{color:var(--muted2)}.donut-wrap{display:flex;align-items:center;gap:16px;justify-content:center;height:205px}.donut{width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--green) 0 52%,var(--gold) 52% 78%,var(--red) 78% 100%);position:relative}.donut:after{content:'';position:absolute;inset:27px;background:var(--card);border-radius:50%}.donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}.donut-center b{font:600 1.08rem var(--serif)}.donut-center span{display:block;font:.43rem var(--mono);color:var(--muted2)}.mini-legend{display:grid;gap:8px;font-size:.52rem;color:var(--muted)}.mini-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.scenario-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px;cursor:pointer;text-align:left}.scenario.active{background:var(--accentSoft);border-color:#9fc5ca}.scenario strong{display:block;font-size:.57rem}.scenario span{display:block;margin-top:2px;font-size:.46rem;color:var(--muted2)}.view{display:none}.view.active{display:block}@media(max-width:950px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side-title{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.twoeq,.three,.scenario-row{grid-template-columns:1fr 1fr}}@media(max-width:650px){.kpis,.two,.twoeq,.three,.scenario-row{grid-template-columns:1fr}.main{padding:14px}.top{position:static}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark"></div><div><h1>Khaled S. — Strategic & Technology Change</h1><span>delivery · readiness · dependencies · benefits · governance</span></div></div><div class="demo">Illustrative data</div></header>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const views=[['Overview','Transformation overview','Current delivery position and decisions requiring attention.'],['Workstreams','Workstream delivery','Progress, confidence and next decisions.'],['Readiness','Readiness & adoption','Readiness across people, process and technology.'],['Dependencies','Risks & dependencies','Items most likely to alter timing or scope.'],['Benefits','Benefits & scenarios','Outcome confidence under different assumptions.'],['Governance','Governance','Traceability from evidence to decision.']];
let current=0,scenario=0;
const health=[['Operating model',88],['Technology adoption',76],['Data & reporting',91],['Process transition',81],['Business readiness',74]];
const readiness=[['Role clarity',86],['Process readiness',83],['Training readiness',72],['Support model',69],['Leadership alignment',90]];
const workstreams=[['Operating model','84%','On plan','Approve support ownership'],['Technology adoption','71%','Watch','Confirm training sequence'],['Data & reporting','90%','On plan','Lock final measures'],['Process transition','79%','In progress','Approve readiness gate'],['Business readiness','68%','At risk','Resolve resource gap'],['Benefits tracking','83%','On plan','Approve revised baseline']];
const deps=[['Support model decision','Decision','Readiness sign-off','Watch'],['Training environment','Dependency','Adoption timing','Review'],['Migration completion','Dependency','Cutover readiness','On track'],['Resource gap','Risk','Operational readiness','At risk'],['Benefit baseline','Decision','Outcome reporting','Watch']];
const scen=[['Base','Current plan',[63,66,70,73,76,79,82,84],'87%','82%','4'],['Delayed migration','+4 weeks',[63,64,65,67,69,72,75,78],'79%','74%','7'],['Capacity uplift','Targeted uplift',[63,68,73,78,82,86,89,91],'91%','89%','2'],['Scope change','Expanded scope',[63,64,67,70,73,76,78,81],'82%','77%','6']];
function cls(s){return /on plan|on track|complete/i.test(s)?'good':/risk/i.test(s)?'bad':'warn'}
function badge(s){return `<span class="badge ${cls(s)}">${s}</span>`}
function bars(arr){return `<div class="bars">${arr.map(x=>`<div class="barrow"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}
function path(vals,w=650,h=205,p=28){let min=Math.min(...vals)-3,max=Math.max(...vals)+3,pts=vals.map((v,i)=>[p+i/(vals.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]);let d=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){let a=pts[i],b=pts[i+1],m=(a[0]+b[0])/2;d+=` C ${m} ${a[1]}, ${m} ${b[1]}, ${b[0]} ${b[1]}`}return {d,pts,min,max}}
function lineChart(a,b){let w=650,h=205,p=28,A=path(a,w,h,p),B=b?path(b,w,h,p):null;return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[42,82,122,162].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="lineA" d="${A.d}"/>${B?`<path class="lineB" d="${B.d}"/>`:''}${A.pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.4" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join('')}</svg>`}
function overview(){return `<div class="head"><div><h2>Transformation overview</h2><p>Current delivery position and decisions requiring attention.</p></div></div><div class="grid kpis"><div class="card"><div class="eyebrow">Workstreams on plan</div><div class="value">8 / 10</div><div class="sub">2 need intervention</div></div><div class="card"><div class="eyebrow">Readiness index</div><div class="value">82%</div><div class="sub">training + ownership gap</div></div><div class="card"><div class="eyebrow">Critical dependencies</div><div class="value">4</div><div class="sub">14 open overall</div></div><div class="card"><div class="eyebrow">Benefits confidence</div><div class="value">87%</div><div class="sub">3 measures unbaselined</div></div></div><div class="grid two"><div class="card"><div class="section-title"><h3>Portfolio health</h3></div>${bars(health)}</div><div class="decision"><div class="eyebrow">Decision focus</div><strong>Resolve support ownership and migration sequencing</strong><span>Both issues sit on the critical path to readiness.</span></div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><h3>Status mix</h3></div><div class="donut-wrap"><div class="donut"><div class="donut-center"><div><b>10</b><span>workstreams</span></div></div></div><div class="mini-legend"><div><i style="background:var(--green)"></i>On plan 52%</div><div><i style="background:var(--gold)"></i>Watch 26%</div><div><i style="background:var(--red)"></i>At risk 22%</div></div></div></div><div class="card"><div class="section-title"><h3>Outcome confidence</h3><div class="legend"><span><i style="background:var(--accent)"></i>Current</span></div></div>${lineChart([64,68,72,75,78,81,84,87])}</div></div>`}
function workstreamView(){return `<div class="head"><div><h2>Workstream delivery</h2><p>Progress, confidence and next decisions.</p></div></div><div class="card"><div class="section-title"><h3>Delivery scorecard</h3></div><div class="table"><table><thead><tr><th>Workstream</th><th>Progress</th><th>Status</th><th>Next decision</th></tr></thead><tbody>${workstreams.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div><div class="grid three" style="margin-top:10px"><div class="card"><div class="eyebrow">Highest confidence</div><div class="value">91%</div><div class="sub">Data & reporting</div></div><div class="card"><div class="eyebrow">Lowest confidence</div><div class="value">68%</div><div class="sub">Business readiness</div></div><div class="card"><div class="eyebrow">Decision load</div><div class="value">6</div><div class="sub">before next gate</div></div></div>`}
function readinessView(){let rows=[['Operations',[82,88,76,71]],['Finance',[91,86,88,83]],['Risk',[87,84,91,86]],['Technology',[74,68,81,72]]];return `<div class="head"><div><h2>Readiness & adoption</h2><p>Readiness across people, process and technology.</p></div></div><div class="grid two"><div class="card"><div class="section-title"><h3>Readiness dimensions</h3></div>${bars(readiness)}</div><div class="card"><div class="section-title"><h3>Change impact by team</h3></div><div class="heat"><div></div>${['Process','System','Role','Training'].map(x=>`<div class="hh">${x}</div>`).join('')}${rows.map(r=>`<div class="hl">${r[0]}</div>${r[1].map(v=>`<div class="hc ${v>=85?'hi':v>=75?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div></div><div class="decision" style="margin-top:10px"><div class="eyebrow">Readiness threshold</div><strong>Support model remains below gate</strong><span>Ownership and training are the two material gaps.</span></div>`}
function dependencyView(){let nodes=[['Migration','Data ready'],['Training','Content aligned'],['Readiness gate','Evidence complete'],['Go-live','Critical gaps closed']];return `<div class="head"><div><h2>Risks & dependencies</h2><p>Items most likely to alter timing or scope.</p></div></div><div class="card"><div class="section-title"><h3>Critical path</h3></div><div class="flow">${nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node"><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}</div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><h3>Dependency register</h3></div><div class="table"><table><thead><tr><th>Item</th><th>Type</th><th>Impact</th><th>Status</th></tr></thead><tbody>${deps.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="section-title"><h3>Risk concentration</h3></div>${bars([['Readiness',78],['Technology',64],['Scope',46],['Benefits',38],['Governance',29]])}</div></div>`}
function benefitsView(){let s=scen[scenario];return `<div class="head"><div><h2>Benefits & scenarios</h2><p>Outcome confidence under different assumptions.</p></div></div><div class="scenario-row">${scen.map((x,i)=>`<button class="scenario ${i===scenario?'active':''}" data-sc="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><div class="grid kpis"><div class="card"><div class="eyebrow">Benefit confidence</div><div class="value">${s[3]}</div></div><div class="card"><div class="eyebrow">Adoption</div><div class="value">${s[4]}</div></div><div class="card"><div class="eyebrow">Critical gaps</div><div class="value">${s[5]}</div></div><div class="card"><div class="eyebrow">Selected scenario</div><div class="value" style="font-size:1rem">${s[0]}</div></div></div><div class="grid two"><div class="card"><div class="section-title"><h3>Confidence trajectory</h3><div class="legend"><span><i style="background:var(--accent)"></i>Base</span><span><i style="background:var(--blue)"></i>Scenario</span></div></div>${lineChart(scen[0][2],s[2])}</div><div class="card"><div class="section-title"><h3>Benefit confidence</h3></div>${bars([['Cycle time',91],['Manual effort',86],['Controls',88],['Reporting',93],['Adoption',79]])}</div></div>`}
function governanceView(){let nodes=[['Question','Decision required'],['Measure','Signal + threshold'],['Rule','Definition + check'],['Source','Evidence'],['Forum','Decision + action']];return `<div class="head"><div><h2>Governance</h2><p>Traceability from evidence to decision.</p></div></div><div class="card"><div class="section-title"><h3>Decision lineage</h3></div><div class="flow">${nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node"><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}</div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><h3>Governance cadence</h3></div>${bars([['Weekly workstream',100],['Fortnightly readiness',82],['Gate assurance',64],['Monthly executive',100]])}</div><div class="card"><div class="section-title"><h3>Control status</h3></div><div class="table"><table><thead><tr><th>Control</th><th>Status</th></tr></thead><tbody><tr><td>Performance measures</td><td>${badge('On track')}</td></tr><tr><td>Readiness gate</td><td>${badge('Watch')}</td></tr><tr><td>Benefits tracking</td><td>${badge('On track')}</td></tr><tr><td>Dependency closure</td><td>${badge('Review')}</td></tr></tbody></table></div></div></div>`}
const renderers=[overview,workstreamView,readinessView,dependencyView,benefitsView,governanceView];
function renderSide(){side.innerHTML=`<div class="side-title">Portfolio views</div>${views.map((v,i)=>`<button class="nav ${i===current?'active':''}" data-view="${i}"><span class="num">0${i}</span><span class="label">${v[0]}</span></button>`).join('')}`;side.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{current=+b.dataset.view;render()})}
function render(){main.innerHTML=renderers[current]();renderSide();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{scenario=+b.dataset.sc;render()})}
render();
</script>
</body></html>
