<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic & Technology Change Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative strategic and technology change portfolio covering delivery, readiness, dependencies, benefits and governance.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;
  --border:#d8e0e5;--border-2:#bcc8cf;--ink:#18232c;--ink-2:#55636f;--ink-3:#7b8893;
  --accent:#0b5d6b;--accent-2:#2f7f7a;--accent-dim:#e4f1f2;--accent-mid:#bddcde;
  --blue:#4a7897;--blue-dim:#e7eff5;--gold:#b58b48;--ok:#3f7a4c;--ok-dim:#e8f3eb;
  --warn:#a3720a;--warn-dim:#fbf1dc;--risk:#a23b2e;--risk-dim:#f8e8e5;
  --shadow:0 7px 22px rgba(34,48,58,.08);--shadow-sm:0 2px 8px rgba(34,48,58,.06);
  --radius:11px;--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono','Courier New',monospace;
}
:root[data-theme="dark"]{
  --paper:#11171c;--surface:#182027;--surface-alt:#1e2830;--surface-deep:#25313a;
  --border:#2f3b44;--border-2:#43525e;--ink:#edf2f4;--ink-2:#aab5be;--ink-3:#81909b;
  --accent:#61c5bf;--accent-2:#7cd4cf;--accent-dim:#173335;--accent-mid:#27585a;
  --blue:#7ba9c8;--blue-dim:#1b3040;--gold:#c9a86d;--ok:#7fc98f;--ok-dim:#193425;
  --warn:#e0ad4c;--warn-dim:#3a2e15;--risk:#e08a7a;--risk-dim:#3c201d;
  --shadow:0 9px 26px rgba(0,0,0,.27);--shadow-sm:0 2px 10px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body,.card,.header,.sidebar,.nav,.select,.theme-btn,.scenario,.heat-cell,.node,.decision{transition:background-color .18s,color .18s,border-color .18s}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button,select{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.header{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:10px;align-items:center;min-width:260px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative;box-shadow:var(--shadow-sm)}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}
.brand-mark:before{top:11px}.brand-mark:after{top:20px}
.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.select,.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}
.theme-btn{display:flex;align-items:center;gap:7px;font-weight:600}.theme-orb{width:10px;height:10px;border-radius:50%;background:#e0a72f;box-shadow:0 0 0 4px rgba(224,167,47,.14)}
:root[data-theme="dark"] .theme-orb{background:#8bc5ec;box-shadow:0 0 0 4px rgba(139,197,236,.12)}
.app{display:grid;grid-template-columns:210px minmax(0,1fr)}
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}
.side-title{font:400 .5rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:0 9px 8px}
.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}
.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}
.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}
.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink-2)}
.main{min-width:0;padding:20px 24px 44px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}
.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:850px;color:var(--ink-2);font-size:.69rem;line-height:1.45}
.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}
.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}
.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.kpi{display:flex;justify-content:space-between;gap:7px}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}
.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:500 .54rem/1 var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.good{color:var(--ok);background:var(--ok-dim)}.warn{color:var(--warn);background:var(--warn-dim)}.bad{color:var(--risk);background:var(--risk-dim)}.info{color:var(--blue);background:var(--blue-dim)}
.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--ink-2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}
.chart{width:100%;height:205px;display:block;overflow:visible}.chart-sm{height:150px}.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--ink-3);font:8px var(--mono)}
.line-a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tooltip{position:fixed;z-index:1000;pointer-events:none;min-width:150px;max-width:260px;padding:8px 9px;border-radius:7px;background:var(--ink);color:var(--surface);font-size:.57rem;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none}.tooltip strong{display:block;margin-bottom:3px;font-size:.6rem}
.hoverable{cursor:help}.metric-stack{display:grid;gap:8px}.metric-bar{display:grid;grid-template-columns:125px 1fr 44px;gap:8px;align-items:center}.metric-bar label{font-size:.59rem;color:var(--ink-2)}
.track{height:7px;border-radius:999px;background:var(--surface-deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}
.heatmap{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .48rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center}
.heat-label{font-size:.59rem;color:var(--ink-2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}
.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl.warn .tl-dot{border-color:var(--warn)}.tl.bad .tl-dot{border-color:var(--risk)}.tl.good .tl-dot{border-color:var(--ok)}
.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}
.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}
.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}
.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:7px 8px;font-size:.58rem;text-align:left}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}
.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}
.note{font-size:.54rem;color:var(--ink-3);line-height:1.45;margin-top:6px}
@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.header{align-items:flex-start;flex-wrap:wrap}}
@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenarios{grid-template-columns:1fr}.header{position:static}}
</style>
</head>
<body>
<div class="shell">
<header class="header">
  <div class="brand"><div class="brand-mark"></div><div><h1>Khaled S. - Strategic & Technology Change Portfolio</h1><p>delivery · readiness · dependencies · benefits · governance</p></div></div>
  <div class="controls">
    <select class="select" id="period"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select>
    <select class="select" id="scope"><option>Enterprise view</option><option>Priority workstreams</option><option>Exception view</option></select>
    <button class="theme-btn" id="themeBtn"><span class="theme-orb"></span><span id="themeText">Dark</span></button>
  </div>
</header>
<div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
const CFG={
 title:"Strategic & Technology Change Portfolio",
 views:[
  {nav:"Executive overview",title:"Transformation overview",desc:"A senior decision view connecting delivery progress, readiness, dependencies and expected outcomes."},
  {nav:"Workstreams",title:"Workstream delivery",desc:"Current position, delivery confidence and the next decision required across major change streams."},
  {nav:"Readiness & adoption",title:"Readiness and adoption",desc:"People, process, technology and support readiness before implementation."},
  {nav:"Risks & dependencies",title:"Risks and dependencies",desc:"Cross-stream items that can alter scope, timing, readiness or delivery confidence."},
  {nav:"Benefits & outcomes",title:"Benefits and outcomes",desc:"Expected outcomes, confidence, assumptions and scenario sensitivity."},
  {nav:"Governance",title:"Governance and decision flow",desc:"Decision rights, evidence, review cadence and traceability from source to executive action."}
 ],
 kpis:[
  {label:"Workstreams on plan",value:"8 / 10",sub:"Two streams need active intervention",icon:"WS"},
  {label:"Readiness index",value:"82%",sub:"Ownership and training remain the main gaps",icon:"RD"},
  {label:"Open dependencies",value:"14",sub:"Four cross-stream items are critical",icon:"DP"},
  {label:"Benefits confidence",value:"87%",sub:"Three measures still need baselining",icon:"BN"}
 ],
 health:[
  {label:"Operating model",value:88},{label:"Technology adoption",value:76},{label:"Data & reporting",value:91},{label:"Process transition",value:81},{label:"Business readiness",value:74}
 ],
 decisionTitle:"Resolve the support-model and sequencing decisions before the next readiness gate",
 decisionText:"The delivery plan is broadly healthy, but unresolved ownership and a migration-training sequencing conflict can turn local issues into a program-level delay if they remain open.",
 register:[
  {item:"Post-go-live support ownership",area:"Operating model",status:"Watch",action:"Confirm accountable support model"},
  {item:"Migration and training overlap",area:"Technology adoption",status:"Review",action:"Re-sequence training window"},
  {item:"Benefit baseline change",area:"Benefits",status:"Watch",action:"Approve revised measure"},
  {item:"Readiness resource gap",area:"Business readiness",status:"At risk",action:"Escalate capacity decision"}
 ],
 workstreams:[
  ["Operating model","Future-state roles and hand-offs","84%","On plan","Approve support ownership"],
  ["Technology adoption","New workflow embedded in teams","71%","Watch","Confirm training sequence"],
  ["Data & reporting","Common measures and reporting","90%","On plan","Lock final measures"],
  ["Process transition","New process ready for cutover","79%","In progress","Approve readiness gate"],
  ["Business readiness","Teams prepared for go-live","68%","At risk","Resolve resource gap"],
  ["Benefits tracking","Outcome measures and baselines","83%","On plan","Approve revised baseline"]
 ],
 readiness:[
  {label:"Role clarity",value:86},{label:"Process readiness",value:83},{label:"Training readiness",value:72},{label:"Support model",value:69},{label:"Leadership alignment",value:90}
 ],
 quality:[
  {label:"Operations",values:[82,88,76,71]},
  {label:"Finance",values:[91,86,88,83]},
  {label:"Risk",values:[87,84,91,86]},
  {label:"Technology",values:[74,68,81,72]}
 ],
 dependencyFlow:[
  {title:"Data migration",text:"Stable migrated data is required before final training validation."},
  {title:"Training",text:"Final process and support model must be reflected in learning content."},
  {title:"Readiness gate",text:"Ownership, controls and capability must be demonstrably ready."},
  {title:"Go-live",text:"Release only when critical gaps are closed or consciously accepted."}
 ],
 dependencies:[
  ["Support model decision","Decision","Readiness sign-off","Business / Technology","Watch"],
  ["Training environment","Dependency","Adoption timing","Technology","Review"],
  ["Migration completion","Dependency","Cutover readiness","Technology","On track"],
  ["Resource gap","Risk","Operational readiness","Business","At risk"],
  ["Benefit baseline","Decision","Outcome reporting","Finance / Strategy","Watch"]
 ],
 benefitTrendA:[63,66,70,73,76,79,82,84,86,87],
 benefitTrendB:[58,62,65,69,72,75,78,81,83,85],
 benefits:[
  {label:"Cycle-time reduction",value:91},{label:"Manual effort reduction",value:86},{label:"Control effectiveness",value:88},{label:"Reporting consistency",value:93},{label:"Adoption confidence",value:79}
 ],
 scenarios:[
  {name:"Base",note:"Current approved plan.",series:[63,66,70,73,76,79,82,84],kpis:[["Benefit confidence","87%"],["Adoption","82%"],["Critical gaps","4"],["Decision load","6"]],decision:"Maintain the current plan with focused intervention",detail:"Delivery remains viable if ownership and sequencing decisions are closed before the next gate."},
  {name:"Delayed migration",note:"Migration shifts four weeks.",series:[63,64,65,67,69,72,75,78],kpis:[["Benefit confidence","79%"],["Adoption","74%"],["Critical gaps","7"],["Decision load","9"]],decision:"Protect training quality rather than compress the full change window",detail:"A late migration should trigger deliberate resequencing, not a blanket compression of training and readiness activity."},
  {name:"Capacity uplift",note:"Targeted readiness capacity added.",series:[63,68,73,78,82,86,89,91],kpis:[["Benefit confidence","91%"],["Adoption","89%"],["Critical gaps","2"],["Decision load","5"]],decision:"Direct extra capacity to the readiness bottleneck",detail:"Additional capacity creates the most value when targeted at ownership, training and operational transition rather than spread evenly."},
  {name:"Scope change",note:"Approved scope expands.",series:[63,64,67,70,73,76,78,81],kpis:[["Benefit confidence","82%"],["Adoption","77%"],["Critical gaps","6"],["Decision load","8"]],decision:"Rebaseline measures and dependencies before accepting the new commitment",detail:"Scope change should be reflected in benefits, readiness, sequencing and governance measures before delivery confidence is restated."}
 ],
 lineage:[
  {title:"Decision question",text:"What decision or intervention is required?"},
  {title:"Performance measure",text:"Which measure indicates the issue and what threshold matters?"},
  {title:"Business rule",text:"How is the measure defined, reconciled and validated?"},
  {title:"Source data",text:"Which system or stakeholder source provides the evidence?"},
  {title:"Governance action",text:"Who reviews, decides, records and follows through?"}
 ],
 timeline:[
  {cls:"good",title:"Weekly workstream review",text:"Progress, exceptions, dependencies and decision requirements."},
  {cls:"good",title:"Fortnightly readiness review",text:"Adoption, ownership, training and support readiness."},
  {cls:"warn",title:"Gate assurance",text:"Critical measures and open risks require evidence before sign-off."},
  {cls:"good",title:"Monthly executive reset",text:"Reconfirm priorities, outcomes, scope and major decisions."}
 ],
 governance:[
  ["Performance measures","Strategy / workstream leads","Measure definitions and source controls","On track"],
  ["Readiness gate","Business / change leads","Evidence pack and exceptions","Watch"],
  ["Benefits tracking","Finance / Strategy","Baseline and outcome measures","On track"],
  ["Dependency closure","Program leadership","Dependency register and decisions","Review"]
 ]
};
let state={view:0,scenario:0};
function statusClass(s){return /on track|on plan|healthy|complete|low/i.test(s)?"good":/risk|at risk/i.test(s)?"bad":/progress/i.test(s)?"info":"warn"}
function badge(s){return `<span class="badge ${statusClass(s)}">${s}</span>`}
function smoothPath(points){if(points.length<2)return"";let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const p0=points[i],p1=points[i+1],mx=(p0[0]+p1[0])/2;d+=` C ${mx} ${p0[1]}, ${mx} ${p1[1]}, ${p1[0]} ${p1[1]}`;}return d;}
function bindTooltips(){const tip=document.getElementById("tooltip");document.querySelectorAll("[data-tip]").forEach(el=>{el.addEventListener("mouseenter",()=>{tip.innerHTML=el.dataset.tip;tip.style.display="block"});el.addEventListener("mousemove",e=>{const r=tip.getBoundingClientRect(),pad=12,gap=14;let l=e.clientX+gap,t=e.clientY+gap;if(l+r.width+pad>innerWidth)l=e.clientX-r.width-gap;if(t+r.height+pad>innerHeight)t=e.clientY-r.height-gap;tip.style.left=Math.max(pad,l)+"px";tip.style.top=Math.max(pad,t)+"px";});el.addEventListener("mouseleave",()=>tip.style.display="none");})}
function metricBars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x.label}</label><div class="track"><div class="fill" style="width:${x.value}%"></div></div><div class="metric-score">${x.value}%</div></div>`).join("")}</div>`}
function lineChart(series,second=null){const w=650,h=220,p=28,all=[...series,...(second||[])],min=Math.min(...all)-2,max=Math.max(...all)+2,pts=series.map((v,i)=>[p+i/(series.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),pts2=second?second.map((v,i)=>[p+i/(second.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]):[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join("")}<path class="line-a" d="${smoothPath(pts)}"/>${second?`<path class="line-b" d="${smoothPath(pts2)}"/>`:""}${pts.map((q,i)=>`<circle class="hoverable" data-tip="<strong>Period ${i+1}</strong>${series[i]}%" cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join("")}</svg>`}
function renderOverview(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[0].title}</h2><p class="page-desc">${CFG.views[0].desc}</p></div><span class="demo">Illustrative demonstration</span></div>
<section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub}</div></div><div class="kpi-icon">${x.icon}</div></div></div>`).join("")}</section>
<section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>Workstream health</h3><p>Delivery, readiness and governance combined.</p></div></div>${metricBars(CFG.health)}</div>
<div class="decision"><div class="eyebrow">Decision focus</div><h3>${CFG.decisionTitle}</h3><p>${CFG.decisionText}</p></div></section>
<section class="card"><div class="chart-title"><div><h3>Priority register</h3><p>Current items requiring senior attention or confirmation.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r.item}</td><td>${r.area}</td><td>${badge(r.status)}</td><td>${r.action}</td></tr>`).join("")}</tbody></table></div></section>`}
function renderWorkstreams(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[1].title}</h2><p class="page-desc">${CFG.views[1].desc}</p></div><span class="demo">Delivery view</span></div>
<section class="card feature"><div class="chart-title"><div><h3>Workstream scorecard</h3><p>Outcome, progress, status and next decision.</p></div></div><div class="table-wrap"><table><thead><tr><th>Workstream</th><th>Outcome</th><th>Progress</th><th>Status</th><th>Next decision</th></tr></thead><tbody>${CFG.workstreams.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td><td>${r[4]}</td></tr>`).join("")}</tbody></table></div></section>
<section class="grid three" style="margin-top:10px"><div class="decision"><div class="eyebrow">Scope discipline</div><h3>Keep outcomes and measures tied to approved scope</h3><p>When scope moves, readiness, dependencies and benefits should be re-tested rather than carried forward unchanged.</p></div><div class="decision"><div class="eyebrow">Delivery discipline</div><h3>Escalate decisions, not just red status</h3><p>A useful workstream view makes the required decision explicit and shows the consequence of delay.</p></div><div class="decision"><div class="eyebrow">Evidence discipline</div><h3>Separate progress from confidence</h3><p>High completion does not guarantee readiness if ownership, controls or evidence remain unresolved.</p></div></section>`}
function renderReadiness(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[2].title}</h2><p class="page-desc">${CFG.views[2].desc}</p></div><span class="demo">Change view</span></div>
<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Readiness dimensions</h3><p>Current confidence across the major change conditions.</p></div></div>${metricBars(CFG.readiness)}</div>
<div class="card"><div class="chart-title"><div><h3>Impact by team</h3><p>Illustrative depth of change by dimension.</p></div></div><div class="heatmap"><div></div>${["Process","System","Role","Training"].map(x=>`<div class="heat-head">${x}</div>`).join("")}${CFG.quality.map(q=>`<div class="heat-label">${q.label}</div>${q.values.map(v=>`<div class="heat-cell ${v>=85?"hi":v>=75?"mid":"lo"}">${v}</div>`).join("")}`).join("")}</div></div></section>
<section class="decision" style="margin-top:10px"><div class="eyebrow">Readiness principle</div><h3>Do not treat adoption as a communications metric</h3><p>Readiness depends on role clarity, process stability, training, support ownership and leadership alignment. A high communications reach figure cannot substitute for those conditions.</p></section>`}
function renderDependencies(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[3].title}</h2><p class="page-desc">${CFG.views[3].desc}</p></div><span class="demo">Program view</span></div>
<section class="card feature"><div class="chart-title"><div><h3>Critical dependency path</h3><p>Where timing and decision slippage can compound.</p></div></div><div class="flow">${CFG.dependencyFlow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':""}<div class="node ${i===0?"active":""}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join("")}</div></section>
<section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Risk and dependency register</h3><p>Current items affecting timing, scope or readiness.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Type</th><th>Impact</th><th>Owner</th><th>Status</th></tr></thead><tbody>${CFG.dependencies.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${badge(r[4])}</td></tr>`).join("")}</tbody></table></div></section>`}
function renderBenefits(){const s=CFG.scenarios[state.scenario];return `<div class="page-head"><div><h2 class="page-title">${CFG.views[4].title}</h2><p class="page-desc">${CFG.views[4].desc}</p></div><span class="demo">Scenario view</span></div>
<div class="scenarios">${CFG.scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?"active":""}" data-sc="${i}"><strong>${x.name}</strong><span>${x.note}</span></button>`).join("")}</div>
<section class="grid kpis">${s.kpis.map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div></div>`).join("")}</section>
<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Outcome confidence trajectory</h3><p>Baseline compared with the selected scenario.</p></div><div class="legend"><span><i style="background:var(--accent)"></i>Base</span><span><i style="background:var(--blue)"></i>Selected</span></div></div>${lineChart(CFG.scenarios[0].series,s.series)}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s.decision}</h3><p>${s.detail}</p></div></section>
<section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Benefit confidence</h3><p>Current confidence by outcome area.</p></div></div>${metricBars(CFG.benefits)}</section>`}
function renderGovernance(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[5].title}</h2><p class="page-desc">${CFG.views[5].desc}</p></div><span class="demo">Governance view</span></div>
<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Decision lineage</h3><p>Trace performance signals back to controlled evidence.</p></div></div><div class="flow">${CFG.lineage.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':""}<div class="node ${i===0?"active":""}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join("")}</div></div>
<div class="card"><div class="chart-title"><div><h3>Governance rhythm</h3><p>Review and assurance cadence.</p></div></div><div class="timeline">${CFG.timeline.map(x=>`<div class="tl ${x.cls}"><span class="tl-dot"></span><strong>${x.title}</strong><p>${x.text}</p></div>`).join("")}</div></div></section>
<section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Governance controls</h3><p>Ownership, evidence and current position.</p></div></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${CFG.governance.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join("")}</tbody></table></div></section>`}
const RENDERERS=[renderOverview,renderWorkstreams,renderReadiness,renderDependencies,renderBenefits,renderGovernance];
function renderSidebar(){const s=document.getElementById("sidebar");s.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?"active":""}" data-view="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v.nav}</span></button>`).join("")}<div class="side-meta">Illustrative data only<br>Independent portfolio example<br>Built for strategic decision support</div>`;s.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{state.view=+b.dataset.view;render()}));}
function render(){document.getElementById("main").innerHTML=RENDERERS[state.view]();renderSidebar();bindTooltips();document.querySelectorAll("[data-sc]").forEach(b=>b.addEventListener("click",()=>{state.scenario=+b.dataset.sc;render()}));}
document.getElementById("themeBtn").addEventListener("click",()=>{const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";document.getElementById("themeText").textContent=dark?"Dark":"Light";});
render();
</script>
</body>
</html>
