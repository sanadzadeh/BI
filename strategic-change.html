<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Strategic & Technology Change Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative strategic and technology change portfolio covering delivery, readiness, dependencies, benefits and governance.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f6;--card:#fff;--soft:#f8fafb;--line:#dbe3e7;--ink:#18232c;--muted:#667580;--muted2:#87949d;--accent:#0b5d6b;--accent2:#4d8790;--accentSoft:#e6f1f2;--blue:#557d98;--gold:#b48946;--green:#477f55;--red:#a94d41;--shadow:0 2px 10px rgba(30,45,55,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue))}.brand h1{margin:0;font:600 1.04rem var(--serif)}.brand span{display:block;margin-top:2px;font:.46rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}.demo{font:.47rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accentSoft);padding:5px 7px;border-radius:999px}.app{display:grid;grid-template-columns:205px 1fr}.side{height:calc(100vh - 58px);position:sticky;top:58px;background:var(--card);border-right:1px solid var(--line);padding:13px 9px}.side-title{font:.46rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:0 8px 7px}.nav{width:100%;border:0;border-left:3px solid transparent;background:transparent;border-radius:7px;padding:8px;text-align:left;color:var(--muted);display:grid;grid-template-columns:24px 1fr;gap:5px;cursor:pointer;margin:2px 0}.nav.active{background:var(--accentSoft);border-left-color:var(--accent);color:var(--accent)}.num{font:.49rem var(--mono);color:var(--muted2)}.label{font-size:.68rem;font-weight:600}.main{padding:18px 22px 36px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:11px}.head h2{font:600 1.34rem var(--serif);margin:0}.head p{margin:4px 0 0;color:var(--muted);font-size:.62rem}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:1.35fr 1fr}.twoeq{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow);min-width:0}.eyebrow{font:.45rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}.value{font:600 1.36rem var(--serif)}.sub{margin-top:3px;font-size:.53rem;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.section-title h3{font-size:.71rem;margin:0}.section-title p{margin:3px 0 0;font-size:.5rem;color:var(--muted2)}.bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:120px 1fr 42px;gap:7px;align-items:center}.barrow label{font-size:.55rem;color:var(--muted)}.track{height:8px;border-radius:99px;background:#edf1f3;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.score{text-align:right;font:.5rem var(--mono);color:var(--muted)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--card),var(--soft));border-radius:10px;padding:12px}.decision strong{display:block;font:600 .88rem var(--serif);margin-bottom:4px}.decision span{font-size:.54rem;color:var(--muted);line-height:1.35}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:.55rem;text-align:left}th{font:.45rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);background:var(--soft)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.49rem;font-weight:700}.good{background:#e7f2e9;color:var(--green)}.warn{background:#fbf0db;color:#956c15}.bad{background:#f8e7e4;color:var(--red)}.heat{display:grid;grid-template-columns:120px repeat(4,1fr);gap:5px;align-items:center}.hh{font:.43rem var(--mono);text-transform:uppercase;color:var(--muted2);text-align:center}.hl{font-size:.53rem;color:var(--muted)}.hc{height:28px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.48rem var(--mono)}.hi{background:var(--green)}.mid{background:var(--gold)}.lo{background:var(--red)}.flow{display:flex;align-items:center;gap:6px;overflow:auto}.node{min-width:130px;flex:1;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:9px}.node b{display:block;font-size:.56rem}.node span{display:block;margin-top:3px;font-size:.48rem;color:var(--muted);line-height:1.3}.arrow{color:var(--muted2)}.scenario-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px;cursor:pointer;text-align:left}.scenario.active{background:var(--accentSoft);border-color:#9fc5ca}.scenario strong{display:block;font-size:.57rem}.scenario span{display:block;margin-top:2px;font-size:.46rem;color:var(--muted2)}.chart{width:100%;height:235px}.gridline{stroke:var(--line);stroke-dasharray:3 5}.tick{fill:var(--muted2);font:8px var(--mono)}.axis{stroke:#aeb9c0;stroke-width:1}.target{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 5}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.mini>div{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px}.mini b{display:block;font:600 .8rem var(--serif)}.mini span{display:block;margin-top:2px;font:.46rem var(--mono);color:var(--muted2)}@media(max-width:950px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side-title{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.twoeq,.scenario-row{grid-template-columns:1fr 1fr}}@media(max-width:650px){.kpis,.two,.twoeq,.scenario-row,.mini{grid-template-columns:1fr}.main{padding:14px}.top{position:static}}
</style></head>
<body><header class="top"><div class="brand"><div class="mark"></div><div><h1>Khaled S. — Strategic & Technology Change</h1><span>delivery · readiness · dependencies · benefits · governance</span></div></div><div class="demo">Illustrative data</div></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Overview','Transformation overview','Current delivery position and decisions requiring attention.'],['Workstreams','Workstream delivery','Progress, status and next decisions.'],['Readiness','Readiness & adoption','Readiness across people, process, technology and support.'],['Dependencies','Risks & dependencies','Items most likely to alter timing, scope or go-live readiness.'],['Benefits','Benefits & scenarios','Forecast benefit realisation against target under different assumptions.'],['Governance','Governance','Traceability from evidence to decision.']];
let view=0,scenario=0;
const health=[['Operating model',88],['Technology adoption',76],['Data & reporting',91],['Process transition',81],['Business readiness',74]];
const readiness=[['Role clarity',86],['Process readiness',83],['Training readiness',72],['Support model',69],['Leadership alignment',90]];
const workstreams=[['Operating model','84%','On plan','Approve support ownership'],['Technology adoption','71%','Watch','Confirm training sequence'],['Data & reporting','90%','On plan','Lock final measures'],['Process transition','79%','In progress','Approve readiness gate'],['Business readiness','68%','At risk','Resolve resource gap'],['Benefits tracking','83%','On plan','Approve revised baseline']];
const deps=[['Support model decision','Decision','Readiness sign-off','Watch'],['Training environment','Dependency','Adoption timing','Review'],['Migration completion','Dependency','Cutover readiness','On track'],['Resource gap','Risk','Operational readiness','At risk'],['Benefit baseline','Decision','Outcome reporting','Watch']];
const riskPts=[['Support ownership',4,5],['Training environment',3,4],['Migration timing',3,5],['Resource capacity',4,4],['Benefit baseline',2,3]];
const benefits=['Cycle time','Manual effort','Control quality','Reporting','Adoption'];
const target=[90,85,90,95,85];
const scenarios=[['Base','Current plan',[86,81,88,92,79],87,82,4],['Delayed migration','+4 weeks',[78,74,84,88,70],79,74,7],['Capacity uplift','Targeted readiness uplift',[91,88,91,95,89],91,89,2],['Scope change','Expanded scope',[82,78,86,90,75],82,77,6]];
function cls(s){return /on plan|on track|complete/i.test(s)?'good':/risk/i.test(s)?'bad':'warn'}
function badge(s){return `<span class="badge ${cls(s)}">${s}</span>`}
function bars(arr){return `<div class="bars">${arr.map(x=>`<div class="barrow"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}
function benefitsChart(vals){const w=650,h=235,pL=45,pR=16,pT=18,pB=38,max=100,plotW=w-pL-pR,plotH=h-pT-pB,slot=plotW/benefits.length;return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,25,50,75,100].map(v=>{const y=pT+(100-v)/100*plotH;return `<line class="gridline" x1="${pL}" y1="${y}" x2="${w-pR}" y2="${y}"/><text class="tick" x="7" y="${y+3}">${v}%</text>`}).join('')}<line class="axis" x1="${pL}" y1="${pT}" x2="${pL}" y2="${h-pB}"/><line class="axis" x1="${pL}" y1="${h-pB}" x2="${w-pR}" y2="${h-pB}"/>${benefits.map((b,i)=>{const x=pL+i*slot+slot*.16,bw=slot*.26,vh=vals[i]/max*plotH,th=target[i]/max*plotH;return `<rect x="${x}" y="${h-pB-vh}" width="${bw}" height="${vh}" rx="3" fill="var(--accent)"/><rect x="${x+slot*.31}" y="${h-pB-th}" width="${bw}" height="${th}" rx="3" fill="var(--blue)" opacity=".5"/><text class="tick" x="${x}" y="${h-12}">${b}</text><text class="tick" x="${x+1}" y="${h-pB-vh-5}">${vals[i]}%</text>`}).join('')}<text class="tick" x="${pL+5}" y="12">Benefit realisation (% of target)</text></svg>`}
function riskMatrix(){const w=650,h=235,pL=48,pR=20,pT=22,pB=38,plotW=w-pL-pR,plotH=h-pT-pB;return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[1,2,3,4,5].map(v=>{const x=pL+(v-1)/4*plotW,y=pT+(5-v)/4*plotH;return `<line class="gridline" x1="${x}" y1="${pT}" x2="${x}" y2="${h-pB}"/><line class="gridline" x1="${pL}" y1="${y}" x2="${w-pR}" y2="${y}"/><text class="tick" x="${x-2}" y="${h-12}">${v}</text><text class="tick" x="24" y="${y+3}">${v}</text>`}).join('')}<line class="axis" x1="${pL}" y1="${h-pB}" x2="${w-pR}" y2="${h-pB}"/><line class="axis" x1="${pL}" y1="${pT}" x2="${pL}" y2="${h-pB}"/>${riskPts.map((r,i)=>{const x=pL+(r[1]-1)/4*plotW,y=pT+(5-r[2])/4*plotH;return `<circle cx="${x}" cy="${y}" r="7" fill="${r[1]>=4&&r[2]>=4?'var(--red)':r[2]>=4?'var(--gold)':'var(--accent)'}"/><text class="tick" x="${x+10}" y="${y-6}">${r[0]}</text>`}).join('')}<text class="tick" x="290" y="230">Likelihood (1 low → 5 high)</text><text class="tick" x="5" y="14">Impact</text></svg>`}
function head(){return `<div class="head"><div><h2>${V[view][1]}</h2><p>${V[view][2]}</p></div></div>`}
function overview(){return head()+`<div class="grid kpis"><div class="card"><div class="eyebrow">Workstreams on plan</div><div class="value">8 / 10</div><div class="sub">2 require intervention</div></div><div class="card"><div class="eyebrow">Readiness index</div><div class="value">82%</div><div class="sub">training and ownership remain below threshold</div></div><div class="card"><div class="eyebrow">Critical dependencies</div><div class="value">4</div><div class="sub">14 open overall</div></div><div class="card"><div class="eyebrow">Forecast benefits</div><div class="value">87%</div><div class="sub">weighted realisation against target</div></div></div><div class="grid two"><div class="card"><div class="section-title"><div><h3>Portfolio health</h3><p>Current score by change dimension.</p></div></div>${bars(health)}</div><div class="decision"><div class="eyebrow">Decision focus</div><strong>Resolve support ownership and migration sequencing</strong><span>Both issues sit on the critical path to readiness and can delay the next gate.</span></div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><div><h3>Readiness below threshold</h3><p>80% is the working readiness threshold for gate review.</p></div></div>${bars(readiness)}</div><div class="card"><div class="section-title"><div><h3>Benefit realisation vs target</h3><p>Base scenario. Dark bars are forecast; light bars are target.</p></div></div>${benefitsChart(scenarios[0][2])}</div></div>`}
function workstreamView(){return head()+`<div class="card"><div class="section-title"><div><h3>Delivery scorecard</h3><p>Progress and next decision by workstream.</p></div></div><div class="table"><table><thead><tr><th>Workstream</th><th>Progress</th><th>Status</th><th>Next decision</th></tr></thead><tbody>${workstreams.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div>`}
function readinessView(){return head()+`<div class="grid twoeq"><div class="card"><div class="section-title"><div><h3>Readiness by dimension</h3><p>Current percentage against the 80% gate threshold.</p></div></div>${bars(readiness)}</div><div class="card"><div class="section-title"><div><h3>Impact by team</h3><p>Illustrative change intensity by dimension.</p></div></div><div class="heat"><div></div>${['Process','System','Role','Training'].map(x=>`<div class="hh">${x}</div>`).join('')}<div class="hl">Operations</div><div class="hc mid">82</div><div class="hc hi">88</div><div class="hc mid">76</div><div class="hc lo">71</div><div class="hl">Finance</div><div class="hc hi">91</div><div class="hc hi">86</div><div class="hc hi">88</div><div class="hc hi">83</div><div class="hl">Risk</div><div class="hc hi">87</div><div class="hc hi">84</div><div class="hc hi">91</div><div class="hc hi">86</div><div class="hl">Technology</div><div class="hc lo">74</div><div class="hc lo">68</div><div class="hc mid">81</div><div class="hc lo">72</div></div></div></div>`}
function dependencyView(){return head()+`<div class="grid two"><div class="card"><div class="section-title"><div><h3>Risk matrix</h3><p>Likelihood and impact scored 1–5.</p></div></div>${riskMatrix()}</div><div class="card"><div class="section-title"><div><h3>Critical path</h3><p>Sequence most exposed to delay.</p></div></div><div class="flow"><div class="node"><b>Migration</b><span>Stable data available</span></div><div class="arrow">→</div><div class="node"><b>Training</b><span>Final process reflected</span></div><div class="arrow">→</div><div class="node"><b>Readiness gate</b><span>Ownership and controls ready</span></div><div class="arrow">→</div><div class="node"><b>Go-live</b><span>Critical gaps closed</span></div></div></div></div><div class="card" style="margin-top:10px"><div class="table"><table><thead><tr><th>Item</th><th>Type</th><th>Impact</th><th>Status</th></tr></thead><tbody>${deps.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join('')}</tbody></table></div></div>`}
function benefitsView(){const s=scenarios[scenario];return head()+`<div class="scenario-row">${scenarios.map((x,i)=>`<button class="scenario ${i===scenario?'active':''}" onclick="scenario=${i};render()"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><div class="grid kpis"><div class="card"><div class="eyebrow">Weighted benefit realisation</div><div class="value">${s[3]}%</div><div class="sub">forecast against approved targets</div></div><div class="card"><div class="eyebrow">Adoption readiness</div><div class="value">${s[4]}%</div><div class="sub">selected scenario</div></div><div class="card"><div class="eyebrow">Critical gaps</div><div class="value">${s[5]}</div><div class="sub">items requiring closure</div></div><div class="card"><div class="eyebrow">Scenario</div><div class="value">${s[0]}</div><div class="sub">${s[1]}</div></div></div><div class="card"><div class="section-title"><div><h3>Forecast benefit realisation vs target</h3><p>Percent of approved target by outcome area. Dark bars are forecast; light bars are target.</p></div></div>${benefitsChart(s[2])}<div class="mini"><div><b>${s[2][0]}%</b><span>cycle-time target realisation</span></div><div><b>${s[2][3]}%</b><span>reporting target realisation</span></div><div><b>${s[2][4]}%</b><span>adoption target realisation</span></div></div></div>`}
function governanceView(){return head()+`<div class="grid twoeq"><div class="card"><div class="section-title"><div><h3>Decision lineage</h3><p>From signal to accountable action.</p></div></div><div class="flow"><div class="node"><b>Signal</b><span>Measure or exception</span></div><div class="arrow">→</div><div class="node"><b>Evidence</b><span>Source, rule and validation</span></div><div class="arrow">→</div><div class="node"><b>Options</b><span>Trade-offs and constraints</span></div><div class="arrow">→</div><div class="node"><b>Decision</b><span>Owner and action</span></div></div></div><div class="card"><div class="section-title"><div><h3>Governance controls</h3><p>Current position by control.</p></div></div>${bars([['Measure definitions',93],['Source assurance',96],['Readiness evidence',84],['Benefit baselines',81],['Action closure',78]])}</div></div>`}
const renders=[overview,workstreamView,readinessView,dependencyView,benefitsView,governanceView];
function nav(){side.innerHTML=`<div class="side-title">Views</div>`+V.map((x,i)=>`<button class="nav ${i===view?'active':''}" onclick="view=${i};render()"><span class="num">0${i}</span><span class="label">${x[0]}</span></button>`).join('')}
function render(){main.innerHTML=renders[view]();nav()}render();
</script></body></html>
