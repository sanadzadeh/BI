<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporting Portfolio & Insights Governance — Khaled Sanad</title>
<meta name="description" content="Illustrative reporting portfolio showing usage, governance, quality, rationalisation and decision support across a complex reporting ecosystem.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f6;--card:#fff;--soft:#f8fafb;--line:#dbe3e7;--ink:#18232c;--muted:#667580;--muted2:#87949d;--accent:#0b5d6b;--accent2:#4d8790;--accentSoft:#e6f1f2;--blue:#557d98;--gold:#b48946;--green:#477f55;--red:#a94d41;--shadow:0 2px 10px rgba(30,45,55,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue))}.brand h1{margin:0;font:600 1.04rem var(--serif)}.brand span{display:block;margin-top:2px;font:.46rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}.demo{font:.47rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accentSoft);padding:5px 7px;border-radius:999px}.app{display:grid;grid-template-columns:210px 1fr}.side{height:calc(100vh - 58px);position:sticky;top:58px;background:var(--card);border-right:1px solid var(--line);padding:13px 9px;overflow:auto}.side-title{font:.46rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:0 8px 7px}.nav{width:100%;border:0;border-left:3px solid transparent;background:transparent;border-radius:7px;padding:8px;text-align:left;color:var(--muted);display:grid;grid-template-columns:24px 1fr;gap:5px;cursor:pointer;margin:2px 0}.nav.active{background:var(--accentSoft);border-left-color:var(--accent);color:var(--accent)}.num{font:.49rem var(--mono);color:var(--muted2)}.label{font-size:.68rem;font-weight:600}.meta{margin-top:14px;border-top:1px solid var(--line);padding:10px 8px;font-size:.5rem;line-height:1.45;color:var(--muted2)}.main{padding:18px 22px 36px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:11px}.head h2{font:600 1.34rem var(--serif);margin:0}.head p{margin:4px 0 0;color:var(--muted);font-size:.62rem;max-width:840px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(5,1fr);margin-bottom:10px}.two{grid-template-columns:1.25fr .75fr}.twoeq{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow);min-width:0}.eyebrow{font:.45rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}.value{font:600 1.36rem var(--serif)}.sub{margin-top:3px;font-size:.53rem;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.section-title h3{font-size:.71rem;margin:0}.section-title p{margin:3px 0 0;font-size:.5rem;color:var(--muted2)}.bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:135px 1fr 44px;gap:7px;align-items:center}.barrow label{font-size:.55rem;color:var(--muted)}.track{height:8px;border-radius:99px;background:#edf1f3;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.score{text-align:right;font:.5rem var(--mono);color:var(--muted)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--card),var(--soft));border-radius:10px;padding:12px}.decision strong{display:block;font:600 .9rem var(--serif);margin-bottom:4px}.decision span{font-size:.54rem;color:var(--muted);line-height:1.42}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:.55rem;text-align:left}th{font:.45rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);background:var(--soft)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.49rem;font-weight:700}.good{background:#e7f2e9;color:var(--green)}.warn{background:#fbf0db;color:#956c15}.bad{background:#f8e7e4;color:var(--red)}.heat{display:grid;grid-template-columns:120px repeat(4,1fr);gap:5px;align-items:center}.hh{font:.43rem var(--mono);text-transform:uppercase;color:var(--muted2);text-align:center}.hl{font-size:.53rem;color:var(--muted)}.hc{height:30px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.48rem var(--mono)}.hi{background:var(--green)}.mid{background:var(--gold)}.lo{background:var(--red)}.flow{display:flex;align-items:center;gap:6px;overflow:auto}.node{min-width:145px;flex:1;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:9px}.node b{display:block;font-size:.56rem}.node span{display:block;margin-top:3px;font-size:.48rem;color:var(--muted);line-height:1.3}.arrow{color:var(--muted2)}.portfolio{display:grid;gap:7px}.asset{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr .8fr;gap:7px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-size:.54rem}.asset b{font-size:.57rem}.meter{height:7px;border-radius:99px;background:#e9eef1;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px}.togglebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.toggle{border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:6px 9px;border-radius:999px;font-size:.52rem;cursor:pointer}.toggle.active{background:var(--accentSoft);border-color:#9fc5ca;color:var(--accent)}.big-number{font:600 2.2rem var(--serif);line-height:1}.callout{padding:10px;border-radius:8px;background:var(--accentSoft);border:1px solid #c5dde0;font-size:.55rem;line-height:1.45;color:var(--ink)}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.two,.twoeq{grid-template-columns:1fr}}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side-title,.meta{display:none}.nav{width:auto;white-space:nowrap}.kpis{grid-template-columns:1fr 1fr}.main{padding:14px}}@media(max-width:580px){.kpis{grid-template-columns:1fr}.top{position:static}.asset{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header class="top"><div class="brand"><div class="mark"></div><div><h1>Khaled S. — Reporting Portfolio & Insights Governance</h1><span>portfolio strategy · usage · quality · rationalisation · decision support</span></div></div><div class="demo">Illustrative data</div></header>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[
['Overview','Executive overview','A portfolio-level view of reporting value, usage, quality and rationalisation priorities.'],
['Portfolio','Reporting portfolio','Inventory of reporting products with usage, owner, quality and action.'],
['Usage','Usage & value','Evidence for keeping, redesigning, consolidating or retiring reporting products.'],
['Governance','Governance framework','A simple operating model for intake, standards, ownership, review and retirement.'],
['Quality','Data quality','Quality and confidence signals that determine whether reporting can be trusted.'],
['Rationalise','Rationalisation','Scenario view of the effect of consolidating low-value or duplicated assets.']
];
let view=0,scenario='Recommended';
const assets=[
['Executive Performance Pack','Executive','High',94,92,'Retain'],
['Faculty Performance Dashboard','Performance','High',88,89,'Retain'],
['Load Forecast Dashboard','Forecasting','High',91,95,'Retain'],
['Student Pipeline Monitor','Planning','Medium',74,86,'Redesign'],
['Operational KPI Pack','Operations','Medium',68,84,'Consolidate'],
['Monthly Variance Dashboard','Finance','Medium',59,83,'Consolidate'],
['Legacy Faculty Pack A','Performance','Low',22,71,'Retire'],
['Legacy Faculty Pack B','Performance','Low',18,69,'Retire'],
['Societal Impact Summary','Impact','Medium',72,80,'Redesign'],
['Ad-hoc Metrics Workbook','Mixed','Low',15,61,'Retire']
];
const quality=[['Metric definitions',91],['Source reconciliation',88],['Refresh reliability',94],['Ownership clarity',79],['Accessibility checks',76],['Usage evidence',71]];
const useBands=[['High-use assets',31],['Medium-use assets',19],['Low-use assets',14]];
const scenarios={
'Current':[64,14,11,74,100],
'Recommended':[48,5,3,86,78],
'Aggressive':[39,2,1,90,62]
};
function nav(){return V.map((x,i)=>`<button class="nav ${i===view?'active':''}" onclick="view=${i};render()"><span class="num">0${i+1}</span><span class="label">${x[0]}</span></button>`).join('')+`<div class="meta">Illustrative portfolio example using fictional data. The example demonstrates governance, usage analysis, quality controls and reporting rationalisation. It does not represent any organisation's reporting estate.</div>`}
function head(){return `<div class="head"><div><h2>${V[view][1]}</h2><p>${V[view][2]}</p></div></div>`}
function badge(s){const c=/retire/i.test(s)?'bad':/redesign|consolidate/i.test(s)?'warn':'good';return `<span class="badge ${c}">${s}</span>`}
function bars(arr){return `<div class="bars">${arr.map(x=>`<div class="barrow"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`}
function overview(){return head()+`<div class="grid kpis">
<div class="card"><div class="eyebrow">Reporting assets</div><div class="value">64</div><div class="sub">across core reporting domains</div></div>
<div class="card"><div class="eyebrow">Low-use assets</div><div class="value">14</div><div class="sub">priority review population</div></div>
<div class="card"><div class="eyebrow">Likely duplicates</div><div class="value">11</div><div class="sub">overlapping purpose or measures</div></div>
<div class="card"><div class="eyebrow">Quality confidence</div><div class="value">84%</div><div class="sub">weighted control position</div></div>
<div class="card"><div class="eyebrow">Potential effort reduction</div><div class="value">22%</div><div class="sub">under recommended rationalisation</div></div>
</div><div class="grid two"><div class="card"><div class="section-title"><div><h3>Reporting health</h3><p>Portfolio-level control and usefulness indicators.</p></div></div>${bars([['Purpose clarity',87],['Data integrity',89],['Usage evidence',71],['Accessibility',76],['Ownership',79]])}</div><div class="decision"><div class="eyebrow">Decision focus</div><strong>Retire or consolidate low-use products before creating new ones</strong><span>The portfolio has enough overlap that adding another dashboard without first testing existing products would increase maintenance effort and dashboard fatigue.</span></div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><div><h3>Usage distribution</h3><p>Assets grouped by observed use.</p></div></div>${bars([['High use',86],['Medium use',53],['Low use',31]])}</div><div class="card"><div class="section-title"><div><h3>Governance principle</h3><p>Every reporting product needs an explicit purpose, owner and review path.</p></div></div><div class="flow"><div class="node"><b>Need</b><span>Decision or obligation</span></div><div class="arrow">→</div><div class="node"><b>Asset</b><span>Reusable product</span></div><div class="arrow">→</div><div class="node"><b>Evidence</b><span>Usage and quality</span></div><div class="arrow">→</div><div class="node"><b>Review</b><span>Retain, redesign or retire</span></div></div></div></div>`}
function portfolio(){return head()+`<div class="card"><div class="section-title"><div><h3>Reporting asset register</h3><p>Illustrative review of purpose, usage, quality and lifecycle action.</p></div></div><div class="table"><table><thead><tr><th>Asset</th><th>Domain</th><th>Usage</th><th>Quality</th><th>Usability</th><th>Action</th></tr></thead><tbody>${assets.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}%</td><td>${r[4]}%</td><td>${badge(r[5])}</td></tr>`).join('')}</tbody></table></div></div>`}
function usage(){return head()+`<div class="grid twoeq"><div class="card"><div class="section-title"><div><h3>Usage evidence</h3><p>Usage alone does not decide value, but it is a necessary signal.</p></div></div>${bars([['Weekly active use',82],['Executive use',74],['Repeat users',78],['Low/no use',22],['Duplicate requests',17]])}</div><div class="card"><div class="section-title"><div><h3>Value test</h3><p>Questions applied before investment in a reporting asset.</p></div></div><div class="portfolio"><div class="callout"><b>Decision served:</b> What decision or statutory obligation does this product support?</div><div class="callout"><b>Existing coverage:</b> Is the need already met by another report or dashboard?</div><div class="callout"><b>Evidence of use:</b> Who uses it, how often and for what action?</div><div class="callout"><b>Cost to maintain:</b> Does the ongoing effort remain justified by value?</div></div></div></div><div class="card" style="margin-top:10px"><div class="section-title"><div><h3>Asset-level usage examples</h3><p>Combining usage with quality and lifecycle action.</p></div></div><div class="portfolio">${assets.slice(0,6).map(r=>`<div class="asset"><b>${r[0]}</b><span>${r[2]} use</span><div class="meter"><i style="width:${r[3]}%"></i></div><span>${r[3]}% quality</span>${badge(r[5])}</div>`).join('')}</div></div>`}
function governance(){return head()+`<div class="grid twoeq"><div class="card"><div class="section-title"><div><h3>Reporting lifecycle</h3><p>Governance from request to retirement.</p></div></div><div class="flow"><div class="node"><b>Intake</b><span>Define decision, audience and urgency</span></div><div class="arrow">→</div><div class="node"><b>Assess</b><span>Check existing coverage and value</span></div><div class="arrow">→</div><div class="node"><b>Build</b><span>Apply standards and controls</span></div><div class="arrow">→</div><div class="node"><b>Review</b><span>Usage, quality and ongoing need</span></div><div class="arrow">→</div><div class="node"><b>Retire</b><span>Archive with agreed replacement</span></div></div></div><div class="card"><div class="section-title"><div><h3>Minimum standards</h3><p>Controls applied consistently across the estate.</p></div></div>${bars([['Named owner',92],['Metric definition',95],['Source lineage',88],['Accessibility',76],['Usage review',71],['Retirement path',68]])}</div></div><div class="card" style="margin-top:10px"><div class="table"><table><thead><tr><th>Control</th><th>Purpose</th><th>Evidence</th><th>Review trigger</th></tr></thead><tbody>
<tr><td>Product owner</td><td>Accountable business purpose</td><td>Named owner and audience</td><td>Ownership change</td></tr>
<tr><td>Metric catalogue</td><td>Consistent definitions</td><td>Approved definitions and logic</td><td>Measure change</td></tr>
<tr><td>Source assurance</td><td>Trusted data</td><td>Reconciliation and lineage</td><td>Source or logic change</td></tr>
<tr><td>Accessibility</td><td>Usable outputs</td><td>Visual and interaction checks</td><td>Material redesign</td></tr>
<tr><td>Usage review</td><td>Evidence of value</td><td>Usage and stakeholder feedback</td><td>Quarterly review</td></tr>
</tbody></table></div></div>`}
function qualityView(){return head()+`<div class="grid two"><div class="card"><div class="section-title"><div><h3>Quality controls</h3><p>Confidence in reporting depends on both data and operating discipline.</p></div></div>${bars(quality)}</div><div class="decision"><div class="eyebrow">Quality rule</div><strong>A polished dashboard cannot compensate for unclear definitions or unreconciled source data</strong><span>Before visual redesign, resolve definition, ownership and source issues that can materially alter the interpretation of performance.</span></div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><div><h3>Quality by reporting domain</h3><p>Illustrative control scores.</p></div></div><div class="heat"><div></div><div class="hh">Definitions</div><div class="hh">Source</div><div class="hh">Refresh</div><div class="hh">Access</div><div class="hl">Planning</div><div class="hc hi">93</div><div class="hc hi">91</div><div class="hc hi">95</div><div class="hc mid">79</div><div class="hl">Performance</div><div class="hc hi">90</div><div class="hc hi">88</div><div class="hc hi">92</div><div class="hc mid">76</div><div class="hl">Forecasting</div><div class="hc hi">95</div><div class="hc hi">94</div><div class="hc hi">96</div><div class="hc hi">84</div><div class="hl">Impact</div><div class="hc mid">81</div><div class="hc mid">78</div><div class="hc hi">88</div><div class="hc mid">73</div></div></div><div class="card"><div class="section-title"><div><h3>Exception handling</h3><p>What happens before a number reaches a senior forum.</p></div></div><div class="flow"><div class="node"><b>Exception</b><span>Unexpected movement</span></div><div class="arrow">→</div><div class="node"><b>Investigate</b><span>Timing, definition, source or true movement</span></div><div class="arrow">→</div><div class="node"><b>Validate</b><span>Reconcile and document</span></div><div class="arrow">→</div><div class="node"><b>Explain</b><span>What changed and why</span></div></div></div></div>`}
function rationalise(){const s=scenarios[scenario];return head()+`<div class="togglebar">${Object.keys(scenarios).map(k=>`<button class="toggle ${k===scenario?'active':''}" onclick="scenario='${k}';render()">${k}</button>`).join('')}</div><div class="grid kpis"><div class="card"><div class="eyebrow">Assets retained</div><div class="value">${s[0]}</div><div class="sub">from a current estate of 64</div></div><div class="card"><div class="eyebrow">Low-use retained</div><div class="value">${s[1]}</div><div class="sub">after review</div></div><div class="card"><div class="eyebrow">Duplicates retained</div><div class="value">${s[2]}</div><div class="sub">after consolidation</div></div><div class="card"><div class="eyebrow">Average quality</div><div class="value">${s[3]}%</div><div class="sub">portfolio confidence</div></div><div class="card"><div class="eyebrow">Maintenance effort</div><div class="value">${s[4]}%</div><div class="sub">relative to current baseline</div></div></div><div class="grid two"><div class="card"><div class="section-title"><div><h3>Scenario comparison</h3><p>The recommended scenario removes duplication while retaining enough coverage to avoid excessive change risk.</p></div></div>${bars([['Asset reduction',Math.round((64-s[0])/64*100)],['Duplicate reduction',Math.round((11-s[2])/11*100)],['Low-use reduction',Math.round((14-s[1])/14*100)],['Quality uplift',s[3]] )}</div><div class="decision"><div class="eyebrow">Recommendation</div><strong>${scenario==='Current'?'Current state requires rationalisation':scenario==='Aggressive'?'Aggressive retirement produces more effort savings but higher change risk':'Recommended: consolidate first, then retire products with weak evidence of use'}</strong><span>${scenario==='Recommended'?'The scenario reduces the estate from 64 to 48 assets and lowers estimated maintenance effort to 78% of current baseline while improving average portfolio quality.':'Use the scenario to test how far rationalisation should go before service or stakeholder disruption outweighs the maintenance benefit.'}</span></div></div>`}
function render(){document.getElementById('side').innerHTML='<div class="side-title">Reporting portfolio</div>'+nav();document.getElementById('main').innerHTML=[overview,portfolio,usage,governance,qualityView,rationalise][view]()}
render();
</script></body></html>
