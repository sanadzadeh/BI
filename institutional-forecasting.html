<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Institutional Forecasting & Scenario Planning — Khaled Sanad</title><style>
:root{--bg:#f3f5f6;--card:#fff;--line:#dbe3e7;--ink:#18232c;--muted:#667580;--accent:#0b5d6b;--blue:#557d98;--green:#477f55;--gold:#b48946;--red:#a94d41}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}h1{font-family:Georgia,serif;font-size:20px;margin:0}.tag{font-size:10px;color:var(--accent);background:#e6f1f2;padding:5px 7px;border-radius:99px}.app{display:grid;grid-template-columns:210px 1fr}.side{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 58px);padding:12px}.nav{width:100%;display:block;border:0;background:transparent;text-align:left;padding:9px;border-radius:7px;color:var(--muted);cursor:pointer}.nav.active{background:#e6f1f2;color:var(--accent);font-weight:700}.meta{font-size:10px;color:#87949d;border-top:1px solid var(--line);margin-top:14px;padding-top:10px;line-height:1.4}.main{padding:20px}.head h2{font:600 24px Georgia,serif;margin:0}.head p{font-size:12px;color:var(--muted)}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(5,1fr);margin:12px 0}.two{grid-template-columns:1.2fr .8fr}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.eye{font-size:10px;color:#87949d;text-transform:uppercase}.val{font:600 24px Georgia,serif;margin-top:4px}.sub{font-size:10px;color:var(--muted);margin-top:3px}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:7px;align-items:center;font-size:11px}.track{height:8px;background:#edf1f3;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px}.decision{border-left:4px solid var(--accent)}.decision strong{display:block;font:600 17px Georgia,serif;margin:5px 0 8px}.decision span{font-size:11px;color:var(--muted);line-height:1.45}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:8px;border-bottom:1px solid var(--line);font-size:11px;text-align:left}th{background:#f8fafb;color:#87949d}.scenario-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.scenario{border:1px solid var(--line);background:#f8fafb;padding:6px 9px;border-radius:99px;cursor:pointer;color:var(--muted)}.scenario.active{background:#e6f1f2;color:var(--accent);border-color:#9fc5ca}.flow{display:flex;gap:6px;align-items:center;overflow:auto}.node{min-width:145px;flex:1;background:#f8fafb;border:1px solid var(--line);padding:9px;border-radius:8px}.node b{font-size:11px}.node span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.arrow{color:#87949d}@media(max-width:900px){.app{grid-template-columns:1fr}.side{min-height:auto;display:flex;overflow:auto}.meta{display:none}.nav{white-space:nowrap}.kpis,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.two{grid-template-columns:1fr}}
</style></head><body><header><h1>Khaled S. — Institutional Forecasting & Scenario Planning</h1><span class="tag">Illustrative data</span></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><script>
const views=[['Overview','Forecast overview','Student-load style forecasting translated into planning, funding and capacity implications.'],['Assumptions','Planning assumptions','Demand, progression and planning assumptions kept explicit and reviewable.'],['Scenarios','Scenario analysis','How different demand and progression assumptions affect the forecast.'],['Uncertainty','Uncertainty & sensitivity','Which assumptions have the largest effect on the result.'],['Validation','Validation & QA','Controls that make the forecast transparent and defensible.'],['Advice','Executive advice','Turning model outputs into concise planning implications.']];let v=0,s=0;
const scenarios=[['Base',100,94,96,0],['Higher demand',106,95,97,2],['Lower progression',99,88,95,-4],['Constrained capacity',102,93,89,-2]];
const bars=a=>'<div class="bars">'+a.map(x=>'<div class="bar"><span>'+x[0]+'</span><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><span>'+x[1]+'%</span></div>').join('')+'</div>';
const head=()=>'<div class="head"><h2>'+views[v][1]+'</h2><p>'+views[v][2]+'</p></div>';
function overview(){return head()+'<div class="grid kpis"><div class="card"><div class="eye">Forecast index</div><div class="val">100</div><div class="sub">base planning case</div></div><div class="card"><div class="eye">Forecast variance</div><div class="val">3.8%</div><div class="sub">current cycle</div></div><div class="card"><div class="eye">Assumption confidence</div><div class="val">86%</div></div><div class="card"><div class="eye">Scenarios tested</div><div class="val">4</div></div><div class="card"><div class="eye">Material sensitivities</div><div class="val">3</div></div></div><div class="grid two"><div class="card">'+bars([['Demand signal',92],['Progression assumption',86],['Capacity assumption',81],['Funding alignment',84],['Data confidence',89]])+'</div><div class="card decision"><div class="eye">Decision focus</div><strong>Progression assumptions create more downside risk than demand assumptions in the current cycle</strong><span>The model should therefore give senior stakeholders a clear view of how retention and progression changes affect load, funding and capacity.</span></div></div></div>'}
function assumptions(){return head()+'<div class="card table"><table><tr><th>Assumption</th><th>Base case</th><th>Source</th><th>Review point</th></tr><tr><td>New student demand</td><td>100 index</td><td>Applications / offers / acceptances</td><td>Each intake cycle</td></tr><tr><td>Progression</td><td>94%</td><td>Historical cohort behaviour</td><td>After results period</td></tr><tr><td>Completion</td><td>96%</td><td>Student outcomes</td><td>Annual</td></tr><tr><td>Capacity</td><td>100%</td><td>Faculty planning assumptions</td><td>Planning cycle</td></tr></table></div><div class="card decision"><strong>Assumptions are model inputs, not hidden facts</strong><span>Each major assumption should have a source, owner, review cycle and explanation of what changes if it moves.</span></div>'}
function scenariosView(){const x=scenarios[s];return head()+'<div class="scenario-row">'+scenarios.map((a,i)=>'<button class="scenario '+(i===s?'active':'')+'" onclick="s='+i+';render()">'+a[0]+'</button>').join('')+'</div><div class="grid kpis"><div class="card"><div class="eye">Demand index</div><div class="val">'+x[1]+'</div></div><div class="card"><div class="eye">Progression</div><div class="val">'+x[2]+'%</div></div><div class="card"><div class="eye">Capacity</div><div class="val">'+x[3]+'%</div></div><div class="card"><div class="eye">Forecast movement</div><div class="val">'+(x[4]>=0?'+':'')+x[4]+'%</div></div><div class="card"><div class="eye">Scenario</div><div class="val" style="font-size:17px">'+x[0]+'</div></div></div><div class="card">'+bars([['Enrolment effect',Math.min(100,x[1]-5)],['Progression effect',x[2]],['Capacity fit',x[3]],['Funding confidence',Math.max(60,88+x[4])]])+'</div>'}
function uncertainty(){return head()+'<div class="grid two"><div class="card">'+bars([['Progression rate',94],['New demand',86],['Completion timing',74],['Capacity',71],['Funding rule',63]])+'</div><div class="card decision"><strong>Show what could change the answer</strong><span>Sensitivity analysis is most useful when it identifies which assumptions materially alter the forecast and which do not.</span></div></div>'}
function validation(){return head()+'<div class="card"><div class="flow"><div class="node"><b>Source</b><span>Reconcile demand and student data</span></div><div class="arrow">→</div><div class="node"><b>Assumption</b><span>Document owner and rationale</span></div><div class="arrow">→</div><div class="node"><b>Model</b><span>Test formulas and edge cases</span></div><div class="arrow">→</div><div class="node"><b>Back-test</b><span>Compare prior forecast to actual</span></div><div class="arrow">→</div><div class="node"><b>Explain</b><span>Variance and confidence</span></div></div></div><div class="card" style="margin-top:10px">'+bars([['Source reconciliation',95],['Assumption traceability',91],['Back-testing',86],['Exception review',89],['Documentation',92]])+'</div>'}
function advice(){return head()+'<div class="card table"><table><tr><th>Finding</th><th>Implication</th><th>Advice</th></tr><tr><td>Demand remains above base assumption</td><td>Potential higher load</td><td>Retain upside scenario for funding and capacity planning</td></tr><tr><td>Progression is weaker in one cohort</td><td>Downside to continuing load</td><td>Separate cohort effect from institution-wide assumption</td></tr><tr><td>Capacity is tight in selected areas</td><td>Forecast may exceed practical delivery capacity</td><td>Use capacity-constrained scenario in planning</td></tr></table></div><div class="card decision"><strong>Executive advice starts with the implication, not the model</strong><span>Senior stakeholders should see the likely outcome, uncertainty, planning impact and what would change the recommendation.</span></div>'}
function render(){document.getElementById('side').innerHTML=views.map((x,i)=>'<button class="nav '+(i===v?'active':'')+'" onclick="v='+i+';render()">'+(i+1)+'. '+x[0]+'</button>').join('')+'<div class="meta">Illustrative forecasting example using fictional data. It does not represent any university or actual student, enrolment, funding or planning information.</div>';document.getElementById('main').innerHTML=[overview,assumptions,scenariosView,uncertainty,validation,advice][v]()}render();
</script></body></html>
