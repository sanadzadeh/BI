<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Commercial Performance & Procurement Analytics - Khaled Sanad</title>
<meta name="description" content="Illustrative procurement and commercial performance dashboard covering spend, supplier performance, contract compliance, savings and benefits realisation.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f6f7;--surface:#fff;--surface2:#f8fafb;--deep:#e9eef1;--border:#d7e0e5;--ink:#17232c;--ink2:#56636e;--ink3:#7c8993;--accent:#365e78;--accent2:#6b8ca3;--accentdim:#e9f0f4;--ok:#4b7a55;--okdim:#eaf4ec;--warn:#a67615;--warndim:#fbf2df;--risk:#a84b43;--riskdim:#f8e8e6;--shadow:0 6px 20px rgba(30,45,55,.08);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:11px 20px}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--accent2));position:relative}.mark:before,.mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:3px}.mark:before{top:11px}.mark:after{top:20px}.brand h1{margin:0;font:600 1.08rem/1 var(--serif)}.brand p{margin:4px 0 0;font:400 .51rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.app{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:calc(100vh - 57px)}.side{background:var(--surface);border-right:1px solid var(--border);padding:14px 9px}.side-title{font:400 .49rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);padding:0 9px 9px}.nav{width:100%;display:grid;grid-template-columns:25px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink2);padding:9px;border-radius:7px;margin:2px 0;cursor:pointer}.nav:hover{background:var(--surface2);color:var(--ink)}.nav.active{background:var(--accentdim);border-left-color:var(--accent);color:var(--accent)}.num{font:400 .52rem/1.2 var(--mono);color:var(--ink3)}.label{font-size:.7rem;font-weight:600}.meta{margin-top:18px;padding:10px 9px;border-top:1px solid var(--border);font-size:.58rem;line-height:1.5;color:var(--ink2)}.main{padding:20px 24px 44px;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:14px}.head h2{margin:0 0 5px;font:600 1.42rem/1 var(--serif)}.head p{margin:0;max-width:840px;color:var(--ink2);font-size:.68rem;line-height:1.45}.pill{font:400 .49rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accentdim);border:1px solid var(--border);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:13px;min-width:0}.eyebrow{font:500 .48rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:8px}.kpi-value{font:600 1.34rem/.95 var(--serif)}.kpi-sub{font-size:.58rem;color:var(--ink2);line-height:1.35;margin-top:5px}.kicon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accentdim);color:var(--accent);font:500 .53rem/1 var(--mono)}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:9px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink3);margin:3px 0 0}.metric-stack{display:grid;gap:9px}.metric{display:grid;grid-template-columns:125px 1fr 45px;gap:8px;align-items:center}.metric label{font-size:.59rem;color:var(--ink2)}.track{height:7px;border-radius:999px;background:var(--deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.score{text-align:right;font:400 .54rem/1 var(--mono);color:var(--ink2)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:var(--surface2)}tbody tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.55rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--okdim)}.warn{color:var(--warn);background:var(--warndim)}.bad{color:var(--risk);background:var(--riskdim)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface2));border-radius:11px;padding:13px;box-shadow:var(--shadow)}.decision h3{font:600 .96rem/1.15 var(--serif);margin:0 0 6px}.decision p{font-size:.59rem;line-height:1.48;color:var(--ink2);margin:0}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:145px;flex:1;padding:10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border)}.node.active{background:var(--accentdim);border-color:var(--accent)}.nt{font:400 .47rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}.nb{font-size:.57rem;line-height:1.4;color:var(--ink2)}.arrow{align-self:center;color:var(--ink3)}.scenario-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface2);color:var(--ink2);border-radius:7px;padding:8px;text-align:left;font-size:.58rem;cursor:pointer}.scenario.active{background:var(--accentdim);border-color:var(--accent);color:var(--accent)}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink3);font-size:.51rem;line-height:1.3}
@media(max-width:1100px){.kpis,.scenario-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenario-grid{grid-template-columns:1fr}.header{position:static}}
</style>
</head>
<body>
<header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. - Commercial Performance Analytics</h1><p>spend · suppliers · contracts · savings · benefits</p></div></div><span class="pill">Illustrative data</span></header>
<div class="app"><nav class="side" id="side"></nav><main class="main" id="main"></main></div>
<script>
const V=[
['Executive overview','Commercial performance overview','A decision-oriented view of spend, supplier performance, contract compliance and realised value.'],
['Spend & categories','Spend and category analysis','Identify concentration, movement and opportunities across major spend categories.'],
['Suppliers','Supplier performance','Compare supplier service, pricing, delivery and risk indicators against agreed expectations.'],
['Contracts','Contract compliance and value','Track compliance, price movement, savings actions and benefit realisation.'],
['Scenarios','Commercial scenarios','Test how sourcing, pricing and demand changes affect expected value.']
];
const kpis=[['Addressable spend','$184m','Selected annual spend','SP'],['Tracked savings','$12.8m','Current initiatives','SV'],['Contract compliance','91%','Spend under agreed terms','CC'],['Benefits realised','84%','Against current plan','BR']];
const categories=[['Clinical supplies',78],['Facilities & services',63],['Technology',52],['Corporate services',46],['Logistics',39]];
const suppliers=[['Supplier A','Clinical supplies','96%','On track','$42m'],['Supplier B','Facilities','88%','Review','$31m'],['Supplier C','Technology','93%','On track','$27m'],['Supplier D','Corporate services','81%','Review','$19m'],['Supplier E','Logistics','97%','On track','$14m']];
const contracts=[['Category 01','92%','$3.2m','88%','On track'],['Category 02','84%','$2.4m','79%','Review'],['Category 03','95%','$1.8m','91%','On track'],['Category 04','87%','$1.3m','82%','Review']];
const scenarios=[
['Base','Current pricing, demand and supplier mix.','Maintain','Continue current initiatives and monitor realised value.'],
['Re-tender','Competitive sourcing across selected categories.','Test market','Compare price, service, switching cost and implementation risk.'],
['Volume shift','Demand increases in major categories.','Reforecast','Reassess pricing tiers, supplier capacity and expected savings.'],
['Supplier change','Primary supplier replaced or consolidated.','Rebalance','Model transition cost, service risk and benefit timing before decision.']
];
let state={view:0,scenario:0};
const badge=s=>'<span class="badge '+(/on track/i.test(s)?'good':/review/i.test(s)?'warn':'bad')+'">'+s+'</span>';
const bars=a=>'<div class="metric-stack">'+a.map(x=>'<div class="metric"><label>'+x[0]+'</label><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><div class="score">'+x[1]+'%</div></div>').join('')+'</div>';
function head(i,label='Illustrative demonstration'){return '<div class="head"><div><h2>'+V[i][1]+'</h2><p>'+V[i][2]+'</p></div><span class="pill">'+label+'</span></div>'}
function overview(){return head(0)+'<section class="grid kpis">'+kpis.map(x=>'<div class="card"><div class="kpi"><div><div class="eyebrow">'+x[0]+'</div><div class="kpi-value">'+x[1]+'</div><div class="kpi-sub">'+x[2]+'</div></div><div class="kicon">'+x[3]+'</div></div></div>').join('')+'</section><section class="grid two" style="margin-bottom:10px"><div class="card"><div class="chart-title"><div><h3>Category opportunity view</h3><p>Relative concentration and improvement potential.</p></div></div>'+bars(categories)+'</div><div class="decision"><div class="eyebrow">Decision focus</div><h3>Connect spend and performance data to a commercial action</h3><p>Use supplier, contract and category evidence to decide whether the next step is renegotiation, sourcing, demand management, process change or continued monitoring.</p></div></section><section class="card"><div class="chart-title"><div><h3>Supplier scorecard</h3><p>Illustrative service and commercial position.</p></div></div><div class="table-wrap"><table><thead><tr><th>Supplier</th><th>Category</th><th>KPI score</th><th>Status</th><th>Spend</th></tr></thead><tbody>'+suppliers.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+badge(r[3])+'</td><td>'+r[4]+'</td></tr>').join('')+'</tbody></table></div></section>'}
function spend(){return head(1,'Spend analysis')+'<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Spend concentration</h3><p>Relative share across selected categories.</p></div></div>'+bars(categories)+'</div><div class="card"><div class="chart-title"><div><h3>Analysis pathway</h3><p>From data to sourcing or performance action.</p></div></div><div class="flow">'+[['Question','Where is value leaking?'],['Data','Spend, supplier, contract, price'],['Analyse','Trend, variance, compliance'],['Compare','Options and business case'],['Act','Source, renegotiate, improve']].map((x,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="node '+(i===0?'active':'')+'"><div class="nt">'+x[0]+'</div><div class="nb">'+x[1]+'</div></div>').join('')+'</div></div></section>'}
function supplier(){return head(2,'Supplier performance')+'<section class="card"><div class="chart-title"><div><h3>Supplier performance table</h3><p>Commercial and service view against agreed expectations.</p></div></div><div class="table-wrap"><table><thead><tr><th>Supplier</th><th>Category</th><th>KPI score</th><th>Status</th><th>Spend</th></tr></thead><tbody>'+suppliers.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+badge(r[3])+'</td><td>'+r[4]+'</td></tr>').join('')+'</tbody></table></div></section><section class="decision" style="margin-top:10px"><div class="eyebrow">Performance principle</div><h3>Supplier scorecards should show where action changes value</h3><p>Combine service, pricing, compliance and trend evidence so the discussion moves beyond reporting into renegotiation, remediation or sourcing decisions.</p></section>'}
function contract(){return head(3,'Contracts and benefits')+'<section class="card"><div class="chart-title"><div><h3>Contract compliance and benefit tracking</h3><p>Illustrative category position.</p></div></div><div class="table-wrap"><table><thead><tr><th>Category</th><th>Compliance</th><th>Savings plan</th><th>Benefits realised</th><th>Status</th></tr></thead><tbody>'+contracts.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+badge(r[4])+'</td></tr>').join('')+'</tbody></table></div></section><section class="grid two" style="margin-top:10px"><div class="decision"><div class="eyebrow">Benefit realisation</div><h3>Track the value after approval, not only at business-case stage</h3><p>Separate forecast savings from realised benefit and show timing, ownership, assumptions and evidence for each initiative.</p></div><div class="card"><div class="chart-title"><div><h3>Performance framework</h3><p>Selected measures.</p></div></div>'+bars([['Contract compliance',91],['Supplier KPI adherence',89],['Savings delivery',84],['Reporting completeness',96]])+'</div></section>'}
function scenario(){let s=scenarios[state.scenario];return head(4,'Scenario analysis')+'<div class="scenario-grid">'+scenarios.map((x,i)=>'<button class="scenario '+(i===state.scenario?'active':'')+'" data-sc="'+i+'"><strong>'+x[0]+'</strong><span>'+x[1]+'</span></button>').join('')+'</div><section class="grid two"><div class="decision"><div class="eyebrow">'+s[2]+'</div><h3>'+s[0]+'</h3><p>'+s[3]+'</p></div><div class="card"><div class="chart-title"><div><h3>Scenario logic</h3><p>Commercial decision structure.</p></div></div><div class="flow">'+[['Baseline','Current spend and terms'],['Change','Price, demand or supplier'],['Impact','Cost, service, risk'],['Options','Compare feasible responses'],['Decision','Recommend and track']].map((x,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="node '+(i===0?'active':'')+'"><div class="nt">'+x[0]+'</div><div class="nb">'+x[1]+'</div></div>').join('')+'</div></div></section>'}
const renderers=[overview,spend,supplier,contract,scenario];
function renderSide(){side.innerHTML='<div class="side-title">Portfolio views</div>'+V.map((v,i)=>'<button class="nav '+(i===state.view?'active':'')+'" data-view="'+i+'"><span class="num">0'+i+'</span><span class="label">'+v[0]+'</span></button>').join('')+'<div class="meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Standalone HTML</div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}
function render(){main.innerHTML=renderers[state.view]();renderSide();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.scenario=+b.dataset.sc;render()})}
render();
</script>
</body>
</html>
