<title>AML Systems & Data Analytics Portfolio - Khaled Sanad</title>
<meta name="description" content="Illustrative AML systems and data analytics portfolio covering transaction monitoring, screening, customer risk, scenario effectiveness and control assurance.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;--border:#d8e0e5;--border-2:#bcc8cf;--ink:#18232c;--ink-2:#55636f;--ink-3:#7b8893;--accent:#0b5d6b;--accent-dim:#e4f1f2;--accent-mid:#bddcde;--blue:#4a7897;--gold:#b58b48;--ok:#3f7a4c;--ok-dim:#e8f3eb;--warn:#a3720a;--warn-dim:#fbf1dc;--risk:#a23b2e;--risk-dim:#f8e8e5;--shadow:0 7px 22px rgba(34,48,58,.08);--shadow-sm:0 2px 8px rgba(34,48,58,.06);--radius:11px;--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono','Courier New',monospace}
:root[data-theme="dark"]{--paper:#11171c;--surface:#182027;--surface-alt:#1e2830;--surface-deep:#25313a;--border:#2f3b44;--border-2:#43525e;--ink:#edf2f4;--ink-2:#aab5be;--ink-3:#81909b;--accent:#61c5bf;--accent-dim:#173335;--accent-mid:#27585a;--blue:#7ba9c8;--gold:#c9a86d;--ok:#7fc98f;--ok-dim:#193425;--warn:#e0ad4c;--warn-dim:#3a2e15;--risk:#e08a7a;--risk-dim:#3c201d;--shadow:0 9px 26px rgba(0,0,0,.27);--shadow-sm:0 2px 10px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center;min-width:240px}.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative;box-shadow:var(--shadow-sm)}.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.brand-mark:before{top:11px}.brand-mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.select,.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}.theme-btn{display:flex;align-items:center;gap:7px;font-weight:600}.theme-orb{width:10px;height:10px;border-radius:50%;background:#e0a72f;box-shadow:0 0 0 4px rgba(224,167,47,.14)}:root[data-theme="dark"] .theme-orb{background:#8bc5ec;box-shadow:0 0 0 4px rgba(139,197,236,.12)}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}.side-title{font:400 .5rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink-2)}.main{min-width:0;padding:20px 24px 44px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:850px;color:var(--ink-2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:7px}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:500 .54rem/1 var(--mono)}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--ok-dim)}.warn{color:var(--warn);background:var(--warn-dim)}.bad{color:var(--risk);background:var(--risk-dim)}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--ink-2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}.chart{width:100%;height:205px;display:block}.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--ink-3);font:8px var(--mono)}.line-a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.metric-stack{display:grid;gap:8px}.metric-bar{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center}.metric-bar label{font-size:.59rem;color:var(--ink-2)}.track{height:7px;border-radius:999px;background:var(--surface-deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}.heatmap{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .48rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center}.heat-label{font-size:.59rem;color:var(--ink-2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:150px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl.warn .tl-dot{border-color:var(--warn)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:7px 8px;text-align:left;font-size:.58rem}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenarios{grid-template-columns:1fr}.header{position:static}}
</style>
</head>
<body>
<div class="shell"><header class="header"><div class="brand"><div class="brand-mark"></div><div><h1>Khaled S. - AML Systems & Data Analytics Portfolio</h1><p>monitoring · screening · customer risk · controls · analytics</p></div></div><div class="controls"><select class="select"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="select"><option>Enterprise view</option><option>Priority controls</option><option>Exception view</option></select><button class="theme-btn" id="themeBtn"><span class="theme-orb"></span><span id="themeText">Dark</span></button></div></header><div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div></div>
<script>
const CFG={views:[['Executive overview','AML control overview','A control-led view of transaction monitoring, screening, customer risk and data assurance.'],['Performance','Detection performance','Scenario, screening and control performance across the AML environment.'],['Data assurance','AML data assurance','Data-quality and validation controls supporting reliable financial crime detection.'],['Scenarios','Control scenarios','Operational scenarios for alert demand, data uplift and rule changes.'],['Governance','Control governance','Traceability from source data and scenario logic through to control action.']],kpis:[['Scenarios','38','Active detection scenarios','SC'],['Coverage','94%','Monitoring and screening coverage','CV'],['False positives','-12%','Quarter movement','FP'],['Data controls','97%','Validation controls passed','DQ']],health:[['TM coverage',94],['Screening quality',96],['Scenario effectiveness',87],['Data integrity',97],['Control evidence',92]],register:[['Scenario 14','Monitoring','Review','Tune threshold'],['Name match','Screening','On track','Maintain QA'],['Risk factors','Customer risk','Improving','Refresh weights'],['Source completeness','Data','On track','Monitor feed']],performance:[['Monitoring','Scenario coverage','94%','+4pp','On track'],['Screening','Screening quality','96%','+2pp','On track'],['Scenarios','Effectiveness','87%','Improving','Review'],['Data','Integrity','97%','+2pp','On track']],quality:[['Transactions',[98,96,95,96]],['Customer risk data',[94,93,89,92]],['Screening reference data',[91,92,87,90]],['Scenario actions',[93,94,88,91]]],flow:[['Control question','What risk or control outcome needs to be understood?'],['Data','Transactions, customers, screening and reference data.'],['Analysis','Scenario logic, threshold analysis and exception testing.'],['Assessment','Coverage, false positives, quality and control evidence.'],['Outcome','Tuning, remediation, monitoring or governance action.']],scenarios:[['Base','Current detection and control settings.','Maintain controlled tuning','Continue targeted tuning with validation before release.'],['Alert surge','Higher alert volumes and investigative demand.','Prioritise high-value detection','Protect coverage while reducing avoidable false positives.'],['Data uplift','Improved source completeness and entity quality.','Use quality gains to sharpen detection','Apply improved data to scenario precision and screening quality.'],['Rule change','Material threshold or rule change.','Stage change through assurance','Test impact, document evidence and monitor post-change outcomes.']],governance:[['Scenario governance','AML analytics','Scenario register','On track'],['Screening QA','Operations','QA evidence','On track'],['Data controls','Data owners','Validation log','On track'],['Tuning actions','Control owners','Action register','Review']]};
let state={view:0,scenario:0};
const badge=s=>`<span class="badge ${/on track|improving/i.test(s)?'good':/review|watch/i.test(s)?'warn':'bad'}">${s}</span>`;
function bars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="metric-score">${x[1]}%</div></div>`).join('')}</div>`}
function lineChart(a,b){let w=650,h=210,p=28,min=Math.min(...a,...b)-2,max=Math.max(...a,...b)+2,pts=s=>s.map((v,i)=>[p+i/(s.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),path=q=>'M '+q.map(x=>x.join(' ')).join(' L '),pa=pts(a),pb=pts(b);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-a" d="${path(pa)}"/><path class="line-b" d="${path(pb)}"/></svg>`}
function combo(){let r=[['Monitoring',90,94,4],['Screening',92,96,2],['Cust risk',84,89,3],['Scenarios',81,87,5],['Data',94,97,2],['Evidence',88,92,3]],w=650,h=210,pL=42,pR=24,pT=18,pB=28,slot=(w-pL-pR)/r.length,pts=[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join('')}${r.map((d,i)=>{let x=pL+i*slot+slot*.14,ah=d[1]/110*(h-pT-pB),bh=d[2]/110*(h-pT-pB);pts.push([pL+i*slot+slot*.42,pT+(7-d[3])/7*(h-pT-pB)]);return `<rect x="${x}" y="${h-pB-ah}" width="${slot*.25}" height="${ah}" rx="3" fill="var(--blue)" opacity=".78"/><rect x="${x+slot*.29}" y="${h-pB-bh}" width="${slot*.25}" height="${bh}" rx="3" fill="var(--gold)" opacity=".86"/><text class="tick" x="${x}" y="${h-8}">${d[0]}</text>`}).join('')}<path class="line-risk" d="M ${pts.map(x=>x.join(' ')).join(' L ')}"/></svg>`}
function head(i,label='Illustrative demonstration'){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[i][1]}</h2><p class="page-desc">${CFG.views[i][2]}</p></div><span class="demo">${label}</span></div>`}
function overview(){return head(0)+`<section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">${x[2]}</div></div><div class="kpi-icon">${x[3]}</div></div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>Detection coverage and exception view</h3><p>Baseline and current coverage with exception movement.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Baseline</span><span><i style="background:var(--gold)"></i>Current</span><span><i style="background:var(--risk)"></i>Exceptions</span></div></div>${combo()}</div><div class="card"><div class="chart-title"><div><h3>Control health</h3><p>Selected AML controls and analytical indicators.</p></div></div>${bars(CFG.health)}</div></section><section class="grid two"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Test whether systems, scenarios and source data produce the intended financial crime coverage</h3><p>Connect detection outcomes to scenario logic, data completeness and control evidence before tuning.</p></div><div class="card"><div class="chart-title"><div><h3>Priority register</h3><p>Current items requiring attention or confirmation.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function performance(){return head(1,'Performance view')+`<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Detection and control trend</h3><p>Illustrative movement across 12 reporting periods.</p></div></div>${lineChart([72,74,77,79,80,82,84,86,87,89,90,92],[76,78,80,82,83,85,87,89,90,92,93,95])}</div><div class="card"><div class="chart-title"><div><h3>Control coverage</h3><p>Relative position across major AML work areas.</p></div></div>${bars(CFG.health)}</div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Performance scorecard</h3><p>Selected measures and current position.</p></div></div><div class="table-wrap"><table><thead><tr><th>Domain</th><th>Primary measure</th><th>Current</th><th>Direction</th><th>Status</th></tr></thead><tbody>${CFG.performance.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${badge(r[4])}</td></tr>`).join('')}</tbody></table></div></section>`}
function assurance(){return head(2,'Assurance view')+`<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heatmap"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="heat-head">${x}</div>`).join('')}${CFG.quality.map(q=>`<div class="heat-label">${q[0]}</div>${q[1].map(v=>`<div class="heat-cell ${v>=90?'hi':v>=80?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Validation pathway</h3><p>From control question to trusted outcome.</p></div></div><div class="flow">${CFG.flow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div></section><section class="grid two" style="margin-top:10px"><div class="card"><div class="chart-title"><div><h3>Issue ageing</h3><p>Illustrative open control items.</p></div></div>${bars([['0-7 days',76],['8-30 days',49],['31-90 days',28],['>90 days',9]])}</div><div class="decision"><div class="eyebrow">Assurance principle</div><h3>Detection outcomes should remain traceable to scenario logic, source data and control evidence</h3><p>Effective AML analytics shows why an alert or coverage result changed, which data and rules drove it, and what action follows.</p></div></section>`}
function scenarios(){let s=CFG.scenarios[state.scenario];return head(3,'Scenario view')+`<div class="scenarios">${CFG.scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?'active':''}" data-sc="${i}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">Scenario view</div></div>`).join('')}</section><section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Control scenario trajectory</h3><p>Baseline compared with selected scenario.</p></div></div>${lineChart([74,77,79,82,84,86,88,90],[74,76,78,80,83,85,87,89].map((v,i)=>v+state.scenario*(i>3?1:0)))}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s[2]}</h3><p>${s[3]}</p></div></section>`}
function governance(){let timeline=[['good','Daily control monitoring','Material alert, screening and feed exceptions.'],['good','Weekly tuning review','Scenario performance, false positives and control actions.'],['warn','Change assurance gate','Material rule or threshold changes require documented testing.'],['good','Monthly control reset','Reassess coverage, effectiveness and open remediation.']];return head(4,'Governance view')+`<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Measure lineage</h3><p>Trace AML measures back to controlled source and logic.</p></div></div><div class="flow">${CFG.flow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Governance timeline</h3><p>Control and review rhythm.</p></div></div><div class="timeline">${timeline.map(x=>`<div class="tl ${x[0]}"><span class="tl-dot"></span><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div></div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Governance controls</h3><p>Ownership, evidence and next action.</p></div></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${CFG.governance.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join('')}</tbody></table></div></section>`}
const renderers=[overview,performance,assurance,scenarios,governance];function renderSidebar(){sidebar.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-view="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v[0]}</span></button>`).join('')}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Standalone HTML</div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}function render(){main.innerHTML=renderers[state.view]();renderSidebar();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.scenario=+b.dataset.sc;render()})}themeBtn.onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';themeText.textContent=d?'Dark':'Light'};render();
</script>
</body>
</html>
