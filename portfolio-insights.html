<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}body,.card,.header,.sidebar,.nav,.select,.theme-btn,.scenario,.heat-cell{transition:background-color .18s,color .18s,border-color .18s}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}button,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center;min-width:240px}.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative;box-shadow:var(--shadow-sm)}.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.brand-mark:before{top:11px}.brand-mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.select,.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}.theme-btn{display:flex;align-items:center;gap:7px;font-weight:600}.theme-orb{width:10px;height:10px;border-radius:50%;background:#e0a72f;box-shadow:0 0 0 4px rgba(224,167,47,.14)}:root[data-theme="dark"] .theme-orb{background:#8bc5ec;box-shadow:0 0 0 4px rgba(139,197,236,.12)}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}.side-title{font:400 .5rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink-2)}.main{min-width:0;padding:20px 24px 44px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:850px;color:var(--ink-2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:7px}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:500 .54rem/1 var(--mono)}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--ok-dim)}.warn{color:var(--warn);background:var(--warn-dim)}.bad{color:var(--risk);background:var(--risk-dim)}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--ink-2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}.chart{width:100%;height:205px;display:block;overflow:visible}.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--ink-3);font:8px var(--mono)}.line-a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.tooltip{position:fixed;z-index:1000;pointer-events:none;min-width:150px;max-width:260px;padding:8px 9px;border-radius:7px;background:var(--ink);color:var(--surface);font-size:.57rem;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none}.tooltip strong{display:block;margin-bottom:3px;font-size:.6rem}.hoverable{cursor:help}.metric-stack{display:grid;gap:8px}.metric-bar{display:grid;grid-template-columns:115px 1fr 44px;gap:8px;align-items:center}.metric-bar label{font-size:.59rem;color:var(--ink-2)}.track{height:7px;border-radius:999px;background:var(--surface-deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}.status-summary{display:flex;gap:12px;margin-top:8px;font-size:.58rem;color:var(--ink-2);flex-wrap:wrap}.status-summary span{display:flex;align-items:center;gap:5px}.status-summary i{width:7px;height:7px;border-radius:2px}.heatmap{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .48rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center}.heat-label{font-size:.59rem;color:var(--ink-2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl.warn .tl-dot{border-color:var(--warn)}.tl.bad .tl-dot{border-color:var(--risk)}.tl.good .tl-dot{border-color:var(--ok)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:6px 8px;font-size:.58rem;text-align:left}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.header{align-items:flex-start;flex-wrap:wrap}}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenarios{grid-template-columns:1fr}.header{position:static}}

<body>
<div class="shell"><header class="header"><div class="brand"><div class="brand-mark"></div><div><h1>Portfolio Insights</h1><p>performance · commercial intelligence · benefits · reporting assurance</p></div></div><div class="controls"><select class="select"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="select"><option>All portfolios</option><option>Priority portfolio</option><option>Exception view</option></select><button class="theme-btn" id="themeBtn"><span class="theme-orb"></span><span id="themeText">Dark</span></button></div></header><div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div></div><div class="tooltip" id="tooltip"></div>
<script>
const CFG={
views:[{nav:'Executive overview',title:'Portfolio overview',desc:'Performance, movements and current actions.'},{nav:'Performance',title:'Portfolio performance',desc:'Trend, mix and segment diagnostics.'},{nav:'Data assurance',title:'Reporting assurance',desc:'Quality, reconciliation and source controls.'},{nav:'Scenarios',title:'Commercial scenarios',desc:'Outcome sensitivity across selected assumptions.'},{nav:'Governance',title:'Governance & lineage',desc:'Measure lineage, review rhythm and action ownership.'}],
kpis:[{label:'Portfolio index',value:'104.6',sub:'+3.2 pts vs plan',icon:'PI'},{label:'Material exceptions',value:'6',sub:'2 require action',icon:'EX'},{label:'Benefit realised',value:'$4.8m',sub:'82% of YTD plan',icon:'BR'},{label:'Reporting confidence',value:'96%',sub:'Critical controls passed',icon:'QA'}],
seriesLabels:['Plan','Actual'],lineLabel:'Variance',primaryRows:[{label:'A',a:96,b:108,line:5},{label:'B',a:99,b:104,line:2},{label:'C',a:101,b:99,line:3},{label:'D',a:100,b:94,line:6},{label:'E',a:98,b:102,line:2},{label:'F',a:100,b:105,line:4}],
health:[{label:'Data completeness',value:97},{label:'Measure consistency',value:94},{label:'Benefit traceability',value:86},{label:'Pack readiness',value:93},{label:'Action closure',value:88}],
register:[{item:'Portfolio D decline',area:'Performance',status:'Review',action:'Driver deep-dive'},{item:'Benefit baseline',area:'Benefits',status:'Watch',action:'Resolve definition'},{item:'Client pack C',area:'Reporting',status:'Watch',action:'Final commentary'},{item:'Source key mismatch',area:'Data',status:'On track',action:'Close 3 records'}],
trendA:[96,97,98,99,100,100,101,102,103,103,104,105],trendB:[95,96,97,98,98,99,99,100,100,101,101,102],
mix:[{label:'Portfolio A',value:91},{label:'Portfolio B',value:86},{label:'Portfolio C',value:79},{label:'Portfolio D',value:68},{label:'Portfolio E',value:83}],
performanceRows:[['Portfolio A','Performance index','108.2','+5.4','On track'],['Portfolio B','Performance index','103.6','+1.2','On track'],['Portfolio C','Performance index','98.7','-2.6','Watch'],['Portfolio D','Performance index','94.3','-5.8','Review'],['Portfolio E','Performance index','102.1','+2.0','On track']],
quality:[{label:'Portfolio source',values:[98,97,96,97]},{label:'Finance source',values:[97,96,95,96]},{label:'Benefits source',values:[91,88,86,89]},{label:'Client reporting',values:[95,94,90,93]}],
flow:[{title:'Source',text:'Portfolio, finance, operations'},{title:'Rules',text:'Measures, keys, definitions'},{title:'Validation',text:'Reconcile and test'},{title:'Reporting',text:'Scorecard and commentary'},{title:'Decision',text:'Action and owner'}],
issueAge:[{label:'0–7 days',value:78},{label:'8–30 days',value:51},{label:'31–90 days',value:26},{label:'>90 days',value:8}],
scenarios:[{name:'Base',note:'Current operating assumptions',series:[96,97,98,99,100,101,102,103],kpis:[{label:'12m benefit',value:'$2.1m',sub:'Base'},{label:'Payback',value:'7 mo',sub:'Current'},{label:'Portfolio index',value:'104.6',sub:'Stable'},{label:'Execution risk',value:'Medium',sub:'2 dependencies'}],decision:'Maintain current plan',detail:'Performance remains above plan with targeted intervention on the weakest segment.'},{name:'Targeted uplift',note:'Focus intervention on weak segments',series:[96,98,100,102,104,106,108,110],kpis:[{label:'12m benefit',value:'$3.0m',sub:'+0.9m'},{label:'Payback',value:'5 mo',sub:'Improved'},{label:'Portfolio index',value:'108.0',sub:'Higher'},{label:'Execution risk',value:'Medium',sub:'Focused'}],decision:'Prioritise targeted uplift',detail:'Concentrate change on segments where variance and benefit potential overlap.'},{name:'Cost pressure',note:'Higher cost-to-serve',series:[96,96,95,95,94,94,93,93],kpis:[{label:'12m benefit',value:'$1.2m',sub:'Reduced'},{label:'Payback',value:'11 mo',sub:'Longer'},{label:'Portfolio index',value:'99.1',sub:'Below plan'},{label:'Execution risk',value:'High',sub:'Cost pressure'}],decision:'Re-test economics',detail:'Reassess interventions where benefit no longer clears the cost hurdle.'},{name:'Faster conversion',note:'Improved operational effectiveness',series:[96,99,102,104,107,109,111,113],kpis:[{label:'12m benefit',value:'$3.4m',sub:'Upside'},{label:'Payback',value:'4 mo',sub:'Faster'},{label:'Portfolio index',value:'110.2',sub:'Upside'},{label:'Execution risk',value:'Low',sub:'Within capacity'}],decision:'Scale proven interventions',detail:'Extend measures with strong evidence and clear benefit attribution.'}],
lineage:[{title:'Executive measure',text:'Index, variance, benefit, action'},{title:'Metric logic',text:'Definitions and calculation rules'},{title:'Validated model',text:'Reconciled reporting layer'},{title:'Source',text:'Portfolio, finance, operations'},{title:'QA',text:'Checks, exceptions, sign-off'}],
timeline:[{cls:'good',title:'Daily exception scan',text:'Material movement and data exceptions'},{cls:'good',title:'Weekly performance review',text:'Drivers, actions and benefit movement'},{cls:'warn',title:'Monthly reporting gate',text:'Reconciliation and commentary sign-off'},{cls:'good',title:'Quarterly strategic review',text:'Portfolio reset and benefit outlook'}],
governanceRows:[['Portfolio measure','Insights','Metric catalogue + reconciliation','On track'],['Benefit tracking','Strategy / Finance','Baseline + realised benefit','Watch'],['Client reporting','Reporting','Pack QA + commentary','On track'],['Action ownership','Operations','Action register','Watch']]
};
let state={view:0,scenario:0};
function statusClass(s){return /on track|complete|passed|low/i.test(s)?'good':/watch|review|medium/i.test(s)?'warn':'bad'}function badge(s){return `<span class="badge ${statusClass(s)}">${s}</span>`}function smoothPath(points){if(points.length<2)return'';let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const p0=points[i],p1=points[i+1],mx=(p0[0]+p1[0])/2;d+=` C ${mx} ${p0[1]}, ${mx} ${p1[1]}, ${p1[0]} ${p1[1]}`;}return d;}
function bindTooltips(){const tip=document.getElementById('tooltip');document.querySelectorAll('[data-tip]').forEach(el=>{el.onmouseenter=()=>{tip.innerHTML=el.dataset.tip;tip.style.display='block'};el.onmousemove=e=>{tip.style.left=Math.min(innerWidth-190,e.clientX+14)+'px';tip.style.top=Math.min(innerHeight-90,e.clientY+14)+'px'};el.onmouseleave=()=>tip.style.display='none'})}
function lineChart(series,second=null){const w=650,h=220,p=28,all=[...series,...(second||[])],min=Math.min(...all)-2,max=Math.max(...all)+2,pts=series.map((v,i)=>[p+i/(series.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),pts2=second?second.map((v,i)=>[p+i/(second.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]):[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-a" d="${smoothPath(pts)}"/>${second?`<path class="line-b" d="${smoothPath(pts2)}"/>`:''}${pts.map((q,i)=>`<circle class="hoverable" data-tip="<strong>Period ${i+1}</strong>${series[i]}" cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('')}</svg>`}
function barLine(rows){const w=650,h=220,pL=42,pR=24,pT=18,pB=28,slot=(w-pL-pR)/rows.length,maxB=120,maxL=8,bars=rows.map((d,i)=>{const x=pL+i*slot+slot*.14,ah=d.a/maxB*(h-pT-pB),bh=d.b/maxB*(h-pT-pB);return `<rect x="${x}" y="${h-pB-ah}" width="${slot*.25}" height="${ah}" rx="3" fill="var(--blue)" opacity=".78"/><rect x="${x+slot*.29}" y="${h-pB-bh}" width="${slot*.25}" height="${bh}" rx="3" fill="var(--gold)" opacity=".86"/>`}).join(''),pts=rows.map((d,i)=>[pL+i*slot+slot*.42,pT+(maxL-d.line)/maxL*(h-pT-pB)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join('')}${bars}<path class="line-risk" d="${smoothPath(pts)}"/>${rows.map((d,i)=>`<text class="tick" x="${pL+i*slot+slot*.23}" y="${h-8}">${d.label}</text>`).join('')}</svg>`}
function metricBars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x.label}</label><div class="track"><div class="fill" style="width:${x.value}%"></div></div><div class="metric-score">${x.value}%</div></div>`).join('')}</div>`}
function head(i,tag){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[i].title}</h2><p class="page-desc">${CFG.views[i].desc}</p></div><span class="demo">${tag}</span></div>`}
function renderOverview(){return `${head(0,'Executive view')}<section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub}</div></div><div class="kpi-icon">${x.icon}</div></div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>Portfolio position vs plan</h3><p>Actual, plan and variance across priority segments.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Plan</span><span><i style="background:var(--gold)"></i>Actual</span><span><i style="background:var(--risk)"></i>Variance</span></div></div>${barLine(CFG.primaryRows)}</div><div class="card"><div class="chart-title"><div><h3>Portfolio health</h3><p>Selected reporting and control measures.</p></div></div>${metricBars(CFG.health)}</div></section><section class="grid two"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Act on the weakest portfolio before broadening intervention</h3><p>Concentrate analysis on declining performance, cost-to-serve and benefit evidence.</p></div><div class="card"><div class="chart-title"><div><h3>Priority register</h3><p>Current items requiring attention.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r.item}</td><td>${r.area}</td><td>${badge(r.status)}</td><td>${r.action}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function renderPerformance(){return `${head(1,'Performance view')}<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Portfolio trend</h3><p>Actual vs benchmark over 12 periods.</p></div></div>${lineChart(CFG.trendA,CFG.trendB)}</div><div class="card"><div class="chart-title"><div><h3>Segment health</h3><p>Relative current position.</p></div></div>${metricBars(CFG.mix)}</div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Performance scorecard</h3><p>Selected portfolio measures.</p></div></div><div class="table-wrap"><table><thead><tr><th>Portfolio</th><th>Measure</th><th>Current</th><th>Direction</th><th>Status</th></tr></thead><tbody>${CFG.performanceRows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===4?badge(v):v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function renderQuality(){return `${head(2,'Assurance view')}<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control.</p></div></div><div class="heatmap"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="heat-head">${x}</div>`).join('')}${CFG.quality.map(q=>`<div class="heat-label">${q.label}</div>${q.values.map(v=>`<div class="heat-cell ${v>=90?'hi':v>=80?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Source-to-decision flow</h3><p>Compact control pathway.</p></div></div><div class="flow">${CFG.flow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join('')}</div></div></section><section class="grid two" style="margin-top:10px"><div class="card"><div class="chart-title"><div><h3>Issue ageing</h3><p>Open reporting issues.</p></div></div>${metricBars(CFG.issueAge)}</div><div class="decision"><div class="eyebrow">Control focus</div><h3>Keep executive reporting traceable to source, rule and reconciliation</h3><p>Every published movement should have a clear calculation basis and exception path.</p></div></section>`}
function renderScenario(){const s=CFG.scenarios[state.scenario];return `${head(3,'Scenario view')}<div class="scenarios">${CFG.scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?'active':''}" data-sc="${i}"><strong>${x.name}</strong><span>${x.note}</span></button>`).join('')}</div><section class="grid kpis">${s.kpis.map(x=>`<div class="card"><div class="eyebrow">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub}</div></div>`).join('')}</section><section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Scenario trajectory</h3><p>Base against selected case.</p></div></div>${lineChart(CFG.scenarios[0].series,s.series)}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s.decision}</h3><p>${s.detail}</p></div></section>`}
function renderGovernance(){return `${head(4,'Governance view')}<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Measure lineage</h3><p>Trace output back to controlled source.</p></div></div><div class="flow">${CFG.lineage.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Review rhythm</h3><p>Control and decision cadence.</p></div></div><div class="timeline">${CFG.timeline.map(x=>`<div class="tl ${x.cls}"><span class="tl-dot"></span><strong>${x.title}</strong><p>${x.text}</p></div>`).join('')}</div></div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Governance controls</h3><p>Ownership, evidence and status.</p></div></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${CFG.governanceRows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join('')}</tbody></table></div></section>`}
const RENDERERS=[renderOverview,renderPerformance,renderQuality,renderScenario,renderGovernance];function renderSidebar(){const s=document.getElementById('sidebar');s.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-view="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v.nav}</span></button>`).join('')}<div class="side-meta">Illustrative data only<br>Internal dashboard-style example</div>`;s.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}function render(){document.getElementById('main').innerHTML=RENDERERS[state.view]();renderSidebar();bindTooltips();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.scenario=+b.dataset.sc;render()})}document.getElementById('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';document.getElementById('themeText').textContent=dark?'Dark':'Light'};render();
</script></body></html>
