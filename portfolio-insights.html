<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfolio Insights Dashboard</title>
<meta name="description" content="Portfolio diagnostics, executive reporting, benefit tracking and reporting assurance dashboard.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f6;--card:#fff;--muted:#66727c;--ink:#18232c;--line:#d9e0e4;--a:#115f68;--a2:#dff0f1;--ok:#39794b;--warn:#a87512;--risk:#a44035;--blue:#557e99;--shadow:0 4px 14px rgba(20,35,45,.07);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font:600 1.15rem var(--serif)}.brand div{font:.55rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:3px}.controls{display:flex;gap:8px}select,button{border:1px solid var(--line);background:#f8fafb;border-radius:7px;padding:7px 9px;font-size:.68rem}.app{display:grid;grid-template-columns:210px 1fr}.side{min-height:calc(100vh - 55px);background:#fff;border-right:1px solid var(--line);padding:15px 9px;position:sticky;top:55px;height:calc(100vh - 55px)}.nav{padding:9px 10px;border-radius:7px;margin:2px 0;font-size:.72rem;color:var(--muted);cursor:pointer}.nav.active{background:var(--a2);color:var(--a);font-weight:700}.main{padding:20px 24px 40px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:16px}.head h2{margin:0;font:600 1.45rem var(--serif)}.head p{margin:5px 0 0;color:var(--muted);font-size:.7rem;max-width:900px;line-height:1.45}.tag{font:.52rem var(--mono);padding:5px 7px;background:var(--a2);color:var(--a);border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:13px}.eyebrow{font:.5rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#87929a;margin-bottom:6px}.big{font:600 1.4rem var(--serif)}.sub{font-size:.6rem;color:var(--muted);margin-top:4px;line-height:1.4}.good{color:var(--ok)}.warn{color:var(--warn)}.risk{color:var(--risk)}.chart{height:210px;display:flex;align-items:flex-end;gap:12px;padding:10px 6px 2px;border-top:1px solid var(--line)}.bar{flex:1;background:linear-gradient(var(--a),var(--blue));border-radius:5px 5px 0 0;position:relative;min-width:28px}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font:.48rem var(--mono);color:var(--muted)}.bar b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:.5rem var(--mono)}.metric{display:grid;grid-template-columns:130px 1fr 45px;gap:8px;align-items:center;margin:9px 0}.metric label{font-size:.6rem;color:var(--muted)}.track{height:7px;background:#e9eef1;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--a);border-radius:99px}.score{text-align:right;font:.53rem var(--mono)}table{width:100%;border-collapse:collapse}th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:.6rem}th{font:.48rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:#7f8a92;background:#f7f9fa}.pill{display:inline-block;padding:3px 6px;border-radius:99px;font-size:.52rem;font-weight:700}.p-ok{background:#e8f3eb;color:var(--ok)}.p-warn{background:#fbf1dc;color:var(--warn)}.p-risk{background:#f8e8e5;color:var(--risk)}.decision{border-left:4px solid var(--a);background:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);margin-top:10px}.decision h3{margin:0 0 5px;font:600 1rem var(--serif)}.decision p{margin:0;color:var(--muted);font-size:.62rem;line-height:1.5}.flow{display:flex;gap:7px;align-items:stretch}.node{flex:1;background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:10px}.node strong{display:block;font-size:.62rem}.node span{display:block;margin-top:5px;color:var(--muted);font-size:.55rem;line-height:1.4}.scenario-row{display:flex;gap:7px;margin-bottom:10px}.scenario{cursor:pointer}.scenario.active{background:var(--a2);border-color:#9fc8cb;color:var(--a);font-weight:700}@media(max-width:950px){.app{grid-template-columns:1fr}.side{position:static;height:auto;min-height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{white-space:nowrap}.kpis,.two,.three{grid-template-columns:1fr 1fr}.main{padding:15px}}@media(max-width:650px){.kpis,.two,.three{grid-template-columns:1fr}.top{align-items:flex-start;gap:8px;flex-wrap:wrap}.flow{flex-direction:column}}
</style></head>
<body><header class="top"><div class="brand"><h1>Portfolio Insights</h1><div>performance · commercial intelligence · benefit tracking · reporting assurance</div></div><div class="controls"><select><option>Current month</option><option>Quarter to date</option><option>Year to date</option></select><select><option>All portfolios</option><option>Client A</option><option>Client B</option><option>Client C</option></select></div></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const views=[
['Executive overview','Portfolio insights overview','Current performance, material movements, opportunities and exceptions prepared for senior review.'],
['Portfolio diagnostics','Portfolio diagnostics','Segment-level performance, movement and driver analysis across the reporting portfolio.'],
['Commercial intelligence','Commercial intelligence','Commercial scenarios, opportunity sizing and prioritisation of improvement activity.'],
['Benefit tracking','Benefit tracking','Initiative outcomes, realised benefits and variance against plan.'],
['Reporting assurance','Reporting assurance','Single-source-of-truth controls, reconciliations, validation and publication readiness.'],
['Client reporting','Client reporting','Pack readiness, performance commentary and open actions across client reporting cycles.']];
let active=0;
function nav(){side.innerHTML=views.map((v,i)=>`<div class="nav ${i===active?'active':''}" onclick="active=${i};nav();render()">0${i} &nbsp; ${v[0]}</div>`).join('')}
function shell(body){return `<div class="head"><div><h2>${views[active][1]}</h2><p>${views[active][2]}</p></div><div class="tag">illustrative analytical example</div></div>${body}`}
function kpis(){return `<div class="grid kpis"><div class="card"><div class="eyebrow">Portfolio performance</div><div class="big">104.6</div><div class="sub good">+3.2 pts vs plan</div></div><div class="card"><div class="eyebrow">Material exceptions</div><div class="big">6</div><div class="sub warn">2 require senior decision</div></div><div class="card"><div class="eyebrow">Benefit realised</div><div class="big">$4.8m</div><div class="sub">82% of YTD plan</div></div><div class="card"><div class="eyebrow">Reporting confidence</div><div class="big">96%</div><div class="sub good">All critical reconciliations passed</div></div></div>`}
function overview(){return shell(kpis()+`<div class="grid two"><div class="card"><div class="eyebrow">Portfolio performance trend</div><div class="chart"><div class="bar" style="height:46%"><b>96</b><span>Apr</span></div><div class="bar" style="height:54%"><b>98</b><span>May</span></div><div class="bar" style="height:63%"><b>100</b><span>Jun</span></div><div class="bar" style="height:74%"><b>102</b><span>Jul</span></div><div class="bar" style="height:84%"><b>104</b><span>Aug</span></div><div class="bar" style="height:92%"><b>105</b><span>Sep</span></div></div></div><div class="card"><div class="eyebrow">Portfolio health</div>${metric('Data completeness',97)}${metric('Measure consistency',94)}${metric('Commentary readiness',91)}${metric('Benefit traceability',86)}${metric('Client pack readiness',93)}</div></div><div class="decision"><h3>Decision focus</h3><p>Prioritise the two portfolios with declining conversion and rising cost-to-serve; maintain current settings elsewhere until the next benefit review confirms the operational response.</p></div>`)}
function metric(n,v){return `<div class="metric"><label>${n}</label><div class="track"><div class="fill" style="width:${v}%"></div></div><div class="score">${v}%</div></div>`}
function diagnostics(){return shell(kpis()+`<div class="card"><div class="eyebrow">Segment diagnostics</div><table><thead><tr><th>Segment</th><th>Index</th><th>vs plan</th><th>Primary driver</th><th>Status</th></tr></thead><tbody><tr><td>Portfolio A</td><td>108.2</td><td>+5.4</td><td>Improved contact effectiveness</td><td><span class="pill p-ok">Above plan</span></td></tr><tr><td>Portfolio B</td><td>103.6</td><td>+1.2</td><td>Stable throughput</td><td><span class="pill p-ok">On track</span></td></tr><tr><td>Portfolio C</td><td>98.7</td><td>-2.6</td><td>Higher cost-to-serve</td><td><span class="pill p-warn">Review</span></td></tr><tr><td>Portfolio D</td><td>94.3</td><td>-5.8</td><td>Conversion deterioration</td><td><span class="pill p-risk">Action</span></td></tr></tbody></table></div><div class="grid two" style="margin-top:10px"><div class="card"><div class="eyebrow">Driver contribution</div>${metric('Volume / mix',72)}${metric('Operational productivity',64)}${metric('Contact effectiveness',81)}${metric('Cost discipline',58)}</div><div class="card"><div class="eyebrow">Analytical questions</div><table><tbody><tr><td>01</td><td>Is the movement structural or timing-related?</td></tr><tr><td>02</td><td>Which segments explain most of the variance?</td></tr><tr><td>03</td><td>Does the proposed intervention improve outcome after cost?</td></tr><tr><td>04</td><td>What needs to be tracked after implementation?</td></tr></tbody></table></div></div>`)}
function commercial(){return shell(`<div class="scenario-row"><button class="scenario active" onclick="setScenario(this,'Base case')">Base case</button><button class="scenario" onclick="setScenario(this,'Targeted uplift')">Targeted uplift</button><button class="scenario" onclick="setScenario(this,'Cost pressure')">Cost pressure</button></div><div class="grid kpis"><div class="card"><div class="eyebrow">Scenario</div><div class="big" id="sc">Base case</div><div class="sub">Current assumptions retained</div></div><div class="card"><div class="eyebrow">Expected benefit</div><div class="big" id="benefit">$2.1m</div><div class="sub">12-month estimate</div></div><div class="card"><div class="eyebrow">Payback</div><div class="big" id="payback">7 mo</div><div class="sub">Illustrative</div></div><div class="card"><div class="eyebrow">Execution risk</div><div class="big" id="risk">Medium</div><div class="sub">Dependencies concentrated in two teams</div></div></div><div class="card"><div class="eyebrow">Opportunity register</div><table><thead><tr><th>Opportunity</th><th>Value</th><th>Effort</th><th>Evidence</th><th>Priority</th></tr></thead><tbody><tr><td>Segment-level intervention</td><td>$1.4m</td><td>Medium</td><td>Strong</td><td><span class="pill p-ok">1</span></td></tr><tr><td>Reporting automation</td><td>$0.5m</td><td>Low</td><td>Strong</td><td><span class="pill p-ok">2</span></td></tr><tr><td>Workflow redesign</td><td>$0.9m</td><td>High</td><td>Moderate</td><td><span class="pill p-warn">3</span></td></tr></tbody></table></div>`)}
function setScenario(el,name){document.querySelectorAll('.scenario').forEach(x=>x.classList.remove('active'));el.classList.add('active');sc.textContent=name;if(name==='Targeted uplift'){benefit.textContent='$3.0m';payback.textContent='5 mo';risk.textContent='Medium'}else if(name==='Cost pressure'){benefit.textContent='$1.2m';payback.textContent='11 mo';risk.textContent='High'}else{benefit.textContent='$2.1m';payback.textContent='7 mo';risk.textContent='Medium'}}
function benefits(){return shell(`<div class="grid kpis"><div class="card"><div class="eyebrow">Planned benefit</div><div class="big">$5.9m</div></div><div class="card"><div class="eyebrow">Realised</div><div class="big">$4.8m</div><div class="sub good">82%</div></div><div class="card"><div class="eyebrow">At risk</div><div class="big">$0.6m</div><div class="sub warn">2 initiatives</div></div><div class="card"><div class="eyebrow">Unverified</div><div class="big">$0.3m</div><div class="sub">Awaiting evidence</div></div></div><div class="card"><div class="eyebrow">Benefit register</div><table><thead><tr><th>Initiative</th><th>Baseline</th><th>Target</th><th>Actual</th><th>Evidence</th><th>Status</th></tr></thead><tbody><tr><td>Reporting automation</td><td>100 hrs</td><td>60 hrs</td><td>58 hrs</td><td>Validated</td><td><span class="pill p-ok">Realised</span></td></tr><tr><td>Workflow uplift</td><td>72%</td><td>80%</td><td>78%</td><td>Validated</td><td><span class="pill p-warn">Watch</span></td></tr><tr><td>Segment intervention</td><td>96.2</td><td>102.0</td><td>103.1</td><td>Validated</td><td><span class="pill p-ok">Realised</span></td></tr><tr><td>Data remediation</td><td>88%</td><td>97%</td><td>94%</td><td>Pending</td><td><span class="pill p-warn">Open</span></td></tr></tbody></table></div>`)}
function assurance(){return shell(`<div class="grid two"><div class="card"><div class="eyebrow">Reporting control health</div>${metric('Source completeness',97)}${metric('Reconciliation pass rate',99)}${metric('Definition alignment',93)}${metric('Exception closure',88)}${metric('Publication readiness',96)}</div><div class="card"><div class="eyebrow">Single-source-of-truth flow</div><div class="flow"><div class="node"><strong>Source systems</strong><span>Operational, finance and portfolio inputs</span></div><div class="node"><strong>Rules & reconciliation</strong><span>Keys, definitions, validation and exceptions</span></div><div class="node"><strong>Certified measures</strong><span>Governed metric layer and commentary logic</span></div><div class="node"><strong>Executive output</strong><span>Pack, dashboard and decision record</span></div></div></div></div><div class="card" style="margin-top:10px"><div class="eyebrow">Open control items</div><table><thead><tr><th>Control</th><th>Issue</th><th>Impact</th><th>Owner</th><th>Status</th></tr></thead><tbody><tr><td>Portfolio key match</td><td>3 unmatched records</td><td>Low</td><td>Data</td><td><span class="pill p-warn">Open</span></td></tr><tr><td>Benefit baseline</td><td>Definition differs across sources</td><td>Medium</td><td>Strategy</td><td><span class="pill p-warn">Resolve</span></td></tr><tr><td>Executive pack total</td><td>Reconciled to source</td><td>None</td><td>Reporting</td><td><span class="pill p-ok">Passed</span></td></tr></tbody></table></div>`)}
function clients(){return shell(`<div class="grid kpis"><div class="card"><div class="eyebrow">Packs due</div><div class="big">8</div></div><div class="card"><div class="eyebrow">Ready</div><div class="big">6</div></div><div class="card"><div class="eyebrow">Awaiting commentary</div><div class="big">1</div></div><div class="card"><div class="eyebrow">Data exception</div><div class="big">1</div></div></div><div class="card"><div class="eyebrow">Client reporting cycle</div><table><thead><tr><th>Portfolio</th><th>Performance</th><th>Commentary</th><th>Reconciled</th><th>Actions</th><th>Status</th></tr></thead><tbody><tr><td>A</td><td>Above plan</td><td>Complete</td><td>Yes</td><td>1</td><td><span class="pill p-ok">Ready</span></td></tr><tr><td>B</td><td>On plan</td><td>Complete</td><td>Yes</td><td>0</td><td><span class="pill p-ok">Ready</span></td></tr><tr><td>C</td><td>Below plan</td><td>Draft</td><td>Yes</td><td>3</td><td><span class="pill p-warn">Review</span></td></tr><tr><td>D</td><td>Below plan</td><td>Complete</td><td>No</td><td>2</td><td><span class="pill p-risk">Hold</span></td></tr></tbody></table></div>`)}
function render(){main.innerHTML=[overview,diagnostics,commercial,benefits,assurance,clients][active]()}nav();render();
</script></body></html>
