<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f2eb;--surface:#fffdf9;--surface-alt:#f2ede5;--surface-deep:#e6dfd6;--border:#d9d0c6;--ink:#172019;--ink2:#556158;--ink3:#7f897f;--plum:#35002f;--green:#0d3b20;--green2:#174d2c;--coral:#ff4b3f;--coral-soft:#ffe2dc;--mint:#dce8df;--gold:#b58b48;--warn:#a3720a;--warn-soft:#f6ead0;--risk:#a84438;--risk-soft:#f3ddd8;--ok:#3f7a4c;--ok-soft:#e4efe6;--shadow:0 8px 24px rgba(37,27,30,.08);--ser:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}.header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--plum);border-bottom:4px solid var(--coral)}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--coral),#ff766d);position:relative}.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.brand-mark:before{top:11px}.brand-mark:after{top:20px}.brand h1{margin:0;color:#fff;font:600 1.06rem/1 var(--ser)}.brand p{margin:4px 0 0;color:#d7bfd3;font:400 .52rem var(--mono);text-transform:uppercase;letter-spacing:.08em}.head-tag{border:1px solid rgba(255,255,255,.18);color:#fff;background:rgba(255,255,255,.05);border-radius:999px;padding:6px 9px;font:400 .5rem var(--mono);text-transform:uppercase;letter-spacing:.07em}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:var(--green);padding:15px 9px}.side-title{font:400 .5rem var(--mono);letter-spacing:.13em;text-transform:uppercase;color:#9fc3a7;padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:#d7e4d8;padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:rgba(255,255,255,.05);color:#fff}.nav.active{background:rgba(255,255,255,.10);border-left-color:var(--coral);color:#fff}.nav-num{font:400 .53rem var(--mono);color:#94b49b}.nav-label{font-size:.7rem;font-weight:600}.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid rgba(255,255,255,.13);font-size:.56rem;line-height:1.5;color:#9fc3a7}.main{min-width:0;padding:20px 24px 44px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.page-title{font:600 1.45rem/1 var(--ser);margin:0 0 5px}.page-desc{margin:0;max-width:840px;color:var(--ink2);font-size:.67rem;line-height:1.45}.demo{font:400 .49rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--green);background:var(--mint);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:1.35fr .85fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:0 2px 8px rgba(34,25,28,.05);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}.eyebrow{font:500 .49rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:7px}.kpi-value{font:600 1.38rem/.95 var(--ser)}.kpi-sub{font-size:.57rem;color:var(--ink2);line-height:1.35;margin-top:5px}.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--coral-soft);color:var(--coral);font:500 .54rem var(--mono)}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.55rem;color:var(--ink3);margin:3px 0 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.53rem;color:var(--ink2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%}.chart{width:100%;height:205px;display:block}.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--ink3);font:8px var(--mono)}.line-green{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-coral{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.metric-stack{display:grid;gap:8px}.metric-bar{display:grid;grid-template-columns:115px 1fr 44px;gap:8px;align-items:center}.metric-bar label{font-size:.58rem;color:var(--ink2)}.track{height:7px;border-radius:999px;background:var(--surface-deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),#2f7446)}.metric-score{text-align:right;font:400 .54rem var(--mono);color:var(--ink2)}.decision{border-left:4px solid var(--coral);background:linear-gradient(135deg,var(--surface),#fbf7f1);border-radius:11px;padding:12px;box-shadow:0 2px 8px rgba(34,25,28,.05)}.decision h3{font:600 .95rem/1.15 var(--ser);margin:0 0 5px}.decision p{font-size:.58rem;line-height:1.45;color:var(--ink2);margin:0}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.55rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--ok-soft)}.warn{color:var(--warn);background:var(--warn-soft)}.bad{color:var(--risk);background:var(--risk-soft)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.58rem}th{font:400 .47rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}.heatmap{display:grid;grid-template-columns:145px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .47rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:center}.heat-label{font-size:.58rem;color:var(--ink2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem var(--mono)}.hi{background:var(--green)}.mid{background:var(--gold)}.lo{background:var(--risk)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:155px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--mint);border-color:var(--green)}.node .nt{font:400 .48rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-bottom:5px}.node .nb{font-size:.56rem;line-height:1.4;color:var(--ink2)}.flow-arrow{align-self:center;color:var(--coral);font-weight:700}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink2);border-radius:7px;padding:7px 8px;text-align:left}.scenario.active{background:var(--mint);border-color:var(--green);color:var(--green)}.scenario strong{display:block;font-size:.6rem}.scenario span{display:block;margin-top:3px;color:var(--ink3);font-size:.5rem;line-height:1.3}.status-strip{display:flex;height:20px;border-radius:7px;overflow:hidden;border:1px solid var(--border);background:var(--surface-deep)}.status-seg{height:100%}.status-seg.ok{background:var(--green)}.status-seg.warn{background:var(--gold)}.status-seg.bad{background:var(--risk)}.status-summary{display:flex;gap:12px;margin-top:8px;font-size:.57rem;color:var(--ink2);flex-wrap:wrap}.status-summary span{display:flex;align-items:center;gap:5px}.status-summary i{width:7px;height:7px;border-radius:2px}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:11px}.tl:last-child{margin-bottom:0}.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--green)}.tl.warn .tl-dot{border-color:var(--gold)}.tl strong{font-size:.61rem}.tl p{margin:3px 0 0;font-size:.55rem;line-height:1.4;color:var(--ink2)}
@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-bottom:1px solid rgba(255,255,255,.13);padding:8px}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenarios{grid-template-columns:1fr}.header{position:static}}
</style></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark"></div><div><h1>Energy Analytics & Commercial Performance</h1><p>usage · forecasting · billing · pricing · margin · data quality</p></div></div><div class="head-tag">Illustrative portfolio</div></header>
<div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div>
<script>
const CFG={views:[{nav:'Executive overview',title:'Energy operating overview',desc:'Consumption, forecast, billing and commercial performance in one decision view.'},{nav:'Usage & demand',title:'Usage & demand',desc:'Actual usage, baseline and material demand drivers.'},{nav:'Reconciliation',title:'Billing reconciliation',desc:'Exceptions, ageing and root causes across billed and expected values.'},{nav:'Commercial',title:'Commercial performance',desc:'Cost, realised price, margin and scenario sensitivity.'},{nav:'Controls',title:'Data controls',desc:'Quality, lineage and control rhythm from source to published insight.'}],kpis:[['Energy use','84.2 GWh','YTD consumption','EU'],['Forecast variance','-2.8%','Actual versus plan','FV'],['Open exceptions','17','Billing items','EX'],['Commercial margin','11.6%','Blended margin','CM']],health:[['Data completeness',97],['Meter coverage',94],['Billing match',92],['Forecast accuracy',89],['Automation',81]],register:[['North portfolio','Usage variance','Review','Validate weather normalisation'],['Retail cluster','Tariff mapping','Watch','Confirm rate logic'],['Invoice batch 07','Duplicate charge','Resolved','Control retained'],['Portfolio forecast','Demand uplift','Review','Reforecast next cycle']],usageRows:[['CBD retail',86,91,4],['Suburban',82,88,5],['Mixed use',78,83,6],['Leisure',74,79,7],['Office',88,90,3],['Other',72,76,5]],trendA:[74,76,78,81,83,85,87,90,92,94,96,97],trendB:[72,74,77,79,82,84,86,88,90,91,93,94],quality:[['Meter feeds',[98,97,96,97]],['Invoices',[94,93,89,92]],['Tariffs',[92,91,88,90]],['Reference data',[90,89,84,88]]],flow:[['Collect','Meter, invoice, tariff and contract feeds.'],['Validate','Completeness, duplicates, keys and timing.'],['Transform','Apply allocation and commercial rules.'],['Reconcile','Compare expected and billed values.'],['Publish','Release governed insight with visible exceptions.']],scenarios:[{name:'Base',note:'Current planning assumptions',series:[74,77,80,82,84,86,88,90],vals:['$118/MWh','$134/MWh','$16/MWh','11.6%'],decision:'Maintain current purchasing and pricing settings',detail:'Current mix remains within tolerance with targeted exception management.'},{name:'Demand +8%',note:'Higher load, same pricing',series:[74,78,82,86,89,92,95,98],vals:['$121/MWh','$134/MWh','$13/MWh','9.7%'],decision:'Protect margin before volume growth',detail:'Higher demand raises exposure faster than realised price unless purchasing settings are adjusted.'},{name:'Price shock',note:'Adverse wholesale movement',series:[74,76,78,79,80,81,82,83],vals:['$126/MWh','$134/MWh','$8/MWh','6.0%'],decision:'Review pricing and hedge assumptions',detail:'A cost shock compresses margin materially and requires earlier intervention.'},{name:'Efficiency',note:'Lower usage intensity',series:[74,75,76,78,80,83,86,89],vals:['$116/MWh','$134/MWh','$18/MWh','13.4%'],decision:'Prioritise efficiency where cost and demand both improve',detail:'Efficiency benefits are strongest where reduced usage also lowers peak-cost exposure.'}]};
let state={view:0,scenario:0};function statusClass(s){return /resolved|on track|healthy/i.test(s)?'good':/review|watch/i.test(s)?'warn':'bad'}function badge(s){return `<span class="badge ${statusClass(s)}">${s}</span>`}function smooth(points){if(points.length<2)return'';let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],m=(a[0]+b[0])/2;d+=` C ${m} ${a[1]}, ${m} ${b[1]}, ${b[0]} ${b[1]}`}return d}function lineChart(a,b=null){const w=650,h=220,p=28,all=[...a,...(b||[])],min=Math.min(...all)-2,max=Math.max(...all)+2,pts=a.map((v,i)=>[p+i/(a.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),pts2=b?b.map((v,i)=>[p+i/(b.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]):[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-green" d="${smooth(pts)}"/>${b?`<path class="line-coral" d="${smooth(pts2)}"/>`:''}${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.6" fill="var(--surface)" stroke="var(--green)" stroke-width="2"/>`).join('')}</svg>`}function barLine(rows){const w=650,h=220,pL=42,pR=24,pT=18,pB=28,slot=(w-pL-pR)/rows.length,maxB=105,maxL=8,bars=rows.map((d,i)=>{const x=pL+i*slot+slot*.14,ah=d[1]/maxB*(h-pT-pB),bh=d[2]/maxB*(h-pT-pB);return `<rect x="${x}" y="${h-pB-ah}" width="${slot*.25}" height="${ah}" rx="3" fill="var(--green)" opacity=".78"/><rect x="${x+slot*.29}" y="${h-pB-bh}" width="${slot*.25}" height="${bh}" rx="3" fill="var(--gold)" opacity=".88"/>`}).join(''),pts=rows.map((d,i)=>[pL+i*slot+slot*.42,pT+(maxL-d[3])/maxL*(h-pT-pB)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join('')}${bars}<path class="line-coral" d="${smooth(pts)}"/>${rows.map((d,i)=>`<text class="tick" x="${pL+i*slot+slot*.10}" y="${h-8}">${d[0]}</text>`).join('')}</svg>`}function metricBars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="metric-score">${x[1]}%</div></div>`).join('')}</div>`}
function renderOverview(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[0].title}</h2><p class="page-desc">${CFG.views[0].desc}</p></div><span class="demo">Illustrative data</span></div><section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">${x[2]}</div></div><div class="kpi-icon">${x[3]}</div></div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>Usage, forecast and variance view</h3><p>Portfolio performance by operating segment.</p></div><div class="legend"><span><i style="background:var(--green)"></i>Actual</span><span><i style="background:var(--gold)"></i>Plan</span><span><i style="background:var(--coral)"></i>Variance</span></div></div>${barLine(CFG.usageRows)}</div><div class="card"><div class="chart-title"><div><h3>Operating health</h3><p>Controls supporting published insight.</p></div></div>${metricBars(CFG.health)}</div></section><section class="grid two"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Investigate movements that affect cost, margin or forecast confidence.</h3><p>Use clear thresholds to separate routine variance from items requiring commercial action or source-data correction.</p></div><div class="card"><div class="chart-title"><div><h3>Priority exceptions</h3><p>Items requiring confirmation or action.</p></div></div><div class="table-wrap"><table><thead><tr><th>Portfolio</th><th>Issue</th><th>Status</th><th>Action</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function renderUsage(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[1].title}</h2><p class="page-desc">${CFG.views[1].desc}</p></div><span class="demo">Demand view</span></div><section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Consumption trajectory</h3><p>Actual versus baseline across 12 periods.</p></div><div class="legend"><span><i style="background:var(--green)"></i>Actual</span><span><i style="background:var(--coral)"></i>Baseline</span></div></div>${lineChart(CFG.trendA,CFG.trendB)}</div><div class="card"><div class="chart-title"><div><h3>Variance drivers</h3><p>Relative contribution to current movement.</p></div></div>${metricBars([['Weather',78],['Trading hours',66],['Occupancy',59],['Portfolio mix',51],['Efficiency',42]])}</div></section><section class="grid three" style="margin-top:10px"><div class="card"><div class="eyebrow">Peak demand</div><div class="kpi-value">12.8 MW</div><div class="kpi-sub">Illustrative current peak</div></div><div class="card"><div class="eyebrow">Usage intensity</div><div class="kpi-value">-3.4%</div><div class="kpi-sub">Versus baseline</div></div><div class="decision"><div class="eyebrow">Analytical focus</div><h3>Separate structural change from short-term variance.</h3><p>Reforecast only where evidence supports a persistent shift.</p></div></section>`}
function renderRecon(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[2].title}</h2><p class="page-desc">${CFG.views[2].desc}</p></div><span class="demo">Exception view</span></div><section class="grid two"><div class="card"><div class="chart-title"><div><h3>Exception mix</h3><p>Open items by cause and severity.</p></div></div><div class="status-strip"><div class="status-seg ok" style="width:42%"></div><div class="status-seg warn" style="width:38%"></div><div class="status-seg bad" style="width:20%"></div></div><div class="status-summary"><span><i style="background:var(--green)"></i>Resolved 42%</span><span><i style="background:var(--gold)"></i>Review 38%</span><span><i style="background:var(--risk)"></i>Investigate 20%</span></div><div style="margin-top:12px">${metricBars([['Meter gaps',72],['Tariff mapping',58],['Duplicate charges',41],['Reference data',34]])}</div></div><div class="card"><div class="chart-title"><div><h3>Issue ageing</h3><p>Open exception profile.</p></div></div>${metricBars([['0–7 days',76],['8–30 days',49],['31–90 days',28],['>90 days',9]])}</div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Reconciliation register</h3><p>Selected exceptions and required action.</p></div></div><div class="table-wrap"><table><thead><tr><th>Exception</th><th>Cause</th><th>Impact</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Volume mismatch</td><td>Meter gap</td><td>$42k</td><td>${badge('Investigate')}</td><td>Validate interval data</td></tr><tr><td>Tariff variance</td><td>Rate mapping</td><td>$18k</td><td>${badge('Review')}</td><td>Check contract logic</td></tr><tr><td>Duplicate charge</td><td>Invoice process</td><td>$9k</td><td>${badge('Resolved')}</td><td>Control retained</td></tr><tr><td>Missing account</td><td>Reference data</td><td>$6k</td><td>${badge('Review')}</td><td>Backfill master data</td></tr></tbody></table></div></section>`}
function renderCommercial(){const s=CFG.scenarios[state.scenario];return `<div class="page-head"><div><h2 class="page-title">${CFG.views[3].title}</h2><p class="page-desc">${CFG.views[3].desc}</p></div><span class="demo">Scenario view</span></div><div class="scenarios">${CFG.scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?'active':''}" data-sc="${i}"><strong>${x.name}</strong><span>${x.note}</span></button>`).join('')}</div><section class="grid kpis">${[['Purchase cost',s.vals[0]],['Sell price',s.vals[1]],['Gross margin',s.vals[2]],['Margin rate',s.vals[3]]].map((x,i)=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">Illustrative scenario</div></div><div class="kpi-icon">0${i+1}</div></div></div>`).join('')}</section><section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Margin trajectory</h3><p>Base case versus selected scenario.</p></div></div>${lineChart(CFG.scenarios[0].series,s.series)}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s.decision}</h3><p>${s.detail}</p></div></section>`}
function renderControls(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[4].title}</h2><p class="page-desc">${CFG.views[4].desc}</p></div><span class="demo">Control view</span></div><section class="grid two"><div class="card"><div class="chart-title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heatmap"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="heat-head">${x}</div>`).join('')}${CFG.quality.map(q=>`<div class="heat-label">${q[0]}</div>${q[1].map(v=>`<div class="heat-cell ${v>=93?'hi':v>=88?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Control rhythm</h3><p>Review points supporting reliable publication.</p></div></div><div class="timeline"><div class="tl"><span class="tl-dot"></span><strong>Daily feed validation</strong><p>Completeness, timing and critical source checks.</p></div><div class="tl"><span class="tl-dot"></span><strong>Weekly exception review</strong><p>Material billing, tariff and forecast items.</p></div><div class="tl warn"><span class="tl-dot"></span><strong>Monthly reconciliation gate</strong><p>High-impact movements require evidence before publication.</p></div><div class="tl"><span class="tl-dot"></span><strong>Quarterly rule review</strong><p>Refresh thresholds and business logic.</p></div></div></div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Source-to-decision lineage</h3><p>Make transformations and exceptions visible.</p></div></div><div class="flow">${CFG.flow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></section>`}
const renderers=[renderOverview,renderUsage,renderRecon,renderCommercial,renderControls];function renderSidebar(){const s=document.getElementById('sidebar');s.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-view="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v.nav}</span></button>`).join('')}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Role-relevant analytical design</div>`;s.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}function render(){document.getElementById('main').innerHTML=renderers[state.view]();renderSidebar();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.scenario=+b.dataset.sc;render()})}render();
</script>
</body></html>
