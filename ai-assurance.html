<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Assurance & Evaluation Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative AI assurance, evaluation, release and monitoring portfolio.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;--border:#d8e0e5;--ink:#18232c;--ink2:#55636f;--ink3:#5f6c77;--accent:#0b5d6b;--accent-dim:#e4f1f2;--blue:#4a7897;--gold:#9a7330;--ok:#3f7a4c;--warn:#93690d;--risk:#a23b2e;--shadow:0 2px 8px rgba(34,48,58,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;font-size:.78rem}button,select{font:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue))}
.brand h1{margin:0;font:600 1.08rem var(--serif)}.brand p{margin:3px 0 0;font:.65rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.controls{display:flex;gap:8px;flex-wrap:wrap}.control{display:grid;gap:3px}.control label{font:.65rem var(--mono);color:var(--ink3)}select{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:7px 9px;font-size:.75rem}
.app{display:grid;grid-template-columns:190px minmax(0,1fr)}.side{position:sticky;top:67px;align-self:start;padding:14px 9px;background:var(--surface);border-right:1px solid var(--border);min-height:calc(100vh - 67px)}
.side-title{font:.65rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:0 8px 7px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:6px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink2);padding:10px 8px;border-radius:7px;margin:2px 0;cursor:pointer}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:.65rem var(--mono);color:var(--ink3)}.nav-label{font-size:.8rem;font-weight:600}
.main{padding:20px 24px 40px;min-width:0;max-width:1280px;width:100%}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:13px;flex-wrap:wrap}.head h2{margin:0 0 4px;font:600 1.45rem var(--serif)}.head p{margin:0;font-size:.78rem;color:var(--ink2)}.demo{font:.65rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-dim);padding:5px 7px;border-radius:999px}
.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;box-shadow:var(--shadow);min-width:0}.eyebrow{font:.65rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:8px}.value{font:600 1.45rem Inter,sans-serif;font-variant-numeric:tabular-nums}.sub{font-size:.75rem;color:var(--ink2);margin-top:4px}.icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:.65rem var(--mono)}
.title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px;flex-wrap:wrap}.title h3{font-size:.86rem;margin:0}.title p{font-size:.72rem;color:var(--ink3);margin:3px 0 0}.legend{display:flex;gap:10px;font-size:.7rem;color:var(--ink2);flex-wrap:wrap}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.chart{width:100%;height:250px;overflow:visible}.gridline{stroke:var(--border);stroke-dasharray:3 5}.tick{fill:var(--ink3);font:10px var(--mono)}.axis-label{fill:var(--ink2);font:10px var(--mono)}.line-a{fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.radar-fill{fill:var(--accent);opacity:.12}.radar-line{fill:none;stroke:var(--accent);stroke-width:2.4}.radar-base{fill:none;stroke:var(--blue);stroke-width:1.7;stroke-dasharray:5 4}.threshold{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:5 5}.chart-note{font:500 9px var(--mono);fill:var(--warn)}
.metric{display:grid;grid-template-columns:130px 1fr 46px;gap:8px;align-items:center;margin:10px 0}.metric label{font-size:.75rem;color:var(--ink2)}.track{height:8px;background:var(--surface-deep);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}.score{text-align:right;font:.7rem var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;font-size:.7rem;font-weight:700}.good{color:var(--ok);background:#e8f3eb}.warn{color:var(--warn);background:#fbf1dc}.bad{color:var(--risk);background:#f8e8e5}
.table{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:.8rem;text-align:left;font-variant-numeric:tabular-nums}th{font:.65rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);background:var(--surface-alt)}
.segmented{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.seg{border:1px solid var(--border);background:var(--surface-alt);padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--ink2)}.seg.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}
.heat{display:grid;grid-template-columns:150px repeat(4,1fr);gap:6px;align-items:center}.hh{font:.65rem var(--mono);text-transform:uppercase;color:var(--ink3);text-align:center}.hl{font-size:.75rem;color:var(--ink2)}.hc{height:32px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.68rem var(--mono)}.hi{background:var(--ok)}.mid{background:#8a650f}.lo{background:var(--risk)}
.decision{border-left:4px solid var(--accent);background:var(--surface);border-radius:10px;padding:12px;box-shadow:var(--shadow)}.decision h3{margin:0 0 4px;font:600 1rem var(--serif)}.decision p{margin:0;font-size:.75rem;line-height:1.45;color:var(--ink2)}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.insight{background:var(--surface-alt);border:1px solid var(--border);border-radius:7px;padding:9px}.insight b{display:block;font:600 .82rem Inter,sans-serif;font-variant-numeric:tabular-nums;margin-bottom:2px}.insight span{display:block;font-size:.7rem;color:var(--ink2);line-height:1.35}
.note{margin-top:12px;font-size:.7rem;color:var(--ink3)}
.readiness{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center}.gauge{width:200px;height:155px}.stage-list{display:grid;gap:7px}.stage{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:7px;background:var(--surface-alt);border:1px solid var(--border)}.stage-dot{width:10px;height:10px;border-radius:50%}.stage span{font-size:.75rem;color:var(--ink2)}.stage b{font-size:.72rem}
.dim-card{cursor:pointer}.dim-card.active{border-color:var(--accent);background:var(--accent-dim)}
.combo-bar{fill:var(--blue);opacity:.88}.combo-threshold{fill:none;stroke:var(--gold);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.combo-point{fill:var(--surface);stroke:var(--gold);stroke-width:2}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;min-height:0;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.side-title{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.insights{grid-template-columns:1fr 1fr}.main{padding:15px;max-width:none}.header{position:static}.side{top:auto}.readiness{grid-template-columns:1fr}}
@media(max-width:650px){.kpis,.two,.insights{grid-template-columns:1fr}.heat{grid-template-columns:110px repeat(4,1fr)}}
</style></head>
<body>
<header class="header">
<div class="brand"><div class="mark"></div><div><h1>Khaled Sanad - AI Assurance & Evaluation</h1><p>synthetic portfolio example · no employer material</p></div></div>
<div class="controls">
<div class="control"><label for="evalSel">Evaluation</label><select id="evalSel"><option value="current">Current</option><option value="prior">Prior</option></select></div>
<div class="control"><label for="setSel">Test set</label><select id="setSel"><option value="all">All</option><option value="representative">Representative</option><option value="edge">Edge cases</option><option value="adversarial">Adversarial</option></select></div>
</div>
</header>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Overview','AI assurance overview','Release readiness, assurance profile and key actions.'],['Evaluation','Evaluation & coverage','Performance, thresholds and test coverage.'],['Monitoring','Monitoring & governance','Regression, drift and release decisions.']];
let view=0,caseMode='all',evaluation='current',scenario='current',focus='overall';
const current={quality:88,grounded:91,consistency:82,safety:95,privacy:96,usability:77,traceability:90};
const prior={quality:84,grounded:86,consistency:77,safety:89,privacy:92,usability:72,traceability:84};
const thresholds={quality:85,grounded:90,consistency:80,safety:90,privacy:90,usability:75};
const coverage={
 all:[['Representative',[96,94,92,90]],['Edge cases',[84,81,79,76]],['Adversarial',[88,86,83,82]],['Regression',[93,92,91,89]]],
 representative:[['Representative',[96,94,92,90]]],edge:[['Edge cases',[84,81,79,76]]],adversarial:[['Adversarial',[88,86,83,82]]]
};
const months=['M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12'];
const scenarios={
 current:{issues:2,controls:1,decision:'Release with controls',quality:[88,89,87,90,91,90,92,91,89,90,88,89],exceptions:[9,8,7,6,5,6,4,5,7,6,8,7],risk:[51,53,52,54,55,56,55,56]},
 model:{issues:4,controls:3,decision:'Re-test before release',quality:[88,89,87,90,91,88,84,82,83,84,85,86],exceptions:[9,8,7,6,5,8,11,13,12,11,10,9],risk:[51,58,66,73,79,82,80,78]},
 prompt:{issues:3,controls:2,decision:'Regression review',quality:[88,89,87,90,91,90,88,86,85,86,87,87],exceptions:[9,8,7,6,5,6,7,9,10,9,8,8],risk:[51,55,61,64,67,69,71,70]},
 data:{issues:5,controls:4,decision:'Restrict + investigate',quality:[88,89,87,90,91,89,86,82,79,80,81,82],exceptions:[9,8,7,6,5,7,10,13,15,14,13,12],risk:[51,57,65,72,78,84,87,86]}
};
function badge(s){return '<span class="badge '+(/pass|on track|approved/i.test(s)?'good':/watch|review|control/i.test(s)?'warn':'bad')+'">'+s+'</span>'}
function metrics(a){return a.map(x=>'<div class="metric"><label>'+x[0]+'</label><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><div class="score">'+x[1]+'%</div></div>').join('')}
function data(){return evaluation==='prior'?prior:current}
function insight(a,b,c){return '<div class="insights"><div class="insight"><b>'+a[0]+'</b><span>'+a[1]+'</span></div><div class="insight"><b>'+b[0]+'</b><span>'+b[1]+'</span></div><div class="insight"><b>'+c[0]+'</b><span>'+c[1]+'</span></div></div>'}
function radar(){
 const d=data(), vals=[d.quality,d.grounded,d.consistency,d.safety,d.privacy,d.usability], base=[prior.quality,prior.grounded,prior.consistency,prior.safety,prior.privacy,prior.usability], labels=['Quality','Grounded','Consistency','Safety','Privacy','Usability'];
 const keys=['quality','grounded','consistency','safety','privacy','usability'],w=560,h=270,cx=280,cy=135,r=95,n=6;
 const pt=(v,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,rr=r*v/100;return [cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]};
 const poly=a=>a.map((v,i)=>pt(v,i).join(',')).join(' ');
 const rings=[25,50,75,100].map(v=>'<polygon points="'+Array.from({length:n},(_,i)=>pt(v,i).join(',')).join(' ')+'" fill="none" stroke="var(--border)" stroke-width="1"/>').join('');
 const spokes=labels.map((_,i)=>{let p=pt(100,i);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--border)"/>'}).join('');
 const text=labels.map((l,i)=>{let p=pt(118,i),active=(focus===keys[i]);return '<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="middle" dominant-baseline="middle" class="tick" style="'+(active?'font-weight:700;fill:var(--accent)':'')+'">'+l+'</text>'}).join('');
 const dots=vals.map((v,i)=>{let p=pt(v,i),active=(focus===keys[i]);return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(active?5:3)+'" fill="'+(active?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>'}).join('');
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-labelledby="radarTitle radarDesc"><title id="radarTitle">AI assurance radar chart</title><desc id="radarDesc">Selected evaluation compared with the prior evaluation across six assurance dimensions.</desc>'+rings+spokes+'<polygon class="radar-base" points="'+poly(base)+'"/><polygon class="radar-fill" points="'+poly(vals)+'"/><polygon class="radar-line" points="'+poly(vals)+'"/>'+dots+text+'</svg>'
}
function readinessGauge(){
 const d=data(), weights=[d.quality,d.grounded,d.consistency,d.safety,d.privacy,d.traceability],score=Math.round(weights.reduce((a,b)=>a+b,0)/weights.length),angle=Math.PI*(score/100),cx=100,cy=105,r=72;
 const polar=a=>[cx-r*Math.cos(a),cy-r*Math.sin(a)],p=polar(angle),large=angle>Math.PI/2?1:0;
 const arc='M 28 105 A 72 72 0 0 1 172 105',val='M 28 105 A 72 72 0 '+large+' 1 '+p[0]+' '+p[1];
 return '<div class="readiness"><svg class="gauge" viewBox="0 0 200 155" role="img" aria-labelledby="gaugeTitle gaugeDesc"><title id="gaugeTitle">Release readiness</title><desc id="gaugeDesc">Composite illustrative readiness score of '+score+' percent.</desc><path d="'+arc+'" fill="none" stroke="var(--surface-deep)" stroke-width="18" stroke-linecap="round"/><path d="'+val+'" fill="none" stroke="var(--accent)" stroke-width="18" stroke-linecap="round"/><text x="100" y="98" text-anchor="middle" style="font:600 28px Inter;fill:var(--ink)">'+score+'%</text><text x="100" y="119" text-anchor="middle" class="tick">READINESS</text></svg><div class="stage-list"><div class="stage"><span class="stage-dot" style="background:var(--ok)"></span><span>Evaluation thresholds</span><b>5/6 pass</b></div><div class="stage"><span class="stage-dot" style="background:var(--ok)"></span><span>Critical safety / privacy</span><b>0 events</b></div><div class="stage"><span class="stage-dot" style="background:var(--warn)"></span><span>Open assurance items</span><b>2</b></div><div class="stage"><span class="stage-dot" style="background:var(--accent)"></span><span>Release position</span><b>Controlled</b></div></div></div>'
}
function overviewDetail(){
 const d=data(), map={
  overall:['Overall assurance','Current profile is above threshold across most dimensions, with usability remaining the weakest area.'],
  quality:['Task quality',d.quality+'% against an 85% threshold. Review remains focused on edge cases and prompt regression.'],
  safety:['Safety',d.safety+'% with no critical events in the illustrative evaluation period.'],
  usability:['Usability',d.usability+'% against a 75% threshold. It passes minimum acceptance but remains on watch.']
 };
 return '<div class="decision" style="margin-top:10px"><div class="eyebrow">Selected focus</div><h3>'+map[focus][0]+'</h3><p>'+map[focus][1]+'</p></div>'
}
function comboChart(){
 const d=data(), dims=[['Quality',d.quality,85],['Grounded',d.grounded,90],['Consistency',d.consistency,80],['Safety',d.safety,90],['Privacy',d.privacy,90],['Usability',d.usability,75]],w=640,h=260,p=42,max=100,slot=(w-2*p)/dims.length;
 const bars=dims.map((x,i)=>{let x0=p+i*slot+18,bh=x[1]/max*(h-2*p),y=h-p-bh;return '<rect class="combo-bar" x="'+x0+'" y="'+y+'" width="34" height="'+bh+'" rx="5"/><text class="tick" x="'+(x0+17)+'" y="'+(h-12)+'" text-anchor="middle">'+x[0]+'</text><text class="tick" x="'+(x0+17)+'" y="'+(y-7)+'" text-anchor="middle">'+x[1]+'%</text>'}).join('');
 const pts=dims.map((x,i)=>{let xx=p+i*slot+35,yy=h-p-x[2]/max*(h-2*p);return [xx,yy,x[2]]});
 const line=pts.map((q,i)=>(i?'L ':'M ')+q[0]+' '+q[1]).join(' ');
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-labelledby="comboTitle comboDesc"><title id="comboTitle">Evaluation result and threshold combo chart</title><desc id="comboDesc">Bars show current results and the line shows predefined thresholds across six evaluation dimensions.</desc>'+[0,25,50,75,100].map(v=>{let y=h-p-v/max*(h-2*p);return '<line class="gridline" x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'"/><text class="tick" x="12" y="'+(y+3)+'">'+v+'%</text>'}).join('')+bars+'<path class="combo-threshold" d="'+line+'"/>'+pts.map(q=>'<circle class="combo-point" cx="'+q[0]+'" cy="'+q[1]+'" r="4"/>').join('')+'<text class="axis-label" transform="rotate(-90 12 130)" x="12" y="130">Score / threshold</text></svg>'
}
function lineChart(series,type){
 const w=620,h=235,p=42,isQ=type==='quality',min=isQ?75:0,max=isQ?94:16,vals=isQ?[80,85,90,94]:[0,5,10,15],title=isQ?'Quality trend':'Exception trend';
 const pts=series.map((v,i)=>[p+i/(series.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p),v]),path=pts.map((q,i)=>(i?'L ':'M ')+q[0]+' '+q[1]).join(' ');
 const thresholdY=isQ?h-p-(85-min)/(max-min)*(h-2*p):null;
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+title+'">'+vals.map(v=>{let y=h-p-(v-min)/(max-min)*(h-2*p);return '<line class="gridline" x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'"/><text class="tick" x="12" y="'+(y+3)+'">'+v+(isQ?'%':'')+'</text>'}).join('')+(isQ?'<line class="threshold" x1="'+p+'" y1="'+thresholdY+'" x2="'+(w-p)+'" y2="'+thresholdY+'"/><text class="chart-note" x="'+(w-p-80)+'" y="'+(thresholdY-6)+'">85% threshold</text>':'')+'<path class="'+(isQ?'line-a':'line-risk')+'" d="'+path+'"/>'+months.map((m,i)=>'<text class="tick" x="'+(p+i/(months.length-1)*(w-2*p)-8)+'" y="'+(h-10)+'">'+m+'</text>').join('')+'<text class="axis-label" transform="rotate(-90 12 120)" x="12" y="120">'+(isQ?'Quality score':'Exceptions')+'</text></svg>'
}
function riskChart(){
 const s=scenarios[scenario],w=620,h=235,p=42,min=45,max=90,ty=h-p-(75-min)/(max-min)*(h-2*p),base=scenarios.current.risk;
 const pp=a=>a.map((v,i)=>[p+i/(a.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p),v]),path=a=>pp(a).map((q,i)=>(i?'L ':'M ')+q[0]+' '+q[1]).join(' ');
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Assurance risk trajectory">'+[50,60,75,90].map(v=>{let y=h-p-(v-min)/(max-min)*(h-2*p);return '<line class="gridline" x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'"/><text class="tick" x="16" y="'+(y+3)+'">'+v+'</text>'}).join('')+'<line class="threshold" x1="'+p+'" y1="'+ty+'" x2="'+(w-p)+'" y2="'+ty+'"/><text class="chart-note" x="'+(w-p-90)+'" y="'+(ty-6)+'">review trigger 75</text><path class="line-b" stroke-dasharray="6 5" d="'+path(base)+'"/><path class="line-a" d="'+path(s.risk)+'"/><text class="axis-label" transform="rotate(-90 12 120)" x="12" y="120">Assurance risk index</text></svg>'
}
function head(){return '<div class="head"><div><h2>'+V[view][1]+'</h2><p>'+V[view][2]+'</p></div><span class="demo">Illustrative analysis</span></div>'}
function overview(){
 const d=data();
 return head()+'<div class="segmented" role="group" aria-label="Overview focus">'+[['overall','Overall'],['quality','Quality'],['safety','Safety'],['usability','Usability']].map(x=>'<button class="seg '+(focus===x[0]?'active':'')+'" data-focus="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div class="grid kpis"><div class="card dim-card '+(focus==='quality'?'active':'')+'" data-focus="quality"><div class="kpi"><div><div class="eyebrow">Task quality</div><div class="value">'+d.quality+'%</div><div class="sub">Threshold 85%</div></div><div class="icon">QA</div></div></div><div class="card dim-card '+(focus==='safety'?'active':'')+'" data-focus="safety"><div class="kpi"><div><div class="eyebrow">Safety</div><div class="value">'+d.safety+'%</div><div class="sub">0 critical events</div></div><div class="icon">SE</div></div></div><div class="card dim-card '+(focus==='usability'?'active':'')+'" data-focus="usability"><div class="kpi"><div><div class="eyebrow">Usability</div><div class="value">'+d.usability+'%</div><div class="sub">Watch</div></div><div class="icon">UX</div></div></div><div class="card dim-card '+(focus==='overall'?'active':'')+'" data-focus="overall"><div class="kpi"><div><div class="eyebrow">Test cases</div><div class="value">200</div><div class="sub">Synthetic set</div></div><div class="icon">TS</div></div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Assurance profile</h3><p>Selected evaluation against prior evaluation.</p></div><div class="legend"><span><i style="background:var(--accent)"></i>Selected</span><span><i style="background:var(--blue)"></i>Prior</span></div></div>'+radar()+'</div><div class="card"><div class="title"><div><h3>Release readiness</h3><p>Composite view of evaluation and control readiness.</p></div></div>'+readinessGauge()+'</div></div>'+overviewDetail()+'<div class="note">Illustrative use case: internal policy question-answering assistant. All figures are synthetic.</div>'
}
function evaluationTab(){
 const q=coverage[caseMode];
 return head()+'<div class="segmented" role="group" aria-label="Test-set filter">'+[['all','All'],['representative','Representative'],['edge','Edge cases'],['adversarial','Adversarial']].map(x=>'<button class="seg '+(caseMode===x[0]?'active':'')+'" data-case="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div class="grid two"><div class="card"><div class="title"><div><h3>Result vs threshold</h3><p>Bars show evaluation results; line shows acceptance thresholds.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Result</span><span><i style="background:var(--gold)"></i>Threshold</span></div></div>'+comboChart()+'</div><div class="card"><div class="title"><div><h3>Test coverage heatmap</h3><p>Coverage by test family and control dimension.</p></div></div><div class="heat"><div></div><div class="hh">Quality</div><div class="hh">Safety</div><div class="hh">Privacy</div><div class="hh">Consistency</div>'+q.map(r=>'<div class="hl">'+r[0]+'</div>'+r[1].map(v=>'<div class="hc '+(v>=90?'hi':v>=80?'mid':'lo')+'">'+v+'%</div>').join('')).join('')+'</div></div></div>'+insight(['200 prompts','Synthetic evaluation set'],['2 reviewers','Human-labelled reference set'],['82% agreement','Illustrative inter-rater agreement'])+'<div class="note">Thresholds are illustrative and set before evaluation. Material outputs retain human review.</div>'
}
function monitoringTab(){
 const s=scenarios[scenario],qNow=s.quality[s.quality.length-1],eNow=s.exceptions[s.exceptions.length-1];
 return head()+'<div class="segmented" role="group" aria-label="Change scenario">'+[['current','Approved state'],['model','Model update'],['prompt','Prompt change'],['data','Data shift']].map(x=>'<button class="seg '+(scenario===x[0]?'active':'')+'" data-scenario="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div class="grid kpis"><div class="card"><div class="eyebrow">Open issues</div><div class="value">'+s.issues+'</div></div><div class="card"><div class="eyebrow">Required controls</div><div class="value">'+s.controls+'</div></div><div class="card"><div class="eyebrow">Scenario quality</div><div class="value">'+qNow+'%</div></div><div class="card"><div class="eyebrow">Decision</div><div class="value" style="font-size:1rem">'+s.decision+'</div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Quality trend</h3><p>Updates with the selected change scenario.</p></div></div>'+lineChart(s.quality,'quality')+'</div><div class="card"><div class="title"><div><h3>Exception trend</h3><p>Updates with the selected change scenario.</p></div></div>'+lineChart(s.exceptions,'exceptions')+'</div></div><div class="grid two" style="margin-top:10px"><div class="card"><div class="title"><div><h3>Assurance risk trajectory</h3><p>Higher values indicate greater assurance risk.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Approved state</span><span><i style="background:var(--accent)"></i>Selected change</span></div></div>'+riskChart()+'</div><div class="card"><div class="title"><div><h3>Governance response</h3><p>Current response for the selected scenario.</p></div></div><div class="table"><table><tr><th>Signal</th><th>Current</th><th>Status</th></tr><tr><td>Quality</td><td>'+qNow+'%</td><td>'+badge(qNow>=85?'On track':'Review')+'</td></tr><tr><td>Exceptions</td><td>'+eNow+'</td><td>'+badge(eNow<=8?'Watch':'Review')+'</td></tr><tr><td>Risk index</td><td>'+s.risk[s.risk.length-1]+'</td><td>'+badge(s.risk[s.risk.length-1]<75?'Watch':'Review')+'</td></tr><tr><td>Safety / privacy</td><td>0 critical</td><td>'+badge('On track')+'</td></tr></table></div><div class="decision" style="margin-top:10px"><div class="eyebrow">Selected response</div><h3>'+s.decision+'</h3><p>Release conditions change with the scale of change, strength of evidence and residual risk.</p></div></div></div><div class="note">Illustrative framework informed by common AI risk-management principles: testing, traceability, human oversight and ongoing monitoring.</div>'
}
function nav(){side.innerHTML='<div class="side-title">Portfolio views</div>'+V.map((x,i)=>'<button class="nav '+(i===view?'active':'')+'" data-view="'+i+'" '+(i===view?'aria-current="page"':'')+'><span class="nav-num">0'+(i+1)+'</span><span class="nav-label">'+x[0]+'</span></button>').join('')}
function bind(){
 side.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=Number(b.dataset.view);render()}));
 main.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{caseMode=b.dataset.case;setSel.value=caseMode;render()}));
 main.querySelectorAll('[data-scenario]').forEach(b=>b.addEventListener('click',()=>{scenario=b.dataset.scenario;render()}));
 main.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>{focus=b.dataset.focus;render()}));
}
function render(){main.innerHTML=[overview,evaluationTab,monitoringTab][view]();nav();bind()}
evalSel.addEventListener('change',e=>{evaluation=e.target.value;render()});
setSel.addEventListener('change',e=>{caseMode=e.target.value;view=1;render()});
render();
</script>
</body></html>
