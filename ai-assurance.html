<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Assurance & Evaluation Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative AI assurance, evaluation, release and monitoring portfolio.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;--border:#d8e0e5;--ink:#18232c;--ink2:#55636f;--ink3:#7b8893;--accent:#0b5d6b;--accent-dim:#e4f1f2;--blue:#4a7897;--gold:#b58b48;--ok:#3f7a4c;--warn:#a3720a;--risk:#a23b2e;--shadow:0 2px 8px rgba(34,48,58,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}
.header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue))}
.brand h1{margin:0;font:600 1.05rem var(--serif)}.brand p{margin:3px 0 0;font:.5rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.controls{display:flex;gap:7px}select,button{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.62rem}
.app{display:grid;grid-template-columns:210px 1fr}.side{position:sticky;top:55px;height:calc(100vh - 55px);padding:14px 9px;background:var(--surface);border-right:1px solid var(--border)}
.side-title{font:.49rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:0 8px 7px}
.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:6px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink2);padding:8px;border-radius:7px;margin:2px 0}
.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:.52rem var(--mono);color:var(--ink3)}.nav-label{font-size:.7rem;font-weight:600}
.main{padding:20px 24px 40px;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:13px}.head h2{margin:0 0 4px;font:600 1.38rem var(--serif)}.head p{margin:0;font-size:.66rem;color:var(--ink2)}
.demo{font:.49rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--accent);background:var(--accent-dim);padding:5px 7px;border-radius:999px}
.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;box-shadow:var(--shadow)}
.eyebrow{font:.48rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between}.value{font:600 1.35rem var(--serif)}.sub{font-size:.57rem;color:var(--ink2);margin-top:4px}
.icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:.52rem var(--mono)}
.title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}.title h3{font-size:.74rem;margin:0}.title p{font-size:.54rem;color:var(--ink3);margin:3px 0 0}
.legend{display:flex;gap:8px;font-size:.52rem;color:var(--ink2);flex-wrap:wrap}.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.chart{width:100%;height:235px;overflow:visible}.gridline{stroke:var(--border);stroke-dasharray:3 5}.tick{fill:var(--ink3);font:8px var(--mono)}
.line-a{fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.area{fill:var(--accent-dim);opacity:.75}.band{fill:var(--warn);opacity:.08}.threshold{stroke:var(--warn);stroke-width:1.1;stroke-dasharray:5 5}
.chart-label{font:500 8px var(--mono);fill:var(--ink2)}.chart-note{font:500 7px var(--mono);fill:var(--warn)}
.metric{display:grid;grid-template-columns:118px 1fr 42px;gap:7px;align-items:center;margin:8px 0}.metric label{font-size:.57rem;color:var(--ink2)}.track{height:7px;background:var(--surface-deep);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}.score{text-align:right;font:.53rem var(--mono);color:var(--ink2)}
.badge{display:inline-flex;align-items:center;padding:3px 6px;border-radius:999px;font-size:.53rem;font-weight:700}.good{color:var(--ok);background:#e8f3eb}.warn{color:var(--warn);background:#fbf1dc}.bad{color:var(--risk);background:#f8e8e5}
.table{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:8px 9px;border-bottom:1px solid var(--border);font-size:.58rem;text-align:left}th{font:.47rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);background:var(--surface-alt)}
.heat{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.hh{font:.47rem var(--mono);text-transform:uppercase;color:var(--ink3);text-align:center}.hl{font-size:.57rem;color:var(--ink2)}.hc{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.5rem var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}
.flow{display:flex;gap:6px;overflow:auto}.node{flex:1;min-width:145px;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface-alt)}.node strong{display:block;font-size:.58rem}.node span{display:block;margin-top:4px;font-size:.53rem;color:var(--ink2);line-height:1.35}.arrow{align-self:center;color:var(--ink3)}
.decision{border-left:4px solid var(--accent);background:var(--surface);border-radius:10px;padding:12px;box-shadow:var(--shadow)}.decision h3{margin:0 0 4px;font:600 .95rem var(--serif)}.decision p{margin:0;font-size:.58rem;line-height:1.45;color:var(--ink2)}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.insight{background:var(--surface-alt);border:1px solid var(--border);border-radius:7px;padding:8px}.insight b{display:block;font:600 .72rem var(--serif);margin-bottom:2px}.insight span{display:block;font-size:.51rem;color:var(--ink2);line-height:1.35}
.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{text-align:left}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;font-size:.5rem;color:var(--ink3)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto}.side-title{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.scenarios,.insights{grid-template-columns:1fr 1fr}}@media(max-width:650px){.kpis,.two,.scenarios,.insights{grid-template-columns:1fr}.main{padding:15px}}
</style></head>
<body>
<header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. - AI Assurance & Evaluation</h1><p>evaluation · release · monitoring · quality assurance</p></div></div><div class="controls"><select><option>Current evaluation</option><option>Prior evaluation</option></select><select><option>All test sets</option><option>Representative</option><option>Edge cases</option><option>Adversarial</option></select></div></header>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Overview','AI assurance overview','Quality, release readiness and residual risk in one view.'],['Evaluation','Evaluation results','Performance against defined thresholds across core dimensions.'],['Test coverage','Test coverage','Representative, edge, adversarial and regression testing.'],['Monitoring','Production monitoring','Signals that indicate regression, drift or control failure.'],['Governance','Release governance','From evidence to release decision and ongoing assurance.']];
let view=0,sc=0;
const scoreRows=[['Task quality',84,88],['Groundedness',86,91],['Consistency',77,82],['Safety',89,95],['Privacy',92,96],['Usability',72,77]];
const months=['M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12'];
const quality=[88,89,87,90,91,90,92,91,89,90,88,89], exceptions=[9,8,7,6,5,6,4,5,7,6,8,7];
const scenarios=[['Current','Approved release state','4','1','91%','Release with controls'],['Model update','New model version','6','3','87%','Re-test'],['Prompt change','Prompt logic changed','5','2','89%','Regression review'],['Data shift','Input distribution moved','8','4','82%','Restrict + investigate']];
const scenarioSeries=[[51,53,52,54,55,56,55,56],[51,58,66,73,79,82,80,78],[51,55,61,64,67,69,71,70],[51,57,65,72,78,84,87,86]];
function badge(s){return '<span class="badge '+(/pass|on track|stable|approved/i.test(s)?'good':/watch|review|control/i.test(s)?'warn':'bad')+'">'+s+'</span>'}
function metrics(a){return a.map(x=>'<div class="metric"><label>'+x[0]+'</label><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><div class="score">'+x[1]+'%</div></div>').join('')}
function pts(series,w,h,p,min,max){return series.map((v,i)=>[p+i/(series.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p),v])}
function smooth(points,t=.18){if(points.length<2)return'';let d='M '+points[0][0]+' '+points[0][1];for(let i=0;i<points.length-1;i++){let p0=points[i-1]||points[i],p1=points[i],p2=points[i+1],p3=points[i+2]||p2;let c1x=p1[0]+(p2[0]-p0[0])*t,c1y=p1[1]+(p2[1]-p0[1])*t,c2x=p2[0]-(p3[0]-p1[0])*t,c2y=p2[1]-(p3[1]-p1[1])*t;d+=' C '+c1x+' '+c1y+', '+c2x+' '+c2y+', '+p2[0]+' '+p2[1]}return d}
function insight(a,b,c){return '<div class="insights"><div class="insight"><b>'+a[0]+'</b><span>'+a[1]+'</span></div><div class="insight"><b>'+b[0]+'</b><span>'+b[1]+'</span></div><div class="insight"><b>'+c[0]+'</b><span>'+c[1]+'</span></div></div>'}
function scoreChart(){let w=650,h=235,p=36,slot=(w-2*p)/scoreRows.length;let bars=scoreRows.map((d,i)=>{let x=p+i*slot+9,a=d[1]/100*(h-72),b=d[2]/100*(h-72);return '<g><rect x="'+x+'" y="'+(h-34-a)+'" width="22" height="'+a+'" rx="5" fill="var(--blue)"/><rect x="'+(x+27)+'" y="'+(h-34-b)+'" width="22" height="'+b+'" rx="5" fill="var(--gold)"/></g><text class="tick" x="'+(x-3)+'" y="'+(h-10)+'">'+d[0]+'</text>'}).join('');return '<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+[42,82,122,162].map(y=>'<line class="gridline" x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'"/>').join('')+bars+'</svg>'}
function trend(){let w=650,h=235,p=34,a=pts(quality,w,h,p,75,100),b=pts(exceptions,w,h,p,0,15),pa=smooth(a),pb=smooth(b);return '<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+[42,82,122,162].map(y=>'<line class="gridline" x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'"/>').join('')+'<path class="line-a" d="'+pa+'"/><path class="line-risk" d="'+pb+'"/>'+months.map((m,i)=>'<text class="tick" x="'+(p+i/(months.length-1)*(w-2*p)-7)+'" y="'+(h-7)+'">'+m+'</text>').join('')+'</svg>'}
function scenarioTrajectory(idx){let w=650,h=235,p=34,min=45,max=90,a=pts(scenarioSeries[0],w,h,p,min,max),b=pts(scenarioSeries[idx],w,h,p,min,max),ty=h-p-(75-min)/(max-min)*(h-2*p);return '<svg class="chart" viewBox="0 0 '+w+' '+h+'"><rect class="band" x="'+p+'" y="'+p+'" width="'+(w-2*p)+'" height="'+(ty-p)+'" rx="6"/>'+[42,82,122,162].map(y=>'<line class="gridline" x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'"/>').join('')+'<line class="threshold" x1="'+p+'" y1="'+ty+'" x2="'+(w-p)+'" y2="'+ty+'"/><text class="chart-note" x="'+(w-p-95)+'" y="'+(ty-5)+'">review trigger 75</text><path class="line-b" stroke-dasharray="6 5" d="'+smooth(a)+'"/><path class="line-a" d="'+smooth(b)+'"/></svg>'}
function head(){return '<div class="head"><div><h2>'+V[view][1]+'</h2><p>'+V[view][2]+'</p></div><span class="demo">Illustrative analysis</span></div>'}
function overview(){return head()+'<div class="grid kpis"><div class="card"><div class="kpi"><div><div class="eyebrow">Release status</div><div class="value">Controlled</div><div class="sub">1 open condition</div></div><div class="icon">RL</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Quality score</div><div class="value">89%</div><div class="sub">Above threshold</div></div><div class="icon">QA</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Critical events</div><div class="value">0</div><div class="sub">Current period</div></div><div class="icon">SE</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Open actions</div><div class="value">4</div><div class="sub">1 overdue</div></div><div class="icon">AC</div></div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Evaluation scorecard</h3><p>Baseline vs current evaluation.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Baseline</span><span><i style="background:var(--gold)"></i>Current</span></div></div>'+scoreChart()+insight(['+5 pts','Groundedness improved against baseline.'],['0 critical','No critical safety or privacy failures.'],['77% usability','Passes minimum threshold but remains on watch.'])+'</div><div class="card"><div class="title"><div><h3>Release readiness</h3><p>Selected assurance measures.</p></div></div>'+metrics([['Task quality',88],['Groundedness',91],['Consistency',82],['Safety controls',95],['Traceability',90]])+'</div></div><div class="grid two" style="margin-top:10px"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Release with controls</h3><p>Retain review for material outputs and monitor usability exceptions during the first production period.</p></div><div class="card"><div class="title"><div><h3>Open assurance items</h3><p>Current items for review.</p></div></div><div class="table"><table><tr><th>Item</th><th>Status</th><th>Evidence</th><th>Action</th></tr><tr><td>Usability variance</td><td>'+badge('Watch')+'</td><td>User testing</td><td>Refine guidance</td></tr><tr><td>Prompt regression</td><td>'+badge('Review')+'</td><td>Regression set</td><td>Re-test</td></tr><tr><td>Privacy controls</td><td>'+badge('On track')+'</td><td>Access + logs</td><td>Maintain</td></tr><tr><td>Release record</td><td>'+badge('Approved')+'</td><td>Decision log</td><td>Monitor</td></tr></table></div></div></div>'}
function evaluation(){return head()+'<div class="grid two"><div class="card"><div class="title"><div><h3>Current evaluation profile</h3><p>Performance against defined thresholds.</p></div></div>'+metrics([['Task quality',88],['Groundedness',91],['Consistency',82],['Safety',95],['Privacy',96],['Usability',77]])+'</div><div class="card"><div class="title"><div><h3>Threshold position</h3><p>Result and release treatment.</p></div></div><div class="table"><table><tr><th>Dimension</th><th>Threshold</th><th>Result</th><th>Status</th></tr><tr><td>Task quality</td><td>85%</td><td>88%</td><td>'+badge('Pass')+'</td></tr><tr><td>Groundedness</td><td>90%</td><td>91%</td><td>'+badge('Pass')+'</td></tr><tr><td>Consistency</td><td>80%</td><td>82%</td><td>'+badge('Pass')+'</td></tr><tr><td>Safety</td><td>0 critical</td><td>0</td><td>'+badge('Pass')+'</td></tr><tr><td>Usability</td><td>75%</td><td>77%</td><td>'+badge('Watch')+'</td></tr></table></div></div></div>'}
function coverage(){let q=[['Representative',[96,94,92,90]],['Edge cases',[84,81,79,76]],['Adversarial',[88,86,83,82]],['Regression',[93,92,91,89]]];return head()+'<div class="grid two"><div class="card"><div class="title"><div><h3>Test coverage heatmap</h3><p>Coverage by test family and dimension.</p></div></div><div class="heat"><div></div><div class="hh">Quality</div><div class="hh">Safety</div><div class="hh">Privacy</div><div class="hh">Consistency</div>'+q.map(r=>'<div class="hl">'+r[0]+'</div>'+r[1].map(v=>'<div class="hc '+(v>=90?'hi':v>=80?'mid':'lo')+'">'+v+'%</div>').join('')).join('')+'</div></div><div class="card"><div class="title"><div><h3>Test-set mix</h3><p>Share of evaluation effort.</p></div></div>'+metrics([['Representative',92],['Edge cases',78],['Adversarial',85],['Regression',90]])+'</div></div>'+insight(['Edge cases 78%','Largest coverage gap in the current set.'],['Regression 90%','Strong reuse of known cases after change.'],['Adversarial 85%','Adequate coverage with room to expand.'])}
function monitoring(){return head()+'<div class="grid two"><div class="card"><div class="title"><div><h3>12-period monitoring trend</h3><p>Quality score and exception volume.</p></div><div class="legend"><span><i style="background:var(--accent)"></i>Quality</span><span><i style="background:var(--risk)"></i>Exceptions</span></div></div>'+trend()+insight(['89% quality','Current result remains above release threshold.'],['7 exceptions','Up from 4 at the low point.'],['No material event','No critical safety or privacy incident.'])+'</div><div class="card"><div class="title"><div><h3>Monitoring signals</h3><p>Signals that trigger review.</p></div></div><div class="table"><table><tr><th>Signal</th><th>Status</th><th>Trigger</th></tr><tr><td>Quality exceptions</td><td>'+badge('Watch')+'</td><td>Below threshold</td></tr><tr><td>Regression</td><td>'+badge('Review')+'</td><td>Baseline decline</td></tr><tr><td>Safety / privacy</td><td>'+badge('On track')+'</td><td>Any material event</td></tr><tr><td>Drift</td><td>'+badge('Watch')+'</td><td>Input change</td></tr></table></div></div></div>'}
function governance(){let s=scenarios[sc];return head()+'<div class="scenarios">'+scenarios.map((x,i)=>'<button class="scenario '+(i===sc?'active':'')+'" onclick="sc='+i+';render()"><strong>'+x[0]+'</strong><span>'+x[1]+'</span></button>').join('')+'</div><div class="grid kpis"><div class="card"><div class="eyebrow">Open issues</div><div class="value">'+s[2]+'</div></div><div class="card"><div class="eyebrow">Controls</div><div class="value">'+s[3]+'</div></div><div class="card"><div class="eyebrow">Evidence confidence</div><div class="value">'+s[4]+'</div></div><div class="card"><div class="eyebrow">Decision</div><div class="value" style="font-size:1rem">'+s[5]+'</div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Assurance trajectory</h3><p>Selected change against the approved state.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Approved state</span><span><i style="background:var(--accent)"></i>'+s[0]+'</span></div></div>'+scenarioTrajectory(sc)+'</div><div class="decision"><div class="eyebrow">Governance response</div><h3>'+s[5]+'</h3><p>Adjust release conditions to the strength of evidence, scale of change and residual risk.</p></div></div><div class="card" style="margin-top:10px"><div class="title"><div><h3>Release workflow</h3><p>Evidence to decision.</p></div></div><div class="flow"><div class="node"><strong>Define</strong><span>Use, user, risk</span></div><div class="arrow">→</div><div class="node"><strong>Evaluate</strong><span>Metrics, tests, thresholds</span></div><div class="arrow">→</div><div class="node"><strong>Assure</strong><span>Limits, controls, residual risk</span></div><div class="arrow">→</div><div class="node"><strong>Decide</strong><span>Release, restrict, redesign, stop</span></div><div class="arrow">→</div><div class="node"><strong>Monitor</strong><span>Regression, drift, incidents</span></div></div></div>'}
function nav(){side.innerHTML='<div class="side-title">Portfolio views</div>'+V.map((x,i)=>'<button class="nav '+(i===view?'active':'')+'" onclick="view='+i+';render()"><span class="nav-num">0'+i+'</span><span class="nav-label">'+x[0]+'</span></button>').join('')}
function render(){main.innerHTML=[overview,evaluation,coverage,monitoring,governance][view]();nav()}render();
</script>
</body></html>
