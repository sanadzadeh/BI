<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Crime Transformation Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative financial-crime transformation portfolio covering current-state issues, future-state outcomes, requirements, dependencies, controls and decision support.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f6;--card:#fff;--soft:#f8fafb;--line:#dbe3e7;--ink:#18232c;--muted:#667580;--muted2:#87949d;--accent:#0b5d6b;--accent2:#4d8790;--accentSoft:#e6f1f2;--blue:#557d98;--gold:#b48946;--green:#477f55;--red:#a94d41;--shadow:0 2px 10px rgba(30,45,55,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue))}.brand h1{margin:0;font:600 1.04rem var(--serif)}.brand span{display:block;margin-top:2px;font:.46rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}.demo{font:.47rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accentSoft);padding:5px 7px;border-radius:999px}.app{display:grid;grid-template-columns:210px 1fr}.side{height:calc(100vh - 58px);position:sticky;top:58px;background:var(--card);border-right:1px solid var(--line);padding:13px 9px;overflow:auto}.side-title{font:.46rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:0 8px 7px}.nav{width:100%;border:0;border-left:3px solid transparent;background:transparent;border-radius:7px;padding:8px;text-align:left;color:var(--muted);display:grid;grid-template-columns:24px 1fr;gap:5px;cursor:pointer;margin:2px 0}.nav.active{background:var(--accentSoft);border-left-color:var(--accent);color:var(--accent)}.num{font:.49rem var(--mono);color:var(--muted2)}.label{font-size:.68rem;font-weight:600}.meta{margin-top:14px;border-top:1px solid var(--line);padding:10px 8px;font-size:.5rem;line-height:1.45;color:var(--muted2)}.main{padding:18px 22px 36px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:11px}.head h2{font:600 1.34rem var(--serif);margin:0}.head p{margin:4px 0 0;color:var(--muted);font-size:.62rem;max-width:850px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(5,1fr);margin-bottom:10px}.two{grid-template-columns:1.2fr .8fr}.twoeq{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow);min-width:0}.eyebrow{font:.45rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}.value{font:600 1.36rem var(--serif)}.sub{margin-top:3px;font-size:.53rem;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.section-title h3{font-size:.71rem;margin:0}.section-title p{margin:3px 0 0;font-size:.5rem;color:var(--muted2)}.bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:140px 1fr 44px;gap:7px;align-items:center}.barrow label{font-size:.55rem;color:var(--muted)}.track{height:8px;border-radius:99px;background:#edf1f3;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.score{text-align:right;font:.5rem var(--mono);color:var(--muted)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--card),var(--soft));border-radius:10px;padding:12px}.decision strong{display:block;font:600 .9rem var(--serif);margin-bottom:4px}.decision span{font-size:.54rem;color:var(--muted);line-height:1.42}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:.55rem;text-align:left;vertical-align:top}th{font:.45rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);background:var(--soft)}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.49rem;font-weight:700}.good{background:#e7f2e9;color:var(--green)}.warn{background:#fbf0db;color:#956c15}.bad{background:#f8e7e4;color:var(--red)}.flow{display:flex;align-items:center;gap:6px;overflow:auto}.node{min-width:145px;flex:1;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:9px}.node b{display:block;font-size:.56rem}.node span{display:block;margin-top:3px;font-size:.48rem;color:var(--muted);line-height:1.3}.arrow{color:var(--muted2)}.heat{display:grid;grid-template-columns:130px repeat(5,1fr);gap:5px;align-items:center}.hh{font:.43rem var(--mono);text-transform:uppercase;color:var(--muted2);text-align:center}.hl{font-size:.53rem;color:var(--muted)}.hc{height:30px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.48rem var(--mono)}.hi{background:var(--green)}.mid{background:var(--gold)}.lo{background:var(--red)}.scenario-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.scenario{border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:6px 9px;border-radius:999px;font-size:.52rem;cursor:pointer}.scenario.active{background:var(--accentSoft);border-color:#9fc5ca;color:var(--accent)}.callout{padding:10px;border-radius:8px;background:var(--accentSoft);border:1px solid #c5dde0;font-size:.55rem;line-height:1.45}.req{display:grid;grid-template-columns:72px 1.3fr 1fr 1fr;gap:7px;align-items:start;padding:8px;border-bottom:1px solid var(--line);font-size:.54rem}.req:last-child{border-bottom:0}.rid{font:.48rem var(--mono);color:var(--muted2)}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.two,.twoeq{grid-template-columns:1fr}}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side-title,.meta{display:none}.nav{width:auto;white-space:nowrap}.kpis{grid-template-columns:1fr 1fr}.main{padding:14px}}@media(max-width:580px){.kpis{grid-template-columns:1fr}.top{position:static}}
</style></head><body>
<header class="top"><div class="brand"><div class="mark"></div><div><h1>Khaled S. — Financial Crime Transformation</h1><span>current state · requirements · future state · controls · decisions</span></div></div><div class="demo">Illustrative data</div></header>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Overview','Transformation overview','A decision-oriented view of issues, outcomes, dependencies and work requiring alignment.'],['Current state','Current-state analysis','Illustrative pain points across customer, operations, data, risk and technology.'],['Future state','Future-state outcomes','Target outcomes expressed as business capabilities and measurable improvements.'],['Requirements','Requirements traceability','A simple line from business need to requirement, control and evidence.'],['Impacts','Impact assessment','Illustrative impacts across people, process, technology, data, risk and controls.'],['Decisions','Decisions & dependencies','Items requiring resolution before design or implementation can progress.']];
let view=0,scenario=0;
const pain=[['Fragmented case information',76],['Duplicated manual review',68],['Inconsistent definitions',72],['Delayed intelligence feedback',61],['Control hand-offs',66]];
const outcomes=[['Shared risk view',88],['Clear case ownership',90],['Reusable intelligence',84],['Consistent control logic',92],['Decision traceability',89]];
const reqs=[
['REQ-01','Common customer-risk view','Customer and risk teams need consistent context','Data mapping and ownership agreed','Design'],
['REQ-02','Traceable control decisions','Control changes need evidence and approval history','Decision log and versioned rules','Ready'],
['REQ-03','Reusable intelligence feedback','Emerging intelligence should inform detection and operations','Structured feedback process','Design'],
['REQ-04','Consistent case hand-off','Operations need clear ownership and minimum information','Standard hand-off criteria','Review'],
['REQ-05','Exception management','Material data or control exceptions require defined action','Exception threshold and escalation','Ready']
];
const decisions=[
['Customer-risk definition','Definition','Risk / Operations','Required before detailed design','Open'],
['Case ownership','Operating model','Operations','Required for hand-off design','Open'],
['Data-source priority','Data','Technology / Data','Required for common view','Review'],
['Control change approval','Governance','Risk','Required for rule traceability','Agreed'],
['Intelligence feedback loop','Process','Intelligence / Operations','Required for learning cycle','Review']
];
const scenarios=[
['Base plan',[78,74,81,76,72],5],
['Data first',[84,72,86,80,76],4],
['Control first',[76,79,78,88,82],3],
['Integrated',[90,88,91,92,89],2]
];
function badge(s){let c=/agreed|ready/i.test(s)?'good':/open/i.test(s)?'bad':'warn';return '<span class="badge '+c+'">'+s+'</span>'}
function bars(arr){return '<div class="bars">'+arr.map(x=>'<div class="barrow"><label>'+x[0]+'</label><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><div class="score">'+x[1]+'%</div></div>').join('')+'</div>'}
function nav(){return V.map((x,i)=>'<button class="nav '+(i===view?'active':'')+'" onclick="view='+i+';render()"><span class="num">0'+(i+1)+'</span><span class="label">'+x[0]+'</span></button>').join('')+'<div class="meta">Illustrative transformation example using fictional data. It demonstrates business-analysis methods and does not represent any organisation\'s actual processes, customers, controls or systems.</div>'}
function head(){return '<div class="head"><div><h2>'+V[view][1]+'</h2><p>'+V[view][2]+'</p></div></div>'}
function overview(){return head()+'<div class="grid kpis"><div class="card"><div class="eyebrow">Open decisions</div><div class="value">5</div><div class="sub">2 block detailed design</div></div><div class="card"><div class="eyebrow">Priority requirements</div><div class="value">18</div><div class="sub">5 shown in this example</div></div><div class="card"><div class="eyebrow">Critical dependencies</div><div class="value">4</div><div class="sub">data, ownership and controls</div></div><div class="card"><div class="eyebrow">Future-state clarity</div><div class="value">82%</div><div class="sub">business outcomes defined</div></div><div class="card"><div class="eyebrow">Implementation readiness</div><div class="value">61%</div><div class="sub">design decisions remain</div></div></div><div class="grid two"><div class="card"><div class="section-title"><div><h3>Current-state pressure points</h3><p>Illustrative severity by theme.</p></div></div>'+bars(pain)+'</div><div class="decision"><div class="eyebrow">Decision focus</div><strong>Agree customer-risk definition and case ownership before detailed solution design</strong><span>Both decisions affect requirements across process, data, technology and controls. Progressing design without them would create avoidable rework.</span></div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><div><h3>Target outcomes</h3><p>Outcome measures rather than technology features.</p></div></div>'+bars(outcomes)+'</div><div class="card"><div class="section-title"><div><h3>Discovery to implementation</h3><p>Business analysis remains linked to intended outcomes.</p></div></div><div class="flow"><div class="node"><b>Discover</b><span>Problem, evidence and stakeholder needs</span></div><div class="arrow">→</div><div class="node"><b>Design</b><span>Options, requirements and impacts</span></div><div class="arrow">→</div><div class="node"><b>Decide</b><span>Trade-offs and agreed direction</span></div><div class="arrow">→</div><div class="node"><b>Implement</b><span>Trace requirements and readiness</span></div></div></div></div>'}
function currentState(){return head()+'<div class="grid twoeq"><div class="card"><div class="section-title"><div><h3>Current-state issues</h3><p>Evidence is separated from interpretation before future-state design begins.</p></div></div>'+bars(pain)+'</div><div class="card"><div class="section-title"><div><h3>Issue framing</h3><p>Illustrative examples.</p></div></div><div class="callout"><b>Process:</b> repeated review of the same customer context across separate activities.</div><div class="callout" style="margin-top:7px"><b>Data:</b> different source systems use different definitions or update timings.</div><div class="callout" style="margin-top:7px"><b>Control:</b> hand-offs make it difficult to trace why a case or rule changed.</div><div class="callout" style="margin-top:7px"><b>Intelligence:</b> emerging findings are not consistently fed back into operational controls.</div></div></div><div class="card" style="margin-top:10px"><div class="section-title"><div><h3>Current-state investigation</h3><p>What is tested before proposing a future state.</p></div></div><div class="flow"><div class="node"><b>Observe</b><span>Process, data and control evidence</span></div><div class="arrow">→</div><div class="node"><b>Validate</b><span>Definitions, sources and exceptions</span></div><div class="arrow">→</div><div class="node"><b>Explain</b><span>Root cause vs symptom</span></div><div class="arrow">→</div><div class="node"><b>Frame</b><span>Business problem and outcome</span></div></div></div>'}
function futureState(){return head()+'<div class="grid two"><div class="card"><div class="section-title"><div><h3>Future-state outcomes</h3><p>Target position expressed without prescribing a specific technology solution.</p></div></div>'+bars(outcomes)+'</div><div class="decision"><div class="eyebrow">Design principle</div><strong>Define the required business outcome before selecting the mechanism</strong><span>Process improvement, data change, control redesign, automation and AI should be assessed against the same intended outcome rather than treated as goals themselves.</span></div></div><div class="card" style="margin-top:10px"><div class="table"><table><thead><tr><th>Outcome</th><th>Current problem</th><th>Future-state measure</th><th>Evidence</th></tr></thead><tbody><tr><td>Common risk context</td><td>Fragmented views</td><td>Shared minimum risk information</td><td>Reduced repeated review</td></tr><tr><td>Clear ownership</td><td>Hand-off ambiguity</td><td>Named owner at each stage</td><td>Fewer unresolved transfers</td></tr><tr><td>Reusable intelligence</td><td>Feedback is inconsistent</td><td>Structured feedback cycle</td><td>Findings reflected in controls</td></tr><tr><td>Traceable control change</td><td>Decision history is fragmented</td><td>Rule, rationale and approval linked</td><td>Auditable change record</td></tr></tbody></table></div></div>'}
function requirements(){return head()+'<div class="card"><div class="section-title"><div><h3>Requirements traceability</h3><p>Illustrative line from need to requirement, control and status.</p></div></div><div>'+reqs.map(r=>'<div class="req"><div class="rid">'+r[0]+'</div><div><b>'+r[1]+'</b><br><span>'+r[2]+'</span></div><div>'+r[3]+'</div><div>'+badge(r[4])+'</div></div>').join('')+'</div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><div><h3>Requirement quality</h3><p>Controls before baseline.</p></div></div>'+bars([['Clear outcome link',93],['Source identified',88],['Acceptance evidence',81],['Owner agreed',84],['Dependency mapped',78]])+'</div><div class="card"><div class="section-title"><div><h3>Traceability chain</h3><p>Each requirement remains tied to the reason it exists.</p></div></div><div class="flow"><div class="node"><b>Business need</b><span>Problem or outcome</span></div><div class="arrow">→</div><div class="node"><b>Requirement</b><span>What must be true</span></div><div class="arrow">→</div><div class="node"><b>Control / design</b><span>How addressed</span></div><div class="arrow">→</div><div class="node"><b>Evidence</b><span>How confirmed</span></div></div></div></div>'}
function impacts(){return head()+'<div class="card"><div class="section-title"><div><h3>Impact heatmap</h3><p>Illustrative intensity of change by workstream.</p></div></div><div class="heat"><div></div><div class="hh">People</div><div class="hh">Process</div><div class="hh">Technology</div><div class="hh">Data</div><div class="hh">Controls</div><div class="hl">Risk assessment</div><div class="hc mid">3</div><div class="hc hi">4</div><div class="hc mid">3</div><div class="hc hi">5</div><div class="hc hi">4</div><div class="hl">Case management</div><div class="hc hi">4</div><div class="hc hi">5</div><div class="hc hi">4</div><div class="hc mid">3</div><div class="hc hi">4</div><div class="hl">Intelligence feedback</div><div class="hc mid">3</div><div class="hc hi">4</div><div class="hc mid">3</div><div class="hc hi">4</div><div class="hc hi">4</div><div class="hl">Control change</div><div class="hc mid">2</div><div class="hc hi">4</div><div class="hc mid">3</div><div class="hc mid">3</div><div class="hc hi">5</div></div></div><div class="grid twoeq" style="margin-top:10px"><div class="card"><div class="section-title"><div><h3>Implementation considerations</h3><p>Items that need resolution before operational transition.</p></div></div>'+bars([['Process ownership',72],['Data mapping',81],['Control approval',88],['Training impact',64],['Operational readiness',61]])+'</div><div class="decision"><div class="eyebrow">Readiness</div><strong>Requirements are not complete when they are documented</strong><span>They remain useful only if ownership, dependencies, acceptance evidence and implementation impacts stay connected as the design changes.</span></div></div>'}
function decisionsView(){const s=scenarios[scenario];return head()+'<div class="scenario-row">'+scenarios.map((x,i)=>'<button class="scenario '+(i===scenario?'active':'')+'" onclick="scenario='+i+';render()">'+x[0]+'</button>').join('')+'</div><div class="grid kpis"><div class="card"><div class="eyebrow">Customer clarity</div><div class="value">'+s[1][0]+'%</div></div><div class="card"><div class="eyebrow">Process clarity</div><div class="value">'+s[1][1]+'%</div></div><div class="card"><div class="eyebrow">Data readiness</div><div class="value">'+s[1][2]+'%</div></div><div class="card"><div class="eyebrow">Control readiness</div><div class="value">'+s[1][3]+'%</div></div><div class="card"><div class="eyebrow">Open blockers</div><div class="value">'+s[2]+'</div></div></div><div class="card"><div class="section-title"><div><h3>Decision register</h3><p>Issues that affect requirements or implementation.</p></div></div><div class="table"><table><thead><tr><th>Decision</th><th>Type</th><th>Primary stakeholders</th><th>Why it matters</th><th>Status</th></tr></thead><tbody>'+decisions.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+badge(r[4])+'</td></tr>').join('')+'</tbody></table></div></div>'}
function render(){document.getElementById('side').innerHTML='<div class="side-title">Transformation</div>'+nav();document.getElementById('main').innerHTML=[overview,currentState,futureState,requirements,impacts,decisionsView][view]()}
render();
</script></body></html>
