<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button,select{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.header{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:10px;align-items:center;min-width:240px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative;box-shadow:var(--shadow-sm)}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}
.brand-mark:before{top:11px}.brand-mark:after{top:20px}
.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.select,.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}
.theme-btn{display:flex;align-items:center;gap:7px;font-weight:600}.theme-orb{width:10px;height:10px;border-radius:50%;background:#e0a72f;box-shadow:0 0 0 4px rgba(224,167,47,.14)}

.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}
.side-title{font:400 .5rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:0 9px 8px}
.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}
.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}
.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}
.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink-2)}
.main{min-width:0;padding:20px 24px 44px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}
.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:850px;color:var(--ink-2);font-size:.69rem;line-height:1.45}
.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}
.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}
.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.kpi{display:flex;justify-content:space-between;gap:7px}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}
.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:500 .54rem/1 var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.good{color:var(--ok);background:var(--ok-dim)}.warn{color:var(--warn);background:var(--warn-dim)}.bad{color:var(--risk);background:var(--risk-dim)}
.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--ink-2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}
.chart-wrap{position:relative}.chart{width:100%;height:205px;display:block;overflow:visible}.chart-sm{height:145px}
.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--ink-3);font:8px var(--mono)}.band{fill:var(--warn-dim);opacity:.85}.band-risk{fill:var(--risk-dim);opacity:.8}
.line-a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-gold{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}

.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}
.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}
.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.tab,.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:6px 8px;font-size:.58rem}.tab.active,.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}
.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{text-align:left}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}
.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}
.note{font-size:.54rem;color:var(--ink-3);line-height:1.45;margin-top:6px}
@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.header{align-items:flex-start;flex-wrap:wrap}}

</style>

function smoothPath(points){if(points.length<2)return"";let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const p0=points[i],p1=points[i+1],mx=(p0[0]+p1[0])/2;d+=` C ${mx} ${p0[1]}, ${mx} ${p1[1]}, ${p1[0]} ${p1[1]}`;}return d;}
function bindTooltips(){const tip=document.getElementById("tooltip");document.querySelectorAll("[data-tip]").forEach(el=>{el.addEventListener("mouseenter",()=>{tip.innerHTML=el.dataset.tip;tip.style.display="block"});el.addEventListener("mousemove",e=>{const r=tip.getBoundingClientRect(),pad=12,gap=14;let l=e.clientX+gap,t=e.clientY+gap;if(l+r.width+pad>innerWidth)l=e.clientX-r.width-gap;if(t+r.height+pad>innerHeight)t=e.clientY-r.height-gap;tip.style.left=Math.max(pad,l)+"px";tip.style.top=Math.max(pad,t)+"px";});el.addEventListener("mouseleave",()=>tip.style.display="none");})}
function lineChart(series, second=null){const w=650,h=220,p=28,all=[...series,...(second||[])],min=Math.min(...all)-2,max=Math.max(...all)+2,pts=series.map((v,i)=>[p+i/(series.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),pts2=second?second.map((v,i)=>[p+i/(second.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]):[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join("")}<path class="line-a" d="${smoothPath(pts)}"/>${second?`<path class="line-b" d="${smoothPath(pts2)}"/>`:""}${pts.map((q,i)=>`<circle class="hoverable" data-tip="<strong>Period ${i+1}</strong>Primary ${series[i]}" cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join("")}</svg>`}
function barLine(rows){const w=650,h=220,pL=42,pR=24,pT=18,pB=28,slot=(w-pL-pR)/rows.length,maxB=Math.max(...rows.map(x=>Math.max(x.a,x.b)))*1.12,maxL=Math.max(...rows.map(x=>x.line),1)*1.15,bars=rows.map((d,i)=>{const x=pL+i*slot+slot*.14,ah=d.a/maxB*(h-pT-pB),bh=d.b/maxB*(h-pT-pB);return `<rect class="hoverable" data-tip="<strong>${d.label}</strong>${CFG.seriesLabels[0]} ${d.a}<br>${CFG.seriesLabels[1]} ${d.b}<br>${CFG.lineLabel} ${d.line}" x="${x}" y="${h-pB-ah}" width="${slot*.25}" height="${ah}" rx="3" fill="var(--blue)" opacity=".78"/><rect class="hoverable" data-tip="<strong>${d.label}</strong>${CFG.seriesLabels[1]} ${d.b}" x="${x+slot*.29}" y="${h-pB-bh}" width="${slot*.25}" height="${bh}" rx="3" fill="var(--gold)" opacity=".86"/>`;}).join(""),pts=rows.map((d,i)=>[pL+i*slot+slot*.42,pT+(maxL-d.line)/maxL*(h-pT-pB)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join("")}${bars}<path class="line-risk" d="${smoothPath(pts)}"/>${rows.map((d,i)=>`<text class="tick" x="${pL+i*slot+slot*.16}" y="${h-8}">${d.label}</text>`).join("")}</svg>`}
function metricBars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x.label}</label><div class="track"><div class="fill" style="width:${x.value}%"></div></div><div class="metric-score">${x.value}%</div></div>`).join("")}</div>`}
function renderOverview(){const k=CFG.kpis;return `<div class="page-head"><div><h2 class="page-title">${CFG.views[0].title}</h2><p class="page-desc">${CFG.views[0].desc}</p></div><span class="demo">Illustrative demonstration</span></div>
<section class="grid kpis">${k.map((x,i)=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub}</div></div><div class="kpi-icon">${x.icon}</div></div></div>`).join("")}</section>
<section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>${CFG.primaryChartTitle}</h3><p>${CFG.primaryChartSub}</p></div><div class="legend"><span><i style="background:var(--blue)"></i>${CFG.seriesLabels[0]}</span><span><i style="background:var(--gold)"></i>${CFG.seriesLabels[1]}</span><span><i style="background:var(--risk)"></i>${CFG.lineLabel}</span></div></div>${barLine(CFG.primaryRows)}</div>
<div class="card"><div class="chart-title"><div><h3>${CFG.healthTitle}</h3><p>${CFG.healthSub}</p></div></div>${metricBars(CFG.health)}<div class="status-summary"><span><i style="background:var(--ok)"></i>Strong</span><span><i style="background:var(--warn)"></i>Watch</span><span><i style="background:var(--risk)"></i>Intervene</span></div></div></section>
<section class="grid two"><div class="decision"><div class="eyebrow">Decision focus</div><h3>${CFG.decisionTitle}</h3><p>${CFG.decisionText}</p></div><div class="card"><div class="chart-title"><div><h3>Priority register</h3><p>Current items requiring attention or confirmation.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r.item}</td><td>${r.area}</td><td>${badge(r.status)}</td><td>${r.action}</td></tr>`).join("")}</tbody></table></div></div></section>`}
function renderPerformance(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[1].title}</h2><p class="page-desc">${CFG.views[1].desc}</p></div><span class="demo">Performance view</span></div>
<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>${CFG.trendTitle}</h3><p>${CFG.trendSub}</p></div></div>${lineChart(CFG.trendA,CFG.trendB)}</div><div class="card"><div class="chart-title"><div><h3>${CFG.mixTitle}</h3><p>${CFG.mixSub}</p></div></div>${metricBars(CFG.mix)}</div></section>
<section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>${CFG.performanceTableTitle}</h3><p>Selected measures and current position.</p></div></div><div class="table-wrap"><table><thead><tr>${CFG.performanceHeaders.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${CFG.performanceRows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===r.length-1?badge(v):v}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`}
function renderQuality(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[2].title}</h2><p class="page-desc">${CFG.views[2].desc}</p></div><span class="demo">Assurance view</span></div>
<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heatmap"><div></div>${["Complete","Accurate","Timely","Controlled"].map(x=>`<div class="heat-head">${x}</div>`).join("")}${CFG.quality.map(q=>`<div class="heat-label">${q.label}</div>${q.values.map(v=>`<div class="heat-cell ${v>=90?"hi":v>=80?"mid":"lo"}">${v}</div>`).join("")}`).join("")}</div></div>
<div class="card"><div class="chart-title"><div><h3>Validation pathway</h3><p>From source to trusted decision product.</p></div></div><div class="flow">${CFG.flow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':""}<div class="node ${i===0?"active":""}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join("")}</div></div></section>
<section class="grid two" style="margin-top:10px"><div class="card"><div class="chart-title"><div><h3>Issue ageing</h3><p>Illustrative open-item profile.</p></div></div>${metricBars(CFG.issueAge)}</div><div class="decision"><div class="eyebrow">Assurance principle</div><h3>${CFG.assuranceTitle}</h3><p>${CFG.assuranceText}</p></div></section>`}
function renderScenario(){const s=CFG.scenarios[state.scenario];return `<div class="page-head"><div><h2 class="page-title">${CFG.views[3].title}</h2><p class="page-desc">${CFG.views[3].desc}</p></div><span class="demo">Scenario view</span></div>
<div class="scenarios">${CFG.scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?"active":""}" data-sc="${i}"><strong>${x.name}</strong><span>${x.note}</span></button>`).join("")}</div>
<section class="grid kpis">${s.kpis.map(x=>`<div class="card"><div class="eyebrow">${x.label}</div><div class="kpi-value">${x.value}</div><div class="kpi-sub">${x.sub}</div></div>`).join("")}</section>
<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>${CFG.scenarioChartTitle}</h3><p>Comparison of baseline and selected scenario trajectory.</p></div></div>${lineChart(CFG.scenarios[0].series,s.series)}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s.decision}</h3><p>${s.detail}</p></div></section>`}
function renderGovernance(){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[4].title}</h2><p class="page-desc">${CFG.views[4].desc}</p></div><span class="demo">Governance view</span></div>
<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Measure lineage</h3><p>Trace key measures from decision output back to controlled source.</p></div></div><div class="flow">${CFG.lineage.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':""}<div class="node ${i===0?"active":""}"><div class="nt">${x.title}</div><div class="nb">${x.text}</div></div>`).join("")}</div></div>
<div class="card"><div class="chart-title"><div><h3>Governance timeline</h3><p>Control and review rhythm.</p></div></div><div class="timeline">${CFG.timeline.map(x=>`<div class="tl ${x.cls}"><span class="tl-dot"></span><strong>${x.title}</strong><p>${x.text}</p></div>`).join("")}</div></div></section>
<section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>${CFG.governanceTableTitle}</h3><p>Ownership, evidence and next action.</p></div></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${CFG.governanceRows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join("")}</tbody></table></div></section>`}
const RENDERERS=[renderOverview,renderPerformance,renderQuality,renderScenario,renderGovernance];
function renderSidebar(){const s=document.getElementById("sidebar");s.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?"active":""}" data-view="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v.nav}</span></button>`).join("")}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Designed for role-relevant decision support</div>`;s.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{state.view=+b.dataset.view;render()}));}
function render(){document.getElementById("main").innerHTML=RENDERERS[state.view]();renderSidebar();bindTooltips();document.querySelectorAll("[data-sc]").forEach(b=>b.addEventListener("click",()=>{state.scenario=+b.dataset.sc;render()}));}
document.getElementById("themeBtn").addEventListener("click",()=>{const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";document.getElementById("themeText").textContent=dark?"Dark":"Light";});
render();
</script>
</body></html>
