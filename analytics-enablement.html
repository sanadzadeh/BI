<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Analytics Enablement Dashboard</title><meta name="description" content="Analytics discovery, trusted insight reuse, AI search and enterprise knowledge enablement dashboard."><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;--border:#d8e0e5;--ink:#18232c;--ink2:#55636f;--ink3:#7b8893;--accent:#0b5d6b;--accentdim:#e4f1f2;--blue:#4a7897;--gold:#b58b48;--ok:#3f7a4c;--warn:#a3720a;--risk:#a23b2e;--shadow:0 2px 8px rgba(34,48,58,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}:root[data-theme="dark"]{--paper:#11171c;--surface:#182027;--surface-alt:#1e2830;--surface-deep:#25313a;--border:#2f3b44;--ink:#edf2f4;--ink2:#aab5be;--ink3:#81909b;--accent:#61c5bf;--accentdim:#173335;--blue:#7ba9c8;--gold:#c9a86d;--ok:#7fc98f;--warn:#e0ad4c;--risk:#e08a7a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative}.mark:before,.mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff}.mark:before{top:11px}.mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:.52rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.controls{display:flex;gap:7px}.controls select,.controls button{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}.app{display:grid;grid-template-columns:210px 1fr}.side{position:sticky;top:55px;height:calc(100vh - 55px);background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}.side-title{font:.5rem var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav.active{background:var(--accentdim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:.53rem var(--mono);color:var(--ink3)}.nav-label{font-size:.71rem;font-weight:600}.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.58rem;line-height:1.5;color:var(--ink2)}.main{padding:20px 24px 44px;min-width:0}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.head h2{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.head p{margin:0;color:var(--ink2);font-size:.69rem}.tag{font:.5rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accentdim);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:13px}.eyebrow{font:.49rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink2);margin-top:5px}.icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accentdim);color:var(--accent);font:.54rem var(--mono)}.chart-title{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink3);margin:3px 0 0}.chart{width:100%;height:205px}.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.linea{fill:none;stroke:var(--accent);stroke-width:3}.lineb{fill:none;stroke:var(--blue);stroke-width:2.5}.metric{display:grid;grid-template-columns:130px 1fr 42px;gap:8px;align-items:center;margin:9px 0}.metric label{font-size:.59rem;color:var(--ink2)}.track{height:7px;background:var(--surface-deep);border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:999px}.score{font:.55rem var(--mono);text-align:right;color:var(--ink2)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:.59rem}th{font:.47rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:var(--surface-alt)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:.55rem;font-weight:700}.good{background:#e8f3eb;color:var(--ok)}.warn{background:#fbf1dc;color:var(--warn)}.bad{background:#f8e8e5;color:var(--risk)}.heatmap{display:grid;grid-template-columns:145px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:.48rem var(--mono);text-align:center;color:var(--ink3);text-transform:uppercase}.heat-label{font-size:.59rem;color:var(--ink2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:white;font:.52rem var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:155px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accentdim);border-color:var(--accent)}.nt{font:.48rem var(--mono);text-transform:uppercase;color:var(--ink3);margin-bottom:5px}.nb{font-size:.58rem;color:var(--ink2);line-height:1.4}.arrow{align-self:center;color:var(--ink3)}.decision{border-left:4px solid var(--accent);background:var(--surface);border-radius:11px;padding:12px;box-shadow:var(--shadow)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;color:var(--ink2);margin:0;line-height:1.45}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink2);border-radius:6px;padding:6px 8px;font-size:.58rem;text-align:left}.scenario.active{background:var(--accentdim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong,.scenario span{display:block}.scenario span{font-size:.51rem;color:var(--ink3);margin-top:3px}.timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl-dot{position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;color:var(--ink2)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.scenarios{grid-template-columns:1fr}.main{padding:16px 12px}}
</style></head><body><div class="header"><div class="brand"><div class="mark"></div><div><h1>Analytics Enablement</h1><p>discovery · trusted insights · reuse · AI search</p></div></div><div class="controls"><select><option>Enterprise view</option><option>Business unit</option><option>Priority domain</option></select><select><option>Current month</option><option>Quarter to date</option></select><button id="theme">Dark</button></div></div><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><script>
const views=[['Overview','Analytics enablement overview','Discovery, trust, reuse and adoption across shared analytical capability.'],['Discovery','Insight discovery','How users find trusted analytics, answers and organisational knowledge.'],['Trust & reuse','Trust and reuse','Certification, reuse and duplication across analytical assets.'],['AI search','AI-assisted search','Search quality, answer confidence and escalation controls.'],['Roadmap','Enablement roadmap','Priorities, dependencies and capability delivery.']];let state={view:0};const kpis=[['Trusted assets','486','+38 this quarter','TA'],['Search success','82%','+9pp since baseline','SS'],['Reuse rate','67%','+14pp','RR'],['Duplicate reports','41','-23%','DR']];function badge(s){return `<span class="badge ${/strong|on track|certified/i.test(s)?'good':/watch|review/i.test(s)?'warn':'bad'}">${s}</span>`}function metric(n,v){return `<div class="metric"><label>${n}</label><div class="track"><div class="fill" style="width:${v}%"></div></div><div class="score">${v}%</div></div>`}function line(a,b){const w=620,h=210,p=28,min=40,max=100,pts=x=>x.map((v,i)=>[p+i/(x.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),path=q=>q.map((p,i)=>`${i?'L':'M'} ${p[0]} ${p[1]}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[40,90,140,190].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="linea" d="${path(pts(a))}"/><path class="lineb" d="${path(pts(b))}"/></svg>`}function head(i,t){return `<div class="head"><div><h2>${views[i][1]}</h2><p>${views[i][2]}</p></div><span class="tag">${t}</span></div>`}function overview(){return `${head(0,'Executive view')}<div class="grid kpis">${kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">${x[2]}</div></div><div class="icon">${x[3]}</div></div></div>`).join('')}</div><div class="grid two" style="margin-bottom:10px"><div class="card"><div class="chart-title"><div><h3>Discovery and reuse trend</h3><p>Search success vs reuse rate.</p></div></div>${line([63,66,68,71,73,76,78,79,81,82],[42,45,48,50,53,56,59,62,65,67])}</div><div class="card"><div class="chart-title"><div><h3>Capability health</h3><p>Selected enablement measures.</p></div></div>${metric('Trusted coverage',91)}${metric('Search relevance',84)}${metric('Metadata completeness',88)}${metric('Reuse adoption',67)}${metric('Owner coverage',94)}</div></div><div class="grid two"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Improve findability before adding more content</h3><p>Prioritise trusted metadata, ownership and search relevance in the domains with the highest duplicate-report volume.</p></div><div class="card"><div class="chart-title"><div><h3>Priority register</h3><p>Current enablement items.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Signal</th><th>Status</th><th>Next action</th></tr></thead><tbody><tr><td>Duplicate KPI packs</td><td>14 variants</td><td>${badge('Review')}</td><td>Consolidate definition</td></tr><tr><td>Search gaps</td><td>Finance domain</td><td>${badge('Watch')}</td><td>Improve metadata</td></tr><tr><td>Certified insight set</td><td>Risk domain</td><td>${badge('On track')}</td><td>Expand reuse</td></tr><tr><td>Asset ownership</td><td>94%</td><td>${badge('On track')}</td><td>Close remaining gaps</td></tr></tbody></table></div></div></div>`}function discovery(){return `${head(1,'Discovery view')}<div class="grid kpis"><div class="card"><div class="eyebrow">Searches / month</div><div class="kpi-value">18.4k</div><div class="kpi-sub">+11%</div></div><div class="card"><div class="eyebrow">Answer found</div><div class="kpi-value">82%</div><div class="kpi-sub">Current</div></div><div class="card"><div class="eyebrow">Time to answer</div><div class="kpi-value">2.8m</div><div class="kpi-sub">Median</div></div><div class="card"><div class="eyebrow">Escalated searches</div><div class="kpi-value">7%</div><div class="kpi-sub">Need owner help</div></div></div><div class="grid two"><div class="card"><div class="chart-title"><div><h3>Search success by domain</h3><p>Current findability.</p></div></div>${metric('Finance',76)}${metric('Risk',89)}${metric('Technology',83)}${metric('Customer',81)}${metric('Operations',86)}</div><div class="card"><div class="chart-title"><div><h3>Discovery funnel</h3><p>From question to trusted answer.</p></div></div><div class="flow"><div class="node active"><div class="nt">Question</div><div class="nb">Natural-language intent</div></div><div class="arrow">→</div><div class="node"><div class="nt">Search</div><div class="nb">Metadata + semantic match</div></div><div class="arrow">→</div><div class="node"><div class="nt">Trust</div><div class="nb">Owner + certification</div></div><div class="arrow">→</div><div class="node"><div class="nt">Reuse</div><div class="nb">Insight or asset reused</div></div></div></div></div>`}function trust(){return `${head(2,'Trust view')}<div class="grid two"><div class="card"><div class="chart-title"><div><h3>Trust heatmap</h3><p>Coverage by control dimension.</p></div></div><div class="heatmap"><div></div>${['Owner','Definition','Lineage','Certified'].map(x=>`<div class="heat-head">${x}</div>`).join('')}<div class="heat-label">Finance</div><div class="heat-cell hi">96</div><div class="heat-cell hi">94</div><div class="heat-cell mid">88</div><div class="heat-cell hi">92</div><div class="heat-label">Risk</div><div class="heat-cell hi">98</div><div class="heat-cell hi">96</div><div class="heat-cell hi">93</div><div class="heat-cell hi">95</div><div class="heat-label">Technology</div><div class="heat-cell hi">94</div><div class="heat-cell mid">87</div><div class="heat-cell mid">84</div><div class="heat-cell mid">89</div><div class="heat-label">Operations</div><div class="heat-cell hi">95</div><div class="heat-cell hi">91</div><div class="heat-cell mid">86</div><div class="heat-cell hi">90</div></div></div><div class="card"><div class="chart-title"><div><h3>Reuse profile</h3><p>Assets used beyond original team.</p></div></div>${metric('Certified dashboards',79)}${metric('Metric definitions',74)}${metric('Analytical models',61)}${metric('Knowledge articles',57)}${metric('Reusable queries',52)}</div></div><div class="card" style="margin-top:10px"><div class="table-wrap"><table><thead><tr><th>Asset</th><th>Domain</th><th>Monthly users</th><th>Reuse</th><th>Status</th></tr></thead><tbody><tr><td>Investment planning scorecard</td><td>Finance</td><td>148</td><td>High</td><td>${badge('Certified')}</td></tr><tr><td>Delivery health view</td><td>Technology</td><td>93</td><td>Medium</td><td>${badge('On track')}</td></tr><tr><td>Risk metric catalogue</td><td>Risk</td><td>171</td><td>High</td><td>${badge('Certified')}</td></tr><tr><td>Operations pack</td><td>Operations</td><td>64</td><td>Low</td><td>${badge('Review')}</td></tr></tbody></table></div></div>`}function ai(){return `${head(3,'AI search view')}<div class="grid kpis"><div class="card"><div class="eyebrow">Answer confidence</div><div class="kpi-value">87%</div><div class="kpi-sub">Reviewed sample</div></div><div class="card"><div class="eyebrow">Grounded answers</div><div class="kpi-value">92%</div><div class="kpi-sub">Source-linked</div></div><div class="card"><div class="eyebrow">Human escalation</div><div class="kpi-value">8%</div><div class="kpi-sub">Ambiguous queries</div></div><div class="card"><div class="eyebrow">Unsupported answers</div><div class="kpi-value">2.1%</div><div class="kpi-sub">Quality sample</div></div></div><div class="grid two"><div class="card"><div class="chart-title"><div><h3>AI search control path</h3><p>Question to reviewed answer.</p></div></div><div class="flow"><div class="node active"><div class="nt">Intent</div><div class="nb">User question</div></div><div class="arrow">→</div><div class="node"><div class="nt">Retrieve</div><div class="nb">Trusted sources only</div></div><div class="arrow">→</div><div class="node"><div class="nt">Generate</div><div class="nb">Grounded answer</div></div><div class="arrow">→</div><div class="node"><div class="nt">Check</div><div class="nb">Confidence + citations</div></div><div class="arrow">→</div><div class="node"><div class="nt">Escalate</div><div class="nb">Owner where needed</div></div></div></div><div class="decision"><div class="eyebrow">Control principle</div><h3>Search should fail safely when the evidence is weak</h3><p>Low-confidence questions should route to an owner or source set rather than return a polished unsupported answer.</p></div></div>`}function roadmap(){return `${head(4,'Roadmap view')}<div class="scenarios"><button class="scenario active"><strong>Q4 foundation</strong><span>Trust + metadata</span></button><button class="scenario"><strong>Q1 discovery</strong><span>Search + catalogue</span></button><button class="scenario"><strong>Q2 reuse</strong><span>Recommendations</span></button><button class="scenario"><strong>Q3 AI assist</strong><span>Grounded answers</span></button></div><div class="grid two"><div class="card"><div class="chart-title"><div><h3>Delivery roadmap</h3><p>Capability sequence.</p></div></div><div class="timeline"><div class="tl"><span class="tl-dot"></span><strong>Trusted asset baseline</strong><p>Owners, definitions and certification</p></div><div class="tl"><span class="tl-dot"></span><strong>Unified discovery</strong><p>Search across analytical assets</p></div><div class="tl"><span class="tl-dot"></span><strong>Reuse recommendations</strong><p>Surface existing insight before new build</p></div><div class="tl"><span class="tl-dot"></span><strong>AI-assisted answers</strong><p>Grounded response with escalation</p></div></div></div><div class="card"><div class="chart-title"><div><h3>Roadmap health</h3><p>Current readiness.</p></div></div>${metric('Architecture alignment',88)}${metric('Metadata readiness',84)}${metric('Business ownership',91)}${metric('Search quality baseline',78)}${metric('AI control design',74)}</div></div>`}function renderSide(){side.innerHTML=`<div class="side-title">Product views</div>${views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-v="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v[0]}</span></button>`).join('')}<div class="side-meta">Illustrative data only<br>Internal dashboard-style example</div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.v;render()})}function render(){main.innerHTML=[overview,discovery,trust,ai,roadmap][state.view]();renderSide()}theme.onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';theme.textContent=dark?'Dark':'Light'};render();
</script></body></html>
