<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise BI Development Portfolio - Khaled Sanad</title><meta name="description" content="Illustrative enterprise business intelligence portfolio covering integrated data, transformation, modelling, reporting and governance."><style>:root{--bg:#f4f6f7;--card:#fff;--soft:#eef3f5;--line:#d8e0e5;--ink:#18232c;--muted:#64727d;--a:#0b5d6b;--b:#4a7897;--ok:#3f7a4c;--warn:#a3720a;--risk:#a23b2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:center}.header h1{font-size:20px;margin:0}.header p{margin:3px 0 0;color:var(--muted);font-size:11px}.tag{font-size:10px;padding:5px 8px;border:1px solid #b9d6d9;background:#e8f3f4;color:var(--a);border-radius:99px}.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 62px)}.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px}.nav{display:block;width:100%;text-align:left;padding:9px 10px;border:0;background:transparent;border-left:3px solid transparent;color:var(--muted);border-radius:6px;margin-bottom:4px;cursor:pointer}.nav.active{background:#e8f3f4;border-left-color:var(--a);color:var(--a);font-weight:700}.main{padding:22px}.head h2{margin:0 0 5px;font-size:24px}.head p{margin:0 0 18px;color:var(--muted);font-size:13px;max-width:850px;line-height:1.5}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.15fr .85fr;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(25,40,50,.05)}.eye{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}.value{font-size:28px;font-weight:700;margin-top:5px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.section{font-size:14px;font-weight:700;margin:0 0 4px}.desc{font-size:11px;color:var(--muted);margin:0 0 12px}.bars{display:grid;gap:10px}.bar{display:grid;grid-template-columns:150px 1fr 42px;gap:8px;align-items:center;font-size:11px}.track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--b))}.score{text-align:right;font-size:10px;color:var(--muted)}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.node{background:#f7f9fa;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:105px}.node strong{font-size:11px}.node p{font-size:10px;color:var(--muted);line-height:1.4}.matrix{display:grid;grid-template-columns:150px repeat(4,1fr);gap:6px;align-items:center}.mh{font-size:9px;color:var(--muted);text-align:center;text-transform:uppercase}.ml{font-size:11px;color:var(--muted)}.cell{padding:9px 5px;border-radius:6px;text-align:center;color:#fff;font-size:10px}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{font-size:9px;text-transform:uppercase;color:var(--muted);background:#f7f9fa}.pill{display:inline-block;padding:3px 6px;border-radius:99px;font-size:9px}.good{background:#e8f3eb;color:var(--ok)}.watch{background:#fbf1dc;color:var(--warn)}.foot{margin-top:16px;font-size:10px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{white-space:nowrap;width:auto}.kpis,.two{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.main{padding:14px}}</style></head><body><header class="header"><div><h1>Khaled S. - Enterprise BI Development Portfolio</h1><p>integrated data · transformation · semantic modelling · reporting · governance</p></div><span class="tag">Illustrative data</span></header><div class="layout"><aside class="side"><button class="nav active" data-v="0">Executive overview</button><button class="nav" data-v="1">Data model</button><button class="nav" data-v="2">Data assurance</button><button class="nav" data-v="3">Delivery</button><button class="nav" data-v="4">Governance</button></aside><main class="main" id="main"></main></div><script>const views=[{t:'Enterprise BI overview',d:'An illustrative view of how integrated financial and operational data can move from source systems through governed transformation and modelling into decision-ready reporting.',body:`<div class="grid kpis"><div class="card"><div class="eye">Source domains</div><div class="value">8</div><div class="sub">Finance, procurement, revenue, activity and operational inputs</div></div><div class="card"><div class="eye">Published measures</div><div class="value">46</div><div class="sub">Governed KPI and analytical measures</div></div><div class="card"><div class="eye">Refresh success</div><div class="value">98.2%</div><div class="sub">Illustrative scheduled refresh reliability</div></div><div class="card"><div class="eye">Data checks passed</div><div class="value">96%</div><div class="sub">Validation rules passing before publish</div></div></div><div class="grid two"><div class="card"><h3 class="section">Decision pipeline</h3><p class="desc">Business need to governed analytical product.</p><div class="flow"><div class="node"><strong>1. Business need</strong><p>Clarify the decision, users, grain, cadence and success measures.</p></div><div class="node"><strong>2. Source integration</strong><p>Map systems, keys, definitions, ownership and expected controls.</p></div><div class="node"><strong>3. Transform</strong><p>Standardise, reconcile, test business rules and document exceptions.</p></div><div class="node"><strong>4. Model</strong><p>Build reusable dimensions, facts, measures and traceable calculations.</p></div><div class="node"><strong>5. Publish</strong><p>Deliver dashboards, monitor quality and manage controlled change.</p></div></div></div><div class="card"><h3 class="section">Delivery readiness</h3><p class="desc">Illustrative quality signals.</p><div class="bars">${[['Source mapping',94],['Business rules',92],['Model documentation',88],['Measure validation',96],['Stakeholder acceptance',91]].map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="score">${x[1]}%</span></div>`).join('')}</div></div></div>`},{t:'Data model',d:'A reusable analytical model separates source-specific structures from governed business logic and reporting measures.',body:`<div class="card"><h3 class="section">Model layers</h3><p class="desc">A practical equivalent of a modern transformation framework, independent of any specific vendor.</p><div class="flow"><div class="node"><strong>Raw / source</strong><p>Preserve source fields, keys, load timestamps and ownership.</p></div><div class="node"><strong>Standardised</strong><p>Clean types, resolve naming, normalise codes and record data quality issues.</p></div><div class="node"><strong>Business layer</strong><p>Apply reusable definitions for cost, activity, revenue, supplier and organisational structures.</p></div><div class="node"><strong>Semantic model</strong><p>Dimensions, facts, relationships, calculation groups and governed measures.</p></div><div class="node"><strong>Reporting</strong><p>Executive, operational and exception views using one consistent measure set.</p></div></div></div><div class="card" style="margin-top:12px"><h3 class="section">Model coverage</h3><div class="matrix"><div></div><div class="mh">Mapping</div><div class="mh">Rules</div><div class="mh">Validation</div><div class="mh">Lineage</div>${[['Finance',['hi','hi','hi','hi']],['Procurement',['hi','hi','mid','hi']],['Revenue',['hi','mid','hi','mid']],['Activity',['mid','hi','hi','mid']]].map(r=>`<div class="ml">${r[0]}</div>${r[1].map((c,i)=>`<div class="cell ${c}">${c==='hi'?'Strong':'Review'}</div>`).join('')}`).join('')}</div></div>`},{t:'Data assurance',d:'Quality controls are designed into the path from source to report rather than added at the end.',body:`<div class="grid two"><div class="card"><h3 class="section">Validation framework</h3><div class="bars">${[['Completeness',97],['Key uniqueness',99],['Reference integrity',95],['Reconciliation',93],['Measure reasonableness',96]].map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="score">${x[1]}%</span></div>`).join('')}</div></div><div class="card"><h3 class="section">Exception handling</h3><table><tr><th>Issue</th><th>Control</th><th>Status</th></tr><tr><td>Duplicate business keys</td><td>Pre-load uniqueness test</td><td><span class="pill good">Controlled</span></td></tr><tr><td>Late source extract</td><td>Freshness threshold</td><td><span class="pill watch">Monitor</span></td></tr><tr><td>Definition mismatch</td><td>Metric register + owner sign-off</td><td><span class="pill good">Controlled</span></td></tr><tr><td>Unexpected variance</td><td>Period reconciliation + commentary</td><td><span class="pill good">Controlled</span></td></tr></table></div></div>`},{t:'Delivery',d:'Enterprise BI delivery requires technical build, prioritisation and stakeholder alignment to work together.',body:`<div class="card"><h3 class="section">Delivery rhythm</h3><table><tr><th>Stage</th><th>Key activity</th><th>Output</th></tr><tr><td>Discover</td><td>Decision need, users, source constraints, success measures</td><td>Agreed scope</td></tr><tr><td>Design</td><td>Grain, dimensions, measures, security, validation</td><td>Model and control design</td></tr><tr><td>Build</td><td>Transformations, semantic model, dashboards</td><td>Working product</td></tr><tr><td>Validate</td><td>Reconciliation, stakeholder walkthrough, edge cases</td><td>Acceptance evidence</td></tr><tr><td>Operate</td><td>Refresh, usage, defects, controlled enhancements</td><td>Trusted ongoing service</td></tr></table></div><div class="grid two"><div class="card"><h3 class="section">Priority balance</h3><div class="bars">${[['Business value',95],['Data readiness',82],['Delivery effort',74],['Control criticality',91],['Reuse potential',87]].map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="score">${x[1]}%</span></div>`).join('')}</div></div><div class="card"><h3 class="section">Definition of done</h3><p class="desc">A reporting product is not complete at dashboard publication.</p><table><tr><td>Measures agreed and documented</td><td><span class="pill good">Required</span></td></tr><tr><td>Source-to-output reconciliation complete</td><td><span class="pill good">Required</span></td></tr><tr><td>Refresh and failure handling defined</td><td><span class="pill good">Required</span></td></tr><tr><td>Stakeholder acceptance recorded</td><td><span class="pill good">Required</span></td></tr></table></div></div>`},{t:'Governance',d:'Traceability, privacy, ownership and controlled change are part of the product design.',body:`<div class="card"><h3 class="section">Governance chain</h3><div class="flow"><div class="node"><strong>Source owner</strong><p>Defines authority, availability and source meaning.</p></div><div class="node"><strong>Data contract</strong><p>Records keys, grain, expected fields and freshness.</p></div><div class="node"><strong>Transformation record</strong><p>Documents business rules, tests and exception treatment.</p></div><div class="node"><strong>Measure register</strong><p>Defines formulas, owners, interpretation and approved use.</p></div><div class="node"><strong>Release control</strong><p>Tracks changes, validation, approval and downstream impact.</p></div></div></div><div class="card" style="margin-top:12px"><h3 class="section">Control coverage</h3><div class="bars">${[['Lineage',91],['Access controls',95],['Privacy review',93],['Change records',88],['Documentation',90]].map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="score">${x[1]}%</span></div>`).join('')}</div></div>`}];function render(i){const v=views[i];document.getElementById('main').innerHTML=`<div class="head"><h2>${v.t}</h2><p>${v.d}</p></div>${v.body}<div class="foot">Illustrative portfolio example. Values are demonstration data and do not represent any organisation.</div>`;document.querySelectorAll('.nav').forEach((b,j)=>b.classList.toggle('active',j===i))}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>render(+b.dataset.v));render(0);</script></body></html>
