 const definition=clamp(d.definition+(quality-1)*11,50,99.9);
 const score=(completeness+reconciliation+timeliness+definition)/4;
 const cycle=clamp(d.cycle*pressure*(1-.53*(automation-.25))*(1+.45*(1-quality)),.5,8);
 const exceptions=Math.max(0,Math.round(d.exceptions*pressure*(2-quality)*(.5+.5*strictness)));
 const effort=d.manual*pressure*(1-.72*automation);
 const breach=score<(strictness*100-3) || reconciliation<strictness*100-2;
 return {...d,completeness,reconciliation,timeliness,definition,score,cycle,exceptions,effort,breach};
}
function model(s=state){
 const rows=baseline.map(d=>calcOne(d,s));
 const avg=k=>rows.reduce((n,r)=>n+r[k]*r.products,0)/rows.reduce((n,r)=>n+r.products,0);
 return {rows,products:rows.reduce((n,r)=>n+r.products,0),volume:rows.reduce((n,r)=>n+r.rows,0)*s.demand/100,quality:avg('score'),timeliness:avg('timeliness'),cycle:avg('cycle'),exceptions:rows.reduce((n,r)=>n+r.exceptions,0),effort:rows.reduce((n,r)=>n+r.effort,0),atRisk:rows.filter(r=>r.breach).length};
}
function badge(text,type){return '<span class="badge '+type+'">'+text+'</span>'}
function makeSide(m){
 const opts=[['base','Base'],['surge','Demand surge'],['disruption','Data disruption'],['uplift','Automation uplift']];
 const sliders=[['demand','Reporting demand',70,160,'%'],['automation','Automation coverage',0,100,'%'],['quality','Source-data quality',65,115,'%'],['strictness','Publication threshold',75,99,'%']];
 const read=state.atRisk===undefined?m.atRisk:state.atRisk;
 $('side').innerHTML='<div class="st">Views</div><div class="nav-list">'+Object.entries(viewNames).map(([id,label],i)=>'<button class="nav '+(state.view===id?'active':'')+'" data-view="'+id+'"><span class="nn">0'+(i+1)+'</span><span class="nl">'+label+'</span></button>').join('')+'</div>'+
 '<div class="readout" aria-live="polite"><div class="st" style="padding:0">Current readout</div><strong>'+m.atRisk+' of '+m.rows.length+' domains need review</strong><p>'+m.exceptions+' modeled open exceptions; '+pct(m.quality)+' portfolio assurance.</p></div>'+
 '<div class="mobile-controls" style="display:none"><button class="clearbtn" data-action="toggle">Scenario controls</button></div>'+
 '<div class="side-control-wrap" id="sideControls"><div class="side-group"><h4>Scenario</h4><div class="presets">'+opts.map(([k,n])=>'<button class="preset '+(state.scenario===k?'active':'')+'" data-preset="'+k+'">'+n+'</button>').join('')+'</div></div>'+
 '<div class="side-group"><h4>Assumptions</h4>'+sliders.map(([k,n,lo,hi,suffix])=>'<div class="ctrl"><label for="sl-'+k+'">'+n+'<output id="out-'+k+'">'+state[k]+suffix+'</output></label><input id="sl-'+k+'" data-control="'+k+'" type="range" min="'+lo+'" max="'+hi+'" step="1" value="'+state[k]+'"></div>').join('')+'<button class="clearbtn" data-action="reset">Reset assumptions</button></div>'+
 '<div class="side-group"><h4>Domain drill-down</h4><select id="domainSelect" class="domainselect">'+baseline.map(d=>'<option value="'+d.id+'" '+(state.domain===d.id?'selected':'')+'>'+d.name+'</option>').join('')+'</select><div class="side-footer">Synthetic demonstration data. Adjustments recalculate scores, exceptions, capacity and publication risks.</div></div></div>';
 document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>{state.view=e.dataset.view;render()});
 document.querySelectorAll('[data-preset]').forEach(e=>e.onclick=()=>{state.scenario=e.dataset.preset;Object.assign(state,presets[state.scenario]);render()});
 document.querySelectorAll('[data-control]').forEach(e=>e.oninput=()=>{state[e.dataset.control]=+e.value;state.scenario='custom';render();const x=$('sl-'+e.dataset.control);if(x)x.focus()});
 document.querySelectorAll('[data-action=reset]').forEach(e=>e.onclick=()=>{state.scenario='base';Object.assign(state,presets.base);render()});
 document.querySelectorAll('[data-action=toggle]').forEach(e=>e.onclick=()=>{$('sideControls').classList.toggle('open')});
 $('domainSelect').onchange=e=>{state.domain=e.target.value;state.view='domain';render()};
}
function title(name,sub){return '<div class="head"><div><h2 class="pt">'+name+'</h2><p class="pd">'+sub+'</p></div><span class="demo">Illustrative model</span></div>'}
function kpis(m){
 const values=[['Reporting products',fmt(m.products),'Published reporting catalogue','RP'],['Assurance score',pct(m.quality),'Weighted control effectiveness','DQ'],['Open exceptions',fmt(m.exceptions),'Modelled across domains','EX'],['Mean cycle time',m.cycle.toFixed(1)+'d','Average turnaround','CT']];
 return '<div class="grid metric-cards" style="margin-bottom:12px">'+values.map(([n,v,sub,code])=>'<div class="card"><div class="kpi"><div><div class="eye">'+n+'</div><div class="kv">'+v+'</div><div class="ks">'+sub+'</div></div><div class="ki">'+code+'</div></div></div>').join('')+'</div>';
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matrixSvg(rows){
 const w=760,h=305,l=64,r=26,t=28,b=46;
 const xx=v=>l+(v-75)/25*(w-l-r),yy=v=>h-b-(v-65)/35*(h-t-b);
 const circles=rows.map(d=>{const x=clamp(xx(d.timeliness),l,w-r),y=clamp(yy(d.score),t,h-b),rr=8+d.products*.9;return '<g class="domain-button" data-domain="'+d.id+'" role="button" tabindex="0" aria-label="'+esc(d.name)+'" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="'+(rr+4)+'" fill="var(--s)" opacity=".85"/><circle cx="'+x+'" cy="'+y+'" r="'+rr+'" fill="'+(d.breach?'var(--r)':'var(--ok)')+'" opacity=".82" stroke="var(--s)" stroke-width="2"/><text x="'+x+'" y="'+(y+3)+'" fill="#fff" font-size="10" text-anchor="middle">'+d.products+'</text><text x="'+x+'" y="'+(y-rr-8)+'" fill="var(--i2)" font-size="11" text-anchor="middle">'+esc(d.name)+'</text></g>'}).join('');
 return '<svg role="img" aria-label="Interactive assurance versus timeliness by reporting domain" viewBox="0 0 '+w+' '+h+'" class="chart chartarea">'+[70,80,90,100].map(v=>'<line x1="'+l+'" x2="'+(w-r)+'" y1="'+yy(v)+'" y2="'+yy(v)+'" stroke="var(--b)" stroke-dasharray="3 5"/><text x="'+(l-9)+'" y="'+(yy(v)+4)+'" text-anchor="end" fill="var(--i3)" font-size="11">'+v+'%</text>').join('')+[75,80,85,90,95,100].map(v=>'<line x1="'+xx(v)+'" x2="'+xx(v)+'" y1="'+t+'" y2="'+(h-b)+'" stroke="var(--b)" stroke-dasharray="3 5"/><text x="'+xx(v)+'" y="'+(h-b+20)+'" text-anchor="middle" fill="var(--i3)" font-size="11">'+v+'%</text>').join('')+'<text x="'+(w/2)+'" y="'+(h-3)+'" text-anchor="middle" fill="var(--i2)" font-size="12">Reporting timeliness</text><text x="17" y="'+(h/2)+'" transform="rotate(-90 17 '+(h/2)+')" text-anchor="middle" fill="var(--i2)" font-size="12">Assurance score</text>'+circles+'</svg>';
}
function stackedSvg(rows){
 const w=700,h=260,left=148,right=76,top=20,rowH=42;let max=Math.max(...rows.map(r=>r.effort))*1.25;
 return '<svg class="chart chartarea" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Estimated reporting effort by domain">'+rows.map((d,i)=>{let y=top+i*rowH,width=d.effort/max*(w-left-right);return '<text x="8" y="'+(y+18)+'" fill="var(--i2)" font-size="12">'+esc(d.name)+'</text><rect x="'+left+'" y="'+y+'" width="'+(w-left-right)+'" height="25" rx="5" fill="var(--sd)"/><rect x="'+left+'" y="'+y+'" width="'+width+'" height="25" rx="5" fill="var(--a)" opacity=".85"/><text x="'+(left+width+8)+'" y="'+(y+17)+'" fill="var(--i)" font-size="12">'+Math.round(d.effort)+' h</text>'}).join('')+'<text x="'+left+'" y="253" fill="var(--i3)" font-size="11">Estimated monthly manual effort, scenario adjusted</text></svg>';
}
function trendSvg(row){
 const w=740,h=275,l=50,r=20,t=22,b=34,sy=v=>h-b-(v-55)/45*(h-t-b);
 const base=Array.from({length:12},(_,i)=>clamp(row.score-9+(i*9/11)+Math.sin(i*1.2)*1.2,55,100));
 const observed=Array.from({length:12},(_,i)=>clamp(row.score-8+i*8/11+(i>6?(state.quality-100)*.32:0)+Math.sin(i*.8)*1.4,55,100));
 const path=a=>'M '+a.map((v,i)=>(l+i/11*(w-l-r)).toFixed(1)+' '+sy(v).toFixed(1)).join(' L ');
 return '<svg class="chart chartarea" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="12 period synthetic assurance trend">'+[60,70,80,90,100].map(v=>'<line x1="'+l+'" x2="'+(w-r)+'" y1="'+sy(v)+'" y2="'+sy(v)+'" stroke="var(--b)" stroke-dasharray="3 5"/><text x="'+(l-9)+'" y="'+(sy(v)+4)+'" text-anchor="end" fill="var(--i3)" font-size="11">'+v+'%</text>').join('')+'<path d="'+path(base)+'" stroke="var(--bl)" stroke-width="2" fill="none"/><path d="'+path(observed)+'" stroke="var(--a)" stroke-width="3" fill="none"/>'+observed.map((v,i)=>'<circle cx="'+(l+i/11*(w-l-r))+'" cy="'+sy(v)+'" r="3" fill="var(--a)"><title>Period '+(i+1)+': '+pct(v)+'</title></circle>').join('')+'</svg><div class="legend"><span><i style="background:var(--bl)"></i>Reference trajectory</span><span><i style="background:var(--a)"></i>Current scenario</span></div>';
}
function table(rows){
 return '<div class="detailwrap" id="detailPanel" '+(!state.details?'hidden':'')+'><div class="tablewrap"><table><thead><tr><th>Domain</th><th>Assurance</th><th>Timeliness</th><th>Reconciliation</th><th>Exceptions</th><th>Cycle</th><th>Publication</th></tr></thead><tbody>'+rows.map(d=>'<tr data-domain="'+d.id+'" class="'+(state.domain===d.id?'selected':'')+'"><td>'+esc(d.name)+'</td><td>'+pct(d.score)+'</td><td>'+pct(d.timeliness)+'</td><td>'+pct(d.reconciliation)+'</td><td>'+d.exceptions+'</td><td>'+d.cycle.toFixed(1)+'d</td><td>'+badge(d.breach?'Review':'Controlled',d.breach?'warn':'good')+'</td></tr>').join('')+'</tbody></table></div></div>';
}
function detailToggle(m){
 return '<button class="detailbtn" id="detailToggle">'+(state.details?'Hide':'Show')+' detailed reporting assurance table</button>'+table(m.rows);
}
function riskText(m){
 const critical=m.rows.filter(d=>d.breach).sort((a,b)=>a.score-b.score);
 return critical.length?'Prioritise '+critical[0].name.toLowerCase()+'; assurance '+pct(critical[0].score)+' and '+critical[0].exceptions+' exceptions under current assumptions.':'All domains clear the selected publication controls. Monitor the highest-exception domain and retain source reconciliation evidence.';
}
function overview(m){
 return title('Reporting assessment','Linked reporting performance, data assurance and exception prioritisation. Change assumptions in the sidebar and select any domain to investigate.')+
 '<div class="worknote"><strong>Interactive model.</strong> Scenario presets and assumptions update assurance, cycle time, exception volumes and capacity estimates immediately.</div>'+kpis(m)+
 '<div class="grid two"><section class="card feature"><div class="chart-title"><div><h3>Assurance versus timeliness</h3><p>Circle size represents published reporting products. Select a domain for its detailed case.</p></div></div>'+matrixSvg(m.rows)+'<div class="legend"><span><i style="background:var(--ok)"></i>Controlled</span><span><i style="background:var(--r)"></i>Requires review</span><span>Number = reporting products</span></div></section>'+
 '<section class="card"><div class="chart-title"><div><h3>Reporting effort by domain</h3><p>Illustrative manual effort, adjusted for demand and automation.</p></div></div>'+stackedSvg(m.rows)+'</section></div>'+
 '<div class="analysis" style="margin-top:12px"><section class="card"><div class="eye">Recommended action</div><div class="bigread">'+(m.atRisk?'Address assurance exceptions before publication':'Maintain publication controls')+'</div><p class="subtle">'+riskText(m)+'</p></section>'+
 '<section class="card"><div class="eye">Change against base case</div><div class="bigread">'+(m.effort-model({...presets.base}).effort>=0?'+':'')+Math.round(m.effort-model({...presets.base}).effort)+' manual hours per month</div><p class="subtle">Reporting volume: '+fmt(m.volume)+' records. '+m.atRisk+' domains below current release criteria.</p></section></div>'+detailToggle(m);
}
function domainPage(m){
 const d=m.rows.find(d=>d.id===state.domain)||m.rows[0];
 const vals=[['Completeness',d.completeness],['Reconciliation',d.reconciliation],['Timeliness',d.timeliness],['Definition coverage',d.definition]];
 return title('Domain analysis: '+d.name,'Inspect reporting performance, assurance controls, source lineage and actions for one domain.')+
 '<div class="worknote">Select a domain in the sidebar or click a point on the assessment chart. Changes to demand, automation and quality flow into this case.</div>'+
 '<div class="grid metric-cards" style="margin-bottom:12px">'+[['Assurance',pct(d.score)],['Open exceptions',d.exceptions],['Cycle time',d.cycle.toFixed(1)+'d'],['Manual effort',Math.round(d.effort)+' h']].map(([k,v])=>'<div class="card"><div class="eye">'+k+'</div><div class="kv">'+v+'</div></div>').join('')+'</div>'+
 '<div class="analysis"><section class="card feature"><div class="chart-title"><div><h3>Assurance trend</h3><p>Illustrative 12-period trend; current scenario versus reference.</p></div></div>'+trendSvg(d)+'</section><section class="card"><div class="chart-title"><div><h3>Control health</h3><p>Four calculated dimensions behind the assurance score.</p></div></div>'+vals.map(([k,v])=>'<div class="mb" style="grid-template-columns:150px 1fr 52px;margin:17px 0"><label>'+k+'</label><div class="progress"><div style="width:'+v+'%"></div></div><div class="score">'+pct(v)+'</div></div>').join('')+'<div style="margin-top:20px">'+badge(d.breach?'Publication review':'Controls met',d.breach?'warn':'good')+'</div></section></div>'+
 '<section class="card" style="margin-top:12px"><div class="chart-title"><h3>Data governance, lineage and actions</h3></div><div class="evidence-grid">'+[['Source systems',d.source],['Control owner',d.owner],['Reporting products',d.products],['Estimated rows',fmt(d.rows*state.demand/100)]].map(([k,v])=>'<div class="evidence"><span>'+k+'</span><strong>'+v+'</strong></div>').join('')+'</div><p class="subtle" style="margin-top:12px"><b>Next action:</b> '+d.action+'. Validate the relevant definitions and reconciliations against source records before publication.</p></section>';
}
function assurance(m){
 return title('Data assurance','Investigate completeness, reconciliation, timeliness and definition coverage across reporting domains.')+
 '<div class="worknote">Change source-data quality or the publication threshold to see which domains fall outside acceptable control limits.</div>'+kpis(m)+
 '<section class="card"><div class="chart-title"><div><h3>Control coverage by domain</h3><p>Cells respond to source quality, automation, demand and release threshold.</p></div></div><div class="tablewrap"><table><thead><tr><th>Domain</th><th>Complete</th><th>Reconciled</th><th>Timely</th><th>Definitions</th><th>Status</th></tr></thead><tbody>'+m.rows.map(d=>'<tr data-domain="'+d.id+'"><td>'+d.name+'</td>'+['completeness','reconciliation','timeliness','definition'].map(k=>'<td><span class="badge '+(d[k]>=state.strictness?'good':d[k]>=state.strictness-5?'warn':'bad')+'">'+pct(d[k])+'</span></td>').join('')+'<td>'+badge(d.breach?'Review':'Controlled',d.breach?'warn':'good')+'</td></tr>').join('')+'</tbody></table></div></section>'+
 '<div class="domain-grid" style="margin-top:12px">'+m.rows.map(d=>'<button class="domainrow '+(d.id===state.domain?'active':'')+'" data-domain="'+d.id+'"><b>'+d.name+'</b><small>'+d.exceptions+' exceptions / '+pct(d.score)+' assurance</small></button>').join('')+'</div>';
}
function scenarioCompare(){
 const cases=Object.entries(presets).map(([id,s])=>({id,name:{base:'Base',surge:'Demand surge',disruption:'Data disruption',uplift:'Automation uplift'}[id],...model(s)}));
 const base=cases[0];
 return title('Scenarios','Compare reporting demand and control assumptions, then select a scenario to inspect its effects.')+
 '<div class="worknote">Preset comparison is calculated from the same domain-level model as the assessment and drill-downs. Select a scenario to apply it.</div>'+
 '<div class="grid metric-cards">'+cases.map(c=>'<button class="domainrow '+(state.scenario===c.id?'active':'')+'" data-preset="'+c.id+'"><div class="eye">'+c.name+'</div><div class="kv" style="margin-top:9px">'+pct(c.quality)+'</div><small>'+c.exceptions+' exceptions · '+c.cycle.toFixed(1)+' day cycle</small></button>').join('')+'</div>'+
 '<div class="grid two" style="margin-top:12px"><section class="card feature"><div class="chart-title"><h3>Quality versus reporting effort</h3></div><div class="tablewrap"><table><thead><tr><th>Scenario</th><th>Assurance</th><th>Cycle</th><th>Exceptions</th><th>Manual hours</th><th>Domains at risk</th></tr></thead><tbody>'+cases.map(c=>'<tr><td>'+c.name+'</td><td>'+pct(c.quality)+'</td><td>'+c.cycle.toFixed(1)+'d</td><td>'+c.exceptions+'</td><td>'+Math.round(c.effort)+'</td><td>'+c.atRisk+'</td></tr>').join('')+'</tbody></table></div></section>'+
 '<section class="card"><div class="chart-title"><h3>Effort difference from base</h3></div>'+cases.map(c=>'<div style="margin:15px 0"><div class="ctrl"><label>'+c.name+' <output>'+(c.effort-base.effort>=0?'+':'')+Math.round(c.effort-base.effort)+' h</output></label></div><div class="progress"><div style="width:'+clamp(c.effort/Math.max(...cases.map(k=>k.effort))*100,2,100)+'%"></div></div></div>').join('')+'</section></div>';
}
function governance(m){
 const d=m.rows.find(d=>d.id===state.domain)||m.rows[0];
 const flow=[['Business outcomes','Identify decision needs and reporting definitions'],['Source systems','Rally, Clarity and operational systems'],['Mapping','Reconcile outcome, epic and cost keys'],['Assurance','Verify data quality and exceptions'],['Publication','Release documented executive measures']];
 return title('Governance and lineage','Trace reporting measures to source records, owners, validation checks and publication decisions.')+
 '<div class="worknote">Selected source: '+esc(d.source)+'. Choose a domain to inspect its accountable owner and control evidence.</div>'+
 '<div class="grid two"><section class="card"><div class="chart-title"><h3>Evidence pathway</h3><p>Business requirements through to controlled publication.</p></div><div class="flow">'+flow.map((x,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="node '+(i===2?'active':'')+'"><div class="nt">'+x[0]+'</div><div class="nb">'+x[1]+'</div></div>').join('')+'</div></section><section class="card"><div class="chart-title"><h3>Selected control evidence</h3></div><div class="evidence-grid">'+[['Domain',d.name],['Owner',d.owner],['Source',d.source],['Exceptions',d.exceptions]].map(([k,v])=>'<div class="evidence"><span>'+k+'</span><strong>'+v+'</strong></div>').join('')+'</div><p class="subtle">'+d.action+'. Evidence is illustrative, not a representation of live enterprise records.</p></section></div>'+
 '<section class="card" style="margin-top:12px"><div class="chart-title"><h3>Control register</h3><p>Review status is derived from the current scenario and release threshold.</p></div><div class="tablewrap"><table><thead><tr><th>Reporting domain</th><th>Accountable owner</th><th>Control evidence</th><th>Current decision</th></tr></thead><tbody>'+m.rows.map(d=>'<tr data-domain="'+d.id+'"><td>'+d.name+'</td><td>'+d.owner+'</td><td>'+d.action+'</td><td>'+badge(d.breach?'Hold and review':'Publish with controls',d.breach?'warn':'good')+'</td></tr>').join('')+'</tbody></table></div></section>';
}
function wire(){
 document.querySelectorAll('g[data-domain],button[data-domain],tr[data-domain]').forEach(e=>{
 const choose=()=>{state.domain=e.dataset.domain;state.view='domain';render()};
 e.addEventListener('click',choose);if(e.tagName.toLowerCase()==='g')e.addEventListener('keydown',k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();choose()}});
 });
 document.querySelectorAll('[data-preset]').forEach(e=>{if(!e.onclick)e.onclick=()=>{state.scenario=e.dataset.preset;Object.assign(state,presets[state.scenario]);render()}});
 const t=$('detailToggle');if(t)t.onclick=()=>{state.details=!state.details;render()};
}
function render(){
 const m=model();
 makeSide(m);
 const views={overview:overview,domain:domainPage,scenarios:scenarioCompare};
 $('main').innerHTML=views[state.view](m);
 wire();
}
$('theme').addEventListener('click',()=>{let dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';$('themeText').textContent=dark?'Dark':'Light'});
render();
</script></body></html>
