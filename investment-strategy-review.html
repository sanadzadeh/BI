<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Investment Strategy & Portfolio Review</title>
<meta name="description" content="Illustrative investment strategy dashboard covering allocation scenarios, portfolio monitoring, manager review, performance, risk and committee decision support.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Libre+Franklin:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16212b;--muted:#66737e;--line:#d9e0e5;--navy:#15344a;--blue:#2f6f91;--teal:#3a7c78;--gold:#af8542;--green:#3f7a4c;--red:#a44b43;--soft:#eaf0f4;--shadow:0 3px 14px rgba(21,52,74,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center}.brand h1{font:700 18px Libre Franklin;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font:500 10px DM Mono;text-transform:uppercase;letter-spacing:.08em}.controls{display:flex;gap:8px}.controls select,.controls button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;font-size:12px;color:var(--ink)}.app{display:grid;grid-template-columns:210px 1fr}.side{min-height:calc(100vh - 58px);background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:58px;height:calc(100vh - 58px)}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12px;margin:2px 0}.nav.active{background:#eaf1f5;color:var(--navy)}.main{padding:22px 24px 40px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}.head h2{margin:0;font-size:22px}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}.tag{font:500 10px DM Mono;color:var(--blue);border:1px solid #c9d9e2;background:#eef5f8;padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px}.eyebrow{font:500 10px DM Mono;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.value{font:700 26px Libre Franklin;margin-top:5px}.sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}.barrow{display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center;margin:9px 0;font-size:11px}.track{height:8px;background:#e8edf0;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--blue));border-radius:8px}.mono{font:500 10px DM Mono;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}th{font:500 10px DM Mono;color:var(--muted);text-transform:uppercase;background:#f8fafb}.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:700}.good{background:#e8f3eb;color:var(--green)}.watch{background:#fbf2df;color:#936d1f}.risk{background:#f8e9e7;color:var(--red)}.scenario{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;text-align:left}.scenario.active{border-color:var(--blue);background:#edf5f8}.scenario strong{display:block;font-size:12px}.scenario span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.callout{border-left:4px solid var(--blue);background:#f7fafc;padding:12px 14px;border-radius:8px;margin-top:10px}.callout strong{font-size:13px}.callout p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.alloc{display:flex;height:26px;border-radius:7px;overflow:hidden;margin-top:12px}.alloc span{display:block;height:100%}.chart{height:200px;display:flex;align-items:end;gap:10px;padding:18px 8px 4px}.col{flex:1;display:flex;align-items:end;gap:4px;height:100%}.b{width:50%;border-radius:5px 5px 0 0;background:var(--blue)}.b.alt{background:#a9bac5}.legend{display:flex;gap:12px;font-size:10px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}.section{display:none}.section.active{display:block}@media(max-width:950px){.app{grid-template-columns:1fr}.side{position:static;height:auto;min-height:0;display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.kpis,.two,.three{grid-template-columns:1fr 1fr}}@media(max-width:620px){.kpis,.two,.three{grid-template-columns:1fr}.main{padding:16px 12px}.top{position:static;align-items:flex-start;gap:10px;flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top"><div class="brand"><h1>Investment Strategy & Portfolio Review</h1><p>asset allocation · manager review · performance · risk · committee papers</p></div><div class="controls"><select><option>Current quarter</option><option>1 year</option><option>3 years</option></select><select><option>Whole portfolio</option><option>Growth assets</option><option>Defensive assets</option></select></div></header>
<div class="app"><aside class="side" id="nav"></aside><main class="main">
<section id="overview" class="section active"></section><section id="allocation" class="section"></section><section id="managers" class="section"></section><section id="performance" class="section"></section><section id="committee" class="section"></section>
</main></div>
<script>
const views=[['overview','00 Overview'],['allocation','01 Allocation'],['managers','02 Manager review'],['performance','03 Performance & risk'],['committee','04 Committee papers']];
const nav=document.getElementById('nav');views.forEach(([id,label],i)=>{const b=document.createElement('button');b.className='nav'+(i===0?' active':'');b.textContent=label;b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')};nav.appendChild(b)});
const kpis=(arr)=>`<div class="grid kpis">${arr.map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('')}</div>`;
document.getElementById('overview').innerHTML=`<div class="head"><div><h2>Portfolio overview</h2><p>Current allocation, active tilts, risk position and review workload.</p></div><span class="tag">illustrative data</span></div>${kpis([['Portfolio return','7.8%','12-month return'],['Policy benchmark','7.1%','12-month benchmark'],['Active risk','2.4%','within review range'],['Open reviews','6','manager and strategy items']])}<div class="grid two"><div class="card"><div class="eyebrow">Strategic allocation</div><div class="alloc"><span style="width:35%;background:#15344a"></span><span style="width:22%;background:#2f6f91"></span><span style="width:18%;background:#3a7c78"></span><span style="width:15%;background:#af8542"></span><span style="width:10%;background:#a9bac5"></span></div>${[['Australian equities',35],['Global equities',22],['Fixed income',18],['Private markets',15],['Cash / defensive',10]].map(x=>`<div class="barrow"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]*2}%"></div></div><span class="mono">${x[1]}%</span></div>`).join('')}</div><div class="card"><div class="eyebrow">Review priorities</div><table><tr><th>Item</th><th>Status</th><th>Next step</th></tr><tr><td>Growth / defensive balance</td><td><span class="badge watch">Review</span></td><td>Test downside scenario</td></tr><tr><td>Global equity manager</td><td><span class="badge watch">Watch</span></td><td>Manager meeting</td></tr><tr><td>Liquidity reserve</td><td><span class="badge good">On track</span></td><td>Quarterly monitor</td></tr><tr><td>Private asset pacing</td><td><span class="badge risk">Action</span></td><td>Update cash-flow assumptions</td></tr></table></div></div>`;
const scenarios={base:['6.9%','8.7%','11.4%','2.1%'],risk:['4.2%','10.8%','14.9%','3.6%'],growth:['8.1%','9.4%','12.2%','2.8%']};
document.getElementById('allocation').innerHTML=`<div class="head"><div><h2>Asset-allocation scenarios</h2><p>Compare expected return, volatility, drawdown and active risk under alternative assumptions.</p></div></div><div class="grid three" id="scBtns"><button class="scenario active" data-s="base"><strong>Base</strong><span>Current capital-market assumptions</span></button><button class="scenario" data-s="risk"><strong>Risk-off</strong><span>Lower growth, wider spreads</span></button><button class="scenario" data-s="growth"><strong>Upside growth</strong><span>Stronger earnings and risk assets</span></button></div><div id="scenarioKpis"></div><div class="callout"><strong>Decision question</strong><p>Does the current growth allocation remain appropriate once downside sensitivity, liquidity needs and implementation constraints are considered together?</p></div>`;
function renderScenario(k){const a=scenarios[k];document.getElementById('scenarioKpis').innerHTML=kpis([['Expected return',a[0],'modelled annualised'],['Volatility',a[1],'portfolio estimate'],['Peak drawdown',a[2],'stress estimate'],['Active risk',a[3],'relative to policy']])}renderScenario('base');document.querySelectorAll('.scenario').forEach(b=>b.onclick=()=>{document.querySelectorAll('.scenario').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderScenario(b.dataset.s)});
document.getElementById('managers').innerHTML=`<div class="head"><div><h2>Manager review</h2><p>Performance, process, people, risk and due-diligence status.</p></div></div><div class="card"><table><tr><th>Manager</th><th>Asset class</th><th>3Y excess return</th><th>Risk</th><th>Due diligence</th><th>Assessment</th></tr><tr><td>Manager A</td><td>Global equities</td><td>+1.4%</td><td>Within range</td><td>Complete</td><td><span class="badge good">Retain</span></td></tr><tr><td>Manager B</td><td>Australian equities</td><td>-0.8%</td><td>Elevated</td><td>Updated</td><td><span class="badge watch">Watch</span></td></tr><tr><td>Manager C</td><td>Fixed income</td><td>+0.6%</td><td>Within range</td><td>Complete</td><td><span class="badge good">Retain</span></td></tr><tr><td>Manager D</td><td>Private markets</td><td>n/a</td><td>Pacing issue</td><td>In progress</td><td><span class="badge risk">Review</span></td></tr></table></div><div class="grid two" style="margin-top:10px"><div class="card"><div class="eyebrow">Manager review framework</div>${[['Performance consistency',82],['Process repeatability',88],['Team stability',76],['Risk controls',91],['Reporting quality',84]].map(x=>`<div class="barrow"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="mono">${x[1]}</span></div>`).join('')}</div><div class="card"><div class="eyebrow">Upcoming actions</div><table><tr><th>When</th><th>Action</th></tr><tr><td>Oct</td><td>Global equity quarterly meeting</td></tr><tr><td>Oct</td><td>Private markets pacing update</td></tr><tr><td>Nov</td><td>Annual due-diligence refresh</td></tr><tr><td>Dec</td><td>Manager scorecard review</td></tr></table></div></div>`;
document.getElementById('performance').innerHTML=`<div class="head"><div><h2>Performance & risk</h2><p>Portfolio and benchmark performance with key risk indicators.</p></div></div>${kpis([['1Y return','7.8%','+0.7% vs benchmark'],['3Y p.a.','6.5%','+0.4% vs benchmark'],['Tracking error','2.1%','within range'],['Liquidity cover','1.8x','forecast obligations']])}<div class="grid two"><div class="card"><div class="eyebrow">Portfolio vs benchmark</div><div class="chart">${[72,88,63,95,80,104].map((h,i)=>`<div class="col"><div class="b" style="height:${h}%"></div><div class="b alt" style="height:${h-6}%"></div></div>`).join('')}</div><div class="legend"><span><i style="background:#2f6f91"></i>Portfolio</span><span><i style="background:#a9bac5"></i>Benchmark</span></div></div><div class="card"><div class="eyebrow">Risk dashboard</div>${[['Growth concentration',72],['Currency exposure',58],['Liquidity risk',36],['Manager concentration',44],['Downside sensitivity',67]].map(x=>`<div class="barrow"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="mono">${x[1]}</span></div>`).join('')}</div></div>`;
document.getElementById('committee').innerHTML=`<div class="head"><div><h2>Committee decision support</h2><p>Clear papers linking evidence, assumptions, alternatives and recommendation.</p></div></div><div class="grid two"><div class="card"><div class="eyebrow">Paper structure</div><table><tr><th>Section</th><th>Purpose</th></tr><tr><td>Decision required</td><td>State the exact approval or direction sought</td></tr><tr><td>Current position</td><td>Performance, risk and implementation context</td></tr><tr><td>Analysis</td><td>Model outputs, manager evidence and key assumptions</td></tr><tr><td>Options</td><td>Alternatives with trade-offs and constraints</td></tr><tr><td>Recommendation</td><td>Preferred course and rationale</td></tr><tr><td>Monitoring</td><td>Measures, triggers and review date</td></tr></table></div><div class="card"><div class="eyebrow">Current decision register</div><table><tr><th>Decision</th><th>Status</th></tr><tr><td>Maintain policy growth weight</td><td><span class="badge good">Ready</span></td></tr><tr><td>Private asset pacing adjustment</td><td><span class="badge watch">Analysis</span></td></tr><tr><td>Manager B watch status</td><td><span class="badge watch">Review</span></td></tr><tr><td>Liquidity buffer range</td><td><span class="badge good">Ready</span></td></tr></table></div></div><div class="callout"><strong>Review discipline</strong><p>Every recommendation should be traceable to the underlying assumptions and evidence, with alternatives and material uncertainties visible to the decision-maker.</p></div>`;
</script>
</body></html>
