<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Investment Strategy & Portfolio Review — Khaled Sanad</title>
<meta name="description" content="Illustrative investment strategy, asset allocation, manager review, performance, risk and committee decision support dashboard.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fa;--surface-deep:#e9eef1;--border:#d8e0e5;--ink:#18232c;--ink2:#55636f;--ink3:#7b8893;--accent:#174f63;--accent2:#3f7f87;--accent-dim:#e6f0f2;--blue:#557f9a;--gold:#b28a4b;--green:#427c54;--red:#a64a3d;--purple:#70678d;--shadow:0 2px 10px rgba(28,45,57,.06);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--accent2))}.brand h1{margin:0;font:600 1.05rem var(--serif)}.brand p{margin:3px 0 0;font:.49rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.controls{display:flex;gap:7px}select{border:1px solid var(--border);background:var(--surface-alt);border-radius:7px;padding:6px 8px;font-size:.62rem;color:var(--ink)}.app{display:grid;grid-template-columns:210px 1fr}.side{position:sticky;top:55px;height:calc(100vh - 55px);padding:14px 9px;background:var(--surface);border-right:1px solid var(--border)}.side-title{font:.48rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:0 8px 7px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:6px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink2);padding:8px;border-radius:7px;margin:2px 0;cursor:pointer}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:.51rem var(--mono);color:var(--ink3)}.nav-label{font-size:.69rem;font-weight:600}.main{padding:20px 24px 40px;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:13px}.head h2{margin:0 0 4px;font:600 1.38rem var(--serif)}.head p{margin:0;font-size:.65rem;color:var(--ink2)}.demo{font:.48rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--accent);background:var(--accent-dim);padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;box-shadow:var(--shadow)}.eyebrow{font:.47rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:8px}.value{font:600 1.36rem var(--serif)}.sub{font-size:.56rem;color:var(--ink2);margin-top:4px;line-height:1.38}.icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:.51rem var(--mono)}.title{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}.title h3{font-size:.73rem;margin:0}.title p{font-size:.53rem;color:var(--ink3);margin:3px 0 0}.legend{display:flex;gap:8px;font-size:.5rem;color:var(--ink2);flex-wrap:wrap}.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}.chart{width:100%;height:205px}.gridline{stroke:var(--border);stroke-dasharray:3 5}.tick{fill:var(--ink3);font:8px var(--mono)}.line-a{fill:none;stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-c{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.area{fill:var(--accent-dim);opacity:.9}.point{stroke:#fff;stroke-width:1.5}.metric{display:grid;grid-template-columns:124px 1fr 44px;gap:7px;align-items:center;margin:8px 0}.metric label{font-size:.56rem;color:var(--ink2)}.track{height:7px;background:var(--surface-deep);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.score{text-align:right;font:.51rem var(--mono);color:var(--ink2)}.badge{display:inline-flex;align-items:center;padding:3px 6px;border-radius:999px;font-size:.51rem;font-weight:700}.good{color:var(--green);background:#e8f3eb}.warn{color:#936d1f;background:#fbf1dc}.bad{color:var(--red);background:#f8e8e5}.table{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:8px 9px;border-bottom:1px solid var(--border);font-size:.57rem;text-align:left}th{font:.46rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);background:var(--surface-alt)}.alloc{display:flex;height:20px;border-radius:6px;overflow:hidden;margin:8px 0 10px}.alloc span{height:100%}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.mini>div{background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:8px}.mini b{display:block;font:600 .85rem var(--serif)}.mini span{display:block;margin-top:2px;font:.48rem var(--mono);color:var(--ink3)}.heat{display:grid;grid-template-columns:135px repeat(4,1fr);gap:6px;align-items:center}.hl{font-size:.55rem;color:var(--ink2)}.hh{font:.45rem var(--mono);text-transform:uppercase;color:var(--ink3);text-align:center}.hc{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:.49rem var(--mono)}.hi{background:var(--green)}.mid{background:var(--gold)}.lo{background:var(--red)}.decision{border-left:4px solid var(--accent);background:var(--surface);border-radius:10px;padding:12px;box-shadow:var(--shadow)}.decision h3{margin:0 0 4px;font:600 .95rem var(--serif)}.decision p{margin:0;font-size:.57rem;line-height:1.45;color:var(--ink2)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);border-radius:8px;padding:9px;text-align:left;cursor:pointer}.scenario.active{background:var(--accent-dim);border-color:#9fc5ca;color:var(--accent)}.scenario strong{display:block;font-size:.62rem}.scenario span{display:block;margin-top:3px;font-size:.49rem;color:var(--ink3)}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:18px;padding:5px}.donut{width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--accent) 0 35%,var(--blue) 35% 57%,var(--accent2) 57% 75%,var(--gold) 75% 90%,#a9b4bc 90% 100%);position:relative}.donut:after{content:'';position:absolute;inset:28px;background:var(--surface);border-radius:50%}.donut-centre{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}.donut-centre b{font:600 1.1rem var(--serif)}.donut-centre span{display:block;font:.45rem var(--mono);color:var(--ink3);margin-top:2px}.flow{display:flex;gap:6px;overflow:auto}.node{flex:1;min-width:145px;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface-alt)}.node strong{display:block;font-size:.57rem}.node span{display:block;margin-top:4px;font-size:.51rem;color:var(--ink2);line-height:1.35}.arrow{align-self:center;color:var(--ink3)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto}.side-title{display:none}.nav{width:auto;white-space:nowrap}.kpis,.two,.three,.scenarios{grid-template-columns:1fr 1fr}}@media(max-width:650px){.kpis,.two,.three,.scenarios,.mini{grid-template-columns:1fr}.main{padding:15px}.header{position:static;align-items:flex-start;flex-wrap:wrap}}
</style></head>
<body><header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. — Investment Strategy & Portfolio Review</h1><p>allocation · performance · manager review · risk · committee decisions</p></div></div><div class="controls"><select><option>Current quarter</option><option>1 year</option><option>3 years</option></select><select><option>Whole portfolio</option><option>Growth assets</option><option>Defensive assets</option></select></div></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Overview','Portfolio overview','Allocation, performance, risk and priority decisions in one view.'],['Allocation','Allocation & scenarios','Strategic weights, tilts and scenario sensitivity.'],['Managers','Manager review','Performance, conviction, risk and due-diligence signals.'],['Performance','Performance & risk','Return path, benchmark comparison and downside indicators.'],['Committee','Committee decisions','Evidence, recommendations and governance readiness.']];let view=0,sc=0;
const months=['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
const portfolio=[100,101.1,100.4,102.2,103.6,104.4,105.9,105.1,106.7,107.8,108.9,110.4];
const benchmark=[100,100.7,100.2,101.6,102.7,103.4,104.6,104.1,105.3,106.2,107.4,108.8];
const drawdown=[0,-.4,-1.2,-.5,0,0,-.3,-1.4,-.5,0,0,0];
const scenarios=[['Base','Current assumptions',6.9,8.7,11.4,2.1],['Risk-off','Lower growth / wider spreads',4.2,10.8,14.9,3.6],['Upside','Stronger earnings / risk assets',8.1,9.4,12.2,2.8],['Liquidity stress','Cash demand + spread widening',3.8,11.7,16.2,4.1]];
function badge(s){return `<span class="badge ${/retain|ready|on track|complete/i.test(s)?'good':/watch|analysis|review/i.test(s)?'warn':'bad'}">${s}</span>`}
function metrics(a){return a.map(x=>`<div class="metric"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[2]??x[1]}</div></div>`).join('')}
function smoothPath(vals,w,h,p,min,max){const pts=vals.map((v,i)=>[p+i/(vals.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]);if(pts.length<2)return'';let d=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){let p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;let c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`}return d}
function performanceChart(){let w=650,h=210,p=30,min=98,max=112,a=smoothPath(portfolio,w,h,p,min,max),b=smoothPath(benchmark,w,h,p,min,max);let area=`${a} L ${w-p} ${h-p} L ${p} ${h-p} Z`;return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[42,82,122,162].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="area" d="${area}"/><path class="line-a" d="${a}"/><path class="line-b" d="${b}"/>${months.map((m,i)=>`<text class="tick" x="${p+i/11*(w-2*p)-7}" y="${h-7}">${m}</text>`).join('')}<circle class="point" cx="${w-p}" cy="${h-p-(portfolio.at(-1)-min)/(max-min)*(h-2*p)}" r="4" fill="var(--accent)"/><text class="tick" x="${w-p-28}" y="${h-p-(portfolio.at(-1)-min)/(max-min)*(h-2*p)-9}">110.4</text></svg>`}
function riskReturnChart(){let pts=[['AU Eq',8.1,13.5],['Global Eq',8.5,14.8],['Fixed Inc',4.8,6.2],['Private',9.2,12.0],['Cash',3.9,1.0]];let w=650,h=210,p=35;return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[40,80,120,160].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}${pts.map((d,i)=>{let x=p+(d[2]-1)/14*(w-2*p),y=h-p-(d[1]-3.5)/6*(h-2*p);let r=[7,7,6,8,5][i];return `<circle cx="${x}" cy="${y}" r="${r}" fill="${['var(--accent)','var(--blue)','var(--accent2)','var(--gold)','#9aa8b1'][i]}" opacity=".9"/><text class="tick" x="${x+8}" y="${y-7}">${d[0]}</text>`}).join('')}<text class="tick" x="265" y="202">risk →</text><text class="tick" x="7" y="18">return ↑</text></svg>`}
function head(){return `<div class="head"><div><h2>${V[view][1]}</h2><p>${V[view][2]}</p></div><span class="demo">Illustrative analysis</span></div>`}
function overview(){return head()+`<div class="grid kpis"><div class="card"><div class="kpi"><div><div class="eyebrow">12M return</div><div class="value">7.8%</div><div class="sub">+0.7% vs policy benchmark</div></div><div class="icon">PF</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Active risk</div><div class="value">2.4%</div><div class="sub">Within review range</div></div><div class="icon">AR</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Liquidity cover</div><div class="value">1.8x</div><div class="sub">Forecast obligations</div></div><div class="icon">LQ</div></div></div><div class="card"><div class="kpi"><div><div class="eyebrow">Open reviews</div><div class="value">6</div><div class="sub">2 priority items</div></div><div class="icon">RV</div></div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Portfolio growth path</h3><p>Indexed performance versus policy benchmark.</p></div><div class="legend"><span><i style="background:var(--accent)"></i>Portfolio</span><span><i style="background:var(--blue)"></i>Benchmark</span></div></div>${performanceChart()}<div class="mini"><div><b>+1.6 pts</b><span>relative gain since Oct</span></div><div><b>3 / 12</b><span>months below benchmark</span></div><div><b>-1.4%</b><span>largest monthly drawdown</span></div></div></div><div class="card"><div class="title"><div><h3>Strategic allocation</h3><p>Current strategic mix.</p></div></div><div class="donut-wrap"><div class="donut"><div class="donut-centre"><div><b>100%</b><span>portfolio</span></div></div></div><div style="min-width:180px">${metrics([['Australian equities',35,'35%'],['Global equities',22,'22%'],['Fixed income',18,'18%'],['Private markets',15,'15%'],['Cash / defensive',10,'10%']])}</div></div></div></div><div class="grid two" style="margin-top:10px"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Private-asset pacing and growth concentration need the next review</h3><p>Performance remains ahead of benchmark, but the strongest portfolio question is whether current growth exposure still fits downside sensitivity and liquidity needs.</p></div><div class="card"><div class="title"><div><h3>Priority register</h3><p>Items requiring analysis or committee attention.</p></div></div><div class="table"><table><tr><th>Issue</th><th>Signal</th><th>Status</th><th>Next step</th></tr><tr><td>Private-asset pacing</td><td>Cash-flow assumptions</td><td>${badge('Review')}</td><td>Re-run pacing</td></tr><tr><td>Growth concentration</td><td>72 / 100</td><td>${badge('Watch')}</td><td>Downside test</td></tr><tr><td>Manager B</td><td>-0.8% 3Y excess</td><td>${badge('Watch')}</td><td>Manager meeting</td></tr><tr><td>Liquidity reserve</td><td>1.8x cover</td><td>${badge('On track')}</td><td>Monitor</td></tr></table></div></div></div>`}
function allocation(){let s=scenarios[sc];return head()+`<div class="scenarios">${scenarios.map((x,i)=>`<button class="scenario ${i===sc?'active':''}" onclick="sc=${i};render()"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join('')}</div><div class="grid kpis"><div class="card"><div class="eyebrow">Expected return</div><div class="value">${s[2]}%</div><div class="sub">modelled annualised</div></div><div class="card"><div class="eyebrow">Volatility</div><div class="value">${s[3]}%</div><div class="sub">portfolio estimate</div></div><div class="card"><div class="eyebrow">Peak drawdown</div><div class="value">${s[4]}%</div><div class="sub">stress estimate</div></div><div class="card"><div class="eyebrow">Active risk</div><div class="value">${s[5]}%</div><div class="sub">relative to policy</div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Risk / return map</h3><p>Illustrative asset-class positioning.</p></div></div>${riskReturnChart()}<div class="mini"><div><b>Private</b><span>highest expected return</span></div><div><b>Global Eq</b><span>highest listed-market risk</span></div><div><b>Fixed Inc</b><span>defensive anchor</span></div></div></div><div class="card"><div class="title"><div><h3>Scenario sensitivity</h3><p>Relative pressure under selected assumptions.</p></div></div>${metrics([['Growth assets',sc===1?91:sc===3?83:64],['Liquidity demand',sc===3?88:sc===1?71:42],['Spread sensitivity',sc===1?86:sc===3?79:48],['Manager dispersion',sc===2?68:55],['Implementation complexity',sc===3?74:58]])}</div></div>`}
function managers(){let q=[['Manager A',[92,88,90,94]],['Manager B',[68,74,71,82]],['Manager C',[86,90,88,91]],['Manager D',[79,72,84,69]]];return head()+`<div class="grid two"><div class="card"><div class="title"><div><h3>Manager diagnostic heatmap</h3><p>Performance, process, people and risk.</p></div></div><div class="heat"><div></div>${['Performance','Process','People','Risk'].map(x=>`<div class="hh">${x}</div>`).join('')}${q.map(r=>`<div class="hl">${r[0]}</div>${r[1].map(v=>`<div class="hc ${v>=86?'hi':v>=75?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="title"><div><h3>Review workload</h3><p>Current due-diligence and monitoring pipeline.</p></div></div>${metrics([['Quarterly meetings',78,'7 / 9'],['Due-diligence refresh',67,'4 / 6'],['Watch-list actions',50,'2 / 4'],['Paper readiness',83,'5 / 6']])}</div></div><div class="card" style="margin-top:10px"><div class="table"><table><tr><th>Manager</th><th>Asset class</th><th>3Y excess</th><th>Risk</th><th>Due diligence</th><th>Assessment</th></tr><tr><td>Manager A</td><td>Global equities</td><td>+1.4%</td><td>Within range</td><td>Complete</td><td>${badge('Retain')}</td></tr><tr><td>Manager B</td><td>Australian equities</td><td>-0.8%</td><td>Elevated</td><td>Updated</td><td>${badge('Watch')}</td></tr><tr><td>Manager C</td><td>Fixed income</td><td>+0.6%</td><td>Within range</td><td>Complete</td><td>${badge('Retain')}</td></tr><tr><td>Manager D</td><td>Private markets</td><td>n/a</td><td>Pacing</td><td>In progress</td><td>${badge('Review')}</td></tr></table></div></div>`}
function performance(){return head()+`<div class="grid kpis"><div class="card"><div class="eyebrow">1Y return</div><div class="value">7.8%</div><div class="sub">+0.7% vs benchmark</div></div><div class="card"><div class="eyebrow">3Y p.a.</div><div class="value">6.5%</div><div class="sub">+0.4% vs benchmark</div></div><div class="card"><div class="eyebrow">Tracking error</div><div class="value">2.1%</div><div class="sub">within range</div></div><div class="card"><div class="eyebrow">Liquidity cover</div><div class="value">1.8x</div><div class="sub">forecast obligations</div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Indexed return history</h3><p>Portfolio and benchmark over twelve periods.</p></div></div>${performanceChart()}</div><div class="card"><div class="title"><div><h3>Risk indicators</h3><p>Current risk signals on a 0-100 scale.</p></div></div>${metrics([['Growth concentration',72],['Downside sensitivity',67],['Currency exposure',58],['Manager concentration',44],['Liquidity risk',36]])}<div class="mini"><div><b>72</b><span>largest current signal</span></div><div><b>36</b><span>liquidity remains contained</span></div><div><b>2.1%</b><span>tracking error</span></div></div></div></div>`}
function committee(){return head()+`<div class="grid kpis"><div class="card"><div class="eyebrow">Papers ready</div><div class="value">4</div><div class="sub">of 6 current items</div></div><div class="card"><div class="eyebrow">Decisions required</div><div class="value">3</div><div class="sub">next committee cycle</div></div><div class="card"><div class="eyebrow">Evidence complete</div><div class="value">91%</div><div class="sub">critical analysis complete</div></div><div class="card"><div class="eyebrow">Open actions</div><div class="value">7</div><div class="sub">2 beyond target date</div></div></div><div class="grid two"><div class="card"><div class="title"><div><h3>Decision pathway</h3><p>Trace recommendation from evidence to monitoring.</p></div></div><div class="flow"><div class="node"><strong>Evidence</strong><span>Performance, risk, manager and liquidity inputs</span></div><div class="arrow">→</div><div class="node"><strong>Options</strong><span>Alternatives, trade-offs and constraints</span></div><div class="arrow">→</div><div class="node"><strong>Recommendation</strong><span>Preferred course and rationale</span></div><div class="arrow">→</div><div class="node"><strong>Monitoring</strong><span>Measures, triggers and review date</span></div></div></div><div class="card"><div class="title"><div><h3>Committee readiness</h3><p>Quality checks before issue.</p></div></div>${metrics([['Decision clarity',96],['Evidence traceability',93],['Options tested',88],['Assumptions documented',91],['Monitoring defined',84]])}</div></div><div class="card" style="margin-top:10px"><div class="table"><table><tr><th>Decision</th><th>Evidence</th><th>Status</th><th>Next step</th></tr><tr><td>Maintain policy growth weight</td><td>Scenario + liquidity</td><td>${badge('Ready')}</td><td>Committee</td></tr><tr><td>Private asset pacing adjustment</td><td>Cash-flow model</td><td>${badge('Analysis')}</td><td>Update assumptions</td></tr><tr><td>Manager B watch status</td><td>Performance + review</td><td>${badge('Review')}</td><td>Manager meeting</td></tr><tr><td>Liquidity buffer range</td><td>Stress analysis</td><td>${badge('Ready')}</td><td>Committee</td></tr></table></div></div>`}
function nav(){side.innerHTML=`<div class="side-title">Portfolio views</div>`+V.map((x,i)=>`<button class="nav ${i===view?'active':''}" onclick="view=${i};render()"><span class="nav-num">0${i}</span><span class="nav-label">${x[0]}</span></button>`).join('')}
function render(){main.innerHTML=[overview,allocation,managers,performance,committee][view]();nav()}render();
</script></body></html>
