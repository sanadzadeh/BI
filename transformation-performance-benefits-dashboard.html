<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transformation Performance & Benefits Dashboard — Khaled Sanad</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--surface:#fff;--surface2:#f8fafb;--border:#d8e0e5;--ink:#18232c;--muted:#66747f;--accent:#0b5d6b;--blue:#4a7897;--gold:#b58b48;--ok:#3f7a4c;--warn:#9a6d0a;--risk:#a23b2e;--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border)}.brand h1{margin:0;font:600 1.15rem var(--serif)}.brand p{margin:3px 0 0;color:var(--muted);font:400 .56rem var(--mono);text-transform:uppercase;letter-spacing:.08em}.toggle{border:1px solid var(--border);background:var(--surface2);padding:7px 10px;border-radius:7px;color:var(--ink)}.app{display:grid;grid-template-columns:210px 1fr}.side{min-height:calc(100vh - 58px);background:var(--surface);border-right:1px solid var(--border);padding:14px 9px}.nav{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;padding:9px;border-radius:7px;color:var(--muted);font-size:.72rem;font-weight:600}.nav.active{background:#e4f1f2;color:var(--accent);border-left-color:var(--accent)}.main{padding:20px 24px 44px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}.head h2{margin:0;font:600 1.45rem var(--serif)}.head p{margin:4px 0 0;max-width:800px;font-size:.72rem;line-height:1.5;color:var(--muted)}.chip{font:400 .52rem var(--mono);text-transform:uppercase;color:var(--accent);background:#e4f1f2;border:1px solid #bddcde;padding:5px 7px;border-radius:999px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px;box-shadow:0 2px 8px rgba(34,48,58,.06)}.eyebrow{font:500 .5rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#7b8893;margin-bottom:6px}.value{font:600 1.45rem var(--serif)}.sub{font-size:.6rem;line-height:1.45;color:var(--muted);margin-top:5px}.section-title{font-size:.78rem;font-weight:700;margin:0 0 8px}.bar{display:grid;grid-template-columns:150px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:.6rem;color:var(--muted)}.track{height:8px;border-radius:999px;background:#e9eef1;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}.score{text-align:right;font:400 .55rem var(--mono)}.chart{width:100%;height:210px}.gridline{stroke:var(--border);stroke-dasharray:3 5}.line1{fill:none;stroke:var(--accent);stroke-width:3}.line2{fill:none;stroke:var(--gold);stroke-width:2.5}.area{fill:#e4f1f2;opacity:.7}table{width:100%;border-collapse:collapse;font-size:.6rem}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left}th{font:400 .49rem var(--mono);text-transform:uppercase;color:#7b8893;background:var(--surface2)}.badge{padding:3px 6px;border-radius:999px;font-size:.55rem;font-weight:700}.good{color:var(--ok);background:#e8f3eb}.warn{color:var(--warn);background:#fbf1dc}.risk{color:var(--risk);background:#f8e8e5}.flow{display:flex;gap:6px;overflow:auto}.node{min-width:150px;flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px}.node strong{font-size:.62rem}.node p{font-size:.56rem;line-height:1.4;color:var(--muted);margin:4px 0 0}.arrow{align-self:center;color:#7b8893}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface2));padding:12px;border-radius:10px}.decision h3{font:600 1rem var(--serif);margin:0 0 5px}.decision p{font-size:.6rem;line-height:1.5;color:var(--muted);margin:0}.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{border:1px solid var(--border);background:var(--surface2);padding:6px 8px;border-radius:6px;font-size:.6rem;color:var(--ink)}.tab.active{background:#e4f1f2;color:var(--accent);border-color:var(--accent);font-weight:700}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:flex;min-height:auto;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.nav{width:auto;white-space:nowrap}.kpis,.two,.three{grid-template-columns:1fr}.main{padding:16px 12px}}
</style>
</head>
<body>
<header class="header"><div class="brand"><h1>Transformation Performance & Benefits Dashboard</h1><p>Operational performance · benefits realisation · data quality · improvement</p></div><button class="toggle" id="reset">Reset view</button></header>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const views=[['overview','Performance overview'],['benefits','Benefits realisation'],['quality','Data quality'],['improvement','Improvement pipeline'],['governance','Reporting governance']];let state={view:'overview'};
function smooth(v){const w=650,h=210,p=25,min=Math.min(...v)-2,max=Math.max(...v)+2,pts=v.map((x,i)=>[p+i/(v.length-1)*(w-2*p),h-p-(x-min)/(max-min)*(h-2*p)]);let d=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){let a=pts[i],b=pts[i+1],m=(a[0]+b[0])/2;d+=` C ${m} ${a[1]}, ${m} ${b[1]}, ${b[0]} ${b[1]}`;}return d}
function chart(a,b){const d=smooth(a);return `<svg class="chart" viewBox="0 0 650 210">${[45,95,145,195].map(y=>`<line class="gridline" x1="25" y1="${y}" x2="625" y2="${y}"/>`).join('')}<path class="line1" d="${d}"/>${b?`<path class="line2" d="${smooth(b)}"/>`:''}</svg>`}
function bars(items){return items.map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span class="score">${x[1]}%</span></div>`).join('')}
function head(t,d){return `<div class="head"><div><h2>${t}</h2><p>${d}</p></div><span class="chip">Illustrative demonstration</span></div>`}
function overview(){return `${head('Operational performance','A role-focused demonstration of how operational data can be consolidated, validated and translated into performance insight for transformation decision-making.')}<section class="grid kpis"><div class="card"><div class="eyebrow">Service performance</div><div class="value">94.2%</div><div class="sub">Illustrative target attainment across tracked measures</div></div><div class="card"><div class="eyebrow">Benefits realised</div><div class="value">87%</div><div class="sub">Delivered value against planned benefits</div></div><div class="card"><div class="eyebrow">Data quality</div><div class="value">98.6%</div><div class="sub">Records passing validation checks</div></div><div class="card"><div class="eyebrow">Reporting timeliness</div><div class="value">96%</div><div class="sub">Recurring outputs delivered to schedule</div></div></section><section class="grid two"><div class="card"><h3 class="section-title">Performance trend</h3><p class="sub">Actual performance compared with target across the reporting cycle.</p>${chart([86,87,88,90,91,92,93,93,94,94,95,95],[88,88,89,89,90,90,91,91,92,92,93,93])}</div><div class="card"><h3 class="section-title">Performance dimensions</h3>${bars([['Service outcome',94],['Cycle time',89],['Benefits delivery',87],['Data completeness',99],['Stakeholder adoption',91]])}</div></section><section class="grid two" style="margin-top:10px"><div class="decision"><div class="eyebrow">Decision insight</div><h3>Focus improvement effort where outcome variance persists after implementation</h3><p>Combine performance trend, benefit measures and data-quality checks to separate genuine operational issues from reporting artefacts before recommending action.</p></div><div class="card"><h3 class="section-title">Current exceptions</h3><table><thead><tr><th>Area</th><th>Variance</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Cycle time</td><td>-6.1%</td><td><span class="badge warn">Monitor</span></td><td>Review workflow bottleneck</td></tr><tr><td>Benefit uptake</td><td>-4.0%</td><td><span class="badge warn">Review</span></td><td>Validate adoption assumptions</td></tr><tr><td>Data completeness</td><td>+1.2%</td><td><span class="badge good">On track</span></td><td>Maintain controls</td></tr></tbody></table></div></section>`}
function benefits(){return `${head('Benefits realisation','Tracking whether transformation initiatives are producing the intended operational outcomes after implementation.')}<div class="tabs"><button class="tab active">Outcome</button><button class="tab">Efficiency</button><button class="tab">Adoption</button></div><section class="grid two"><div class="card"><h3 class="section-title">Planned vs realised</h3>${bars([['Service improvement',91],['Manual effort reduction',84],['Reporting automation',93],['Adoption',88],['Risk reduction',86]])}</div><div class="card"><h3 class="section-title">Realisation trend</h3><p class="sub">Illustrative maturity of realised benefits after go-live.</p>${chart([48,57,66,72,78,82,85,87],[55,62,69,75,81,85,89,92])}</div></section><section class="card" style="margin-top:10px"><table><thead><tr><th>Initiative</th><th>Measure</th><th>Baseline</th><th>Current</th><th>Status</th></tr></thead><tbody><tr><td>Reporting automation</td><td>Manual preparation hours</td><td>100</td><td>42</td><td><span class="badge good">Realising</span></td></tr><tr><td>Workflow change</td><td>Average cycle time</td><td>8.4d</td><td>7.1d</td><td><span class="badge good">Improving</span></td></tr><tr><td>New control</td><td>Exception rate</td><td>5.8%</td><td>4.9%</td><td><span class="badge warn">Monitor</span></td></tr></tbody></table></section>`}
function quality(){return `${head('Data quality & reliability','Controls that improve confidence in operational performance information consolidated from multiple systems and stakeholder-maintained sources.')}<section class="grid three"><div class="card"><div class="eyebrow">Completeness</div><div class="value">98.8%</div><div class="sub">Mandatory fields populated</div></div><div class="card"><div class="eyebrow">Reconciliation</div><div class="value">99.3%</div><div class="sub">Cross-source values aligned</div></div><div class="card"><div class="eyebrow">Rule pass rate</div><div class="value">97.9%</div><div class="sub">Records passing reporting rules</div></div></section><section class="grid two" style="margin-top:10px"><div class="card"><h3 class="section-title">Validation coverage</h3>${bars([['Source completeness',99],['Duplicate checks',98],['Hierarchy mapping',96],['Definition conformity',97],['Reconciliation',99]])}</div><div class="card"><h3 class="section-title">Issue ageing</h3><table><thead><tr><th>Issue type</th><th>Open</th><th>>7 days</th><th>Control</th></tr></thead><tbody><tr><td>Missing source value</td><td>14</td><td>2</td><td><span class="badge good">Validation</span></td></tr><tr><td>Hierarchy mismatch</td><td>6</td><td>1</td><td><span class="badge warn">Mapping</span></td></tr><tr><td>Definition conflict</td><td>4</td><td>0</td><td><span class="badge good">Rule book</span></td></tr></tbody></table></div></section>`}
function improvement(){return `${head('Improvement pipeline','A simple method for turning recurring operational issues into prioritised improvement opportunities and measurable post-implementation outcomes.')}<div class="card"><div class="flow"><div class="node"><strong>1. Detect</strong><p>Identify trend, exception or stakeholder pain point.</p></div><div class="arrow">→</div><div class="node"><strong>2. Validate</strong><p>Confirm data quality and isolate the root cause.</p></div><div class="arrow">→</div><div class="node"><strong>3. Prioritise</strong><p>Assess impact, effort, risk and expected benefit.</p></div><div class="arrow">→</div><div class="node"><strong>4. Implement</strong><p>Deliver change with clear success measures.</p></div><div class="arrow">→</div><div class="node"><strong>5. Measure</strong><p>Track post-implementation performance and benefits.</p></div></div></div><section class="grid two" style="margin-top:10px"><div class="card"><h3 class="section-title">Opportunity prioritisation</h3>${bars([['Reporting automation',92],['Cycle-time reduction',86],['Data-quality uplift',88],['Dashboard usability',79],['Control simplification',74]])}</div><div class="decision"><div class="eyebrow">Operating principle</div><h3>Success measures should be defined before implementation</h3><p>This creates a defensible baseline and makes benefits realisation measurable rather than retrospective.</p></div></section>`}
function governance(){return `${head('Reporting governance','A lightweight governance layer to keep definitions, validation rules and recurring reporting consistent and reviewable.')}<section class="grid two"><div class="card"><h3 class="section-title">Governance coverage</h3>${bars([['Metric definitions',96],['Source lineage',92],['Validation rules',95],['Owner / reviewer clarity',89],['Change documentation',93]])}</div><div class="card"><table><thead><tr><th>Control</th><th>Purpose</th><th>Status</th></tr></thead><tbody><tr><td>Metric dictionary</td><td>Common interpretation</td><td><span class="badge good">Established</span></td></tr><tr><td>Reconciliation log</td><td>Trace exceptions</td><td><span class="badge good">Established</span></td></tr><tr><td>Change register</td><td>Document reporting changes</td><td><span class="badge good">Established</span></td></tr><tr><td>Source lineage</td><td>Improve traceability</td><td><span class="badge warn">Expand</span></td></tr></tbody></table></div></section>`}
const renderers={overview,benefits,quality,improvement,governance};function render(){document.getElementById('side').innerHTML=views.map((v,i)=>`<button class="nav ${state.view===v[0]?'active':''}" data-v="${v[0]}">0${i+1} &nbsp; ${v[1]}</button>`).join('')+`<p style="font-size:.56rem;color:#7b8893;line-height:1.5;padding:10px">Organisation-neutral portfolio artefact<br>Illustrative data only<br>No proprietary employer information</p>`;document.getElementById('main').innerHTML=renderers[state.view]();document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render()})}document.getElementById('reset').onclick=()=>{state.view='overview';render()};render();
</script>
</body>
</html>
