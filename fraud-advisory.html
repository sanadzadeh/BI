<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraud Risk Advisory Portfolio — Khaled Sanad</title>
<meta name="description" content="Illustrative fraud-risk advisory portfolio covering emerging threats, risk assessments, controls, governance, reporting and capability uplift.">
<style>
:root{--bg:#f4f6f7;--card:#fff;--soft:#f8fafb;--line:#dbe3e7;--ink:#18232c;--muted:#667580;--accent:#0b5d6b;--blue:#557d98;--green:#477f55;--gold:#b48946;--red:#a94d41;--serif:Georgia,serif;--mono:Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}h1{font:600 18px var(--serif);margin:0}.tag{font:10px var(--mono);color:var(--accent);background:#e6f1f2;padding:5px 7px;border-radius:999px}.app{display:grid;grid-template-columns:210px 1fr}.side{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 58px);padding:12px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:7px;margin:2px 0;color:var(--muted);cursor:pointer}.nav.active{background:#e6f1f2;color:var(--accent);font-weight:700}.meta{font-size:10px;color:#87949d;border-top:1px solid var(--line);margin-top:14px;padding-top:10px;line-height:1.4}.main{padding:20px}.head h2{margin:0;font:600 24px var(--serif)}.head p{color:var(--muted);font-size:12px}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(5,1fr);margin:12px 0}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.eye{font:10px var(--mono);text-transform:uppercase;color:#87949d}.val{font:600 24px var(--serif);margin-top:4px}.sub{font-size:10px;color:var(--muted);margin-top:3px}.two{grid-template-columns:1.2fr .8fr}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:145px 1fr 42px;gap:7px;align-items:center;font-size:11px}.track{height:8px;background:#edf1f3;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px}.decision{border-left:4px solid var(--accent)}.decision strong{font:600 17px var(--serif);display:block;margin:4px 0 8px}.decision span{font-size:11px;color:var(--muted);line-height:1.45}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:8px;border-bottom:1px solid var(--line);font-size:11px;text-align:left}th{font:10px var(--mono);text-transform:uppercase;color:#87949d;background:var(--soft)}.badge{padding:3px 6px;border-radius:999px;font-size:10px;font-weight:700}.good{background:#e7f2e9;color:var(--green)}.warn{background:#fbf0db;color:#956c15}.bad{background:#f8e7e4;color:var(--red)}.flow{display:flex;gap:6px;align-items:center;overflow:auto}.node{flex:1;min-width:140px;background:var(--soft);border:1px solid var(--line);padding:9px;border-radius:8px}.node b{font-size:11px}.node span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.arrow{color:#87949d}.heat{display:grid;grid-template-columns:140px repeat(4,1fr);gap:5px}.hc{padding:8px;border-radius:5px;color:#fff;text-align:center;font:10px var(--mono)}.hi{background:var(--red)}.mid{background:var(--gold)}.lo{background:var(--green)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{min-height:auto;display:flex;overflow:auto}.meta{display:none}.nav{white-space:nowrap}.kpis,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.two{grid-template-columns:1fr}}
</style></head><body><header><h1>Khaled S. — Fraud Risk Advisory Portfolio</h1><span class="tag">Illustrative data</span></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Overview','Fraud-risk overview','Current exposure, controls and decisions requiring attention.'],['Threats','Emerging threats','Illustrative fraud and identity-risk themes and response priorities.'],['Assessments','Risk assessments','A simple assessment view linking exposure, likelihood, impact and treatment.'],['Controls','Controls & actions','Prevent, detect and respond controls with current improvement actions.'],['Governance','Governance & reporting','How evidence moves from risk signal to decision and action.'],['Capability','Capability uplift','Training, guidance and repeatable methods for stronger fraud-risk practice.']];let view=0;
const risks=[['Identity takeover',84],['Social engineering',79],['Synthetic identity',71],['Mule activity',76],['Credential compromise',68]];
const controls=[['Identity verification',82],['Transaction monitoring',79],['Case escalation',86],['Threat intelligence',74],['Control assurance',77]];
function badge(s){return '<span class="badge '+(/Strong|On track|Complete/.test(s)?'good':/High|Critical/.test(s)?'bad':'warn')+'">'+s+'</span>'}
function bars(a){return '<div class="bars">'+a.map(x=>'<div class="bar"><span>'+x[0]+'</span><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><span>'+x[1]+'%</span></div>').join('')+'</div>'}
function head(){return '<div class="head"><h2>'+V[view][1]+'</h2><p>'+V[view][2]+'</p></div>'}
function overview(){return head()+'<div class="grid kpis"><div class="card"><div class="eye">High risks</div><div class="val">4</div><div class="sub">requiring active treatment</div></div><div class="card"><div class="eye">Open actions</div><div class="val">11</div><div class="sub">3 overdue</div></div><div class="card"><div class="eye">Control confidence</div><div class="val">80%</div><div class="sub">weighted assurance view</div></div><div class="card"><div class="eye">Emerging threats</div><div class="val">5</div><div class="sub">under active review</div></div><div class="card"><div class="eye">Capability sessions</div><div class="val">8</div><div class="sub">illustrative annual cycle</div></div></div><div class="grid two"><div class="card">'+bars(risks)+'</div><div class="card decision"><div class="eye">Advisory focus</div><strong>Strengthen identity-risk controls where threat growth and control confidence diverge</strong><span>Priority should follow evidence of changing exposure, control effectiveness and service impact rather than threat volume alone.</span></div></div>'}
function threats(){return head()+'<div class="card"><div class="table"><table><thead><tr><th>Threat</th><th>Signal</th><th>Exposure</th><th>Response</th><th>Status</th></tr></thead><tbody><tr><td>Identity takeover</td><td>Growth in compromised identity indicators</td><td>High</td><td>Review verification and escalation controls</td><td>'+badge('Critical')+'</td></tr><tr><td>Social engineering</td><td>Changing scam narratives</td><td>High</td><td>Improve customer and frontline indicators</td><td>'+badge('High')+'</td></tr><tr><td>Synthetic identity</td><td>Cross-source inconsistencies</td><td>Medium</td><td>Strengthen identity-data checks</td><td>'+badge('Review')+'</td></tr><tr><td>Mule activity</td><td>Transaction and network signals</td><td>High</td><td>Improve detection and case feedback</td><td>'+badge('High')+'</td></tr></tbody></table></div></div>'}
function assessments(){return head()+'<div class="grid two"><div class="card"><div class="heat"><div></div><div>Likelihood</div><div>Impact</div><div>Control gap</div><div>Priority</div><div>Identity takeover</div><div class="hc hi">5</div><div class="hc hi">5</div><div class="hc mid">3</div><div class="hc hi">High</div><div>Social engineering</div><div class="hc hi">5</div><div class="hc mid">4</div><div class="hc mid">3</div><div class="hc hi">High</div><div>Synthetic identity</div><div class="hc mid">3</div><div class="hc mid">4</div><div class="hc mid">3</div><div class="hc mid">Med</div><div>Credential compromise</div><div class="hc mid">4</div><div class="hc mid">3</div><div class="hc lo">2</div><div class="hc mid">Med</div></div></div><div class="card decision"><div class="eye">Assessment principle</div><strong>Separate threat severity from control effectiveness</strong><span>A material threat does not automatically mean weak control. The advisory view needs both the exposure and the current strength of prevention, detection and response.</span></div></div></div>'}
function controlsView(){return head()+'<div class="grid two"><div class="card">'+bars(controls)+'</div><div class="card"><div class="flow"><div class="node"><b>Prevent</b><span>Identity and process controls</span></div><div class="arrow">→</div><div class="node"><b>Detect</b><span>Signals and monitoring</span></div><div class="arrow">→</div><div class="node"><b>Respond</b><span>Case, escalation and recovery</span></div><div class="arrow">→</div><div class="node"><b>Learn</b><span>Intelligence and control feedback</span></div></div></div></div><div class="card" style="margin-top:10px"><div class="table"><table><thead><tr><th>Control area</th><th>Issue</th><th>Action</th><th>Status</th></tr></thead><tbody><tr><td>Identity verification</td><td>Changing attack methods</td><td>Review step-up triggers</td><td>'+badge('Review')+'</td></tr><tr><td>Threat intelligence</td><td>Feedback not consistently reused</td><td>Formalise intelligence-to-control cycle</td><td>'+badge('On track')+'</td></tr><tr><td>Case escalation</td><td>Different thresholds</td><td>Align escalation criteria</td><td>'+badge('Review')+'</td></tr></tbody></table></div></div>'}
function governance(){return head()+'<div class="card"><div class="flow"><div class="node"><b>Signal</b><span>Threat, incident or control issue</span></div><div class="arrow">→</div><div class="node"><b>Assess</b><span>Exposure, likelihood, impact</span></div><div class="arrow">→</div><div class="node"><b>Advise</b><span>Options and recommendation</span></div><div class="arrow">→</div><div class="node"><b>Decide</b><span>Owner, treatment and due date</span></div><div class="arrow">→</div><div class="node"><b>Monitor</b><span>Evidence of improvement</span></div></div></div><div class="grid two" style="margin-top:10px"><div class="card">'+bars([['Risk assessment currency',92],['Action ownership',85],['Control evidence',79],['Executive reporting',90],['Policy alignment',88]])+'</div><div class="card decision"><div class="eye">Reporting standard</div><strong>Show the exposure, the control position and the decision required</strong><span>Senior reporting should make the reason for action clear without burying the decision under operational detail.</span></div></div></div>'}
function capability(){return head()+'<div class="grid two"><div class="card"><div class="table"><table><thead><tr><th>Capability area</th><th>Audience</th><th>Method</th><th>Outcome</th></tr></thead><tbody><tr><td>Fraud-risk assessment</td><td>Risk and business teams</td><td>Workshop + guide</td><td>More consistent assessments</td></tr><tr><td>Emerging threat interpretation</td><td>Operations and controls</td><td>Briefing</td><td>Faster translation to action</td></tr><tr><td>Evidence and escalation</td><td>Advisory teams</td><td>Case examples</td><td>Clearer recommendations</td></tr><tr><td>Control feedback</td><td>Risk, operations, technology</td><td>Working session</td><td>Better learning loop</td></tr></tbody></table></div></div><div class="card decision"><div class="eye">Capability approach</div><strong>Build repeatable judgement, not just awareness</strong><span>Training is most useful when people can apply the same method to a new fraud-risk problem after the session ends.</span></div></div></div>'}
function render(){document.getElementById('side').innerHTML=V.map((x,i)=>'<button class="nav '+(i===view?'active':'')+'" onclick="view='+i+';render()">'+(i+1)+'. '+x[0]+'</button>').join('')+'<div class="meta">Illustrative example only. Uses fictional data and does not represent any organisation\'s actual fraud events, controls or risk profile.</div>';document.getElementById('main').innerHTML=[overview,threats,assessments,controlsView,governance,capability][view]()}render();
</script></body></html>
