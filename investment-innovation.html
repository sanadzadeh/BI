<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investment Innovation Dashboard</title><meta name="description" content="Organisation-neutral investment analytics dashboard covering portfolio monitoring, research signals, scenarios, AI-enabled workflows and controls."><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--paper:#f3f5f6;--surface:#fff;--surface-alt:#f7f9fb;--surface-deep:#eaf0ff;--border:#d9e1ef;--border-2:#b9c8eb;--ink:#18232c;--ink-2:#55636f;--ink-3:#7b8893;--accent:#1152f0;--accent-2:#2f68f2;--accent-dim:#eaf0ff;--accent-mid:#c5d5ff;--blue:#6f91ee;--gold:#e0a344;--ok:#3f7a4c;--ok-dim:#e8f3eb;--warn:#a3720a;--warn-dim:#fbf1dc;--risk:#a23b2e;--risk-dim:#f8e8e5;--shadow:0 7px 22px rgba(34,48,58,.07);--shadow-sm:0 2px 8px rgba(34,48,58,.05);--radius:11px;--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono','Courier New',monospace}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-top:6px solid #323232;border-bottom:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center;min-width:260px}.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative;box-shadow:var(--shadow-sm)}.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:#fff;border-radius:6px}.brand-mark:before{width:6px;height:23px;left:9px;top:5px;transform:rotate(35deg)}.brand-mark:after{width:6px;height:23px;right:9px;top:5px;transform:rotate(-35deg)}.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.select{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}.side-title{font:400 .5rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.58rem;line-height:1.5;color:var(--ink-2)}.main{min-width:0;padding:20px 24px 44px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:850px;color:var(--ink-2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:7px}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:500 .54rem/1 var(--mono)}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--ok-dim)}.warn{color:var(--warn);background:var(--warn-dim)}.bad{color:var(--risk);background:var(--risk-dim)}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--ink-2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}.chart{width:100%;height:205px;display:block}.gridline{stroke:var(--border);stroke-dasharray:3 5}.tick{fill:var(--ink-3);font:8px var(--mono)}.line-a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5}.metric-stack{display:grid;gap:8px}.metric-bar{display:grid;grid-template-columns:115px 1fr 44px;gap:8px;align-items:center}.metric-bar label{font-size:.59rem;color:var(--ink-2)}.track{height:7px;border-radius:999px;background:#edf1f7;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}.heatmap{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .48rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center}.heat-label{font-size:.59rem;color:var(--ink-2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .52rem/1 var(--mono)}.hi{background:var(--ok)}.mid{background:var(--warn)}.lo{background:var(--risk)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:6px 8px;font-size:.58rem;text-align:left}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}@media(max-width:1150px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.header{align-items:flex-start;flex-wrap:wrap}}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenarios{grid-template-columns:1fr}.header{position:static}}</style></head><body><div class="shell"><header class="header"><div class="brand"><div class="brand-mark"></div><div><h1>Investment Innovation Dashboard</h1><p>portfolio analytics · research signals · scenarios · governance</p></div></div><div class="controls"><select class="select"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="select"><option>Whole portfolio</option><option>Growth portfolio</option><option>Exception view</option></select></div></header><div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div></div><script>const CFG={views:[{nav:'Executive overview',title:'Investment overview',desc:'Portfolio position, active research signals and decision exceptions.'},{nav:'Performance',title:'Portfolio performance',desc:'Trend, relative performance and contribution across investment themes.'},{nav:'Data assurance',title:'Analytical assurance',desc:'Data quality, source coverage and validation before outputs reach decision-makers.'},{nav:'Scenarios',title:'Investment scenarios',desc:'Scenario comparison for portfolio, market and research assumptions.'},{nav:'Governance',title:'Governance and lineage',desc:'Traceability from investment question to source, method, review and action.'}],kpis:[['Portfolio index','104.8','Illustrative composite','PF'],['Active signals','12','4 high confidence','SG'],['Model confidence','87%','Post-validation','CF'],['Open exceptions','5','2 need review','EX']],primary:[['Equities',82,88,5],['Credit',79,84,4],['Rates',75,81,6],['Real assets',86,89,3],['Alternatives',72,78,5],['Liquidity',90,92,2]],health:[['Data completeness',95],['Signal stability',88],['Back-test coverage',84],['Explainability',91],['Review closure',82]],register:[['Macro surprise','Rates','On track','Scenario update'],['Earnings-language shift','Equities','On track','Research review'],['Liquidity deterioration','Credit','Watch','Monitor'],['Feature drift','Model','Review','Hold']],trendA:[74,76,78,80,81,83,85,87,89,91,93,95],trendB:[72,73,75,77,79,80,82,84,85,87,89,90],mix:[['Growth',89],['Defensive',84],['Real assets',81],['Alternatives',77],['Liquidity',92]],quality:[['Market data',[98,96,95,96]],['Fundamental data',[94,93,88,91]],['External research',[88,90,82,86]],['Model features',[90,92,81,84]]],flow:[['Investment question','Define portfolio or research decision.'],['Data','Market, fundamental and approved external sources.'],['Analysis','Signals, scenarios, ranking and attribution.'],['Validation','Sensitivity, stability and exception review.'],['Decision','Recommendation, caveats and next action.']],scenarios:[{name:'Base',note:'Current assumptions',series:[74,76,79,81,83,85,87,89],k:[['Portfolio index','104.8'],['Active signals','12'],['Confidence','87%'],['Exceptions','5']],decision:'Maintain current positioning',detail:'No material change required while monitoring identified rate and liquidity signals.'},{name:'Growth tilt',note:'Higher risk allocation',series:[74,78,82,85,88,91,94,97],k:[['Portfolio index','107.2'],['Active signals','15'],['Confidence','82%'],['Exceptions','8']],decision:'Increase monitoring intensity',detail:'Higher upside is paired with wider dispersion and a larger exception queue.'},{name:'Risk-off',note:'Defensive allocation',series:[74,75,76,78,80,82,84,86],k:[['Portfolio index','102.9'],['Active signals','9'],['Confidence','90%'],['Exceptions','3']],decision:'Prioritise capital preservation',detail:'Lower dispersion and fewer unresolved signals support a more defensive stance.'},{name:'Data uplift',note:'Improved enrichment',series:[74,80,84,88,91,93,95,96],k:[['Portfolio index','105.5'],['Active signals','13'],['Confidence','92%'],['Exceptions','2']],decision:'Use enrichment to sharpen conviction',detail:'Improved source quality raises confidence and reduces unresolved exceptions.'}],lineage:[['Investment finding','Theme, scale, confidence and action.'],['Analytical model','Portfolio, market and signal structures.'],['Method','Scenario, ranking and attribution logic.'],['Source','Controlled internal and external data.'],['QA','Review, evidence trail and sign-off.']],timeline:[['Daily monitoring','Material signal movement and threshold breaches.'],['Weekly research review','Signals, confidence and priority actions.'],['Monthly scenario refresh','Re-test assumptions and key sensitivities.'],['Quarterly governance review','Model, source and control effectiveness.']],gov:[['Signal validation','Investment analytics','Test evidence','On track'],['Scenario governance','Portfolio strategy','Sensitivity pack','On track'],['Exception ownership','Research leads','Action register','Watch'],['External data','Data governance','Source register','On track']]};let state={view:0,scenario:0};function badge(s){let c=/on track/i.test(s)?'good':/watch|review/i.test(s)?'warn':'bad';return `<span class="badge ${c}">${s}</span>`}function smoothPath(a){let d=`M ${a[0][0]} ${a[0][1]}`;for(let i=0;i<a.length-1;i++){let p=a[i],q=a[i+1],m=(p[0]+q[0])/2;d+=` C ${m} ${p[1]}, ${m} ${q[1]}, ${q[0]} ${q[1]}`}return d}function lineChart(a,b){const w=650,h=220,p=28,all=[...a,...b],mn=Math.min(...all)-2,mx=Math.max(...all)+2,pts=x=>x.map((v,i)=>[p+i/(x.length-1)*(w-2*p),h-p-(v-mn)/(mx-mn)*(h-2*p)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-a" d="${smoothPath(pts(a))}"/><path class="line-b" d="${smoothPath(pts(b))}"/></svg>`}function barLine(rows){const w=650,h=220,pL=42,pR=24,pT=18,pB=28,slot=(w-pL-pR)/rows.length,maxB=100,maxL=8,bars=rows.map((d,i)=>{let x=pL+i*slot+slot*.14,ah=d[1]/maxB*(h-pT-pB),bh=d[2]/maxB*(h-pT-pB);return `<rect x="${x}" y="${h-pB-ah}" width="${slot*.25}" height="${ah}" rx="3" fill="var(--blue)" opacity=".78"/><rect x="${x+slot*.29}" y="${h-pB-bh}" width="${slot*.25}" height="${bh}" rx="3" fill="var(--gold)" opacity=".88"/>`}).join(''),pts=rows.map((d,i)=>[pL+i*slot+slot*.42,pT+(maxL-d[3])/maxL*(h-pT-pB)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join('')}${bars}<path class="line-risk" d="${smoothPath(pts)}"/>${rows.map((d,i)=>`<text class="tick" x="${pL+i*slot+slot*.14}" y="${h-8}">${d[0]}</text>`).join('')}</svg>`}function bars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="metric-score">${x[1]}%</div></div>`).join('')}</div>`}function head(i,tag){return `<div class="page-head"><div><h2 class="page-title">${CFG.views[i].title}</h2><p class="page-desc">${CFG.views[i].desc}</p></div><span class="demo">${tag}</span></div>`}function renderOverview(){return head(0,'Current view')+`<section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">${x[2]}</div></div><div class="kpi-icon">${x[3]}</div></div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>Portfolio coverage and signal exceptions</h3><p>Current versus baseline with exception overlay.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Baseline</span><span><i style="background:var(--gold)"></i>Current</span><span><i style="background:var(--risk)"></i>Exceptions</span></div></div>${barLine(CFG.primary)}</div><div class="card"><div class="chart-title"><div><h3>Analytical health</h3><p>Selected monitoring and control gates.</p></div></div>${bars(CFG.health)}</div></section><section class="grid two"><div class="decision"><div class="eyebrow">Decision focus</div><h3>Escalate signals where conviction and portfolio impact intersect</h3><p>Prioritise signals that are supported by stable data, clear drivers and a material portfolio implication.</p></div><div class="card"><div class="chart-title"><div><h3>Priority register</h3><p>Current items requiring attention.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Area</th><th>Status</th><th>Action</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div></section>`}function renderPerformance(){return head(1,'Performance view')+`<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Portfolio vs benchmark trend</h3><p>Illustrative indexed trajectory.</p></div></div>${lineChart(CFG.trendA,CFG.trendB)}</div><div class="card"><div class="chart-title"><div><h3>Portfolio mix</h3><p>Coverage by major investment area.</p></div></div>${bars(CFG.mix)}</div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Performance scorecard</h3><p>Selected measures and current position.</p></div></div><div class="table-wrap"><table><thead><tr><th>Domain</th><th>Measure</th><th>Current</th><th>Direction</th><th>Status</th></tr></thead><tbody><tr><td>Equities</td><td>Signal coverage</td><td>88%</td><td>+6pp</td><td>${badge('On track')}</td></tr><tr><td>Credit</td><td>Liquidity coverage</td><td>84%</td><td>+4pp</td><td>${badge('On track')}</td></tr><tr><td>Rates</td><td>Scenario coverage</td><td>81%</td><td>+7pp</td><td>${badge('Watch')}</td></tr><tr><td>Models</td><td>Validation pass rate</td><td>91%</td><td>Stable</td><td>${badge('On track')}</td></tr></tbody></table></div></section>`}function renderQuality(){return head(2,'Assurance view')+`<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heatmap"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="heat-head">${x}</div>`).join('')}${CFG.quality.map(q=>`<div class="heat-label">${q[0]}</div>${q[1].map(v=>`<div class="heat-cell ${v>=90?'hi':v>=80?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Validation pathway</h3><p>From question to trusted decision output.</p></div></div><div class="flow">${CFG.flow.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div></section>`}function renderScenario(){let s=CFG.scenarios[state.scenario];return head(3,'Scenario view')+`<div class="scenarios">${CFG.scenarios.map((x,i)=>`<button class="scenario ${i===state.scenario?'active':''}" data-sc="${i}"><strong>${x.name}</strong><span>${x.note}</span></button>`).join('')}</div><section class="grid kpis">${s.k.map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div></div>`).join('')}</section><section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Scenario trajectory</h3><p>Baseline versus selected scenario.</p></div></div>${lineChart(CFG.scenarios[0].series,s.series)}</div><div class="decision"><div class="eyebrow">Scenario implication</div><h3>${s.decision}</h3><p>${s.detail}</p></div></section>`}function renderGovernance(){return head(4,'Governance view')+`<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Measure lineage</h3><p>Trace output back to controlled source.</p></div></div><div class="flow">${CFG.lineage.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Governance rhythm</h3><p>Monitoring and review cadence.</p></div></div><div class="timeline">${CFG.timeline.map(x=>`<div class="tl"><span class="tl-dot"></span><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div></div></section><section class="card" style="margin-top:10px"><div class="chart-title"><div><h3>Governance controls</h3><p>Ownership, evidence and status.</p></div></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${CFG.gov.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join('')}</tbody></table></div></section>`}const R=[renderOverview,renderPerformance,renderQuality,renderScenario,renderGovernance];function renderSidebar(){let s=document.getElementById('sidebar');s.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-view="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v.nav}</span></button>`).join('')}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Decision-support demonstration</div>`;s.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}function render(){document.getElementById('main').innerHTML=R[state.view]();renderSidebar();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.scenario=+b.dataset.sc;render()})}render();</script></body></html>
