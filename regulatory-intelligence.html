<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}body,.card,.header,.sidebar,.nav,.select,.theme-btn,.tab,.scenario,.heat-cell{transition:background-color .18s,color .18s,border-color .18s}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}button,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center;min-width:240px}.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--blue));position:relative;box-shadow:var(--shadow-sm)}.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.brand-mark:before{top:11px}.brand-mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--serif);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.select,.theme-btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:.64rem}.theme-btn{display:flex;align-items:center;gap:7px;font-weight:600}.theme-orb{width:10px;height:10px;border-radius:50%;background:#e0a72f;box-shadow:0 0 0 4px rgba(224,167,47,.14)}:root[data-theme="dark"] .theme-orb{background:#8bc5ec;box-shadow:0 0 0 4px rgba(139,197,236,.12)}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:15px 9px}.side-title{font:400 .5rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accent-dim);border-left-color:var(--accent);color:var(--accent)}.nav-num{font:400 .53rem/1.2 var(--mono);color:var(--ink-3)}.nav-label{font-size:.71rem;font-weight:600}.side-meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--border);font-size:.59rem;line-height:1.5;color:var(--ink-2)}.main{min-width:0;padding:20px 24px 44px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.page-title{font:600 1.38rem/1 var(--serif);margin:0 0 5px}.page-desc{margin:0;max-width:850px;color:var(--ink-2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-mid);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px;min-width:0}.card.feature{box-shadow:var(--shadow)}.eyebrow{font:500 .49rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:7px}.kpi-value{font:600 1.33rem/.95 var(--serif)}.kpi-sub{font-size:.59rem;color:var(--ink-2);line-height:1.35;margin-top:5px}.kpi-icon{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);font:500 .54rem/1 var(--mono)}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.56rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--ok-dim)}.warn{color:var(--warn);background:var(--warn-dim)}.bad{color:var(--risk);background:var(--risk-dim)}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink-3);margin:3px 0 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--ink-2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}.chart{width:100%;height:205px;display:block;overflow:visible}.gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--ink-3);font:8px var(--mono)}.line-a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-b{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-risk{fill:none;stroke:var(--risk);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.metric-stack{display:grid;gap:8px}.metric-bar{display:grid;grid-template-columns:135px 1fr 44px;gap:8px;align-items:center}.metric-bar label{font-size:.59rem;color:var(--ink-2)}.track{height:7px;border-radius:999px;background:var(--surface-deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue))}.metric-score{text-align:right;font:400 .55rem/1 var(--mono);color:var(--ink-2)}.heatmap{display:grid;grid-template-columns:155px repeat(4,1fr);gap:6px;align-items:center}.heat-head{font:400 .48rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center}.heat-label{font-size:.59rem;color:var(--ink-2)}.heat-cell{height:29px;border-radius:5px;display:grid;place-items:center;font:400 .52rem/1 var(--mono)}.hi{background:var(--ok-dim);color:var(--ok)}.mid{background:var(--warn-dim);color:var(--warn)}.lo{background:var(--risk-dim);color:var(--risk)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:168px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accent-dim);border-color:var(--accent)}.node .nt{font:400 .48rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}.node .nb{font-size:.58rem;line-height:1.4;color:var(--ink-2)}.flow-arrow{align-self:center;color:var(--ink-3)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm)}.decision h3{font:600 .94rem/1.15 var(--serif);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--ink-2);margin:0}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}.scenario-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink-2);border-radius:6px;padding:8px;text-align:left}.scenario.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}.scenario strong,.scenario span{display:block}.scenario span{margin-top:3px;color:var(--ink-3);font-size:.51rem;line-height:1.3}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}.tl-dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl.warn .tl-dot{border-color:var(--warn)}.tl.good .tl-dot{border-color:var(--ok)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink-2)}@media(max-width:1150px){.kpis,.scenario-grid{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.header{align-items:flex-start;flex-wrap:wrap}}@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.side-meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenario-grid{grid-template-columns:1fr}.header{position:static}}

<body>
<div class="shell"><header class="header"><div class="brand"><div class="brand-mark"></div><div><h1>Khaled S. - Regulatory Intelligence, Data & Reporting Portfolio</h1><p>intelligence-led · risk-based · targeting · operational reporting</p></div></div><div class="controls"><select class="select"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="select"><option>Enterprise view</option><option>Priority targeting</option><option>Exception view</option></select><button class="theme-btn" id="themeBtn"><span class="theme-orb"></span><span id="themeText">Dark</span></button></div></header><div class="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main"></main></div></div>
<script>
const CFG={views:[{nav:'Executive overview',title:'Regulatory intelligence overview',desc:'An intelligence-led and risk-based view of regulatory exposure, targeting, operational insight and performance.'},{nav:'Performance',title:'Operational intelligence performance',desc:'Coverage, emerging trends, targeting and action closure across priority regulatory activity.'},{nav:'Intelligence assurance',title:'Intelligence assurance',desc:'Source reliability, data quality, analytical confidence and quality assurance supporting defensible decisions.'},{nav:'Intelligence & targeting',title:'Intelligence and targeting',desc:'From intelligence intake through exploitation assessment to regulatory targeting and response.'},{nav:'Governance',title:'Governance, information sharing & lineage',desc:'Information-sharing controls, briefing materials, governance processes and traceability from source to action.'}],kpis:[['High-risk entities','46','Priority regulatory population','EN'],['Priority premises','31','Targeting focus','PR'],['High-confidence assessments','84%','Evidence-rated intelligence','CF'],['Open regulatory actions','12','Operational follow-up','AC']],health:[['Source reliability',91],['Risk indicator quality',88],['Targeting coverage',86],['Intelligence QA',94],['Action closure',81]],rows:[['Retail activity',62,79,7],['Supply / distribution',68,85,8],['Entity networks',58,74,5],['Premises risk',64,82,7],['Online activity',49,71,9]],trendA:[72,74,76,78,80,81,84,86,87,89,91,93],trendB:[65,68,70,72,74,76,78,81,83,85,87,89],mix:[['Entity intelligence',89],['Premises intelligence',86],['Emerging trends',82],['External referrals',79],['Operational reporting',93]],quality:[['Internal operational data',[96,94,93,95]],['Entity / premises data',[92,91,88,92]],['External intelligence',[88,90,82,86]],['Assessment actions',[90,92,84,88]]],targeting:[['External intelligence','Law enforcement, regulator or other validated referral.'],['Entity & premises matching','Resolve customers, entities, locations and associated relationships.'],['Behavioural analysis','Assess transactional, network and emerging-trend indicators.'],['Exploitation assessment','Define exposure, confidence, limitations and broader risk.'],['Targeting priority','Rank activity, premises or entities using risk-based criteria.'],['Regulatory response','Investigation, enforcement, control uplift or further intelligence.']],register:[['Illicit product activity','Retail / premises','High','Targeted regulatory activity'],['Linked entity network','Entity intelligence','Review','Expand relationship analysis'],['Emerging distribution pattern','Supply','Watch','Refresh indicators'],['External agency referral','Information sharing','Review','Complete exploitation assessment']],governance:[['Intelligence intake','Intelligence / operations','Source, provenance, handling restrictions','On track'],['Assessment QA','Intelligence analytics','Evidence, confidence, limitations','On track'],['Targeting decision','Operational leadership','Risk indicators and priority rationale','On track'],['Information sharing','Authorised stakeholders','Need-to-know and sharing protocol','On track'],['Control improvement','Operations / policy','Assessment findings and action traceability','Watch']],timeline:[['good','Intelligence intake','Log provenance, classification and information-sharing restrictions.'],['good','Assessment and QA','Test source reliability, evidence and confidence before use.'],['warn','Targeting and briefing','Convert assessment into briefing material, priorities and operational options.'],['good','Response and review','Track regulatory action, control uplift and lessons for continuous improvement.']]};
let state={view:0};
function badge(s){const c=/on track|high/i.test(s)?'good':/watch|review/i.test(s)?'warn':'bad';return `<span class="badge ${c}">${s}</span>`}
function smoothPath(points){if(points.length<2)return'';let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const p0=points[i],p1=points[i+1],mx=(p0[0]+p1[0])/2;d+=` C ${mx} ${p0[1]}, ${mx} ${p1[1]}, ${p1[0]} ${p1[1]}`;}return d}
function lineChart(a,b){const w=650,h=220,p=28,all=[...a,...b],min=Math.min(...all)-2,max=Math.max(...all)+2,pts=a.map((v,i)=>[p+i/(a.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]),pts2=b.map((v,i)=>[p+i/(b.length-1)*(w-2*p),h-p-(v-min)/(max-min)*(h-2*p)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gridline" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="line-a" d="${smoothPath(pts)}"/><path class="line-b" d="${smoothPath(pts2)}"/></svg>`}
function barLine(rows){const w=650,h=220,pL=42,pR=24,pT=18,pB=28,slot=(w-pL-pR)/rows.length,maxB=100,maxL=10,bars=rows.map((d,i)=>{const x=pL+i*slot+slot*.14,ah=d[1]/maxB*(h-pT-pB),bh=d[2]/maxB*(h-pT-pB);return `<rect x="${x}" y="${h-pB-ah}" width="${slot*.25}" height="${ah}" rx="3" fill="var(--blue)" opacity=".78"/><rect x="${x+slot*.29}" y="${h-pB-bh}" width="${slot*.25}" height="${bh}" rx="3" fill="var(--gold)" opacity=".86"/>`}).join(''),pts=rows.map((d,i)=>[pL+i*slot+slot*.42,pT+(maxL-d[3])/maxL*(h-pT-pB)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gridline" x1="${pL}" y1="${pT+i*(h-pT-pB)/3}" x2="${w-pR}" y2="${pT+i*(h-pT-pB)/3}"/>`).join('')}${bars}<path class="line-risk" d="${smoothPath(pts)}"/>${rows.map((d,i)=>`<text class="tick" x="${pL+i*slot+slot*.10}" y="${h-8}">${d[0]}</text>`).join('')}</svg>`}
function metricBars(items){return `<div class="metric-stack">${items.map(x=>`<div class="metric-bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="metric-score">${x[1]}%</div></div>`).join('')}</div>`}
function head(i,tag){const v=CFG.views[i];return `<div class="page-head"><div><h2 class="page-title">${v.title}</h2><p class="page-desc">${v.desc}</p></div><span class="demo">${tag}</span></div>`}
function renderOverview(){return head(0,'Illustrative demonstration')+`<section class="grid kpis">${CFG.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eyebrow">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-sub">${x[2]}</div></div><div class="kpi-icon">${x[3]}</div></div></div>`).join('')}</section><section class="grid two" style="margin-bottom:10px"><div class="card feature"><div class="chart-title"><div><h3>Risk indicators and targeting pressure</h3><p>Current exposure and priority activity across major regulatory themes.</p></div><div class="legend"><span><i style="background:var(--blue)"></i>Baseline</span><span><i style="background:var(--gold)"></i>Current</span><span><i style="background:var(--risk)"></i>Escalation signal</span></div></div>${barLine(CFG.rows)}</div><div class="card"><div class="chart-title"><div><h3>Intelligence-led operating model</h3><p>Health of evidence, targeting, QA and response.</p></div></div>${metricBars(CFG.health)}</div></section><section class="grid two"><div class="decision"><div class="eyebrow">Operational targeting</div><h3>Prioritise where multiple risk indicators converge</h3><p>Combine source reliability, recency, entity links, premises history and behavioural indicators before directing regulatory activity.</p></div><div class="card"><div class="chart-title"><div><h3>Priority regulatory register</h3><p>Current intelligence items requiring targeting or follow-up.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Domain</th><th>Priority</th><th>Response</th></tr></thead><tbody>${CFG.register.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function renderPerformance(){return head(1,'Performance view')+`<section class="grid two"><div class="card feature"><div class="chart-title"><div><h3>Intelligence coverage trend</h3><p>Illustrative movement across 12 reporting periods.</p></div></div>${lineChart(CFG.trendA,CFG.trendB)}</div><div class="card"><div class="chart-title"><div><h3>Intelligence coverage</h3><p>Coverage across major intelligence and reporting domains.</p></div></div>${metricBars(CFG.mix)}</div></section><section class="grid three" style="margin-top:10px"><div class="card"><div class="eyebrow">Business planning</div><div class="kpi-value">4</div><div class="kpi-sub">Priority themes informing current planning cycle</div></div><div class="card"><div class="eyebrow">Emerging trends</div><div class="kpi-value">7</div><div class="kpi-sub">Patterns under active intelligence review</div></div><div class="card"><div class="eyebrow">Briefing materials</div><div class="kpi-value">9</div><div class="kpi-sub">Decision-ready products issued this period</div></div></section>`}
function renderAssurance(){return head(2,'Assurance view')+`<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Source reliability and data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heatmap"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="heat-head">${x}</div>`).join('')}${CFG.quality.map(q=>`<div class="heat-label">${q[0]}</div>${q[1].map(v=>`<div class="heat-cell ${v>=90?'hi':v>=80?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Intelligence confidence framework</h3><p>From intake to defensible assessment.</p></div></div><div class="flow"><div class="node active"><div class="nt">Source</div><div class="nb">Provenance, authority, recency and handling restrictions.</div></div><div class="flow-arrow">→</div><div class="node"><div class="nt">Corroborate</div><div class="nb">Test external intelligence against internal data and related evidence.</div></div><div class="flow-arrow">→</div><div class="node"><div class="nt">Assess</div><div class="nb">Document confidence, limitations and competing explanations.</div></div><div class="flow-arrow">→</div><div class="node"><div class="nt">QA</div><div class="nb">Review analytical logic, evidence and intended use.</div></div></div></div></section><section class="decision" style="margin-top:10px"><div class="eyebrow">Assurance principle</div><h3>Intelligence products should remain traceable to source, method, confidence and decision use</h3><p>This makes findings easier to challenge, update and reuse when new intelligence changes the risk picture or requires control uplift.</p></section>`}
function renderTargeting(){return head(3,'Targeting view')+`<section class="card feature"><div class="chart-title"><div><h3>Intelligence-to-response pathway</h3><p>Illustrative operating flow for risk-based targeting and regulatory response.</p></div></div><div class="flow">${CFG.targeting.map((x,i)=>`${i?'<div class="flow-arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></section><section class="grid two" style="margin-top:10px"><div class="card"><div class="chart-title"><div><h3>Targeting dimensions</h3><p>Factors used to prioritise regulatory activity.</p></div></div>${metricBars([['Source confidence',88],['Entity / premises links',84],['Behavioural indicators',91],['Recency',86],['Operational history',79]])}</div><div class="decision"><div class="eyebrow">Exploitation assessment</div><h3>Move beyond the referral to understand organisational exposure</h3><p>Assess whether activity is isolated or indicates broader exploitation across customers, transactions, products, premises or connected entities before recommending investigation, enforcement or control change.</p></div></section>`}
function renderGovernance(){return head(4,'Governance view')+`<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Governance and information-sharing rhythm</h3><p>Control points from intake through response and continuous improvement.</p></div></div><div class="timeline">${CFG.timeline.map(x=>`<div class="tl ${x[0]}"><span class="tl-dot"></span><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div></div><div class="card"><div class="chart-title"><div><h3>Governance controls</h3><p>Ownership, evidence and information-sharing requirements.</p></div></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Owner</th><th>Evidence</th><th>Status</th></tr></thead><tbody>${CFG.governance.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3])}</td></tr>`).join('')}</tbody></table></div></div></section><section class="decision" style="margin-top:10px"><div class="eyebrow">Continuous improvement</div><h3>Use operational outcomes to refresh indicators, controls and targeting rules</h3><p>Transparent processes make it easier to update the operating model when new intelligence reveals emerging risk, control weakness or changes in how regulated products and services are being exploited.</p></section>`}
const R=[renderOverview,renderPerformance,renderAssurance,renderTargeting,renderGovernance];
function renderSidebar(){const s=document.getElementById('sidebar');s.innerHTML=`<div class="side-title">Portfolio views</div>${CFG.views.map((v,i)=>`<button class="nav ${i===state.view?'active':''}" data-view="${i}"><span class="nav-num">0${i}</span><span class="nav-label">${v.nav}</span></button>`).join('')}<div class="side-meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Intelligence-led and risk-based decision support</div>`;s.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}
function render(){document.getElementById('main').innerHTML=R[state.view]();renderSidebar()}
document.getElementById('themeBtn').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';document.getElementById('themeText').textContent=d?'Dark':'Light'};
render();
</script></body></html>
