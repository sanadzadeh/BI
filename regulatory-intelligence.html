<meta name="description" content="Illustrative regulatory intelligence, data and reporting portfolio covering risk indicators, targeting, operational reporting, assurance and governance.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#f3f5f6;--s:#fff;--sa:#f7f9fa;--sd:#e9eef1;--b:#d8e0e5;--b2:#bcc8cf;--i:#18232c;--i2:#55636f;--i3:#7b8893;--a:#0b5d6b;--a2:#2f7f7a;--ad:#e4f1f2;--am:#bddcde;--bl:#4a7897;--bd:#e7eff5;--g:#b58b48;--ok:#3f7a4c;--okd:#e8f3eb;--w:#a3720a;--wd:#fbf1dc;--r:#a23b2e;--rd:#f8e8e5;--sh:0 7px 22px rgba(34,48,58,.08);--ss:0 2px 8px rgba(34,48,58,.06);--rad:11px;--ser:'Cormorant Garamond',Georgia,serif;--mon:'DM Mono',monospace}
:root[data-theme=dark]{--p:#11171c;--s:#182027;--sa:#1e2830;--sd:#25313a;--b:#2f3b44;--b2:#43525e;--i:#edf2f4;--i2:#aab5be;--i3:#81909b;--a:#61c5bf;--a2:#7cd4cf;--ad:#173335;--am:#27585a;--bl:#7ba9c8;--bd:#1b3040;--g:#c9a86d;--ok:#7fc98f;--okd:#193425;--w:#e0ad4c;--wd:#3a2e15;--r:#e08a7a;--rd:#3c201d;--sh:0 9px 26px rgba(0,0,0,.27);--ss:0 2px 10px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--p);color:var(--i);font-family:Inter,system-ui,sans-serif}body,.card,.header,.side,.nav,.select,.theme,.scenario,.decision{transition:background-color .18s,color .18s,border-color .18s}button,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;background:var(--s);border-bottom:1px solid var(--b)}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--a),var(--bl));position:relative;box-shadow:var(--ss)}.mark:before,.mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}.mark:before{top:11px}.mark:after{top:20px}.brand h1{font:600 1.06rem/1 var(--ser);margin:0}.brand p{margin:4px 0 0;font:400 .52rem/1.15 var(--mon);letter-spacing:.08em;text-transform:uppercase;color:var(--i3)}.controls{display:flex;gap:7px;flex-wrap:wrap}.select,.theme{border:1px solid var(--b);background:var(--sa);color:var(--i);border-radius:7px;padding:6px 8px;font-size:.64rem}.theme{display:flex;align-items:center;gap:7px;font-weight:600}.orb{width:10px;height:10px;border-radius:50%;background:#e0a72f;box-shadow:0 0 0 4px rgba(224,167,47,.14)}:root[data-theme=dark] .orb{background:#8bc5ec;box-shadow:0 0 0 4px rgba(139,197,236,.12)}.app{display:grid;grid-template-columns:210px minmax(0,1fr)}.side{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--s);border-right:1px solid var(--b);padding:15px 9px}.st{font:400 .5rem/1 var(--mon);letter-spacing:.13em;text-transform:uppercase;color:var(--i3);padding:0 9px 8px}.nav{width:100%;display:grid;grid-template-columns:24px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--i2);padding:8px 9px;border-radius:7px;margin:2px 0}.nav:hover{background:var(--sa);color:var(--i)}.nav.active{background:var(--ad);border-left-color:var(--a);color:var(--a)}.nn{font:400 .53rem/1.2 var(--mon);color:var(--i3)}.nl{font-size:.71rem;font-weight:600}.meta{margin-top:16px;padding:10px 9px;border-top:1px solid var(--b);font-size:.58rem;line-height:1.5;color:var(--i2)}.main{min-width:0;padding:20px 24px 44px}.view{display:none}.view.active{display:block}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.pt{font:600 1.38rem/1 var(--ser);margin:0 0 5px}.pd{margin:0;max-width:800px;color:var(--i2);font-size:.69rem;line-height:1.45}.demo{font:400 .5rem/1 var(--mon);letter-spacing:.08em;text-transform:uppercase;color:var(--a);background:var(--ad);border:1px solid var(--am);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:10px}.card{background:var(--s);border:1px solid var(--b);border-radius:var(--rad);box-shadow:var(--ss);padding:13px;min-width:0}.feature{box-shadow:var(--sh)}.eye{font:500 .49rem/1.2 var(--mon);letter-spacing:.09em;text-transform:uppercase;color:var(--i3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:7px}.kv{font:600 1.34rem/.95 var(--ser)}.ks{font-size:.59rem;color:var(--i2);line-height:1.35;margin-top:5px}.ki{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--ad);color:var(--a);font:500 .54rem/1 var(--mon)}.ct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.ct h3{font-size:.75rem;margin:0}.ct p{font-size:.56rem;color:var(--i3);margin:3px 0 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.54rem;color:var(--i2)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:block}.chart{width:100%;height:210px}.gl{stroke:var(--b);stroke-width:1;stroke-dasharray:3 5}.tick{fill:var(--i3);font:8px var(--mon)}.la{fill:none;stroke:var(--a);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.lb{fill:none;stroke:var(--bl);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.lr{fill:none;stroke:var(--r);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:126px 1fr 40px;gap:8px;align-items:center}.bar label{font-size:.58rem;color:var(--i2)}.track{height:7px;background:var(--sd);border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--bl))}.score{text-align:right;font:400 .54rem/1 var(--mon);color:var(--i2)}.decision{border-left:4px solid var(--a);background:linear-gradient(135deg,var(--s),var(--sa));border-radius:var(--rad);padding:13px 14px;box-shadow:var(--ss);border-top:1px solid var(--b);border-right:1px solid var(--b);border-bottom:1px solid var(--b)}.decision h3{font:600 .94rem/1.15 var(--ser);margin:0 0 5px}.decision p{font-size:.59rem;line-height:1.45;color:var(--i2);margin:0}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.53rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--okd)}.warn{color:var(--w);background:var(--wd)}.bad{color:var(--r);background:var(--rd)}.strip{display:flex;height:20px;border-radius:7px;overflow:hidden;border:1px solid var(--b);background:var(--sd)}.seg.good{background:var(--ok)}.seg.warn{background:var(--w)}.seg.bad{background:var(--r)}.summary{display:flex;gap:12px;margin-top:8px;font-size:.57rem;color:var(--i2);flex-wrap:wrap}.summary span{display:flex;align-items:center;gap:5px}.summary i{width:7px;height:7px;border-radius:2px}.heat{display:grid;grid-template-columns:145px repeat(4,1fr);gap:6px;align-items:center}.hh{font:400 .48rem/1 var(--mon);text-transform:uppercase;color:var(--i3);text-align:center}.hl{font-size:.59rem;color:var(--i2)}.hc{height:31px;border-radius:5px;display:grid;place-items:center;font:500 .52rem/1 var(--mon)}.hi{background:var(--okd);color:var(--ok)}.mid{background:var(--wd);color:var(--w)}.lo{background:var(--rd);color:var(--r)}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:150px;flex:1;padding:10px;border-radius:8px;background:var(--sa);border:1px solid var(--b)}.node.active{background:var(--ad);border-color:var(--a)}.nt{font:400 .48rem/1 var(--mon);text-transform:uppercase;color:var(--i3);margin-bottom:5px}.nb{font-size:.58rem;line-height:1.4;color:var(--i2)}.arrow{align-self:center;color:var(--i3)}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{text-align:left;border:1px solid var(--b);background:var(--sa);color:var(--i2);border-radius:7px;padding:9px}.scenario:hover{border-color:var(--am)}.scenario.active{background:var(--ad);border-color:var(--a);color:var(--a);box-shadow:inset 0 0 0 1px var(--am)}.scenario strong,.scenario span{display:block}.scenario strong{font-size:.61rem}.scenario span{margin-top:3px;color:var(--i3);font-size:.51rem;line-height:1.3}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:8px;top:2px;bottom:3px;width:2px;background:var(--b)}.tl{position:relative;margin-bottom:12px}.tl:last-child{margin-bottom:0}.dot{position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--s);border:3px solid var(--a)}.tl.warn .dot{border-color:var(--w)}.tl.good .dot{border-color:var(--ok)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--i2)}.tw{overflow:auto;border:1px solid var(--b);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:650px;background:var(--s)}th,td{padding:8px 9px;border-bottom:1px solid var(--b);text-align:left;font-size:.59rem}th{font:400 .47rem/1.2 var(--mon);text-transform:uppercase;color:var(--i3);background:var(--sa)}tbody tr:last-child td{border-bottom:0}
@media(max-width:1000px){.kpis,.scenarios{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--b)}.st,.meta{display:none}.nav{width:auto;white-space:nowrap}.two,.kpis,.scenarios{grid-template-columns:1fr}.header{position:static}.main{padding:16px 12px 36px}.heat{grid-template-columns:115px repeat(4,1fr)}}
</style></head>
<body><div class="shell"><header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. - Regulatory Intelligence, Data & Reporting Portfolio</h1><p>intelligence · risk indicators · targeting · operational reporting</p></div></div><div class="controls"><select class="select"><option>Current period</option><option>Quarter to date</option><option>Year to date</option></select><select class="select"><option>Enterprise view</option><option>Priority view</option><option>Exceptions</option></select><button class="theme" id="theme"><span class="orb"></span><span id="themeText">Dark</span></button></div></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div></div>
<script>
const cfg={views:[['Executive overview','Regulatory intelligence overview','Risk, targeting, operational activity and reporting quality.'],['Performance','Operational performance','Coverage, targeting and action closure across priority areas.'],['Data assurance','Intelligence assurance','Data quality and analytical QA supporting defensible targeting.'],['Scenarios','Risk scenarios','Changes in risk, intelligence quality and operational demand.'],['Governance','Governance and lineage','Traceability from source intelligence to operational action.']],kpis:[['High-risk entities','46','Priority population','EN'],['Priority premises','31','Targeting focus','PR'],['High-confidence indicators','84%','Validated intelligence','CF'],['Open actions','12','Operational follow-up','AC']],health:[['Data completeness',92],['Indicator quality',88],['Targeting coverage',86],['QA completion',94],['Action closure',81]],rows:[['Retail',62,79,7],['Supply',68,85,8],['Entities',58,74,5],['Premises',64,82,7],['Online',49,71,9]],trendA:[72,74,76,78,80,81,84,86,87,89,91,93],trendB:[65,68,70,72,74,76,78,81,83,85,87,89],mix:[['Entity intelligence',89],['Premises intelligence',86],['Emerging trends',82],['Operational reporting',93],['Action closure',81]],quality:[['Entity data',[95,93,91,94]],['Premises data',[92,90,87,91]],['External intelligence',[88,90,82,86]],['Operational actions',[91,89,85,88]]],scenarios:[{n:'Base',d:'Current risk and workload.',k:['46','31','84%','12'],s:[72,74,77,80,82,85,87,89],t:'Maintain risk-led prioritisation',x:'Keep targeting focused on converging indicators and validated intelligence.'},{n:'Risk surge',d:'Priority activity increases.',k:['58','39','80%','21'],s:[72,73,74,76,78,79,80,81],t:'Protect analytical triage',x:'Separate rapid-response work from deeper intelligence assessments.'},{n:'Data uplift',d:'Source quality improves.',k:['46','31','91%','9'],s:[72,79,83,87,90,93,95,96],t:'Use better data to sharpen targeting',x:'Higher quality should improve confidence and reduce low-value follow-up.'},{n:'Demand shift',d:'Operational priorities change.',k:['51','36','82%','17'],s:[72,76,79,81,83,85,86,88],t:'Rebalance priorities transparently',x:'Re-score work against harm, confidence, recency and operational need.'}]};let state={v:0,s:0};
const badge=s=>`<span class="badge ${/track|complete|high/i.test(s)?'good':/watch|review|medium/i.test(s)?'warn':'bad'}">${s}</span>`;
function smooth(a){if(a.length<2)return'';let d=`M ${a[0][0]} ${a[0][1]}`;for(let i=0;i<a.length-1;i++){let p=a[i],q=a[i+1],m=(p[0]+q[0])/2;d+=` C ${m} ${p[1]}, ${m} ${q[1]}, ${q[0]} ${q[1]}`}return d}
function lineChart(a,b){let w=650,h=210,p=28,all=[...a,...(b||[])],mn=Math.min(...all)-2,mx=Math.max(...all)+2,pts=a.map((v,i)=>[p+i/(a.length-1)*(w-2*p),h-p-(v-mn)/(mx-mn)*(h-2*p)]),pts2=b?b.map((v,i)=>[p+i/(b.length-1)*(w-2*p),h-p-(v-mn)/(mx-mn)*(h-2*p)]):[];return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[45,95,145,195].map(y=>`<line class="gl" x1="${p}" y1="${y}" x2="${w-p}" y2="${y}"/>`).join('')}<path class="la" d="${smooth(pts)}"/>${b?`<path class="lb" d="${smooth(pts2)}"/>`:''}</svg>`}
function combo(rows){let w=650,h=210,l=42,r=24,t=18,b=28,slot=(w-l-r)/rows.length,max=100,pts=rows.map((x,i)=>[l+i*slot+slot*.44,t+(10-x[3])/10*(h-t-b)]);return `<svg class="chart" viewBox="0 0 ${w} ${h}">${[0,1,2,3].map(i=>`<line class="gl" x1="${l}" y1="${t+i*(h-t-b)/3}" x2="${w-r}" y2="${t+i*(h-t-b)/3}"/>`).join('')}${rows.map((x,i)=>{let px=l+i*slot+slot*.13,ha=x[1]/max*(h-t-b),hb=x[2]/max*(h-t-b);return `<rect x="${px}" y="${h-b-ha}" width="${slot*.26}" height="${ha}" rx="3" fill="var(--bl)" opacity=".82"/><rect x="${px+slot*.3}" y="${h-b-hb}" width="${slot*.26}" height="${hb}" rx="3" fill="var(--g)" opacity=".9"/><text class="tick" x="${px}" y="${h-7}">${x[0]}</text>`}).join('')}<path class="lr" d="${smooth(pts)}"/></svg>`}
const bars=a=>`<div class="bars">${a.map(x=>`<div class="bar"><label>${x[0]}</label><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><div class="score">${x[1]}%</div></div>`).join('')}</div>`;
function head(i,label){return `<div class="head"><div><h2 class="pt">${cfg.views[i][1]}</h2><p class="pd">${cfg.views[i][2]}</p></div><span class="demo">${label}</span></div>`}
function overview(){return head(0,'Illustrative demonstration')+`<section class="grid kpis">${cfg.kpis.map(x=>`<div class="card"><div class="kpi"><div><div class="eye">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">${x[2]}</div></div><div class="ki">${x[3]}</div></div></div>`).join('')}</section><section class="grid two"><div class="card feature"><div class="ct"><div><h3>Risk indicators and targeting pressure</h3><p>Current position across priority intelligence themes.</p></div><div class="legend"><span><i style="background:var(--bl)"></i>Baseline</span><span><i style="background:var(--g)"></i>Current</span><span><i style="background:var(--r)"></i>Pressure</span></div></div>${combo(cfg.rows)}</div><div class="card"><div class="ct"><div><h3>Operating model health</h3><p>Selected assurance and delivery indicators.</p></div></div>${bars(cfg.health)}</div></section><section class="grid two"><div class="decision"><div class="eye">Decision focus</div><h3>Direct activity where multiple risk indicators converge</h3><p>Combine confidence, recency, entity links and operational history before prioritising activity.</p></div><div class="card"><div class="ct"><div><h3>Priority profile</h3><p>Current action mix.</p></div></div><div class="strip"><div class="seg good" style="width:58%"></div><div class="seg warn" style="width:29%"></div><div class="seg bad" style="width:13%"></div></div><div class="summary"><span><i style="background:var(--ok)"></i>On track 58%</span><span><i style="background:var(--w)"></i>Watch 29%</span><span><i style="background:var(--r)"></i>Escalate 13%</span></div></div></section>`}
function performance(){return head(1,'Performance view')+`<section class="grid two"><div class="card feature"><div class="ct"><div><h3>12-period intelligence trend</h3><p>Coverage and validated action trajectory.</p></div></div>${lineChart(cfg.trendA,cfg.trendB)}</div><div class="card"><div class="ct"><div><h3>Coverage mix</h3><p>Relative strength across major work areas.</p></div></div>${bars(cfg.mix)}</div></section><section class="card"><div class="ct"><div><h3>Operational scorecard</h3><p>Selected current measures.</p></div></div><div class="tw"><table><thead><tr><th>Area</th><th>Measure</th><th>Current</th><th>Status</th></tr></thead><tbody><tr><td>Entities</td><td>Priority population reviewed</td><td>89%</td><td>${badge('On track')}</td></tr><tr><td>Premises</td><td>Targeting coverage</td><td>86%</td><td>${badge('On track')}</td></tr><tr><td>Emerging trends</td><td>Indicator coverage</td><td>82%</td><td>${badge('Watch')}</td></tr><tr><td>Actions</td><td>Closure rate</td><td>81%</td><td>${badge('Watch')}</td></tr></tbody></table></div></section>`}
function assurance(){return head(2,'Assurance view')+`<section class="grid two"><div class="card"><div class="ct"><div><h3>Data-quality heatmap</h3><p>Completeness, accuracy, timeliness and control coverage.</p></div></div><div class="heat"><div></div>${['Complete','Accurate','Timely','Controlled'].map(x=>`<div class="hh">${x}</div>`).join('')}${cfg.quality.map(x=>`<div class="hl">${x[0]}</div>${x[1].map(v=>`<div class="hc ${v>=90?'hi':v>=80?'mid':'lo'}">${v}</div>`).join('')}`).join('')}</div></div><div class="card"><div class="ct"><div><h3>Validation pathway</h3><p>From intelligence question to operational action.</p></div></div><div class="flow">${[['Question','What requires attention?'],['Sources','Internal and external evidence.'],['Analysis','Indicators, links and trends.'],['Assessment','Confidence and priority.'],['Action','Targeting or follow-up.']].map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div></section><div class="decision"><div class="eye">Assurance principle</div><h3>Keep the conclusion traceable to source, logic and confidence</h3><p>Transparent analytical rules make it easier to challenge, validate and update controls when the risk environment changes.</p></div>`}
function scenarios(){let s=cfg.scenarios[state.s];return head(3,'Scenario view')+`<div class="scenarios">${cfg.scenarios.map((x,i)=>`<button class="scenario ${i===state.s?'active':''}" data-sc="${i}"><strong>${x.n}</strong><span>${x.d}</span></button>`).join('')}</div><section class="grid kpis">${['Entities','Premises','Confidence','Actions'].map((x,i)=>`<div class="card"><div class="eye">${x}</div><div class="kv">${s.k[i]}</div></div>`).join('')}</section><section class="grid two"><div class="card feature"><div class="ct"><div><h3>Scenario trajectory</h3><p>Baseline against selected scenario.</p></div></div>${lineChart(cfg.scenarios[0].s,s.s)}</div><div class="decision"><div class="eye">Scenario implication</div><h3>${s.t}</h3><p>${s.x}</p></div></section>`}
function governance(){return head(4,'Governance view')+`<section class="grid two"><div class="card"><div class="ct"><div><h3>Measure lineage</h3><p>Trace intelligence output back to controlled evidence.</p></div></div><div class="flow">${[['Insight','Risk, entity, premises, confidence.'],['Indicator','Defined logic and threshold.'],['Method','SQL, Python and trend analysis.'],['Source','Controlled internal and validated external information.'],['QA','Validation and evidence trail.']].map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${i===0?'active':''}"><div class="nt">${x[0]}</div><div class="nb">${x[1]}</div></div>`).join('')}</div></div><div class="card"><div class="ct"><div><h3>Review rhythm</h3><p>Operational and analytical control cadence.</p></div></div><div class="timeline"><div class="tl good"><span class="dot"></span><strong>Operational review</strong><p>Material shifts, new indicators and urgent actions.</p></div><div class="tl good"><span class="dot"></span><strong>Analytical QA</strong><p>Source, method, confidence and caveat review.</p></div><div class="tl warn"><span class="dot"></span><strong>Priority reset</strong><p>Re-score themes when risk or demand changes.</p></div><div class="tl good"><span class="dot"></span><strong>Governance review</strong><p>Ownership, actions and unresolved issues.</p></div></div></div></section>`}
const renderers=[overview,performance,assurance,scenarios,governance];function side(){document.getElementById('side').innerHTML=`<div class="st">Portfolio views</div>${cfg.views.map((x,i)=>`<button class="nav ${i===state.v?'active':''}" data-v="${i}"><span class="nn">0${i}</span><span class="nl">${x[0]}</span></button>`).join('')}<div class="meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Decision-support demonstration</div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{state.v=+b.dataset.v;render()})}function render(){document.getElementById('main').innerHTML=renderers[state.v]();side();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.s=+b.dataset.sc;render()})}document.getElementById('theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'':'dark';document.getElementById('themeText').textContent=d?'Dark':'Light'};render();
</script></body></html>
