<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Operational & Emerging Risk Monitor - Khaled Sanad</title>
<meta name="description" content="Illustrative operational and emerging risk portfolio covering risk themes, incidents, controls, remediation and governance reporting.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f6f7;--surface:#fff;--surface-alt:#f8fafb;--deep:#e9eef1;--border:#d7e0e5;--ink:#17232c;--ink2:#56636e;--ink3:#7c8993;--accent:#315d6f;--accent2:#62859a;--accentdim:#e8f0f3;--ok:#477b55;--okdim:#eaf4ec;--warn:#a07317;--warndim:#fbf1da;--risk:#a14d42;--riskdim:#f8e9e6;--shadow:0 6px 22px rgba(30,45,55,.08);--serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace}
:root[data-theme="dark"]{--paper:#10161b;--surface:#182027;--surface-alt:#202a32;--deep:#25313a;--border:#33414b;--ink:#edf2f4;--ink2:#aeb8c0;--ink3:#7e8c97;--accent:#75b7c9;--accent2:#8eaec1;--accentdim:#19323a;--ok:#80c18c;--okdim:#183323;--warn:#dfb157;--warndim:#3a2e16;--risk:#e08c80;--riskdim:#3c211e;--shadow:0 8px 26px rgba(0,0,0,.24)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 20px;background:var(--surface);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--accent2));position:relative}.mark:before,.mark:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:4px}.mark:before{top:11px}.mark:after{top:20px}.brand h1{margin:0;font:600 1.08rem/1 var(--serif)}.brand p{margin:4px 0 0;font:400 .51rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}.controls{display:flex;gap:7px;align-items:center}.btn{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);border-radius:7px;padding:7px 9px;font-size:.62rem;cursor:pointer}.app{display:grid;grid-template-columns:215px minmax(0,1fr)}.side{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:14px 9px}.side-title{font:400 .49rem/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);padding:0 9px 9px}.nav{width:100%;display:grid;grid-template-columns:25px 1fr;gap:7px;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink2);padding:9px;border-radius:7px;margin:2px 0;cursor:pointer}.nav:hover{background:var(--surface-alt);color:var(--ink)}.nav.active{background:var(--accentdim);border-left-color:var(--accent);color:var(--accent)}.num{font:400 .52rem/1.2 var(--mono);color:var(--ink3)}.label{font-size:.7rem;font-weight:600}.meta{margin-top:18px;padding:10px 9px;border-top:1px solid var(--border);font-size:.58rem;line-height:1.5;color:var(--ink2)}.main{min-width:0;padding:20px 24px 44px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:14px}.head h2{margin:0 0 5px;font:600 1.42rem/1 var(--serif)}.head p{margin:0;max-width:840px;color:var(--ink2);font-size:.68rem;line-height:1.45}.pill{font:400 .49rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accentdim);border:1px solid var(--border);padding:5px 7px;border-radius:999px;white-space:nowrap}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:13px;min-width:0}.eyebrow{font:500 .48rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}.kpi{display:flex;justify-content:space-between;gap:8px}.kpi-value{font:600 1.34rem/.95 var(--serif)}.kpi-sub{font-size:.58rem;color:var(--ink2);line-height:1.35;margin-top:5px}.kicon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accentdim);color:var(--accent);font:500 .53rem/1 var(--mono)}.chart-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:9px}.chart-title h3{font-size:.75rem;margin:0}.chart-title p{font-size:.56rem;color:var(--ink3);margin:3px 0 0}.metric-stack{display:grid;gap:9px}.metric{display:grid;grid-template-columns:128px 1fr 42px;gap:8px;align-items:center}.metric label{font-size:.59rem;color:var(--ink2)}.track{height:7px;border-radius:999px;background:var(--deep);overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.score{text-align:right;font:400 .54rem/1 var(--mono);color:var(--ink2)}.decision{border-left:4px solid var(--accent);background:linear-gradient(135deg,var(--surface),var(--surface-alt));border-radius:11px;padding:13px;box-shadow:var(--shadow)}.decision h3{font:600 .96rem/1.15 var(--serif);margin:0 0 6px}.decision p{font-size:.59rem;line-height:1.48;color:var(--ink2);margin:0}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:670px;background:var(--surface)}th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:.59rem}th{font:400 .47rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:var(--surface-alt)}tbody tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;font-size:.55rem;font-weight:700}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.good{color:var(--ok);background:var(--okdim)}.warn{color:var(--warn);background:var(--warndim)}.bad{color:var(--risk);background:var(--riskdim)}.heat{display:grid;grid-template-columns:150px repeat(4,1fr);gap:6px;align-items:center}.hhead{font:400 .47rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:center}.hlabel{font-size:.59rem;color:var(--ink2)}.hcell{height:29px;border-radius:5px;display:grid;place-items:center;color:#fff;font:400 .51rem/1 var(--mono)}.hi{background:var(--risk)}.mid{background:var(--warn)}.lo{background:var(--ok)}.timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:8px;top:3px;bottom:3px;width:2px;background:var(--border)}.tl{position:relative;margin-bottom:13px}.dot{position:absolute;left:-20px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}.tl strong{font-size:.62rem}.tl p{margin:3px 0 0;font-size:.56rem;line-height:1.4;color:var(--ink2)}.scenario-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.scenario{border:1px solid var(--border);background:var(--surface-alt);color:var(--ink2);border-radius:7px;padding:8px;text-align:left;font-size:.58rem;cursor:pointer}.scenario.active{background:var(--accentdim);border-color:var(--accent);color:var(--accent)}.scenario strong{display:block}.scenario span{display:block;margin-top:3px;color:var(--ink3);font-size:.51rem;line-height:1.3}.flow{display:flex;gap:6px;align-items:stretch;overflow:auto}.node{min-width:145px;flex:1;padding:10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border)}.node.active{background:var(--accentdim);border-color:var(--accent)}.nt{font:400 .47rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}.nb{font-size:.57rem;line-height:1.4;color:var(--ink2)}.arrow{align-self:center;color:var(--ink3)}
@media(max-width:1100px){.kpis,.scenario-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.side-title,.meta{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px 12px 36px}.two,.kpis,.scenario-grid{grid-template-columns:1fr}.header{position:static}}
</style>
</head>
<body>
<div class="shell">
<header class="header"><div class="brand"><div class="mark"></div><div><h1>Khaled S. - Operational & Emerging Risk Monitor</h1><p>themes · incidents · controls · remediation · governance</p></div></div><div class="controls"><button class="btn" id="themeBtn">Toggle theme</button></div></header>
<div class="app"><nav class="side" id="side"></nav><main class="main" id="main"></main></div>
</div>
<script>
const V=[
['Executive overview','Operational and emerging risk overview','A governance-ready view of risk themes, incidents, controls and remediation.'],
['Risk register','Risk register and themes','Prioritised risks with ownership, treatment and review status.'],
['Incidents','Incident and trend analysis','Connect incident patterns and risk themes to control or governance action.'],
['Controls','Controls and assurance','Track control testing, evidence quality and remediation progress.'],
['Scenarios','Scenario analysis','Test how emerging conditions may alter exposure, control demand and response.']
];
const kpis=[['Open risks','27','Across current register','RR'],['Emerging themes','6','Under active assessment','ER'],['Actions overdue','4','Require owner attention','RA'],['Control health','91%','Selected control coverage','CT']];
const themes=[['Third-party dependency',78],['Technology resilience',66],['Data and reporting integrity',54],['Regulatory change',43],['Conduct and process',37]];
const register=[
['ER-014','Third-party service concentration','Operational / emerging','High','Risk owner review','Mitigate'],
['ER-011','Critical process dependency','Resilience','High','Control uplift in progress','Mitigate'],
['ER-008','Regulatory change readiness','Compliance','Medium','Assessment current','Monitor'],
['OR-032','Data lineage gaps in governance reporting','Operational','Medium','Validation uplift','Remediate'],
['OR-027','Manual control dependency','Operational','Medium','Automation assessed','Treat']
];
const incidents=[
['Service interruption','Operations','8','+2','Dependency concentration identified','Escalate supplier resilience review'],
['Reporting error','Governance','5','-1','Recurring source-data issue','Strengthen validation before forum use'],
['Access exception','Technology','3','0','No common driver confirmed','Continue monitoring'],
['Process failure','Operations','7','+3','Manual hand-off theme','Prioritise control redesign']
];
const controls=[
['Key operational controls','92','On track'],
['Risk reporting validation','88','Review'],
['Remediation evidence','84','Review'],
['Incident root-cause closure','90','On track'],
['Governance action tracking','95','On track']
];
const matrix=[['Likelihood',0],['Third-party dependency',[4,5,4,3]],['Technology resilience',[3,4,4,3]],['Regulatory change',[3,3,4,4]],['Data integrity',[4,3,3,4]],['Manual process',[4,3,2,3]]];
const scenarios=[
['Base','Current trend and control environment.','Maintain','Continue standard monitoring and scheduled review.'],
['Incident spike','Operational incidents increase materially.','Escalate','Reassess affected controls and accelerate remediation.'],
['New obligation','Material regulatory requirement emerges.','Translate','Convert requirement into obligations, controls and assurance checks.'],
['Control failure','Key control repeatedly fails.','Treat','Escalate ownership, test compensating controls and track remediation.']
];
let state={view:0,scenario:0};
const badge=s=>'<span class="badge '+(/on track|maintain|monitor/i.test(s)?'good':/review|progress|remediate/i.test(s)?'warn':'bad')+'">'+s+'</span>';
const bars=a=>'<div class="metric-stack">'+a.map(x=>'<div class="metric"><label>'+x[0]+'</label><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><div class="score">'+x[1]+'%</div></div>').join('')+'</div>';
function head(i,label='Illustrative demonstration'){return '<div class="head"><div><h2>'+V[i][1]+'</h2><p>'+V[i][2]+'</p></div><span class="pill">'+label+'</span></div>'}
function overview(){return head(0)+
'<section class="grid kpis">'+kpis.map(x=>'<div class="card"><div class="kpi"><div><div class="eyebrow">'+x[0]+'</div><div class="kpi-value">'+x[1]+'</div><div class="kpi-sub">'+x[2]+'</div></div><div class="kicon">'+x[3]+'</div></div></div>').join('')+'</section>'+
'<section class="grid two" style="margin-bottom:10px"><div class="card"><div class="chart-title"><div><h3>Emerging risk themes</h3><p>Relative exposure based on recent indicators and control observations.</p></div></div>'+bars(themes)+'</div><div class="decision"><div class="eyebrow">Decision focus</div><h3>Use themes and incidents to decide what needs monitoring, escalation or control change</h3><p>A useful risk view connects the signal, the affected process or control, the owner, the response and the evidence that confirms whether treatment worked.</p></div></section>'+
'<section class="card"><div class="chart-title"><div><h3>Priority risk register</h3><p>Illustrative current risks and treatment position.</p></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Risk</th><th>Category</th><th>Rating</th><th>Status</th><th>Response</th></tr></thead><tbody>'+register.map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i===4?badge(c):c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>'}
function risks(){return head(1,'Risk register view')+'<section class="card"><div class="chart-title"><div><h3>Register with treatment state</h3><p>Prioritise by current exposure, control evidence and response status.</p></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Risk</th><th>Category</th><th>Rating</th><th>Status</th><th>Treatment</th></tr></thead><tbody>'+register.map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i===4?badge(c):c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section><section class="grid two" style="margin-top:10px"><div class="card"><div class="chart-title"><div><h3>Theme exposure</h3><p>Relative view across current themes.</p></div></div>'+bars(themes)+'</div><div class="decision"><div class="eyebrow">Register discipline</div><h3>Keep the register connected to observable evidence</h3><p>Ratings should move when incidents, control results, external requirements or other evidence change the underlying exposure.</p></div></section>'}
function incident(){return head(2,'Trend and incident view')+'<section class="card"><div class="chart-title"><div><h3>Incident themes and resulting action</h3><p>Illustrative link from observed events to enterprise response.</p></div></div><div class="table-wrap"><table><thead><tr><th>Theme</th><th>Area</th><th>Events</th><th>Movement</th><th>Finding</th><th>Action</th></tr></thead><tbody>'+incidents.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section><section class="grid two" style="margin-top:10px"><div class="decision"><div class="eyebrow">Analysis principle</div><h3>Do not treat incident counts as the finding</h3><p>The useful output is the common driver, affected control or process, whether exposure changed and what action should follow.</p></div><div class="card"><div class="chart-title"><div><h3>Escalation pathway</h3><p>From signal to governed action.</p></div></div><div class="flow">'+[['Signal','Incident, trend or external requirement'],['Assess','Exposure, controls and affected processes'],['Rate','Current risk and materiality'],['Escalate','Owner, forum or enterprise process'],['Verify','Treatment evidence and residual risk']].map((x,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="node '+(i===0?'active':'')+'"><div class="nt">'+x[0]+'</div><div class="nb">'+x[1]+'</div></div>').join('')+'</div></div></section>'}
function control(){return head(3,'Control and assurance view')+'<section class="grid two"><div class="card"><div class="chart-title"><div><h3>Control health</h3><p>Selected evidence and assurance indicators.</p></div></div>'+bars(controls.map(x=>[x[0],+x[1]]))+'</div><div class="card"><div class="chart-title"><div><h3>Remediation rhythm</h3><p>Illustrative governance cadence.</p></div></div><div class="timeline">'+[['Daily','Capture incidents, exceptions and material changes.'],['Weekly','Confirm owners, actions and evidence needed.'],['Monthly','Reassess ratings and overdue remediation.'],['Quarterly','Review themes, control effectiveness and emerging risks.']].map(x=>'<div class="tl"><span class="dot"></span><strong>'+x[0]+'</strong><p>'+x[1]+'</p></div>').join('')+'</div></div></section><section class="decision" style="margin-top:10px"><div class="eyebrow">Assurance principle</div><h3>Control change is incomplete until the post-implementation result is checked</h3><p>Confirm the implemented rule or process, test the resulting output, document exceptions and feed residual issues back into the risk view.</p></section>'}
function scenario(){let s=scenarios[state.scenario];return head(4,'Scenario view')+'<div class="scenario-grid">'+scenarios.map((x,i)=>'<button class="scenario '+(i===state.scenario?'active':'')+'" data-sc="'+i+'"><strong>'+x[0]+'</strong><span>'+x[1]+'</span></button>').join('')+'</div><section class="grid two"><div class="card"><div class="chart-title"><div><h3>Selected response</h3><p>What changes when the scenario occurs.</p></div></div><div class="decision"><div class="eyebrow">'+s[2]+'</div><h3>'+s[0]+'</h3><p>'+s[3]+'</p></div></div><div class="card"><div class="chart-title"><div><h3>Scenario assessment flow</h3><p>Simple structure for operational and emerging risk analysis.</p></div></div><div class="flow">'+[['Trigger','What changed?'],['Exposure','Who or what is affected?'],['Controls','What should prevent or detect it?'],['Residual','What remains after controls?'],['Action','Monitor, treat or escalate']].map((x,i)=>(i?'<div class="arrow">→</div>':'')+'<div class="node '+(i===0?'active':'')+'"><div class="nt">'+x[0]+'</div><div class="nb">'+x[1]+'</div></div>').join('')+'</div></div></section>'}
const renderers=[overview,risks,incident,control,scenario];
function renderSide(){side.innerHTML='<div class="side-title">Portfolio views</div>'+V.map((v,i)=>'<button class="nav '+(i===state.view?'active':'')+'" data-view="'+i+'"><span class="num">0'+i+'</span><span class="label">'+v[0]+'</span></button>').join('')+'<div class="meta">Organisation-neutral portfolio artefact<br>Illustrative data only<br>Standalone HTML</div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=+b.dataset.view;render()})}
function render(){main.innerHTML=renderers[state.view]();renderSide();document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.scenario=+b.dataset.sc;render()})}
themeBtn.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark'};render();
</script>
</body>
</html>
