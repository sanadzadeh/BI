<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics & AI Advisory Portfolio — Khaled Sanad</title><meta name="description" content="Illustrative analytics and AI advisory portfolio covering KPI frameworks, delivery, reporting, AI-assisted workflows, quality and capability uplift.">
<style>
:root{--bg:#f3f5f6;--card:#fff;--soft:#f8fafb;--line:#dbe3e7;--ink:#18232c;--muted:#667580;--accent:#0b5d6b;--blue:#557d98;--green:#477f55;--gold:#b48946;--red:#a94d41;--serif:Georgia,serif;--mono:Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0}.brand h1{font:600 18px var(--serif);margin:0}.brand span{font:9px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#87949d}.tag{font:9px var(--mono);color:var(--accent);background:#e6f1f2;padding:5px 7px;border-radius:99px}.app{display:grid;grid-template-columns:210px 1fr}.side{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 58px);padding:12px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:7px;margin:2px 0;color:var(--muted);cursor:pointer}.nav.active{background:#e6f1f2;color:var(--accent);font-weight:700}.meta{font-size:10px;color:#87949d;border-top:1px solid var(--line);margin-top:14px;padding-top:10px;line-height:1.4}.main{padding:20px}.head h2{font:600 24px var(--serif);margin:0}.head p{font-size:12px;color:var(--muted)}.grid{display:grid;gap:10px}.kpis{grid-template-columns:repeat(5,1fr);margin:12px 0}.two{grid-template-columns:1.2fr .8fr}.twoeq{grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.eye{font:9px var(--mono);text-transform:uppercase;color:#87949d}.val{font:600 24px var(--serif);margin-top:4px}.sub{font-size:10px;color:var(--muted);margin-top:3px}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:145px 1fr 42px;gap:7px;align-items:center;font-size:11px}.track{height:8px;background:#edf1f3;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:99px}.decision{border-left:4px solid var(--accent)}.decision strong{display:block;font:600 17px var(--serif);margin:5px 0 8px}.decision span{font-size:11px;line-height:1.45;color:var(--muted)}.table{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}th{font:9px var(--mono);text-transform:uppercase;color:#87949d;background:var(--soft)}.badge{padding:3px 6px;border-radius:99px;font-size:10px;font-weight:700}.good{background:#e7f2e9;color:var(--green)}.warn{background:#fbf0db;color:#956c15}.flow{display:flex;gap:6px;align-items:center;overflow:auto}.node{min-width:140px;flex:1;background:var(--soft);border:1px solid var(--line);padding:9px;border-radius:8px}.node b{font-size:11px}.node span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.arrow{color:#87949d}.scenario-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.scenario{border:1px solid var(--line);background:var(--soft);padding:6px 9px;border-radius:99px;cursor:pointer;color:var(--muted)}.scenario.active{background:#e6f1f2;color:var(--accent);border-color:#9fc5ca}.callout{padding:9px;border:1px solid #c5dde0;background:#e6f1f2;border-radius:8px;font-size:11px;line-height:1.4}@media(max-width:950px){.app{grid-template-columns:1fr}.side{min-height:auto;display:flex;overflow:auto}.meta{display:none}.nav{white-space:nowrap}.kpis,.two,.twoeq{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kpis,.two,.twoeq{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><h1>Khaled S. — Analytics & AI Advisory</h1><span>business question · measures · delivery · quality · capability</span></div><span class="tag">Illustrative data</span></header><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>
const V=[['Overview','Engagement overview','A client-oriented view of analytics priorities, delivery health and decisions.'],['Measures','KPI framework','Measures tied to business outcomes rather than dashboard volume.'],['Delivery','Analytics delivery','Priorities, risks and progress across analytical products.'],['AI workflow','AI-assisted workflow','Where AI accelerates analysis and where human review remains necessary.'],['Quality','Quality & governance','Controls for data, measures, model logic and stakeholder-facing outputs.'],['Capability','Capability uplift','Methods for improving analytical consistency and consulting capability.']];let view=0,scenario=0;
const health=[['Business alignment',91],['Measure quality',88],['Data confidence',84],['Delivery predictability',79],['Adoption',82]];
const products=[['Executive performance view','Reporting','Decision support','On track'],['Demand forecast model','Modelling','Planning','On track'],['Service performance dashboard','BI','Operations','Review'],['AI-assisted exception analysis','AI / analytics','Investigation','Pilot'],['Manual monthly pack','Reporting','Legacy','Consolidate']];
function badge(s){return '<span class="badge '+(/on track/i.test(s)?'good':'warn')+'">'+s+'</span>'}
function bars(a){return '<div class="bars">'+a.map(x=>'<div class="bar"><span>'+x[0]+'</span><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><span>'+x[1]+'%</span></div>').join('')+'</div>'}
function head(){return '<div class="head"><h2>'+V[view][1]+'</h2><p>'+V[view][2]+'</p></div>'}
function overview(){return head()+'<div class="grid kpis"><div class="card"><div class="eye">Active products</div><div class="val">12</div><div class="sub">across reporting and analytics</div></div><div class="card"><div class="eye">Priority decisions</div><div class="val">4</div><div class="sub">requiring stakeholder alignment</div></div><div class="card"><div class="eye">KPI confidence</div><div class="val">88%</div><div class="sub">definition and source quality</div></div><div class="card"><div class="eye">Delivery health</div><div class="val">81%</div><div class="sub">weighted portfolio position</div></div><div class="card"><div class="eye">Manual effort reduction</div><div class="val">27%</div><div class="sub">illustrative opportunity</div></div></div><div class="grid two"><div class="card">'+bars(health)+'</div><div class="card decision"><div class="eye">Advisory focus</div><strong>Reduce reporting effort before adding another analytical product</strong><span>Three current outputs overlap in purpose. Consolidation creates capacity for higher-value modelling and AI-assisted analysis without increasing delivery load.</span></div></div></div>'}
function measures(){return head()+'<div class="card"><div class="table"><table><thead><tr><th>Outcome</th><th>KPI</th><th>Definition</th><th>Source</th><th>Decision</th></tr></thead><tbody><tr><td>Service efficiency</td><td>Cycle time</td><td>Median elapsed time to completion</td><td>Operational system</td><td>Capacity and process action</td></tr><tr><td>Delivery performance</td><td>Forecast variance</td><td>Actual vs agreed forecast</td><td>Planning system</td><td>Reforecast or intervention</td></tr><tr><td>Quality</td><td>Exception rate</td><td>Material exceptions / total volume</td><td>Control log</td><td>Root-cause analysis</td></tr><tr><td>Adoption</td><td>Active use</td><td>Repeat users in reporting period</td><td>Usage telemetry</td><td>Retain, improve or retire</td></tr></tbody></table></div></div><div class="grid twoeq" style="margin-top:10px"><div class="card">'+bars([['Clear definition',94],['Named owner',91],['Trusted source',87],['Decision link',93],['Review cycle',82]])+'</div><div class="card decision"><div class="eye">Measurement principle</div><strong>A KPI should exist because someone can act on it</strong><span>Measures that do not change a decision, trigger an action or satisfy an obligation should be challenged before more reporting is built around them.</span></div></div></div>'}
function delivery(){return head()+'<div class="card"><div class="table"><table><thead><tr><th>Product</th><th>Type</th><th>Primary use</th><th>Status</th></tr></thead><tbody>'+products.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+badge(r[3])+'</td></tr>').join('')+'</tbody></table></div></div><div class="grid twoeq" style="margin-top:10px"><div class="card">'+bars([['Scope clarity',89],['Data readiness',83],['Stakeholder alignment',86],['Technical delivery',81],['Adoption readiness',76]])+'</div><div class="card"><div class="flow"><div class="node"><b>Frame</b><span>Decision and outcome</span></div><div class="arrow">→</div><div class="node"><b>Design</b><span>Measures and analytical method</span></div><div class="arrow">→</div><div class="node"><b>Deliver</b><span>Model, report or workflow</span></div><div class="arrow">→</div><div class="node"><b>Adopt</b><span>Use, feedback and improve</span></div></div></div></div>'}
function ai(){return head()+'<div class="grid two"><div class="card"><div class="flow"><div class="node"><b>Question</b><span>Define the analytical task</span></div><div class="arrow">→</div><div class="node"><b>AI assist</b><span>Draft logic, code or documentation</span></div><div class="arrow">→</div><div class="node"><b>Test</b><span>Validate data, logic and edge cases</span></div><div class="arrow">→</div><div class="node"><b>Review</b><span>Human judgement and approval</span></div></div></div><div class="card decision"><div class="eye">Use rule</div><strong>Use AI where it shortens the work, not where it weakens accountability</strong><span>AI can accelerate exploration, code, documentation and repetitive analysis. Source data, model logic and stakeholder-facing conclusions still require independent review.</span></div></div></div><div class="card" style="margin-top:10px"><div class="table"><table><thead><tr><th>Use case</th><th>AI contribution</th><th>Human control</th></tr></thead><tbody><tr><td>Data exploration</td><td>Suggest checks and patterns</td><td>Validate against source data</td></tr><tr><td>Code and formulas</td><td>Draft and refactor</td><td>Test logic and edge cases</td></tr><tr><td>Scenario design</td><td>Generate assumptions to test</td><td>Approve relevance and weights</td></tr><tr><td>Documentation</td><td>Draft method and notes</td><td>Confirm accuracy and context</td></tr></tbody></table></div></div>'}
function quality(){return head()+'<div class="grid two"><div class="card">'+bars([['Source reconciliation',93],['Measure definitions',91],['Model validation',88],['Output QA',94],['Decision traceability',86]])+'</div><div class="card decision"><div class="eye">Quality principle</div><strong>Good visualisation cannot repair weak analytical logic</strong><span>Quality starts with source information, definitions and model logic, then extends to usability and presentation.</span></div></div></div><div class="card" style="margin-top:10px"><div class="flow"><div class="node"><b>Source</b><span>Reconcile and understand</span></div><div class="arrow">→</div><div class="node"><b>Rule</b><span>Define measure and logic</span></div><div class="arrow">→</div><div class="node"><b>Model</b><span>Test calculations</span></div><div class="arrow">→</div><div class="node"><b>Output</b><span>Check interpretation</span></div><div class="arrow">→</div><div class="node"><b>Decision</b><span>Document implication</span></div></div></div>'}
function capability(){return head()+'<div class="grid two"><div class="card"><div class="table"><table><thead><tr><th>Capability</th><th>Method</th><th>Expected result</th></tr></thead><tbody><tr><td>KPI design</td><td>Workshop + examples</td><td>Measures tied to decisions</td></tr><tr><td>Analytical QA</td><td>Peer review checklist</td><td>More consistent outputs</td></tr><tr><td>Stakeholder communication</td><td>Briefing practice</td><td>Clearer recommendations</td></tr><tr><td>AI use</td><td>Approved workflow examples</td><td>Faster work with retained control</td></tr><tr><td>Dashboard design</td><td>Design review</td><td>Less clutter and stronger usability</td></tr></tbody></table></div></div><div class="card decision"><div class="eye">Capability approach</div><strong>Improve the method as well as the individual product</strong><span>Reusable standards, examples and review practices reduce rework and help analysts make better decisions independently.</span></div></div></div>'}
function render(){document.getElementById('side').innerHTML=V.map((x,i)=>'<button class="nav '+(i===view?'active':'')+'" onclick="view='+i+';render()">'+(i+1)+'. '+x[0]+'</button>').join('')+'<div class="meta">Illustrative example using fictional data. It demonstrates an analytics and AI advisory approach and does not represent any client or organisation.</div>';document.getElementById('main').innerHTML=[overview,measures,delivery,ai,quality,capability][view]()}render();
</script></body></html>
